on:
  workflow_dispatch:
    inputs:
      os_type:
        description: 'ðŸ–¥ï¸ Há»‡ Ä‘iá»u hÃ nh (Windows, Linux, hoáº·c Cáº£ hai song song)'
        required: false
        default: 'windows'
        type: choice
        options:
          - 'windows'
          - 'linux'
          - 'both'
      machine_id:
        description: 'ðŸ·ï¸ TÃªn Ä‘á»‹nh danh mÃ¡y & báº£n lÆ°u riÃªng (VD: may-phu-2 Ä‘á»ƒ cháº¡y song song khÃ´ng Ä‘Ã¨ nhau)'
        required: false
        default: 'may-phu-2'
        type: string
      duration:
        description: 'ðŸ• Thá»i gian sá»­ dá»¥ng (tÃ­nh tá»« lÃºc job báº¯t Ä‘áº§u)'
        required: false
        default: '5h00m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h00m'
      auto_restart:
        description: 'ðŸ” Tá»± khá»Ÿi Ä‘á»™ng phiÃªn má»›i sau khi háº¿t giá»'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: 'ðŸ’½ KÃ½ tá»± á»• Ä‘Ä©a áº£o riÃªng biá»‡t Ä‘á»ƒ chá»©a toÃ n bá»™ Há»‡ Äiá»u HÃ nh & Dá»¯ Liá»‡u'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: 'ðŸ“¦ Dung lÆ°á»£ng á»• Ä‘Ä©a áº£o VHDX tá»‘i Ä‘a (GB - co giÃ£n Ä‘á»™ng)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: 'ðŸªŸ Báº£n Windows (GIá»® Cá» Äá»ŠNH giá»¯a cÃ¡c phiÃªn Ä‘á»ƒ app khÃ´ng lá»—i)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      fixed_password:
        description: 'ðŸ” Máº­t kháº©u cá»‘ Ä‘á»‹nh cho cáº£ RDP (runneradmin/runner) & Sunshine Web UI'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: 'ðŸ–¥ï¸ Äá»™ phÃ¢n giáº£i mÃ n hÃ¬nh áº£o máº·c Ä‘á»‹nh cho Sunshine'
        required: false
        default: '1920x1080@60'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'
      choco_packages:
        description: 'ðŸ“¦ App cÃ i thÃªm báº±ng choco (tá»± Ä‘á»™ng lÆ°u váº¿t sang phiÃªn sau)'
        required: false
        default: 'discord spotify evkey bandicam googlechrome vlc 7zip notepadplusplus'
        type: string
      optimize_windows:
        description: 'âš™ï¸ Tá»‘i Æ°u Windows (Fix lag triá»‡t Ä‘á»ƒ, táº¯t telemetry, RAM/CPU tweaks)'
        required: false
