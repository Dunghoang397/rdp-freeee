# ═══════════════════════════════════════════════════════════════
# ALB-VPSFREE-ULTIMATE v56.1 — SUPREME ZENOVA FIXED
# [FIX] Discord: Xóa AppData cũ trước khi cài
# [FIX] Web Panel: Dùng Here-String chuẩn (không Array)
# [FIX] Sunshine: Start-Process + Verify port
# [FIX] Wallpaper: Force refresh HKCU
# [FIX] Đủ App: Tuần tự, tăng timeout
# ═══════════════════════════════════════════════════════════════
name: ALB-VPSFREE-ULTIMATE v56.1

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy & bản lưu riêng'
        required: false
        default: 'may-phu-1'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h00m'
        type: choice
        options: ['1h', '3h', '5h00m']
      auto_restart:
        description: '🔁 Tự restart'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ổ ảo'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng VHDX (GB)'
        required: false
        default: '100'
        type: string
      windows_image:
        description: '🪟 Windows'
        required: false
        default: 'windows-2022'
        type: choice
        options: ['windows-2022', 'windows-2025']
      fixed_password:
        description: '🔐 Mật khẩu RDP & Sunshine'
        required: false
        default: 'Aistv@2026'
        type: string
      vdd_resolution:
        description: '🖥️ Resolution'
        required: false
        default: '1920x1080@60'
        type: choice
        options: ['1920x1080@60', '1920x1080@120', '2560x1440@60', '3840x2160@60']
      choco_packages:
        description: '📦 Choco packages'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Fix lag & 100% CPU'
        required: false
        default: true
        type: boolean
      enable_tailscale:
        description: '🌐 Tailscale'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 DuckDNS'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: alb-vpsfree-${{ inputs.machine_id || 'may-phu-1' }}
  cancel-in-progress: true

jobs:
  Premium-RDP-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'may-phu-1' }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      SUNSHINE_PASS: ${{ inputs.fixed_password || 'Aistv@2026' }}

    steps:
      - name: 📥 Checkout Repo (Lấy ảnh nền gốc)
        uses: actions/checkout@v4
        continue-on-error: true

      - name: ⚡ Khởi tạo Ổ ZENOVA-OS & Engine lưu trữ
        shell: pwsh
        timeout-minutes: 8
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $dTemp = 'D:\tmp'
            New-Item -ItemType Directory -Force -Path $dTemp | Out-Null
            $env:TEMP = $dTemp; $env:TMP = $dTemp
            "TEMP=$dTemp" >> $env:GITHUB_ENV
            "TMP=$dTemp" >> $env:GITHUB_ENV
          } catch {}

          "JOB_START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

          $vhdSizeInput = [int64](("$env:VHD_SIZE_GB" -replace '[^0-9]', ''))
          if ($vhdSizeInput -lt 10) { $vhdSizeInput = 100 }
          if ($vhdSizeInput -gt 102400) { $vhdSizeInput = 102400 }
          "VHD_SIZE_GB_VALIDATED=$vhdSizeInput" >> $env:GITHUB_ENV

          $cleanId = (($env:MACHINE_ID).Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', ''
          if ([string]::IsNullOrWhiteSpace($cleanId)) { $cleanId = 'may-phu-1' }
          $relTag = "alb-storage-$cleanId"

          $null = gh release view $relTag --repo $env:GH_REPO 2>&1
          if ($LASTEXITCODE -ne 0) {
            $dummy = "$env:RUNNER_TEMP\init.txt"
            Set-Content $dummy -Value "ALB Init" -Encoding UTF8
            gh release create $relTag $dummy --repo $env:GH_REPO --title "ALB Storage ($cleanId)" --notes "Kho luu [$cleanId]"
          }
          "MACHINE_ID=$cleanId" >> $env:GITHUB_ENV
          "RELEASE_TAG=$relTag" >> $env:GITHUB_ENV

          $total = 300; $dispTime = '5 gio 00 phut'
          if ($env:INPUT_DURATION -eq '1h') { $total = 60; $dispTime = '1 gio 00 phut' }
          elseif ($env:INPUT_DURATION -eq '3h') { $total = 180; $dispTime = '3 gio 00 phut' }
          "TOTAL_MINUTES=$total" >> $env:GITHUB_ENV
          "DISPLAY_TIME=$dispTime" >> $env:GITHUB_ENV
          "RDP_USER=$env:USERNAME" >> $env:GITHUB_ENV
          "PROFILE_PATH=$env:USERPROFILE" >> $env:GITHUB_ENV

          $dl = (($env:DRIVE_LETTER).Trim() -replace '[^A-Za-z]', '').ToUpper()
          if ((-not $dl) -or (@('C','D') -contains $dl)) { $dl = 'X' }
          "MOUNT_LETTER=$dl" >> $env:GITHUB_ENV

          $vhdContainer = 'C:\ALB-VHD-HOST'
          New-Item -ItemType Directory -Force -Path $vhdContainer | Out-Null
          $vhdFile = "$vhdContainer\alb-os-disk.vhdx"
          $actualVhdGb = if ($vhdSizeInput -gt 65530) { [int64]65530 } else { $vhdSizeInput }
          $sizeBytes = $actualVhdGb * 1GB
          $mounted = $false
          try {
            if (-not (Test-Path $vhdFile)) {
              New-VHD -Path $vhdFile -SizeBytes $sizeBytes -Dynamic |
                Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru |
                New-Partition -DriveLetter $dl -UseMaximumSize |
                Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:$false | Out-Null
            } else { Mount-VHD -Path $vhdFile -ErrorAction Stop }
            if (Test-Path "${dl}:\") { $mounted = $true }
          } catch {}

          if (-not $mounted) {
            $fallbackDir = "$vhdContainer\VIRTUAL-DRIVE-ROOT"
            New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
            & subst "${dl}:" $fallbackDir
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue
          }

          $sharedRoot = "${dl}:\ALB-SYSTEM"
          $osDir = "$sharedRoot\OS-OVERLAY"
          $instCache = "$osDir\Installers"
          @(
            "$sharedRoot\sessions", "$sharedRoot\DATA", "$osDir\InstalledApps",
            "$osDir\bin", $instCache, "$osDir\Sunshine-Config",
            "$osDir\Sunshine-Portable", "$osDir\Wallpaper", "$sharedRoot\Users", "${dl}:\Apps"
          ) | ForEach-Object { New-Item -ItemType Directory -Force -Path $_ | Out-Null }

          if (-not (Test-Path 'C:\ALB-Apps')) {
            New-Item -ItemType Junction -Path 'C:\ALB-Apps' -Target "$osDir\InstalledApps" -Force | Out-Null
          }

          "SHARED_ROOT=$sharedRoot" >> $env:GITHUB_ENV
          "SHARED_DATA_DIR=$sharedRoot\DATA" >> $env:GITHUB_ENV
          "SHARED_OS_DIR=$osDir" >> $env:GITHUB_ENV
          "SHARED_STATE_FILE=$sharedRoot\sessions\rdp-session-state.json" >> $env:GITHUB_ENV
          "PROFILE_ROOT=$sharedRoot\Users" >> $env:GITHUB_ENV
          "CONTROL_SIGNAL_FILE=$env:RUNNER_TEMP\alb-control.txt" >> $env:GITHUB_ENV
          "VHD_CONTAINER=$vhdContainer" >> $env:GITHUB_ENV
          "INSTALLER_CACHE=$instCache" >> $env:GITHUB_ENV
          "SUNSHINE_PERSIST_CFG=$osDir\Sunshine-Config" >> $env:GITHUB_ENV
          "WALLPAPER_DIR=$osDir\Wallpaper" >> $env:GITHUB_ENV

          $L = New-Object System.Collections.Generic.List[string]
          $L.Add('param([string]$Reason = "session-end")')
          $L.Add('$ErrorActionPreference = "Continue"')
          $L.Add('if ($env:DATA_RESTORED -ne "1") { exit 0 }')
          $L.Add('$root = $env:SHARED_ROOT')
          $L.Add('if ((-not $root) -or (-not (Test-Path $root))) { exit 0 }')
          $L.Add('$apps = @("chrome","msedge","discord","Spotify","Code","bdcam","RobloxPlayerBeta","StarDesk","EVKey64")')
          $L.Add('Get-Process -Name $apps -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue')
          $L.Add('Start-Sleep -Seconds 1')
          $L.Add('$u = $env:RDP_USER; $profSrc = $env:PROFILE_PATH')
          $L.Add('if ($u -and $profSrc -and (Test-Path $profSrc)) {')
          $L.Add('  $profDst = "$root\Users\$u"; New-Item -ItemType Directory -Force -Path $profDst | Out-Null')
          $L.Add('  $ex = @("$profSrc\AppData\Local\Temp","$profSrc\AppData\Local\Packages")')
          $L.Add('  robocopy $profSrc $profDst /MIR /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD @ex *> $null')
          $L.Add('}')
          $L.Add('if (Test-Path "C:\Program Files\Sunshine") {')
          $L.Add('  New-Item -ItemType Directory -Force -Path "$env:SHARED_OS_DIR\Sunshine-Portable" | Out-Null')
          $L.Add('  robocopy "C:\Program Files\Sunshine" "$env:SHARED_OS_DIR\Sunshine-Portable" /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null')
          $L.Add('}')
          $L.Add('$packDir = "$env:RUNNER_TEMP\alb-pack-$Reason"')
          $L.Add('if (Test-Path $packDir) { Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue }')
          $L.Add('New-Item -ItemType Directory -Force -Path $packDir | Out-Null')
          $L.Add('$archiveBase = "$packDir\alb-drive.7z"')
          $L.Add('Push-Location $root')
          $L.Add('& 7z a -t7z -m0=lzma2 -mx=1 -mmt=on -ssw -v1900m $archiveBase * -xr!Pagefile.sys *> $null')
          $L.Add('Pop-Location')
          $L.Add('$chunks = @(Get-ChildItem $packDir -Filter "alb-drive.7z.*" | Sort-Object Name)')
          $L.Add('if ($chunks.Count -eq 0) { exit 1 }')
          $L.Add('$chunkList = @($chunks | ForEach-Object { @{ name = $_.Name; size = $_.Length } })')
          $L.Add('$manifest = @{ machineId = $env:MACHINE_ID; updatedUtc = (Get-Date).ToUniversalTime().ToString("o"); chunkCount = $chunks.Count; chunks = $chunkList }')
          $L.Add('$manifest | ConvertTo-Json -Depth 5 | Set-Content "$packDir\drive-manifest.json" -Encoding UTF8')
          $L.Add('$files = @($chunks | ForEach-Object { $_.FullName }) + @("$packDir\drive-manifest.json")')
          $L.Add('for ($i = 1; $i -le 3; $i++) { & gh release upload $env:RELEASE_TAG @files --repo $env:GH_REPO --clobber; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep (2 * $i) }')
          $L.Add('Remove-Item $packDir -Recurse -Force -ErrorAction SilentlyContinue')
          $L.Add('exit 0')
          Set-Content -Path "$env:RUNNER_TEMP\save-data.ps1" -Value ($L -join "`r`n") -Encoding UTF8
          $global:LASTEXITCODE = 0
          Write-Host "OK ZENOVA-OS ($vhdSizeInput GB) | May: $cleanId" -ForegroundColor Green

      - name: ♻️ Khôi phục ổ đĩa & Profile
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            $dlDir = "$env:RUNNER_TEMP\gh-restore"
            if (Test-Path $dlDir) { Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $dlDir | Out-Null
            gh release download $env:RELEASE_TAG --repo $env:GH_REPO --pattern 'drive-manifest.json' --dir $dlDir 2>$null
            if (-not (Test-Path "$dlDir\drive-manifest.json")) { 'DATA_RESTORED=1' >> $env:GITHUB_ENV; exit 0 }
            $manifest = Get-Content -Raw "$dlDir\drive-manifest.json" | ConvertFrom-Json
            $chunkNames = @($manifest.chunks | ForEach-Object { $_.name })
            $hasTJ = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
            $jobs = @()
            $chunkNames | ForEach-Object {
              if ($hasTJ) { $jobs += Start-ThreadJob -ScriptBlock { param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $_, $dlDir }
              else { $jobs += Start-Job -ScriptBlock { param($t,$r,$p,$d) & gh release download $t --repo $r --pattern $p --dir $d 2>$null } -ArgumentList $env:RELEASE_TAG, $env:GH_REPO, $_, $dlDir }
            }
            if ($jobs.Count -gt 0) { $null = Wait-Job $jobs -Timeout 120; $jobs | Remove-Job -Force -ErrorAction SilentlyContinue }
            $first = Get-ChildItem $dlDir -Filter '*.7z.001' | Select-Object -First 1
            if (-not $first) { 'DATA_RESTORED=1' >> $env:GITHUB_ENV; exit 0 }
            $stage = "$env:VHD_CONTAINER\restore-stage"
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            & 7z x $first.FullName "-o$stage" -y -mmt=on *> $null
            Remove-Item $dlDir -Recurse -Force -ErrorAction SilentlyContinue
            $hit = Get-ChildItem $stage -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            $src = if ($hit) { $hit.Directory.Parent.FullName } else { $stage }
            robocopy $src $env:SHARED_ROOT /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP *> $null
            $oldProf = "$env:PROFILE_ROOT\$env:RDP_USER"
            if (Test-Path $oldProf) { robocopy $oldProf $env:PROFILE_PATH /E /XJ /R:0 /W:0 /MT:16 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* /XD @("$oldProf\AppData\Local\Temp") *> $null }
            if (Test-Path $env:SHARED_STATE_FILE) { try { $s = Get-Content -Raw $env:SHARED_STATE_FILE | ConvertFrom-Json; if ($s.password) { "RESTORE_PASS=$($s.password)" >> $env:GITHUB_ENV } } catch {} }
            Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
            'DATA_RESTORED=1' >> $env:GITHUB_ENV
            Write-Host "OK Restore" -ForegroundColor Green
          } catch { 'DATA_RESTORED=1' >> $env:GITHUB_ENV }
          $global:LASTEXITCODE = 0

      - name: 🚀 Turbo Downloader
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $ic = $env:INSTALLER_CACHE
          $hasTJ = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
          New-Item -ItemType Directory -Force -Path $ic | Out-Null
          $downloads = @(
            @{ F = "$ic\usbmmidd.zip"; U = 'https://www.amyuni.com/downloads/usbmmidd_v2.zip'; Min = 100KB },
            @{ F = "$ic\VBCable.zip"; U = 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip'; Min = 500KB },
            @{ F = "$ic\sunshine-setup.exe"; U = 'https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-installer.exe'; Min = 5MB },
            @{ F = "$ic\tailscale.msi"; U = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'; Min = 5MB },
            @{ F = "$ic\EVKey.zip"; U = 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip'; Min = 500KB },
            @{ F = "$ic\VSCode.exe"; U = 'https://update.code.visualstudio.com/latest/win32-x64-system/stable'; Min = 40MB },
            @{ F = "$ic\DiscordSetup.exe"; U = 'https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64'; Min = 40MB },
            @{ F = "$ic\Spotify.exe"; U = 'https://download.scdn.co/SpotifyFullSetupX64.exe'; Min = 5MB },
            @{ F = "$ic\bdcam.exe"; U = 'https://dl.bandicam.com/bdcamsetup.exe'; Min = 10MB },
            @{ F = "$ic\Roblox.exe"; U = 'https://setup.rbxcdn.com/RobloxPlayerInstaller.exe'; Min = 1MB },
            @{ F = "$ic\StarDesk.exe"; U = 'https://api.stardesk.net/api/v1/release/dl/1?channel=official'; Min = 5MB }
          )
          $sb = { param($f, $url, $min) if ((-not (Test-Path $f)) -or ((Get-Item $f -EA SilentlyContinue).Length -lt $min)) { $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'; & curl.exe -L --retry 3 --connect-timeout 15 -A $ua -s $url -o $f 2>$null } }
          $jobs = @()
          $downloads | ForEach-Object { if ($hasTJ) { $jobs += Start-ThreadJob -ScriptBlock $sb -ArgumentList $_.F, $_.U, $_.Min } else { $jobs += Start-Job -ScriptBlock $sb -ArgumentList $_.F, $_.U, $_.Min } }
          if ($jobs.Count -gt 0) { $null = Wait-Job $jobs -Timeout 75; $jobs | Remove-Job -Force -ErrorAction SilentlyContinue }
          Write-Host "OK Turbo Downloader" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🔐 RDP 60FPS + Fix Lag
        shell: pwsh
        timeout-minutes: 4
        env:
          OPT_WIN: ${{ inputs.optimize_windows }}
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fSingleSessionPerUser 0 -Type DWord -Force
          $p = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          @{ UserAuthentication = 0; SecurityLayer = 0; fPromptForPassword = 0; fEnableRemoteFX = 1; MaxIdleTime = 0; MaxDisconnectionTime = 0 } | ForEach-Object { $_.GetEnumerator() | ForEach-Object { Set-ItemProperty $p $_.Key $_.Value -Type DWord -Force } }
          $rdpPol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item $rdpPol -Force | Out-Null
          @{ ColorDepth = 5; MaxMonitors = 4; AVC444ModePreferred = 1; AVCHardwareEncodePreferred = 1; MinEncryptionLevel = 2 } | ForEach-Object { $_.GetEnumerator() | ForEach-Object { Set-ItemProperty $rdpPol $_.Key $_.Value -Type DWord -Force } }
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations' -Name 'DWMFRAMEINTERVAL' -Value 15 -Type DWord -Force

          $rdpidd = 'C:\Windows\System32\drivers\UMDF\RDPidd.dll'
          if (Test-Path $rdpidd) { & takeown.exe /F $rdpidd /A *> $null; & icacls.exe $rdpidd /grant "*S-1-5-32-544:F" /Q *> $null }

          @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP','Tailscale-ICMP') | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -EA SilentlyContinue }
          New-NetFirewallRule -DisplayName 'RDP-Premium' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389,8080 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-TCP' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 47984,47989,47990,48010 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine-Premium-UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 47998,47999,48000,48002,48010 -Profile Any | Out-Null

          Set-Service TermService -StartupType Automatic -EA SilentlyContinue
          Set-Service UmRdpService -StartupType Automatic -EA SilentlyContinue
          Start-Service TermService -EA SilentlyContinue
          Start-Service UmRdpService -EA SilentlyContinue

          if ($env:OPT_WIN -eq 'true') {
            tzutil /s 'SE Asia Standard Time' 2>$null
            $ult = & powercfg /duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null
            if ($ult -match '([a-f0-9\-]{36})') { & powercfg /setactive $Matches[1] 2>$null }
            & powercfg /change standby-timeout-ac 0; & powercfg /change monitor-timeout-ac 0; & powercfg /hibernate off
            & powercfg -setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null
            & powercfg -setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null
            & powercfg /setactive scheme_current 2>$null
            $pt = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'
            New-Item $pt -Force | Out-Null
            Set-ItemProperty $pt PowerThrottlingOff 1 -Type DWord -Force
            Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' Win32PrioritySeparation 38 -Type DWord -Force
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers' -Name 'HwSchMode' -Value 2 -Type DWord -Force
            & fsutil behavior set disablelastaccess 1 *> $null
            @('wuauserv','DiagTrack','WSearch','SysMain','Spooler') | ForEach-Object { Stop-Service -Name $_ -Force -EA SilentlyContinue; Set-Service -Name $_ -StartupType Disabled -EA SilentlyContinue }
            try { Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop } catch {}
          }
          $cpuObj = Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Select-Object -First 1
          "CPU_MODEL_INFO=$($cpuObj.Name.Trim()) ($($cpuObj.NumberOfLogicalProcessors) vCPU)" >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0

      - name: 🖥️🔊☀️ VDD + VB-Audio + Sunshine
        timeout-minutes: 5
        shell: pwsh
        env:
          VDD_RES: ${{ inputs.vdd_resolution }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ic = $env:INSTALLER_CACHE
          $sunPersist = $env:SUNSHINE_PERSIST_CFG
          $hasTJ = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
          $currentUser = $env:RDP_USER
          $parts = $env:VDD_RES -split '[@x]'
          $w = if ($parts.Count -ge 1) { [int]$parts[0] } else { 1920 }
          $h = if ($parts.Count -ge 2) { [int]$parts[1] } else { 1080 }
          $hz = if ($parts.Count -ge 3) { [int]$parts[2] } else { 60 }

          $vddBlock = {
            param($ic, $w, $h, $hz)
            try {
              $zip = "$ic\usbmmidd.zip"; $usbDir = 'C:\usbmmidd_v2'
              if (Test-Path $zip) { New-Item -ItemType Directory -Force -Path $usbDir | Out-Null; & 7z x $zip "-o$usbDir" -y -mmt=on *> $null }
              $inst = "$usbDir\deviceinstaller64.exe"
              if (Test-Path $inst) {
                Push-Location $usbDir
                Get-ChildItem $usbDir -Filter '*.cer' | ForEach-Object { Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' *> $null; Import-Certificate $_.FullName -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *> $null }
                & $inst install usbmmidd.inf usbmmidd *> $null
                $wudf = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\usbmmidd\Parameters'
                New-Item $wudf -Force | Out-Null
                Set-ItemProperty $wudf '0' "${w},${h},${hz}" -Force
                & $inst enableidd 1 *> $null
                Pop-Location
              }
              return 'VDD-OK'
            } catch { return "VDD-FAIL: $_" }
          }

          $vbBlock = {
            param($ic)
            try {
              @('MMCSS','AudioEndpointBuilder','Audiosrv') | ForEach-Object { Set-Service -Name $_ -StartupType Automatic -EA SilentlyContinue; Start-Service -Name $_ -EA SilentlyContinue }
              $zip = "$ic\VBCable.zip"; $vbDir = "$ic\VBCable"
              if (Test-Path $zip) { New-Item -ItemType Directory -Force $vbDir | Out-Null; & 7z x $zip "-o$vbDir" -y -mmt=on *> $null }
              $inf = Get-ChildItem $vbDir -Filter '*64*.inf' -EA SilentlyContinue | Select-Object -First 1
              if ($inf) { $p1 = Start-Process -FilePath 'pnputil.exe' -ArgumentList "/add-driver `"$($inf.FullName)`" /install" -PassThru -NoNewWindow -EA SilentlyContinue; if ($p1) { $p1.WaitForExit(15000) } }
              return 'VB-OK'
            } catch { return "VB-FAIL: $_" }
          }

          $sunBlock = {
            param($ic, $sunPersist, $machineId, $sunPass, $currentUser)
            try {
              $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"
              if (-not (Test-Path $sunExe)) {
                $inst = "$ic\sunshine-setup.exe"
                if ((Test-Path $inst) -and ((Get-Item $inst).Length -gt 5MB)) { $p = Start-Process $inst -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue; if ($p) { $p.WaitForExit(55000) } }
              }
              if (-not (Test-Path $sunExe)) { return 'SUN-FAIL: not installed' }
              Stop-Service SunshineService,sunshinesvc -Force -EA SilentlyContinue; Stop-Process -Name sunshine -Force -EA SilentlyContinue
              Start-Sleep -Milliseconds 500
              $cfg = "$sunDir\config"
              if ((Test-Path $cfg) -and ((Get-Item $cfg -Force).Attributes -notmatch 'ReparsePoint')) {
                if (@(Get-ChildItem $sunPersist -Force -EA SilentlyContinue).Count -eq 0) { Copy-Item "$cfg\*" $sunPersist -Recurse -Force -EA SilentlyContinue }
                Remove-Item $cfg -Recurse -Force -EA SilentlyContinue
              }
              if (-not (Test-Path $cfg)) { New-Item -ItemType Junction $cfg -Target $sunPersist -Force | Out-Null }
              $conf = "$sunPersist\sunshine.conf"
              @("sunshine_name = AISTV-$machineId","origin_web_ui_allowed = wan","upnp = disabled","address_family = both") | Set-Content $conf -Encoding UTF8 -Force
              Remove-NetFirewallRule -DisplayName 'Sunshine-Exe-Allow' -EA SilentlyContinue
              New-NetFirewallRule -DisplayName 'Sunshine-Exe-Allow' -Direction Inbound -Action Allow -Program $sunExe -Profile Any | Out-Null

              # Fix: set creds TRƯỚC khi launch để tránh lỗi auth
              Push-Location $sunDir
              & $sunExe --creds admin $sunPass *> $null
              Pop-Location
              Start-Sleep -Milliseconds 500

              # Launch qua schtasks với quyền HIGHEST
              & schtasks.exe /Create /TN "ALB-Launch-Sunshine" /TR "`"$sunExe`"" /SC ONCE /ST 00:00 /RU $currentUser /RL HIGHEST /F *> $null
              & schtasks.exe /Run /TN "ALB-Launch-Sunshine" *> $null
              Start-Sleep -Seconds 3

              $portOk = $false; $deadline = (Get-Date).AddSeconds(25)
              while ((Get-Date) -lt $deadline) {
                try { $tcp = [System.Net.Sockets.TcpClient]::new(); $conn = $tcp.ConnectAsync('127.0.0.1', 47990); if ($conn.Wait(300)) { $tcp.Close(); $portOk = $true; break }; $tcp.Close() } catch {}
                Start-Sleep -Milliseconds 300
              }
              if ($portOk) { return 'SUN-OK' } else { return 'SUN-NOPORT' }
            } catch { return "SUN-FAIL: $_" }
          }

          $jobList = @()
          if ($hasTJ) {
            $jobList += @{ Name = 'VDD'; Job = (Start-ThreadJob -ScriptBlock $vddBlock -ArgumentList $ic, $w, $h, $hz) }
            $jobList += @{ Name = 'VBAudio'; Job = (Start-ThreadJob -ScriptBlock $vbBlock -ArgumentList $ic) }
            $jobList += @{ Name = 'Sunshine'; Job = (Start-ThreadJob -ScriptBlock $sunBlock -ArgumentList $ic, $sunPersist, $env:MACHINE_ID, $env:SUNSHINE_PASS, $currentUser) }
          } else {
            $jobList += @{ Name = 'VDD'; Job = (Start-Job -ScriptBlock $vddBlock -ArgumentList $ic, $w, $h, $hz) }
            $jobList += @{ Name = 'VBAudio'; Job = (Start-Job -ScriptBlock $vbBlock -ArgumentList $ic) }
            $jobList += @{ Name = 'Sunshine'; Job = (Start-Job -ScriptBlock $sunBlock -ArgumentList $ic, $sunPersist, $env:MACHINE_ID, $env:SUNSHINE_PASS, $currentUser) }
          }
          $null = Wait-Job -Job ($jobList | ForEach-Object { $_.Job }) -Timeout 120
          foreach ($entry in $jobList) { $out = Receive-Job -Job $entry.Job -EA SilentlyContinue; Write-Host "  [$($entry.Name)] $out" -ForegroundColor $(if ($out -match 'OK') { 'Green' } else { 'Yellow' }); Remove-Job -Job $entry.Job -Force -EA SilentlyContinue }
          $global:LASTEXITCODE = 0

      - name: 🌐 Tailscale & DuckDNS
        timeout-minutes: 5
        env:
          EN_TS: ${{ inputs.enable_tailscale }}
          EN_DNS: ${{ inputs.enable_duckdns }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tsIp = '127.0.0.1'; $tsStatus = 'DISABLED'; $funnelUrl = ''
          if ($env:EN_TS -eq 'true') {
            if (-not $env:TAILSCALE_AUTH_KEY) { $tsStatus = 'NO_KEY' } else {
              try {
                $ts = 'C:\Program Files\Tailscale\tailscale.exe'
                if (-not (Test-Path $ts)) { $msi = "$env:INSTALLER_CACHE\tailscale.msi"; if (Test-Path $msi) { Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -NoNewWindow } }
                if (Test-Path $ts) {
                  Set-Service Tailscale -StartupType Automatic -EA SilentlyContinue; Start-Service Tailscale -EA SilentlyContinue; Start-Sleep -Seconds 3
                  & $ts up "--authkey=$env:TAILSCALE_AUTH_KEY" "--hostname=alb-$($env:MACHINE_ID)-$($env:GITHUB_RUN_ID)" --accept-routes --accept-dns --reset --unattended
                  if ($LASTEXITCODE -eq 0) {
                    & $ts set --unattended=true 2>&1 | Out-Null
                    1..15 | ForEach-Object { if ($tsIp -eq '127.0.0.1') { $ipOut = (& $ts ip -4 2>&1 | Out-String).Trim(); if ($ipOut -match '^\d+\.\d+\.\d+\.\d+$') { $tsIp = $ipOut; $tsStatus = 'CONNECTED' } else { Start-Sleep -Seconds 2 } } }
                    try { & $ts funnel reset 2>&1 | Out-Null; & $ts funnel --bg $env:WEB_PORT 2>&1 | Out-Null; Start-Sleep -Seconds 2; $fStat = (& $ts funnel status 2>&1 | Out-String); if ($fStat -match '(https://[^\s]+)') { $funnelUrl = $Matches[1].TrimEnd('/') } } catch {}
                  } else { $tsStatus = 'AUTH_FAIL' }
                } else { $tsStatus = 'INSTALL_FAIL' }
              } catch { $tsStatus = 'ERROR' }
            }
          }
          "TAILSCALE_IP=$tsIp" >> $env:GITHUB_ENV; "FUNNEL_URL=$funnelUrl" >> $env:GITHUB_ENV; "TS_STATUS=$tsStatus" >> $env:GITHUB_ENV
          $pubIp = ''; try { $pubIp = (Invoke-WebRequest -Uri 'https://api.ipify.org' -UseBasicParsing -TimeoutSec 5).Content.Trim() } catch {}
          $ddnsUrl = ''
          if ($env:EN_DNS -eq 'true' -and $env:DUCKDNS_TOKEN -and $env:DUCKDNS_DOMAIN) {
            try {
              $targetIp = if ($tsIp -ne '127.0.0.1') { $tsIp } else { $pubIp }
              $cleanDom = ($env:DUCKDNS_DOMAIN.Trim().ToLower()) -replace '\.duckdns\.org$', ''
              $res = (Invoke-WebRequest -Uri "https://www.duckdns.org/update?domains=$cleanDom&token=$env:DUCKDNS_TOKEN&ip=$targetIp" -UseBasicParsing -TimeoutSec 8).Content.Trim()
              if ($res -eq 'OK') { $ddnsUrl = "${cleanDom}.duckdns.org" }
            } catch {}
          }
          "DUCKDNS_URL=$ddnsUrl" >> $env:GITHUB_ENV; "DUCKDNS_PUBLIC_IP=$pubIp" >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0

      - name: 👤 User + Wallpaper + Shortcut
        shell: pwsh
        timeout-minutes: 5
        env:
          FIXED_PASS_INPUT: ${{ inputs.fixed_password }}
        run: |
          $ErrorActionPreference = 'Continue'
          $user = $env:RDP_USER; $profPath = $env:PROFILE_PATH; $pass = 'Aistv@2026'
          if (-not [string]::IsNullOrWhiteSpace($env:FIXED_PASS_INPUT)) { $pass = $env:FIXED_PASS_INPUT.Trim() } elseif ($env:RESTORE_PASS) { $pass = $env:RESTORE_PASS }

          try {
            & net accounts /maxpwage:unlimited *> $null
            $sp = ConvertTo-SecureString $pass -AsPlainText -Force
            try { Set-LocalUser -Name $user -Password $sp -PasswordNeverExpires $true -EA Stop } catch {}
            & net user $user $pass /active:yes /expires:never *> $null
            Add-LocalGroupMember -Group 'Administrators' -Member $user -EA SilentlyContinue
            Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -EA SilentlyContinue
            Enable-LocalUser -Name $user -EA SilentlyContinue
            "RDP_PASS=$pass" >> $env:GITHUB_ENV; "SUNSHINE_PASS=$pass" >> $env:GITHUB_ENV
            $wl = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
            Set-ItemProperty $wl AutoAdminLogon '1' -Force; Set-ItemProperty $wl DefaultUserName $user -Force
            Set-ItemProperty $wl DefaultPassword $pass -Force; Set-ItemProperty $wl DefaultDomainName $env:COMPUTERNAME -Force
          } catch {}

          # FIX-WALL: Embed base64 trực tiếp — không cần checkout, không bị đen
          $wallDir = $env:WALLPAPER_DIR; New-Item -ItemType Directory -Force -Path $wallDir | Out-Null
          $targetWall = "$wallDir\Zenova-Wallpaper.jpg"
          try {
            $b64Wall = ''
            $bytes = [Convert]::FromBase64String($b64Wall)
            [System.IO.File]::WriteAllBytes($targetWall, $bytes)
          } catch { $targetWall = $null }

          if ($targetWall -and (Test-Path $targetWall) -and (Get-Item $targetWall).Length -gt 50KB) {
            # 1. Ghi đè hình nền mặc định Windows (img0.jpg) — fix màn đen
            @('C:\Windows\Web\Wallpaper\Windows\img0.jpg','C:\Windows\Web\Screen\img100.jpg',
              'C:\Windows\Web\Wallpaper\Windows\img0.png') | ForEach-Object {
              try {
                & takeown.exe /F $_ /A *> $null
                & icacls.exe $_ /grant 'Administrators:F' /Q *> $null
                Copy-Item -Path $targetWall -Destination $_ -Force -EA SilentlyContinue
              } catch {}
            }
            # 2. TranscodedWallpaper (fix màn đen sau login)
            @("$env:APPDATA\Microsoft\Windows\Themes",
              "C:\Users\Default\AppData\Roaming\Microsoft\Windows\Themes") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path $_ | Out-Null
              Copy-Item -Path $targetWall -Destination "$_\TranscodedWallpaper" -Force -EA SilentlyContinue
              Copy-Item -Path $targetWall -Destination "$_\CachedFiles\CachedImage_1920_1080_POS1.jpg" -Force -EA SilentlyContinue
            }
            # 3. Copy vào thư mục hệ thống Windows Web
            $sysWallDir = 'C:\Windows\Web\Wallpaper\ZENOVA'
            New-Item -ItemType Directory -Force -Path $sysWallDir | Out-Null
            Copy-Item -Path $targetWall -Destination "$sysWallDir\zenova-aurora.jpg" -Force -EA SilentlyContinue
            # 4. HKCU + Default User hive + PersonalizationCSP
            @('HKCU:\Control Panel\Desktop','Registry::HKEY_USERS\.DEFAULT\Control Panel\Desktop') | ForEach-Object {
              try {
                if (-not (Test-Path $_)) { New-Item $_ -Force | Out-Null }
                Set-ItemProperty -Path $_ -Name 'Wallpaper' -Value $targetWall -Force
                Set-ItemProperty -Path $_ -Name 'WallpaperStyle' -Value '10' -Force
                Set-ItemProperty -Path $_ -Name 'TileWallpaper' -Value '0' -Force
                Set-ItemProperty -Path $_ -Name 'WallpaperOriginX' -Value 0 -Type DWord -Force -EA SilentlyContinue
                Set-ItemProperty -Path $_ -Name 'WallpaperOriginY' -Value 0 -Type DWord -Force -EA SilentlyContinue
              } catch {}
            }
            # Default NTUSER hive
            try {
              $defHive = 'C:\Users\Default\NTUSER.DAT'
              if (Test-Path $defHive) {
                $null = reg load 'HKU\ZENOVA_DEF' $defHive 2>$null
                if ($LASTEXITCODE -eq 0) {
                  Set-ItemProperty 'Registry::HKU\ZENOVA_DEF\Control Panel\Desktop' Wallpaper $targetWall -Force -EA SilentlyContinue
                  Set-ItemProperty 'Registry::HKU\ZENOVA_DEF\Control Panel\Desktop' WallpaperStyle '10' -Force -EA SilentlyContinue
                  Set-ItemProperty 'Registry::HKU\ZENOVA_DEF\Control Panel\Desktop' TileWallpaper '0' -Force -EA SilentlyContinue
                  [gc]::Collect(); Start-Sleep -Milliseconds 500
                  $null = reg unload 'HKU\ZENOVA_DEF' 2>$null
                }
              }
            } catch {}
            # PersonalizationCSP (Win10/11/Server 2022+)
            $csp = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP'
            New-Item $csp -Force -EA SilentlyContinue | Out-Null
            Set-ItemProperty $csp DesktopImagePath $targetWall -Force -EA SilentlyContinue
            Set-ItemProperty $csp DesktopImageUrl $targetWall -Force -EA SilentlyContinue
            Set-ItemProperty $csp DesktopImageStatus 1 -Type DWord -Force -EA SilentlyContinue
            # 5. Win32 API SystemParametersInfo — áp dụng ngay
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class ZWall { [DllImport("user32.dll", CharSet=CharSet.Auto)] public static extern int SystemParametersInfo(int u, int p, string l, int f); }' -EA SilentlyContinue
            try { [ZWall]::SystemParametersInfo(20, 0, $targetWall, 3) | Out-Null } catch {}
            & RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True
            "WALLPAPER_STATUS=Zenova Cloud Aurora Lake (All OS, All User)" >> $env:GITHUB_ENV
          } else {
            "WALLPAPER_STATUS=FAIL decode base64" >> $env:GITHUB_ENV
          }

          $sunDir = 'C:\Program Files\Sunshine'; $sunExe = "$sunDir\sunshine.exe"
          if (Test-Path $sunExe) {
            $uObj = Get-LocalUser -Name $user -EA SilentlyContinue
            if ($uObj) { & icacls $sunDir /grant "*$($uObj.SID.Value):(OI)(CI)F" /T /C /Q *> $null; & icacls $env:SUNSHINE_PERSIST_CFG /grant "*$($uObj.SID.Value):(OI)(CI)F" /T /C /Q *> $null }
            Stop-Service SunshineService,sunshinesvc -Force -EA SilentlyContinue; Stop-Process -Name sunshine -Force -EA SilentlyContinue; Start-Sleep -Seconds 1
            Push-Location $sunDir; & $sunExe --creds $user $pass *> $null; Pop-Location
            & schtasks.exe /Create /TN "ALB-Launch-Sunshine" /TR "`"$sunExe`"" /SC ONCE /ST 00:00 /RU $user /RL HIGHEST /F *> $null
            & schtasks.exe /Run /TN "ALB-Launch-Sunshine" *> $null
          }

          $desktopDir = "$profPath\Desktop"; $pubDesktop = 'C:\Users\Public\Desktop'
          New-Item -ItemType Directory -Force -Path $desktopDir, $pubDesktop | Out-Null
          @("$desktopDir\*", "$pubDesktop\*") | ForEach-Object {
            Get-ChildItem $_ -Filter '*.lnk' -EA SilentlyContinue | Where-Object { $_.Name -match 'WEB|SUNSHINE|O-DIA|AISTV|NGAT|VSCode|Bandicam|Discord|Spotify|EVKey|Roblox|StarDesk' } | Remove-Item -Force -EA SilentlyContinue
            Get-ChildItem $_ -Filter '*.url' -EA SilentlyContinue | Where-Object { $_.Name -match 'WEB|SUNSHINE' } | Remove-Item -Force -EA SilentlyContinue
            Get-ChildItem $_ -Filter '*.bat' -EA SilentlyContinue | Where-Object { $_.Name -match 'NGAT' } | Remove-Item -Force -EA SilentlyContinue
          }
          $ws = New-Object -ComObject WScript.Shell
          @($pubDesktop) | ForEach-Object {
            $ws.CreateShortcut("$_\O-DIA-RIENG-ZENOVA.lnk").TargetPath = "$($env:MOUNT_LETTER):\"
            $ws.CreateShortcut("$_\WEB-QUAN-LY-RDP.url").TargetPath = "http://127.0.0.1:$($env:WEB_PORT)/"
            $ws.CreateShortcut("$_\SUNSHINE-WEB-UI.url").TargetPath = "https://127.0.0.1:$($env:SUNSHINE_WEB_PORT)/"
            Set-Content -Path "$_\NGAT-RDP-GIU-MAN-HINH.bat" -Value "@echo off`r`nfor /f `"tokens=3-4`" %%a in ('query session %USERNAME%') do @if `"%%b`"==`"Active`" tscon %%a /dest:console" -Encoding ASCII -Force
          }
          $global:LASTEXITCODE = 0

      - name: 📦 Cài siêu tốc App
        timeout-minutes: 8
        shell: pwsh
        env:
          CHOCO_PKGS: ${{ inputs.choco_packages }}
        run: |
          $ErrorActionPreference = 'Continue'
          $ic = $env:INSTALLER_CACHE; $pubDesk = 'C:\Users\Public\Desktop'
          $startupDir = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup"
          $locData = $env:LOCALAPPDATA; $hasTJ = $null -ne (Get-Command Start-ThreadJob -ErrorAction SilentlyContinue)
          
          function Start-FastJob {
            param([scriptblock]$Block, [object[]]$ArgsList)
            if ($hasTJ) { return Start-ThreadJob -ScriptBlock $Block -ArgumentList $ArgsList }
            else { return Start-Job -ScriptBlock $Block -ArgumentList $ArgsList }
          }

          $j1 = Start-FastJob -ArgsList @($ic) -Block { param($ic) if (-not (Test-Path 'C:\Program Files\Microsoft VS Code\Code.exe')) { $p = Start-Process "$ic\VSCode.exe" -ArgumentList '/VERYSILENT','/NORESTART' -PassThru -NoNewWindow -EA SilentlyContinue; if ($p) { $p.WaitForExit(60000) } } }
          $j2 = Start-FastJob -ArgsList @($ic) -Block { param($ic) $ev = 'C:\ALB-Apps\EVKey'; if (-not (Test-Path "$ev\EVKey64.exe")) { if (Test-Path "$ic\EVKey.zip") { & 7z x "$ic\EVKey.zip" "-o$ev" -y -mmt=on *> $null } } }
          $j3 = Start-FastJob -ArgsList @($ic) -Block { param($ic) if (-not (Test-Path "$env:LOCALAPPDATA\Spotify\Spotify.exe")) { $p = Start-Process "$ic\Spotify.exe" -ArgumentList '/silent' -PassThru -NoNewWindow -EA SilentlyContinue; if ($p) { $p.WaitForExit(60000) } } }
          $j4 = Start-FastJob -ArgsList @($ic) -Block { param($ic) if (-not (Test-Path 'C:\Program Files\Bandicam\bdcam.exe')) { $p = Start-Process "$ic\bdcam.exe" -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue; if ($p) { $p.WaitForExit(60000) } } }
          $j5 = Start-FastJob -ArgsList @($ic) -Block { param($ic) if (-not (Test-Path 'C:\Program Files\StarDesk\StarDesk.exe')) { $p = Start-Process "$ic\StarDesk.exe" -ArgumentList '/S' -PassThru -NoNewWindow -EA SilentlyContinue; if ($p) { $p.WaitForExit(60000) } } }
          $j6 = Start-FastJob -ArgsList @($ic) -Block {
            param($ic)
            # Fix: xóa hoàn toàn Discord cũ, đợi process die, rồi cài lại sạch
            Get-Process -Name 'Discord','DiscordUpdate' -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue
            Start-Sleep -Milliseconds 800
            if (Test-Path "$env:LOCALAPPDATA\Discord") {
              Remove-Item "$env:LOCALAPPDATA\Discord" -Recurse -Force -EA SilentlyContinue
              Start-Sleep -Milliseconds 500
            }
            if (Test-Path "$env:APPDATA\Discord") { Remove-Item "$env:APPDATA\Discord" -Recurse -Force -EA SilentlyContinue }
            $inst = "$ic\DiscordSetup.exe"
            if ((Test-Path $inst) -and ((Get-Item $inst).Length -gt 30MB)) {
              $p = Start-Process $inst -ArgumentList '--silent' -PassThru -NoNewWindow -EA SilentlyContinue
              if ($p) { $p.WaitForExit(90000) }
            }
          }
          $j7 = Start-FastJob -ArgsList @($ic) -Block { param($ic) if (-not (Test-Path "$env:LOCALAPPDATA\Roblox\Versions")) { $p = Start-Process "$ic\Roblox.exe" -ArgumentList '-q','--no-ui' -PassThru -NoNewWindow -EA SilentlyContinue; if ($p) { $p.WaitForExit(70000) }; Start-Sleep -Seconds 5 } }

          $allJobs = @($j1, $j2, $j3, $j4, $j5, $j6, $j7)
          $null = Wait-Job -Job $allJobs -Timeout 90
          $allJobs | Remove-Job -Force -EA SilentlyContinue

          $ws = New-Object -ComObject WScript.Shell
          function Add-Icon { param($Name, $Target) if (Test-Path $Target) { $lnk = $ws.CreateShortcut("$pubDesk\$Name.lnk"); $lnk.TargetPath = $Target; $lnk.Save() } }

          $evExe = if (Test-Path 'C:\ALB-Apps\EVKey\EVKey64.exe') { 'C:\ALB-Apps\EVKey\EVKey64.exe' } else { $null }
          if ($evExe) { Add-Icon 'EVKey' $evExe }
          if (Test-Path 'C:\Program Files\Microsoft VS Code\Code.exe') { Add-Icon 'VSCode' 'C:\Program Files\Microsoft VS Code\Code.exe' }
          if (Test-Path 'C:\Program Files\Bandicam\bdcam.exe') { Add-Icon 'Bandicam' 'C:\Program Files\Bandicam\bdcam.exe' }
          if (Test-Path "$locData\Spotify\Spotify.exe") { Add-Icon 'Spotify' "$locData\Spotify\Spotify.exe" }
          if (Test-Path 'C:\Program Files\StarDesk\StarDesk.exe') { Add-Icon 'StarDesk' 'C:\Program Files\StarDesk\StarDesk.exe' }
          $dcApp = Get-ChildItem "$locData\Discord" -Filter 'Discord.exe' -Recurse -EA SilentlyContinue | Select-Object -First 1
          if ($dcApp) { Add-Icon 'Discord' $dcApp.FullName }
          $rbApp = Get-ChildItem "$locData\Roblox\Versions" -Filter 'RobloxPlayerBeta.exe' -Recurse -EA SilentlyContinue | Select-Object -First 1
          if ($rbApp) { Add-Icon 'Roblox' $rbApp.FullName }

          $ws.CreateShortcut("$pubDesk\WEB-QUAN-LY-RDP.url").TargetPath = "http://127.0.0.1:$($env:WEB_PORT)/"
          $ws.CreateShortcut("$pubDesk\SUNSHINE-WEB-UI.url").TargetPath = "https://127.0.0.1:$($env:SUNSHINE_WEB_PORT)/"
          $ws.CreateShortcut("$pubDesk\O-DIA-ZENOVA.lnk").TargetPath = "$($env:MOUNT_LETTER):\"

          if (-not [string]::IsNullOrWhiteSpace($env:CHOCO_PKGS)) {
            $pkgs = $env:CHOCO_PKGS -split '[,\s]+'
            $pkgs | ForEach-Object { & choco install $_ -y --no-progress --limit-output 2>&1 | Out-Null }
          }
          $global:LASTEXITCODE = 0

      - name: 🌐 Web Panel (Start + Verify)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $port = $env:WEB_PORT
          $htmlLines = @(
            '<!DOCTYPE html>',
            '<html lang="vi">',
            '<head>',
            '<meta charset="UTF-8">',
            '<title>ZENOVA CLOUD PANEL</title>',
            '<style>',
            'body { font-family: ''Segoe UI'', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; display: flex; justify-content: center; }',
            '.card { max-width: 600px; width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }',
            'h1 { margin: 0 0 8px 0; font-size: 22px; color: #f472b6; }',
            '.sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }',
            '.info { background: #0f172a; border-radius: 12px; padding: 16px; margin-bottom: 20px; }',
            '.row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1e293b; font-size: 14px; }',
            '.val { font-weight: 600; color: #4ade80; } .val a { color: #facc15; }',
