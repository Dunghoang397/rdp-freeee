name: 'Zenova Ultimate VPS (Windows) - Full Pro Max'

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy (VD: zenova-1)'
        required: false
        default: 'zenova-1'
        type: string
      display_name:
        description: '🏷️ Tên hiển thị của máy'
        required: false
        default: 'Zenova Ultimate Machine'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng (tối đa 24h - tự động chuyển tiếp)'
        required: false
        default: '5h'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h'
          - '6h'
          - '12h'
          - '24h'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới & lưu dữ liệu cho phiên mới'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo riêng biệt lưu dữ liệu (VD: X)'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo riêng (Hỗ trợ GB/TB, tối đa 60TB - Dynamic)'
        required: false
        default: '60TB'
        type: string
      windows_image:
        description: '🪟 Bản Windows (chọn windows-2025 hoặc windows-2022)'
        required: false
        default: 'windows-2025'
        type: choice
        options:
          - 'windows-2025'
          - 'windows-2022'
      fixed_password:
        description: '🔐 Mật khẩu RDP / Apollo / Windows cố định'
        required: false
        default: 'Zenova@2026'
        type: string
      pin_code:
        description: '🔑 Mã PIN StarDesk Trung / GameViewer (VD: Zenova2026)'
        required: false
        default: 'Zenova2026'
        type: string
      stardesk_id_trung:
        description: '🌟 ID StarDesk Trung (để trống hệ thống tự nhận diện)'
        required: false
        default: ''
        type: string
      tailscale_authkey:
        description: '🔑 Key Tailscale Auth (tskey-auth-... hoặc lưu trong Secret TAILSCALE_AUTHKEY / OAuth)'
        required: false
        default: ''
        type: string
      storage_repo:
        description: '📦 Repo lưu trữ ổ đĩa (để trống dùng chính repo này)'
        required: false
        default: ''
        type: string
      root_machine_id:
        description: '🏷️ Tên máy gốc để kế thừa ổ đĩa lần đầu (nếu có)'
        required: false
        default: 'zenova-root'
        type: string
      choco_packages:
        description: '📦 App cài thêm qua choco (lưu vết sang phiên sau)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu tối thượng (Fix CPU 100%, Fix Lag, Múi giờ VN)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS'
        required: false
        default: true
        type: boolean
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo VDD'
        required: false
        default: '1920x1080@60'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  Zenova-Windows:
    name: '🪟 Windows VPS (RDP + Apollo + StarDesk Trung)'
    runs-on: ${{ github.event.inputs.windows_image || 'windows-2025' }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      STORAGE_GH_TOKEN: ${{ secrets.STORAGE_GH_TOKEN || secrets.PAT_TOKEN || github.token }}
      STORAGE_REPO: ${{ github.event.inputs.storage_repo || github.repository }}
      RUNNER_GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      RUNNER_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-1' }}
      ROOT_MACHINE_ID: ${{ github.event.inputs.root_machine_id || 'zenova-root' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || github.event.inputs.machine_id || 'Zenova Ultimate Machine' }}
      DRIVE_LETTER: ${{ github.event.inputs.drive_letter || 'X' }}
      VHD_SIZE_GB: ${{ github.event.inputs.vhd_size_gb || '60TB' }}
      WEB_PORT: '8080'
      APOLLO_WEB_PORT: '47990'
      ENABLE_DUCKDNS: ${{ github.event.inputs.enable_duckdns || 'true' }}
      INPUT_PIN_CODE: ${{ github.event.inputs.pin_code || 'Zenova2026' }}
      STARDESK_ID_INPUT: ${{ github.event.inputs.stardesk_id_trung || '' }}
      TAILSCALE_KEY_INPUT: ${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY || '' }}
      NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN || secrets.NGROK_TOKEN || '' }}
      CHOCO_PACKAGES: ${{ github.event.inputs.choco_packages || '' }}

    steps:
      - name: 📥 Checkout Zenova files
        uses: actions/checkout@v4

      - name: 🔎 Kiểm tra công cụ trên Windows host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop';
          foreach ($tool in @('gh.exe', 'git.exe', 'curl.exe')) {
              if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Thiếu $tool. Cài GitHub CLI, Git và curl trước khi chạy workflow."; }
          }
          $sevenZip = Get-Command '7z.exe' -ErrorAction SilentlyContinue;
          if (-not $sevenZip) {
              $candidate = 'C:\Program Files\7-Zip\7z.exe';
              if (Test-Path $candidate) { Split-Path $candidate | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8; }
              else { throw 'Thiếu 7-Zip (7z.exe). Cài 7-Zip trước khi chạy workflow.'; }
          }
          Write-Host '✅ Git, GitHub CLI, curl và 7-Zip đã sẵn sàng.' -ForegroundColor Green

      - name: 🧱 Dựng ổ đĩa riêng & Chuẩn bị thông số
        shell: pwsh
        env:
          INPUT_DURATION: ${{ github.event.inputs.duration || '5h' }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV";

          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', '';
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'zenova-1'; }
          $relTag      = "zenova-storage-$cleanId";
          $stateBranch = "zenova-state-$cleanId";
          $rootRelTag  = "zenova-storage-$($env:ROOT_MACHINE_ID)";

          "MACHINE_ID=$cleanId" >> "$env:GITHUB_ENV";
          "RELEASE_TAG=$relTag" >> "$env:GITHUB_ENV";
          "STATE_BRANCH=$stateBranch" >> "$env:GITHUB_ENV";
          "ROOT_RELEASE_TAG=$rootRelTag" >> "$env:GITHUB_ENV";

          $total = 300;
          $display = '5 giờ';
          switch ("$env:INPUT_DURATION") {
              '1h'  { $total = 60;   $display = '1 giờ'; }
              '3h'  { $total = 180;  $display = '3 giờ'; }
              '5h'  { $total = 300;  $display = '5 giờ'; }
              '6h'  { $total = 360;  $display = '6 giờ'; }
              '12h' { $total = 720;  $display = '12 giờ'; }
              '24h' { $total = 1440; $display = '24 giờ (Tự chuyển tiếp)'; }
              default { $total = 300; $display = '5 giờ'; }
          }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV";
          "DISPLAY_TIME=$display" >> "$env:GITHUB_ENV";

          $user     = "zenova";
          $profPath = "C:\Users\zenova";
          "RDP_USER=$user" >> "$env:GITHUB_ENV";
          "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV";

          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper();
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X'; }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV";

          $vhdContainer = 'C:\ZENOVA-VHD-HOST';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" -ErrorAction SilentlyContinue | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'zenova-os.vhdx');

          $rawSize = ("$env:VHD_SIZE_GB").Trim().ToUpper();
          $sizeBytes = 100GB;
          
          if ($rawSize -match '^(\d+)\s*TB$') {
              $tbValue = [int64]$Matches[1];
              $sizeBytes = $tbValue * 1TB;
          } elseif ($rawSize -match '^(\d+)\s*GB$') {
              $sizeBytes = ([int64]$Matches[1]) * 1GB;
          } elseif ($rawSize -match '^(\d+)$') {
              $sizeBytes = ([int64]$Matches[1]) * 1GB;
          }

          $maxBytes = 60TB;
          if ($sizeBytes -gt $maxBytes) { $sizeBytes = $maxBytes; }

          Write-Host "💽 Đang khởi tạo ổ đĩa riêng ${dl}:\ ($(($sizeBytes / 1TB).ToString('0.##')) TB Dynamic VHDX)..." -ForegroundColor Cyan;
          
          $mounted = $false;
          try {
              if (Get-Command New-VHD -ErrorAction SilentlyContinue) {
                  if (-not (Test-Path "$vhdFile")) {
                      New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:($false) | Out-Null;
                  } else {
                      Mount-VHD -Path "$vhdFile";
                  }
                  $null = Get-PSDrive -Name "$dl" -ErrorAction Stop;
                  if (Test-Path "${dl}:\") { $mounted = $true; }
              }
          } catch {}

          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" -ErrorAction SilentlyContinue | Out-Null;
              try {
                  $typeDef = 'using System; using System.Runtime.InteropServices; public class KernelDisk { [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Auto)] public static extern bool DefineDosDevice(int dwFlags, string lpDeviceName, string lpTargetPath); }';
                  Add-Type -TypeDefinition $typeDef -ErrorAction SilentlyContinue;
                  [KernelDisk]::DefineDosDevice(0, "${dl}:", "$fallbackDir");
              } catch {}
              & subst "${dl}:" "$fallbackDir" 2>$null;
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue;
              $null = New-PSDrive -Name "$dl" -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue;
          }

          $sharedRoot       = "${dl}:\ZENOVA-SYSTEM";
          $sharedSessionDir = "$sharedRoot\sessions";
          $sharedDataDir    = "$sharedRoot\DATA";
          $ctrlSigFile      = [System.IO.Path]::Combine($vhdContainer, 'control-signal.txt');
          $stateJsonFile    = [System.IO.Path]::Combine($vhdContainer, 'machine-state.json');

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "${dl}:\Apps", "${dl}:\Games", "${dl}:\Downloads") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" -ErrorAction SilentlyContinue | Out-Null;
          };

          "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV";
          "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV";
          "SHARED_DATA_DIR=$sharedDataDir" >> "$env:GITHUB_ENV";
          "CONTROL_SIGNAL_FILE=$ctrlSigFile" >> "$env:GITHUB_ENV";
          "STATE_JSON_FILE=$stateJsonFile" >> "$env:GITHUB_ENV";
          "VHD_CONTAINER=$vhdContainer" >> "$env:GITHUB_ENV";

          Write-Host "✅ Đã thiết lập xong không gian ổ đĩa riêng ${dl}:\" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      - name: 🧰 Tạo script đóng gói & lưu trữ dữ liệu (Siêu tốc, bỏ qua file lớn)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE = 0;
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-zenova-drive.ps1');

          $scriptLines = @(
              'param([string]$Reason = "manual")',
              '$ErrorActionPreference = "Continue";',
              '$global:LASTEXITCODE = 0;',
              '$sw = [System.Diagnostics.Stopwatch]::StartNew();',
              'function Log { param($m) Write-Host "  [$($sw.Elapsed.ToString("mm\:ss"))] $m" -ForegroundColor Gray }',
              'Write-Host "💾 [$Reason] Bắt đầu lưu dữ liệu..." -ForegroundColor Cyan;',
              '',
              'Log "Bước 1: Tắt app đang chạy...";',
              '$apps = @("chrome","msedge","brave","firefox","Spotify","Bandicam","EVKey","RobloxPlayerBeta","StarDesk","GameViewer","prismlauncher","javaw","Code","python","pythonw","node");',
              'foreach ($a in $apps) { Get-Process -Name "$a*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; }',
              'Start-Sleep -Seconds 2;',
              '',
              'Log "Bước 2: Stage dữ liệu hệ thống (bỏ qua X:\Downloads)...";',
              '$stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", "save-stage");',
              'if (Test-Path "$stage") { Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$stage" | Out-Null;',
              'robocopy "$env:SHARED_ROOT" "$stage\system" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '$global:LASTEXITCODE = 0;',
              '',
              'Log "Bước 3: Stage profile user (chỉ file <100MB, bỏ installer)...";',
              '$userProf = "$env:PROFILE_PATH";',
              'if (Test-Path "$userProf") {',
              '    $profDst = "$stage\profile";',
              '    New-Item -ItemType Directory -Force -Path "$profDst" | Out-Null;',
              '    foreach ($fld in @("Desktop","Documents","Pictures")) {',
              '        $src = Join-Path $userProf $fld;',
              '        if (Test-Path $src) {',
              '            robocopy $src "$profDst\$fld" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF *.exe *.msi *.zip *.7z *.iso *.vhdx *.vhd *.tmp *.log *> $null;',
              '            $global:LASTEXITCODE = 0;',
              '        }',
              '    }',
              '    $dlSrc = Join-Path $userProf "Downloads";',
              '    if (Test-Path $dlSrc) {',
              '        $dlDst = "$profDst\Downloads";',
              '        New-Item -ItemType Directory -Force -Path $dlDst | Out-Null;',
              '        Get-ChildItem $dlSrc -File -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 100MB -and $_.Extension -notmatch "^\.(exe|msi|zip|7z|iso|vhdx|vhd)$" } | ForEach-Object {',
              '            try { Copy-Item $_.FullName -Destination $dlDst -Force -ErrorAction SilentlyContinue } catch {}',
              '        }',
              '    }',
              '}',
              '',
              'Log "Bước 4: Nén siêu tốc (mức 1, đa luồng)...";',
              '$out7zDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "save-7z");',
              'if (Test-Path "$out7zDir") { Remove-Item -Path "$out7zDir" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$out7zDir" | Out-Null;',
              '$outPrefix = Join-Path $out7zDir "zenova-drive.7z";',
              '& 7z a -t7z -mx=1 -mmt=on -v1900m "$outPrefix" "$stage\*" *>$null;',
              '$chunks = @(Get-ChildItem -Path "$out7zDir" -Filter "zenova-drive.7z.*" | Sort-Object Name);',
              'if ($chunks.Count -eq 0) { Write-Host "❌ Nén thất bại!" -ForegroundColor Red; exit 1; }',
              'Log "Đã nén $($chunks.Count) chunk.";',
              '',
              'Log "Bước 5: Upload lên GitHub Release...";',
              '$manifest = [PSCustomObject]@{ machineId = "$env:MACHINE_ID"; savedAt = [DateTimeOffset]::UtcNow.ToString("o"); chunkCount = $chunks.Count; reason = $Reason };',
              '$manifestPath = Join-Path $out7zDir "drive-manifest.json";',
              '$manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding UTF8;',
              '$uploadArgs = @("release","upload","$env:RELEASE_TAG","--repo","$env:STORAGE_REPO","--clobber","$manifestPath");',
              'foreach ($c in $chunks) { $uploadArgs += $c.FullName }',
              '& gh @uploadArgs 2>&1 | ForEach-Object { Write-Host "    $_" -ForegroundColor DarkGray };',
              'if ($LASTEXITCODE -ne 0) { Write-Host "❌ Upload fail (exit $LASTEXITCODE)!" -ForegroundColor Red; exit 1; }',
              '',
              'Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue;',
              'Remove-Item -Path "$out7zDir" -Recurse -Force -ErrorAction SilentlyContinue;',
              'Write-Host "🎉 HOÀN TẤT trong $($sw.Elapsed.ToString("mm\:ss"))!" -ForegroundColor Green;',
              '$global:LASTEXITCODE = 0;'
          );

          Set-Content -Path $saveScriptPath -Value ($scriptLines -join "`r`n") -Encoding UTF8;
          "SAVE_SCRIPT_PATH=$saveScriptPath" >> "$env:GITHUB_ENV";
          $global:LASTEXITCODE = 0;
          exit 0;

      - name: 🧰 Tạo script đồng bộ trạng thái máy lên Git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $pushScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'push-zenova-state.ps1');

          $lines = @(
              '$ErrorActionPreference = "Continue";',
              '$global:LASTEXITCODE = 0;',
              '$state = [PSCustomObject]@{ machineId = "$env:MACHINE_ID"; displayName = "$env:DISPLAY_NAME"; lastSeen = [DateTimeOffset]::UtcNow.ToString("o"); releaseTag = "$env:RELEASE_TAG"; tailscaleIp = if (Test-Path "C:\tailscale-ip.txt") { (Get-Content "C:\tailscale-ip.txt" -Raw).Trim() } else { "" }; stardeskId = if (Test-Path "C:\stardesk-id.txt") { (Get-Content "C:\stardesk-id.txt" -Raw).Trim() } else { "" }; stardeskPin = if (Test-Path "C:\stardesk-pin.txt") { (Get-Content "C:\stardesk-pin.txt" -Raw).Trim() } else { "Zenova2026" }; cloudflareWeb = if (Test-Path "C:\cloudflared-web-url.txt") { (Get-Content "C:\cloudflared-web-url.txt" -Raw).Trim() } else { "" }; cloudflareApollo = if (Test-Path "C:\cloudflared-apollo-url.txt") { (Get-Content "C:\cloudflared-apollo-url.txt" -Raw).Trim() } else { "" }; };',
              '$state | ConvertTo-Json -Depth 5 | Set-Content -Path "$env:STATE_JSON_FILE" -Encoding UTF8;',
              '$stateRepoDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "state-repo");',
              'if (-not (Test-Path "$stateRepoDir")) {',
              '    & git clone --depth 1 "https://x-access-token:$($env:STORAGE_GH_TOKEN)@github.com/$($env:STORAGE_REPO).git" "$stateRepoDir" 2>&1 | Out-Null;',
              '};',
              'if (Test-Path "$stateRepoDir") {',
              '    Push-Location "$stateRepoDir";',
              '    & git config user.name "Zenova-Automation" 2>&1 | Out-Null;',
              '    & git config user.email "zenova@cloud.local" 2>&1 | Out-Null;',
              '    & git checkout -B "$env:STATE_BRANCH" 2>&1 | Out-Null;',
              '    $destState = [System.IO.Path]::Combine("$stateRepoDir", "state.json");',
              '    Copy-Item -Path "$env:STATE_JSON_FILE" -Destination "$destState" -Force -ErrorAction SilentlyContinue;',
              '    & git add state.json 2>&1 | Out-Null;',
              '    & git commit -m "Auto-sync state [$env:MACHINE_ID]" --allow-empty 2>&1 | Out-Null;',
              '    & git push origin "$env:STATE_BRANCH" --force 2>&1 | Out-Null;',
              '    Pop-Location;',
              '};',
              '$global:LASTEXITCODE = 0;'
          );

          Set-Content -Path $pushScriptPath -Value ($lines -join "`r`n") -Encoding UTF8;
          "PUSH_STATE_SCRIPT=$pushScriptPath" >> "$env:GITHUB_ENV";
          $global:LASTEXITCODE = 0;
          exit 0;

      - name: ♻️ Khôi phục dữ liệu từ GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $dl = "$env:MOUNT_LETTER";

          @(
              'HKLM:\SOFTWARE\Policies\Google\Chrome',
              'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
              'HKLM:\SOFTWARE\Policies\BraveSoftware\Brave',
              'HKLM:\SOFTWARE\Policies\CocCoc\Browser'
          ) | ForEach-Object {
              New-Item -Path "$_" -Force -ErrorAction SilentlyContinue | Out-Null;
              Set-ItemProperty -Path "$_" -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          };

          $suffix = (("$env:MACHINE_ID").ToUpper() -replace '[^A-Z0-9]', '');
          if ($suffix.Length -gt 8) { $suffix = $suffix.Substring(0, 8); }
          $fixedHost = if ($suffix) { "ZENOVA-$suffix" } else { 'ZENOVA-VPS' };
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;

          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore');
          if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue; }
          New-Item -ItemType Directory -Force -Path "$dlDir" -ErrorAction SilentlyContinue | Out-Null;

          $isFirstRun = $false;
          $sourceTag = "$env:RELEASE_TAG";

          $null = gh release view "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $isFirstRun = $true;
          } else {
              gh release download "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
              $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json');
              if (-not (Test-Path "$manifestFile")) {
                  if ("$env:ROOT_RELEASE_TAG" -and ("$env:ROOT_RELEASE_TAG" -ne "$env:RELEASE_TAG")) {
                      $null = gh release view "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
                      if (($LASTEXITCODE) -eq 0) {
                          gh release download "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
                          if (Test-Path "$manifestFile") {
                              $sourceTag = "$env:ROOT_RELEASE_TAG";
                              Write-Host "📦 Kế thừa bản lưu từ máy gốc [$env:ROOT_RELEASE_TAG]..." -ForegroundColor Cyan;
                          } else {
                              $isFirstRun = $true;
                          }
                      } else {
                          $isFirstRun = $true;
                      }
                  } else {
                      $isFirstRun = $true;
                  }
              }
          }

          $global:LASTEXITCODE = 0;

          if ($isFirstRun) {
              Write-Host "ℹ️ Máy [$env:MACHINE_ID] là máy mới! Tạo phiên làm việc mới..." -ForegroundColor Cyan;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          $manifest = Get-Content -Raw -Path "$manifestFile" | ConvertFrom-Json;
          Write-Host "⬇️ Tìm thấy bản lưu từ [$sourceTag] ($($manifest.chunkCount) phân mảnh). Đang tải..." -ForegroundColor Cyan;
          gh release download "$sourceTag" --repo "$env:STORAGE_REPO" --pattern 'zenova-drive.7z.*' --dir "$dlDir";
          if (($LASTEXITCODE) -ne 0) {
              Write-Host "⚠️ Không tải được phân mảnh từ [$sourceTag], tiếp tục phiên mới..." -ForegroundColor Yellow;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          $firstChunk = [System.IO.Path]::Combine("$dlDir", 'zenova-drive.7z.001');
          if (Test-Path "$firstChunk") {
              Write-Host "📦 Đang giải nén dữ liệu vào ${dl}:\..." -ForegroundColor Cyan;
              & 7z x "$firstChunk" "-o${dl}:\" -y -mmt=on *>$null;
          }

          $global:LASTEXITCODE = 0;
          exit 0;

      - name: ⚙️ Tạo User, Giả lập CPU Xeon & Tối ưu Mạng Zero-Lag
        shell: pwsh
        env:
          FIXED_PASS: ${{ github.event.inputs.fixed_password || 'Zenova@2026' }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "⚙️ ĐANG CẤU HÌNH TÀI KHOẢN & TỐI ƯU HÓA INTEL XEON ZERO-LAG..." -ForegroundColor Yellow;

          try {
              $cpuName = "Intel(R) Xeon(R) Platinum 8380 CPU @ 2.30GHz"
              Set-ItemProperty -Path "HKLM:\HARDWARE\DESCRIPTION\System\CentralProcessor\0" -Name "ProcessorNameString" -Value $cpuName -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path "HKLM:\HARDWARE\DESCRIPTION\System\CentralProcessor\0" -Name "VendorIdentifier" -Value "GenuineIntel" -Force -ErrorAction SilentlyContinue;
              Write-Host "│ ✅ Đã giả lập CPU: $cpuName" -ForegroundColor Green;
          } catch {}

          try {
              $dgPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity';
              New-Item -Path $dgPath -Force -ErrorAction SilentlyContinue | Out-Null;
              Set-ItemProperty -Path $dgPath -Name 'Enabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
              bcdedit /set hypervisorlaunchtype off 2>&1 | Out-Null;
              Write-Host "│ ✅ Đã tắt HVCI!" -ForegroundColor Green;
          } catch {}

          try {
              $secCfg = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.cfg');
              $secDb  = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.sdb');
              secedit /export /cfg "$secCfg" *> $null;
              if (Test-Path "$secCfg") {
                  (Get-Content $secCfg) -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' | Set-Content $secCfg;
                  secedit /configure /db "$secDb" /cfg "$secCfg" /areas SECURITYPOLICY *> $null;
                  Remove-Item "$secCfg", "$secDb" -Force -ErrorAction SilentlyContinue;
              }
          } catch {}

          $user = "zenova";
          $pass = if ($env:FIXED_PASS) { $env:FIXED_PASS } else { "Zenova@2026" };
          "FIXED_PASSWORD=$pass" >> "$env:GITHUB_ENV";

          try {
              & net user $user $pass /add /comment:"Zenova Cloud User" /fullname:"Zenova" /expires:never 2>&1 | Out-Null;
              & net user $user $pass 2>&1 | Out-Null;
              & net user runneradmin $pass 2>&1 | Out-Null;
              Write-Host "│ ✅ Đã tạo User Zenova thành công!" -ForegroundColor Green;
          } catch {
              try {
                  $secPass = ConvertTo-SecureString "$pass" -AsPlainText -Force;
                  if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
                      New-LocalUser -Name $user -Password $secPass -FullName "Zenova" -PasswordNeverExpires -ErrorAction SilentlyContinue;
                  }
              } catch {}
          }

          try {
              Set-LocalUser -Name $user -PasswordNeverExpires $true -ErrorAction SilentlyContinue;
              Set-LocalUser -Name "runneradmin" -PasswordNeverExpires $true -ErrorAction SilentlyContinue;
              Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue;
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue;
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue;
          } catch {}

          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon';
          Set-ItemProperty -Path $winlogon -Name 'AutoAdminLogon' -Value '1' -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path $winlogon -Name 'DefaultUserName' -Value $user -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path $winlogon -Name 'DefaultPassword' -Value $pass -Force -ErrorAction SilentlyContinue;

          Write-Host "🚀 Đang tối ưu CPU Xeon & Khử Delay Mạng..." -ForegroundColor Cyan;

          $ptPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling';
          New-Item -Path $ptPath -Force -ErrorAction SilentlyContinue | Out-Null;
          Set-ItemProperty -Path $ptPath -Name 'PowerThrottlingOff' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Power' -Name 'CsEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' -Name 'Win32PrioritySeparation' -Value 38 -Type DWord -Force -ErrorAction SilentlyContinue;

          try {
              powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null | Out-Null;
              powercfg -setactive e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null | Out-Null;
              powercfg /setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null | Out-Null;
              powercfg /setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null | Out-Null;
              powercfg /change standby-timeout-ac 0 2>$null;
              powercfg /change monitor-timeout-ac 0 2>$null;
              powercfg /change disk-timeout-ac 0 2>$null;
              powercfg /hibernate off 2>$null;
          } catch {}

          try {
              Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -ErrorAction SilentlyContinue;
          } catch {}

          $servicesToKill = @('WSearch', 'SysMain', 'wuauserv', 'UsoSvc', 'DiagTrack', 'dmwappushservice', 'WerSvc', 'PcaSvc', 'DPS');
          foreach ($svc in $servicesToKill) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue;
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue;
          }

          tzutil /s 'SE Asia Standard Time' 2>$null;

          try {
              $interfaces = Get-ChildItem "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces" -ErrorAction SilentlyContinue
              foreach ($i in $interfaces) {
                  Set-ItemProperty -Path $i.PSPath -Name "TcpAckFrequency" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $i.PSPath -Name "TCPNoDelay" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path $i.PSPath -Name "TcpDelAckTicks" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue
              }
              netsh int tcp set global autotuninglevel=normal 2>$null | Out-Null;
              netsh int tcp set global congestionprovider=bbr 2>$null | Out-Null;
              netsh int tcp set global rss=enabled 2>$null | Out-Null;
              netsh int tcp set global rsc=enabled 2>$null | Out-Null;
              netsh int tcp set global ecncapability=enabled 2>$null | Out-Null;
              netsh int tcp set global timestamps=disabled 2>$null | Out-Null;
              netsh int tcp set heuristics disabled 2>$null | Out-Null;
          } catch {}

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force -ErrorAction SilentlyContinue;
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue;
          Start-Service -Name TermService -ErrorAction SilentlyContinue;
          netsh advfirewall set allprofiles state off 2>&1 | Out-Null;

          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Server\ServerManager' -Name 'DoNotOpenAtLogon' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\ServerManager' -Name 'DoNotOpenServerManagerAtLogon' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;

          try {
              Enable-WindowsOptionalFeature -Online -FeatureName DirectPlay -All -NoRestart -ErrorAction SilentlyContinue | Out-Null;
          } catch {}

          Write-Host "✅ Tối ưu Intel Xeon Platinum & Mạng Zero-Lag hoàn tất!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      - name: 🌐 Lấy Public IP của máy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $pubIp = "";
          @('https://api.ipify.org', 'https://ifconfig.me/ip', 'https://icanhazip.com', 'https://ipinfo.io/ip') | ForEach-Object {
              if (-not $pubIp) {
                  try { $pubIp = (Invoke-RestMethod -Uri $_ -TimeoutSec 4).Trim(); } catch {}
              }
          };
          if (-not $pubIp) { $pubIp = "127.0.0.1"; }
          "MACHINE_PUBLIC_IP=$pubIp" >> "$env:GITHUB_ENV";
