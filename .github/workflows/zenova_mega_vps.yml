              '--url', 'https://github.com/chrisd1100/OP-AutoClicker/releases/download/v4.0/OPAutoClicker.exe', '-o', "$autoClickExe"
          );
          & curl.exe -L -s --retry 2 -Z @parallelDownloads;

          # Sao chép các file vừa tải vào all Downloads folders
          foreach ($appPath in @("$vsCodeSetup", "$windhawkExe", "$autoClickExe", "$bloxExe")) {
              if (Test-Path $appPath) {
                  Copy-Item -Path $appPath -Destination "C:\Users\runneradmin\Downloads\" -Force -ErrorAction SilentlyContinue;
                  Copy-Item -Path $appPath -Destination "${dl}:\Downloads\" -Force -ErrorAction SilentlyContinue;
