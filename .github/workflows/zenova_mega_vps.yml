          JSON_EOF

          # Upload lÃªn GitHub Release vá»›i cÆ¡ cháº¿ retry 3 láº§n
          UPLOAD_FILES=("${CHUNKS[@]}" "$MANIFEST")
          UPLOAD_OK=0
