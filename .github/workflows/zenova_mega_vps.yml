name: 'Zenova Ultimate VPS (Windows) - Full Pro Max'

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy (VD: zenova-1)'
        required: false
        default: 'zenova-1'
        type: string
      display_name:
        description: '🏷️ Tên hiển thị của máy'
        required: false
        default: 'Zenova Ultimate Machine'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng (tối đa 24h - tự động chuyển tiếp)'
        required: false
        default: '5h'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h'
          - '6h'
          - '12h'
          - '24h'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới & lưu dữ liệu cho phiên mới'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo riêng biệt lưu dữ liệu (VD: X)'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo riêng (Hỗ trợ GB/TB, tối đa 60TB - Dynamic)'
        required: false
        default: '60TB'
        type: string
      windows_image:
        description: '🪟 Bản Windows (khuyên dùng windows-2022 để 100% CPU Intel Xeon)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      fixed_password:
        description: '🔐 Mật khẩu RDP / Sunshine / Windows cố định'
        required: false
        default: 'Zenova@2026'
        type: string
      pin_code:
        description: '🔑 Mã PIN StarDesk Trung / GameViewer (VD: Zenova2026)'
        required: false
        default: 'Zenova2026'
        type: string
      stardesk_id_trung:
        description: '🌟 ID StarDesk Trung (để trống hệ thống tự nhận diện)'
        required: false
        default: ''
        type: string
      tailscale_authkey:
        description: '🔑 Key Tailscale Auth (tskey-auth-... hoặc lưu trong Secret TAILSCALE_AUTHKEY)'
        required: false
        default: ''
        type: string

      storage_repo:
        description: '📦 Repo lưu trữ ổ đĩa (để trống dùng chính repo này)'
        required: false
        default: ''
        type: string
      root_machine_id:
        description: '🏷️ Tên máy gốc để kế thừa ổ đĩa lần đầu (nếu có)'
        required: false
        default: 'zenova-root'
        type: string
      choco_packages:
        description: '📦 App cài thêm qua choco (lưu vết sang phiên sau)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu tối thượng (Fix CPU 100%, Fix Lag, Múi giờ VN)'
        required: false
        default: true
        type: boolean
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo VDD'
        required: false
        default: '1920x1080@60'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  # =========================================================================
  # ZENOVA WINDOWS RUNNER (INTEL XEON + SUNSHINE + STARDESK TRUNG + APPS)
  # =========================================================================
  Zenova-Windows:
    name: '🪟 Windows VPS (Intel Xeon + Sunshine + StarDesk Trung)'
    runs-on: ${{ github.event.inputs.windows_image || 'windows-2022' }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      STORAGE_GH_TOKEN: ${{ secrets.STORAGE_GH_TOKEN || secrets.PAT_TOKEN || github.token }}
      STORAGE_REPO: ${{ github.event.inputs.storage_repo || github.repository }}
      RUNNER_GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      RUNNER_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-1' }}
      ROOT_MACHINE_ID: ${{ github.event.inputs.root_machine_id || 'zenova-root' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || github.event.inputs.machine_id || 'Zenova Ultimate Machine' }}
      DRIVE_LETTER: ${{ github.event.inputs.drive_letter || 'X' }}
      VHD_SIZE_GB: ${{ github.event.inputs.vhd_size_gb || '60TB' }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      INPUT_PIN_CODE: ${{ github.event.inputs.pin_code || 'Zenova2026' }}
      STARDESK_ID_INPUT: ${{ github.event.inputs.stardesk_id_trung || '' }}
      TAILSCALE_KEY_INPUT: ${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY || '' }}
      NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN || secrets.NGROK_TOKEN || '' }}
      CHOCO_PACKAGES: ${{ github.event.inputs.choco_packages || '' }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. DỰNG Ổ ĐĨA RIÊNG & CHUẨN BỊ THÔNG SỐ (HỖ TRỢ LÊN ĐẾN 60TB)
      # ─────────────────────────────────────────────────────────────
      - name: 🧱 Dựng ổ đĩa riêng & Chuẩn bị thông số
        shell: pwsh
        env:
          INPUT_DURATION: ${{ github.event.inputs.duration || '5h' }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV";

          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', '';
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'zenova-1'; }
          $relTag      = "zenova-storage-$cleanId";
          $stateBranch = "zenova-state-$cleanId";
          $rootRelTag  = "zenova-storage-$($env:ROOT_MACHINE_ID)";

          "MACHINE_ID=$cleanId" >> "$env:GITHUB_ENV";
          "RELEASE_TAG=$relTag" >> "$env:GITHUB_ENV";
          "STATE_BRANCH=$stateBranch" >> "$env:GITHUB_ENV";
          "ROOT_RELEASE_TAG=$rootRelTag" >> "$env:GITHUB_ENV";

          $total = 300;
          $display = '5 giờ';
          switch ("$env:INPUT_DURATION") {
              '1h'  { $total = 60;   $display = '1 giờ'; }
              '3h'  { $total = 180;  $display = '3 giờ'; }
              '5h'  { $total = 300;  $display = '5 giờ'; }
              '6h'  { $total = 360;  $display = '6 giờ'; }
              '12h' { $total = 720;  $display = '12 giờ'; }
              '24h' { $total = 1440; $display = '24 giờ (Tự chuyển tiếp)'; }
              default { $total = 300; $display = '5 giờ'; }
          }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV";
          "DISPLAY_TIME=$display" >> "$env:GITHUB_ENV";

          $user     = "zenova";
          $profPath = "C:\Users\zenova";
          "RDP_USER=$user" >> "$env:GITHUB_ENV";
          "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV";

          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper();
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X'; }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV";

          $vhdContainer = 'C:\ZENOVA-VHD-HOST';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" -ErrorAction SilentlyContinue | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'zenova-os.vhdx');

          # Xử lý dung lượng TB / GB linh hoạt tối đa 60TB
          $rawSize = ("$env:VHD_SIZE_GB").Trim().ToUpper();
          $sizeBytes = 100GB;
          
          if ($rawSize -match '^(\d+)\s*TB$') {
              $tbValue = [int64]$Matches[1];
              $sizeBytes = $tbValue * 1TB;
              Write-Host "📦 Dung lượng cấu hình: $tbValue TB" -ForegroundColor Cyan;
          } elseif ($rawSize -match '^(\d+)\s*GB$') {
              $sizeBytes = ([int64]$Matches[1]) * 1GB;
              Write-Host "📦 Dung lượng cấu hình: $($Matches[1]) GB" -ForegroundColor Cyan;
          } elseif ($rawSize -match '^(\d+)$') {
              $sizeBytes = ([int64]$Matches[1]) * 1GB;
              Write-Host "📦 Dung lượng cấu hình: $($Matches[1]) GB (mặc định)" -ForegroundColor Cyan;
          }

          $maxBytes = 60TB;
          if ($sizeBytes -gt $maxBytes) {
              $sizeBytes = $maxBytes;
              Write-Host "⚠️ Giới hạn dung lượng tối đa 60TB!" -ForegroundColor Yellow;
          }

          Write-Host "💽 Đang khởi tạo ổ đĩa riêng ${dl}:\ ($(($sizeBytes / 1TB).ToString('0.##')) TB Dynamic VHDX)..." -ForegroundColor Cyan;
          
          $mounted = $false;
          try {
              if (Get-Command New-VHD -ErrorAction SilentlyContinue) {
                  if (-not (Test-Path "$vhdFile")) {
                      New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:($false) | Out-Null;
                  } else {
                      Mount-VHD -Path "$vhdFile";
                  }
                  $null = Get-PSDrive -Name "$dl" -ErrorAction Stop;
                  if (Test-Path "${dl}:\") { $mounted = $true; }
              }
          } catch {
              Write-Host "⚠️ Fallback sang cơ chế Kernel DOS Devices cho ${dl}:\..." -ForegroundColor Yellow;
          }

          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" -ErrorAction SilentlyContinue | Out-Null;
              try {
                  $typeDef = 'using System; using System.Runtime.InteropServices; public class KernelDisk { [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Auto)] public static extern bool DefineDosDevice(int dwFlags, string lpDeviceName, string lpTargetPath); }';
                  Add-Type -TypeDefinition $typeDef -ErrorAction SilentlyContinue;
                  [KernelDisk]::DefineDosDevice(0, "${dl}:", "$fallbackDir");
              } catch {}
              & subst "${dl}:" "$fallbackDir" 2>$null;
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue;
              $null = New-PSDrive -Name "$dl" -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue;
          }

          $sharedRoot       = "${dl}:\ZENOVA-SYSTEM";
          $sharedSessionDir = "$sharedRoot\sessions";
          $sharedDataDir    = "$sharedRoot\DATA";
          $ctrlSigFile      = [System.IO.Path]::Combine($vhdContainer, 'control-signal.txt');
          $stateJsonFile    = [System.IO.Path]::Combine($vhdContainer, 'machine-state.json');

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "${dl}:\Apps", "${dl}:\Games", "${dl}:\Downloads") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" -ErrorAction SilentlyContinue | Out-Null;
          };

          "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV";
          "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV";
          "SHARED_DATA_DIR=$sharedDataDir" >> "$env:GITHUB_ENV";
          "CONTROL_SIGNAL_FILE=$ctrlSigFile" >> "$env:GITHUB_ENV";
          "STATE_JSON_FILE=$stateJsonFile" >> "$env:GITHUB_ENV";
          "VHD_CONTAINER=$vhdContainer" >> "$env:GITHUB_ENV";

          Write-Host "✅ Đã thiết lập xong không gian ổ đĩa riêng ${dl}:\" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 2. TẠO SCRIPT ĐÓNG GÓI & LƯU TRỮ DỮ LIỆU
      # (LƯU Ý: manual-web-save TUYỆT ĐỐI KHÔNG TẮT MÁY, KHÔNG TẮT APP)
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đóng gói & lưu trữ dữ liệu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-zenova-drive.ps1');

          $scriptLines = @(
              'param([string]$Reason = "manual")',
              '$ErrorActionPreference = "Continue";',
              '$global:LASTEXITCODE = 0;',
              'Write-Host "💾 [$Reason] Đang tiến hành đóng gói và lưu trữ dữ liệu..." -ForegroundColor Cyan;',
              '# CHỈ tắt app khi kết thúc phiên hoàn toàn (final-session-save hoặc restart). Khi lưu sớm qua Web Panel (manual-web-save) thì TUYỆT ĐỐI KHÔNG TẮT APP!',
              'if ($Reason -ne "manual-web-save") {',
              '    $appsToClose = @("chrome", "msedge", "brave", "firefox", "Spotify", "Bandicam", "EVKey", "RobloxPlayerBeta", "StarDesk", "GameViewer", "prismlauncher", "javaw", "Code");',
              '    foreach ($app in $appsToClose) {',
              '        Get-Process -Name "$app*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;',
              '        taskkill.exe /F /IM "$app*.exe" /T 2>$null | Out-Null;',
              '    };',
              '    Start-Sleep -Seconds 2;',
              '};',
              '$stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", "save-stage");',
              'if (Test-Path "$stage") { Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$stage" -ErrorAction SilentlyContinue | Out-Null;',
              'robocopy "$env:SHARED_ROOT" "$stage" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '$global:LASTEXITCODE = 0;',
              '$userProf = "$env:PROFILE_PATH";',
              'if (Test-Path "$userProf") {',
              '    $profDst = [System.IO.Path]::Combine("$stage", "Users", "$env:RDP_USER");',
              '    New-Item -ItemType Directory -Force -Path "$profDst" -ErrorAction SilentlyContinue | Out-Null;',
              '    @("Desktop", "Documents", "Downloads", "Pictures") | ForEach-Object {',
              '        $src = [System.IO.Path]::Combine($userProf, $_);',
              '        $dst = [System.IO.Path]::Combine($profDst, $_);',
              '        if (Test-Path $src) { robocopy $src $dst /E /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP *> $null; }',
              '    };',
              '};',
              '$out7zDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "save-7z");',
              'if (Test-Path "$out7zDir") { Remove-Item -Path "$out7zDir" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$out7zDir" -ErrorAction SilentlyContinue | Out-Null;',
              '$outPrefix = [System.IO.Path]::Combine($out7zDir, "zenova-drive.7z");',
              '& 7z a -t7z -m0=lzma2 -mx=3 -md=32m -mfb=32 -ms=on -v1900m "$outPrefix" "$stage\*" *>$null;',
              '$chunks = Get-ChildItem -Path "$out7zDir" -Filter "zenova-drive.7z.*" | Sort-Object Name;',
              'if ($chunks.Count -gt 0) {',
              '    $manifest = [PSCustomObject]@{ machineId = "$env:MACHINE_ID"; savedAt = [DateTimeOffset]::UtcNow.ToString("o"); chunkCount = $chunks.Count; reason = $Reason; };',
              '    $manifestPath = [System.IO.Path]::Combine($out7zDir, "drive-manifest.json");',
              '    $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding UTF8;',
              '    $uploadArgs = @("release", "upload", "$env:RELEASE_TAG", "--repo", "$env:STORAGE_REPO", "--clobber", "$manifestPath");',
              '    foreach ($c in $chunks) { $uploadArgs += $c.FullName; }',
              '    & gh @uploadArgs 2>&1 | Out-Null;',
              '    Write-Host "✅ Đã lưu xong $($chunks.Count) phân mảnh dữ liệu lên GitHub Release [$env:RELEASE_TAG]!" -ForegroundColor Green;',
              '};',
              '$global:LASTEXITCODE = 0;'
          );

          Set-Content -Path $saveScriptPath -Value ($scriptLines -join "`r`n") -Encoding UTF8;
          "SAVE_SCRIPT_PATH=$saveScriptPath" >> "$env:GITHUB_ENV";
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 3. TẠO SCRIPT ĐỒNG BỘ TRẠNG THÁI MÁY LÊN GIT
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đồng bộ trạng thái máy lên Git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $pushScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'push-zenova-state.ps1');

          $lines = @(
              '$ErrorActionPreference = "Continue";',
              '$global:LASTEXITCODE = 0;',
              '$state = [PSCustomObject]@{ machineId = "$env:MACHINE_ID"; displayName = "$env:DISPLAY_NAME"; lastSeen = [DateTimeOffset]::UtcNow.ToString("o"); releaseTag = "$env:RELEASE_TAG"; tailscaleIp = if (Test-Path "C:\tailscale-ip.txt") { (Get-Content "C:\tailscale-ip.txt" -Raw).Trim() } else { "" }; stardeskId = if (Test-Path "C:\stardesk-id.txt") { (Get-Content "C:\stardesk-id.txt" -Raw).Trim() } else { "" }; cloudflareWeb = if (Test-Path "C:\cloudflared-web-url.txt") { (Get-Content "C:\cloudflared-web-url.txt" -Raw).Trim() } else { "" }; cloudflareSunshine = if (Test-Path "C:\cloudflared-sunshine-url.txt") { (Get-Content "C:\cloudflared-sunshine-url.txt" -Raw).Trim() } else { "" }; };',
              '$state | ConvertTo-Json -Depth 5 | Set-Content -Path "$env:STATE_JSON_FILE" -Encoding UTF8;',
              '$stateRepoDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "state-repo");',
              'if (-not (Test-Path "$stateRepoDir")) {',
              '    & git clone --depth 1 "https://x-access-token:$($env:STORAGE_GH_TOKEN)@github.com/$($env:STORAGE_REPO).git" "$stateRepoDir" 2>&1 | Out-Null;',
              '};',
              'if (Test-Path "$stateRepoDir") {',
              '    Push-Location "$stateRepoDir";',
              '    & git config user.name "Zenova-Automation" 2>&1 | Out-Null;',
              '    & git config user.email "zenova@cloud.local" 2>&1 | Out-Null;',
              '    & git checkout -B "$env:STATE_BRANCH" 2>&1 | Out-Null;',
              '    $destState = [System.IO.Path]::Combine("$stateRepoDir", "state.json");',
              '    Copy-Item -Path "$env:STATE_JSON_FILE" -Destination "$destState" -Force -ErrorAction SilentlyContinue;',
              '    & git add state.json 2>&1 | Out-Null;',
              '    & git commit -m "Auto-sync state [$env:MACHINE_ID]" --allow-empty 2>&1 | Out-Null;',
              '    & git push origin "$env:STATE_BRANCH" --force 2>&1 | Out-Null;',
              '    Pop-Location;',
              '};',
              '$global:LASTEXITCODE = 0;'
          );

          Set-Content -Path $pushScriptPath -Value ($lines -join "`r`n") -Encoding UTF8;
          "PUSH_STATE_SCRIPT=$pushScriptPath" >> "$env:GITHUB_ENV";
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 4. KHÔI PHỤC DỮ LIỆU TỪ GITHUB RELEASE
      # ─────────────────────────────────────────────────────────────
      - name: ♻️ Khôi phục dữ liệu từ GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $dl = "$env:MOUNT_LETTER";

          @(
              'HKLM:\SOFTWARE\Policies\Google\Chrome',
              'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
              'HKLM:\SOFTWARE\Policies\BraveSoftware\Brave',
              'HKLM:\SOFTWARE\Policies\CocCoc\Browser'
          ) | ForEach-Object {
              New-Item -Path "$_" -Force -ErrorAction SilentlyContinue | Out-Null;
              Set-ItemProperty -Path "$_" -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          };

          $suffix = (("$env:MACHINE_ID").ToUpper() -replace '[^A-Z0-9]', '');
          if ($suffix.Length -gt 8) { $suffix = $suffix.Substring(0, 8); }
          $fixedHost = if ($suffix) { "ZENOVA-$suffix" } else { 'ZENOVA-VPS' };
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;

          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore');
          if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue; }
          New-Item -ItemType Directory -Force -Path "$dlDir" -ErrorAction SilentlyContinue | Out-Null;

          $isFirstRun = $false;
          $sourceTag = "$env:RELEASE_TAG";

          $null = gh release view "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $isFirstRun = $true;
          } else {
              gh release download "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
              $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json');
              if (-not (Test-Path "$manifestFile")) {
                  if ("$env:ROOT_RELEASE_TAG" -and ("$env:ROOT_RELEASE_TAG" -ne "$env:RELEASE_TAG")) {
                      $null = gh release view "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
                      if (($LASTEXITCODE) -eq 0) {
                          gh release download "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
                          if (Test-Path "$manifestFile") {
                              $sourceTag = "$env:ROOT_RELEASE_TAG";
                              Write-Host "📦 Kế thừa bản lưu từ máy gốc [$env:ROOT_RELEASE_TAG]..." -ForegroundColor Cyan;
                          } else {
                              $isFirstRun = $true;
                          }
                      } else {
                          $isFirstRun = $true;
                      }
                  } else {
                      $isFirstRun = $true;
                  }
              }
          }

          $global:LASTEXITCODE = 0;

          if ($isFirstRun) {
              Write-Host "ℹ️ Khởi tạo phiên làm việc mới cho máy [$env:MACHINE_ID]..." -ForegroundColor Cyan;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          $manifest = Get-Content -Raw -Path "$manifestFile" | ConvertFrom-Json;
          Write-Host "⬇️ Tìm thấy bản lưu từ [$sourceTag] ($($manifest.chunkCount) phân mảnh). Đang tải..." -ForegroundColor Cyan;
          gh release download "$sourceTag" --repo "$env:STORAGE_REPO" --pattern 'zenova-drive.7z.*' --dir "$dlDir";
          if (($LASTEXITCODE) -ne 0) {
              Write-Host "⚠️ Không tải được phân mảnh từ [$sourceTag], tiếp tục phiên mới..." -ForegroundColor Yellow;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          $firstChunk = [System.IO.Path]::Combine("$dlDir", 'zenova-drive.7z.001');
          if (Test-Path "$firstChunk") {
              Write-Host "📦 Đang giải nén dữ liệu vào ${dl}:\..." -ForegroundColor Cyan;
              & 7z x "$firstChunk" "-o${dl}:\" -y *>$null;
          }

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 5. TẠO USER ZENOVA & TỐI ƯU INTEL XEON TỐI THƯỢNG (CHỐNG LAG / DELAY)
      # ─────────────────────────────────────────────────────────────
      - name: ⚙️ Tạo User Zenova & Tối ưu CPU Intel Xeon (Fix CPU 100% & Fix Lag)
        shell: pwsh
        env:
          FIXED_PASS: ${{ github.event.inputs.fixed_password || 'Zenova@2026' }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "⚙️ THIẾT LẬP USER ZENOVA & TỐI ƯU TOÀN DIỆN CHO CPU INTEL XEON..." -ForegroundColor Yellow;

          # 1. KIỂM TRA PHẦN CỨNG CPU INTEL XEON
          try {
              $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1);
              Write-Host "🔥 CPU PHẦN CỨNG : $($cpu.Name)" -ForegroundColor Green;
              Write-Host "⚡ SỐ NHÂN / LUỒNG: $($cpu.NumberOfCores) Cores / $($cpu.NumberOfLogicalProcessors) Threads" -ForegroundColor Green;
          } catch {}

          # 2. TẮT BẢO VỆ BỘ NHỚ (HVCI) ĐỂ DRIVER ÂM THANH & MÀN HÌNH NẠP THÀNH CÔNG
          try {
              $dgPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity';
              New-Item -Path $dgPath -Force -ErrorAction SilentlyContinue | Out-Null;
              Set-ItemProperty -Path $dgPath -Name 'Enabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
              bcdedit /set hypervisorlaunchtype off 2>&1 | Out-Null;
              bcdedit /set testsigning on 2>&1 | Out-Null;
              Write-Host "│ ✅ Đã tắt HVCI & bật TestSigning cho Driver!" -ForegroundColor Green;
          } catch {}

          # 3. TẠO USER ZENOVA & RUNNERADMIN
          try {
              $secCfg = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.cfg');
              $secDb  = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.sdb');
              secedit /export /cfg "$secCfg" *> $null;
              if (Test-Path "$secCfg") {
                  (Get-Content $secCfg) -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' | Set-Content $secCfg;
                  secedit /configure /db "$secDb" /cfg "$secCfg" /areas SECURITYPOLICY *> $null;
                  Remove-Item "$secCfg", "$secDb" -Force -ErrorAction SilentlyContinue;
              }
          } catch {}

          $user = "zenova";
          $pass = if ($env:FIXED_PASS) { $env:FIXED_PASS } else { "Zenova@2026" };
          "FIXED_PASSWORD=$pass" >> "$env:GITHUB_ENV";

          $secPass = ConvertTo-SecureString "$pass" -AsPlainText -Force;
          try {
              $existingUser = Get-LocalUser -Name $user -ErrorAction SilentlyContinue;
              if (-not $existingUser) {
                  New-LocalUser -Name $user -Password $secPass -FullName "Zenova" -Description "Zenova Cloud User" -PasswordNeverExpires -ErrorAction SilentlyContinue;
              } else {
                  Set-LocalUser -Name $user -Password $secPass -PasswordNeverExpires $true -ErrorAction SilentlyContinue;
              }
          } catch {}

          try {
              & net user $user $pass /add /comment:"Zenova Cloud User" /fullname:"Zenova" /expires:never 2>&1 | Out-Null;
              & net user $user $pass 2>&1 | Out-Null;
              & net user runneradmin $pass 2>&1 | Out-Null;
          } catch {}

          try {
              Set-LocalUser -Name $user -PasswordNeverExpires $true -ErrorAction SilentlyContinue;
              Set-LocalUser -Name "runneradmin" -PasswordNeverExpires $true -ErrorAction SilentlyContinue;
          } catch {}

          try {
              Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue;
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue;
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue;
          } catch {}

          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon';
          Set-ItemProperty -Path $winlogon -Name 'AutoAdminLogon' -Value '1' -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path $winlogon -Name 'DefaultUserName' -Value $user -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path $winlogon -Name 'DefaultPassword' -Value $pass -Force -ErrorAction SilentlyContinue;

          # 4. TỐI ƯU HÓA ĐẶC TRỊ CHO INTEL XEON & FIX CPU 100%
          Write-Host "🚀 Đang tối ưu CPU Intel Xeon (Unpark All Cores, Win32PrioritySeparation, BBR)..." -ForegroundColor Cyan;

          # Tắt PowerThrottling toàn bộ Core Xeon
          $ptPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling';
          New-Item -Path $ptPath -Force -ErrorAction SilentlyContinue | Out-Null;
          Set-ItemProperty -Path $ptPath -Name 'PowerThrottlingOff' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;

          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Power' -Name 'CsEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          
          # Win32PrioritySeparation 38 (0x26): Tối ưu tối thượng cho CPU Xeon đa nhân, triệt tiêu giật lag khung hình
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' -Name 'Win32PrioritySeparation' -Value 38 -Type DWord -Force -ErrorAction SilentlyContinue;

          # Unpark 100% số Core của Intel Xeon (Chạy max xung nhịp không bị hạ xung)
          try {
              powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null | Out-Null;
              powercfg -setactive e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null | Out-Null;
              powercfg /setacvalueindex scheme_current sub_processor CPMINCORES 100 2>$null | Out-Null;
              powercfg /setacvalueindex scheme_current sub_processor CPMAXCORES 100 2>$null | Out-Null;
              powercfg /change standby-timeout-ac 0 2>$null;
              powercfg /change monitor-timeout-ac 0 2>$null;
              powercfg /change disk-timeout-ac 0 2>$null;
              powercfg /hibernate off 2>$null;
          } catch {}

          # Tắt Windows Defender Realtime Monitoring để giải phóng 100% CPU
          try {
              Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -ErrorAction SilentlyContinue;
          } catch {}

          # Tắt các Service ngầm ngốn CPU máy chủ (Giữ nguyên Audiosrv & AudioEndpointBuilder)
          $servicesToKill = @(
              'WSearch', 'SysMain', 'wuauserv', 'UsoSvc', 'DiagTrack',
              'dmwappushservice', 'WerSvc', 'PcaSvc', 'DPS'
          );
          foreach ($svc in $servicesToKill) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue;
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue;
          }

          tzutil /s 'SE Asia Standard Time' 2>$null;

          # TỐI ƯU MẠNG BBR & TCP GIẢM DELAY XUỐNG 0-5MS
          try {
              netsh int tcp set global autotuninglevel=normal 2>$null | Out-Null;
              netsh int tcp set global congestionprovider=bbr 2>$null | Out-Null;
              netsh int tcp set global rss=enabled 2>$null | Out-Null;
              netsh int tcp set global rsc=enabled 2>$null | Out-Null;
              netsh int tcp set global ecncapability=enabled 2>$null | Out-Null;
              netsh int tcp set global timestamps=disabled 2>$null | Out-Null;
              netsh int tcp set heuristics disabled 2>$null | Out-Null;
          } catch {}

          # Bật âm thanh trong Terminal Services & RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'fDisableAudioCapture' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'fDisableAudioCapture' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force -ErrorAction SilentlyContinue;
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue;
          Start-Service -Name TermService -ErrorAction SilentlyContinue;
          netsh advfirewall set allprofiles state off 2>&1 | Out-Null;

          # Tắt popup Server Manager
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Server\ServerManager' -Name 'DoNotOpenAtLogon' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\ServerManager' -Name 'DoNotOpenServerManagerAtLogon' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;

          try {
              Enable-WindowsOptionalFeature -Online -FeatureName DirectPlay -All -NoRestart -ErrorAction SilentlyContinue | Out-Null;
          } catch {}

          Write-Host "✅ Đã tối ưu CPU Intel Xeon & Windows thành công!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 6. LẤY PUBLIC IP CỦA MÁY
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Lấy Public IP của máy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $pubIp = "";
          @('https://api.ipify.org', 'https://ifconfig.me/ip', 'https://icanhazip.com', 'https://ipinfo.io/ip') | ForEach-Object {
              if (-not $pubIp) {
                  try { $pubIp = (Invoke-RestMethod -Uri $_ -TimeoutSec 4).Trim(); } catch {}
              }
          };
          if (-not $pubIp) { $pubIp = "127.0.0.1"; }
          "MACHINE_PUBLIC_IP=$pubIp" >> "$env:GITHUB_ENV";
          Set-Content -Path "C:\machine-ip.txt" -Value "$pubIp" -Force;
          Write-Host "│ 🌐 IP Outbound: $pubIp" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 7. KẾT NỐI TAILSCALE (LẤY IP 100.x.x.x KẾT NỐI SUNSHINE & RDP)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Kết nối Tailscale (Official GitHub Action - OAuth)
        uses: tailscale/github-action@v4
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: 🌐 Kiểm tra & Kết nối Tailscale Key (nếu chưa có OAuth)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $tsIp = "";
          $tsCli = 'C:\Program Files\Tailscale\tailscale.exe';
          if (-not (Test-Path $tsCli)) {
              $tsCli = (Get-Command tailscale -ErrorAction SilentlyContinue).Source;
          }

          # Nếu action trước chưa có IP, thử kết nối qua AuthKey
          $authKey = "$env:TAILSCALE_KEY_INPUT".Trim();
          if ($authKey -and ($authKey -match '^tskey-')) {
              Write-Host "│ 🔑 Đang kết nối Tailscale qua AuthKey..." -ForegroundColor Cyan;
              if (Test-Path $tsCli) {
                  & "$tsCli" up --authkey="$authKey" --unattended=true --accept-routes=true --netfilter-mode=off 2>&1 | Out-Null;
              }
          }

          if ($tsCli -and (Test-Path $tsCli)) {
              for ($i = 0; $i -lt 25; $i++) {
                  $checkIp = (& "$tsCli" ip -4 2>$null) | Select-Object -First 1;
                  if ($checkIp -and $checkIp.Trim() -match '^100\.') {
                      $tsIp = $checkIp.Trim();
                      break;
                  }
                  Start-Sleep -Seconds 1;
              }
          }

          if ($tsIp) {
              "TAILSCALE_IP=$tsIp" >> "$env:GITHUB_ENV";
              Set-Content -Path "C:\tailscale-ip.txt" -Value "$tsIp" -Force;
              Write-Host "│ 🎉 Tailscale OK! IP: $tsIp" -ForegroundColor Green;
              [Console]::WriteLine("::notice title=TAILSCALE IP SẴN SÀNG::IP: $tsIp | RDP: $tsIp:3389 | Sunshine: https://$tsIp:47990");
          } else {
              Write-Host "│ ⚠️ Tailscale chưa có IP (kiểm tra Secret OAuth hoặc TAILSCALE_AUTHKEY)" -ForegroundColor Yellow;
              Set-Content -Path "C:\tailscale-ip.txt" -Value "Chưa có IP" -Force;
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 8. NGROK RDP TUNNEL (TÙY CHỌN)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Ngrok RDP Tunnel (tùy chọn)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $ngTok = if ($env:NGROK_TOKEN) { $env:NGROK_TOKEN } else { "" };
          if ($ngTok) {
              Write-Host "│ 🔑 Tìm thấy Ngrok Token! Đang thiết lập RDP công khai..." -ForegroundColor Cyan;
              try {
                  $ngZip = "$env:TEMP\ngrok.zip";
                  & curl.exe -L --retry 3 --connect-timeout 15 "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -o "$ngZip" 2>$null;
                  if (Test-Path "$ngZip") {
                      Expand-Archive -Path "$ngZip" -DestinationPath 'C:\ngrok' -Force;
                      $ngExe = 'C:\ngrok\ngrok.exe';
                      if (Test-Path "$ngExe") {
                          & "$ngExe" config add-authtoken "$ngTok" *> $null;
                          Start-Process -FilePath "$ngExe" -ArgumentList "tcp 3389 --log=C:\ngrok.log" -WindowStyle Hidden;
                          for ($i = 0; $i -lt 15; $i++) {
                              Start-Sleep -Seconds 1;
                              if (Test-Path "C:\ngrok.log") {
                                  $ngLog = Get-Content -Path "C:\ngrok.log" -Raw -ErrorAction SilentlyContinue;
                                  if ($ngLog -match 'url=tcp://([a-zA-Z0-9\.\-]+:\d+)') {
                                      $ep = $Matches[1];
                                      "RDP_NGROK_ENDPOINT=$ep" >> "$env:GITHUB_ENV";
                                      Set-Content -Path "C:\rdp-ngrok.txt" -Value "$ep" -Force;
                                      Write-Host "│ 🎉 NGROK RDP: $ep" -ForegroundColor Green;
                                      break;
                                  }
                              }
                          }
                      }
                  }
              } catch {}
          } else {
              Write-Host "│ ℹ️ Không có NGROK_TOKEN — bỏ qua Ngrok" -ForegroundColor Gray;
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 9. CÀI ĐẶT & KÍCH HOẠT CARD ÂM THANH ẢO (VB-CABLE ĐA TẦNG + SOUNDVOLUMEVIEW)
      # ─────────────────────────────────────────────────────────────
      - name: 🔊 Cài đặt & Bật Card Âm Thanh Ảo (Fix 100% Không Có Âm Thanh)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🔊 ĐANG CÀI ĐẶT & KÍCH HOẠT CARD ÂM THANH ẢO (VB-AUDIO CABLE)..." -ForegroundColor Yellow;

          # 1. Bật toàn bộ Audio Services
          @('MMCSS', 'AudioEndpointBuilder', 'Audiosrv') | ForEach-Object {
              Set-Service -Name "$_" -StartupType Automatic -ErrorAction SilentlyContinue;
              Start-Service -Name "$_" -ErrorAction SilentlyContinue;
          };
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Audiosrv' -Name 'Start' -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue;

          # 2. Tải và cài đặt VB-Cable qua gói chính thức
          $vbDir = 'C:\VBCable';
          $vbZip = "$env:TEMP\VBCable.zip";
          New-Item -ItemType Directory -Force -Path $vbDir -ErrorAction SilentlyContinue | Out-Null;

          try {
              & curl.exe -L -s --retry 3 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -o "$vbZip" 2>$null;
              if (-not (Test-Path "$vbZip")) {
                  & curl.exe -L -s --retry 3 'https://download.vb-audio.com/Download_EXTERNAL/VBCABLE_Driver_Pack43.zip' -o "$vbZip" 2>$null;
              }
              if (Test-Path "$vbZip") {
                  Expand-Archive -Path "$vbZip" -DestinationPath "$vbDir" -Force;
                  
                  # Cài đặt Driver qua pnputil
                  $vbInf = Get-ChildItem -Path "$vbDir" -Filter '*64*.inf' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1;
                  if (-not $vbInf) { $vbInf = Get-ChildItem -Path "$vbDir" -Filter '*.inf' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1; }
                  if ($vbInf) {
                      & pnputil.exe /add-driver "$($vbInf.FullName)" /install /force 2>&1 | Out-Null;
                  }

                  # Chạy bộ cài đặt x64
                  $vbSetup = Get-ChildItem -Path "$vbDir" -Filter 'VBCABLE_Setup_x64.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1;
                  if ($vbSetup) {
                      Start-Process -FilePath $vbSetup.FullName -ArgumentList "-i", "-h" -Wait -ErrorAction SilentlyContinue;
                      Start-Sleep -Seconds 3;
                  }
              }
          } catch {}

          # Fallback Tầng 2: Cài qua Chocolatey nếu chưa nhận
          $audioCheck = Get-PnpDevice -Class 'MEDIA','AudioEndpoint' -ErrorAction SilentlyContinue | Where-Object { $_.FriendlyName -match 'VB-Audio|CABLE' };
          if (-not $audioCheck) {
              Write-Host "│ 🔄 Dự phòng Tầng 2: Cài VB-Cable qua choco..." -ForegroundColor Cyan;
              try { choco install vb-cable -y --no-progress --limit-output --ignore-checksums; } catch {}
          }

          & pnputil.exe /scan-devices 2>&1 | Out-Null;

          # 3. Đặt VB-Cable làm thiết bị âm thanh mặc định qua SoundVolumeView
          try {
              $svvZip = "$env:TEMP\svv.zip";
              & curl.exe -L -s --retry 2 'https://www.nirsoft.net/utils/soundvolumeview-x64.zip' -o "$svvZip" 2>$null;
              if (Test-Path "$svvZip") {
                  Expand-Archive -Path "$svvZip" -DestinationPath 'C:\SoundVolumeView' -Force;
                  $svv = 'C:\SoundVolumeView\SoundVolumeView.exe';
                  if (Test-Path "$svv") {
                      & "$svv" /SetDefault "CABLE Input" all 2>&1 | Out-Null;
                      & "$svv" /SetDefault "CABLE Output" all 2>&1 | Out-Null;
                      & "$svv" /Unmute "CABLE Input" 2>&1 | Out-Null;
                      & "$svv" /Unmute "CABLE Output" 2>&1 | Out-Null;
                      Write-Host "│ ✅ Đã set VB-Cable làm thiết bị phát âm thanh mặc định!" -ForegroundColor Green;
                  }
              }
          } catch {}

          Restart-Service -Name 'Audiosrv' -Force -ErrorAction SilentlyContinue;
          Restart-Service -Name 'AudioEndpointBuilder' -Force -ErrorAction SilentlyContinue;
          Write-Host "✅ Card âm thanh ảo sẵn sàng!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 10. CÀI ĐẶT SUNSHINE & FIX TRIỆT ĐỂ LỖI CSRF PROTECTION ERROR
      # ─────────────────────────────────────────────────────────────
      - name: ☀️ Cài đặt Sunshine & Fix Lỗi CSRF Protection Error (Hỗ trợ Tailscale IP & Cloudflare)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "☀️ ĐANG CÀI ĐẶT SUNSHINE & CẤU HÌNH FIX LỖI CSRF PROTECTION..." -ForegroundColor Yellow;

          $sunMsi = "$env:TEMP\Sunshine.msi";
          & curl.exe -L -s --retry 3 'https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.msi' -o "$sunMsi" 2>$null;

          if (Test-Path "$sunMsi") {
              Start-Process msiexec.exe -ArgumentList "/i `"$sunMsi`" /qn /norestart" -Wait;
              Start-Sleep -Seconds 3;
          }

          $sunExe = 'C:\Program Files\Sunshine\sunshine.exe';
          $pass = if ($env:FIXED_PASSWORD) { $env:FIXED_PASSWORD } else { "Zenova@2026" };

          if (Test-Path "$sunExe") {
              & "$sunExe" --creds zenova "$pass" 2>&1 | Out-Null;
              Start-Sleep -Seconds 1;
          }

          # Cấu hình Sunshine: FIX TRIỆT ĐỂ LỖI CSRF BẰNG origin_web_ui_allowed & csrf_allowed_origins
          $tsIp = if (Test-Path "C:\tailscale-ip.txt") { (Get-Content "C:\tailscale-ip.txt" -Raw).Trim() } else { "" };
          $pubIp = if (Test-Path "C:\machine-ip.txt") { (Get-Content "C:\machine-ip.txt" -Raw).Trim() } else { "" };

          $allowedOrigins = @(
              "https://127.0.0.1:47990",
              "https://localhost:47990"
          );
          if ($tsIp -and ($tsIp -match '^100\.')) {
              $allowedOrigins += "https://$($tsIp):47990";
          }
          if ($pubIp -and ($pubIp -ne '127.0.0.1')) {
              $allowedOrigins += "https://$($pubIp):47990";
          }
          $csrfOriginsStr = ($allowedOrigins | Select-Object -Unique) -join ',';

          $sunCfgDir = "C:\Program Files\Sunshine\config";
          New-Item -ItemType Directory -Force -Path $sunCfgDir -ErrorAction SilentlyContinue | Out-Null;

          # Ghi cấu hình chuẩn chống CSRF & Low latency
          $sunConfContent = @"
          sunshine_name = Zenova-$($env:MACHINE_ID)
          min_log_level = info
          origin_web_ui_allowed = wan
          origin_pin_allowed = wan
          address_family = both
          port = 47989
          web_ui_port = 47990
          upnp = disabled
          encoder = nvenc
          nvenc_preset = p1
          latency = ultra_low
          packet_size = 1024
          fec_percentage = 20
          fps = [60, 120]
          csrf_allowed_origins = $csrfOriginsStr
          "@ -replace '(?m)^\s+', '';

          Set-Content -Path "$sunCfgDir\sunshine.conf" -Value $sunConfContent -Encoding UTF8 -Force;
          Write-Host "│ ✅ Đã cấu hình sunshine.conf (origin_web_ui_allowed = wan, csrf_allowed_origins = $csrfOriginsStr)" -ForegroundColor Green;

          # Mở Firewall Windows cho Sunshine
          netsh advfirewall firewall add rule name="Sunshine_TCP" dir=in action=allow protocol=TCP localport=47984,47989,47990,48010 profile=any 2>&1 | Out-Null;
          netsh advfirewall firewall add rule name="Sunshine_UDP" dir=in action=allow protocol=UDP localport=47998,47999,48000,48002,48010 profile=any 2>&1 | Out-Null;

          # Cài đặt màn hình ảo VDD
          try {
              $vddZip = "$env:TEMP\usbmmidd_v2.zip";
              & curl.exe -L -s --retry 2 'https://www.amyuni.com/downloads/usbmmidd_v2.zip' -o "$vddZip" 2>$null;
              if (Test-Path "$vddZip") {
                  Expand-Archive -Path "$vddZip" -DestinationPath 'C:\' -Force;
                  Push-Location 'C:\usbmmidd_v2';
                  Get-ChildItem -Filter '*.cer' | ForEach-Object {
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null;
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null;
                  };
                  & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null;
                  & .\deviceinstaller64.exe enableidd 1 *> $null;
                  Pop-Location;
                  Write-Host "│ ✅ Màn hình ảo VDD sẵn sàng!" -ForegroundColor Green;
              }
          } catch {}

          # Khởi động dịch vụ Sunshine
          Set-Service -Name 'SunshineService' -StartupType Automatic -ErrorAction SilentlyContinue;
          Restart-Service -Name 'SunshineService' -Force -ErrorAction SilentlyContinue;

          Write-Host "✅ Sunshine Server đã khởi chạy thành công!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 11. TẢI TOÀN BỘ FILE TỪ DOWNLOADS\APP VÀO Ổ C (KHÔNG XOÁ BẤT KỲ GÌ)
      # (BỎ TẢI DISCORD WEB TRÁNH LỖI VÌ ĐÃ CÓ DISCORDSETUP TRONG APP)
      # ─────────────────────────────────────────────────────────────
      - name: 📦 Tải toàn bộ file từ Downloads\app vào C:\Users\...\Downloads (Ổ C)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "📦 ĐANG TẢI & SAO CHÉP TOÀN BỘ ỨNG DỤNG VÀO THƯ MỤC DOWNLOADS Ổ C..." -ForegroundColor Cyan;

          # Thư mục Downloads trên Ổ C của tất cả User
          $targetDownloadFolders = @(
              "C:\Users\zenova\Downloads",
              "C:\Users\runneradmin\Downloads",
              "C:\Apps"
          );
          foreach ($f in $targetDownloadFolders) {
              New-Item -ItemType Directory -Force -Path $f -ErrorAction SilentlyContinue | Out-Null;
          }

          # 1. Tải trọn vẹn toàn bộ 9 file từ Release Bundle 'zenova-apps'
          try {
              $bundleDir = "$env:TEMP\zenova-apps-bundle";
              New-Item -ItemType Directory -Force -Path "$bundleDir" -ErrorAction SilentlyContinue | Out-Null;
              & gh release download zenova-apps --repo "$env:RUNNER_REPO" --dir "$bundleDir" 2>&1 | Out-Null;
              if (Test-Path "$bundleDir") {
                  Get-ChildItem -Path "$bundleDir" | ForEach-Object {
                      $file = $_;
                      foreach ($df in $targetDownloadFolders) {
                          Copy-Item -Path $file.FullName -Destination $df -Force -ErrorAction SilentlyContinue;
                      }
                  }
                  Write-Host "│ ✅ Đã nạp thành công trọn bộ file (Antigravity, AutoClicker, CloudCord, DiscordSetup, Store, VSCode, Windhawk, Wallpapers...) vào Downloads ổ C của tất cả máy!" -ForegroundColor Green;
              }
          } catch {
              Write-Host "│ ⚠️ Lỗi tải release bundle: $($_.Exception.Message)" -ForegroundColor Yellow;
          }

          # 2. Tải thêm Bloxstrap 120 FPS, Minecraft PrismLauncher, Spotify, Bandicam, EVKey
          $bloxExe   = 'C:\Bloxstrap\Bloxstrap.exe';
          $mcZip     = "$env:TEMP\PrismLauncher.zip";
          $spExe     = "$env:TEMP\SpotifySetup.exe";
          $bdExe     = "$env:TEMP\bdcamsetup.exe";
          $evZip     = "$env:TEMP\EVKey.zip";
          $net8Exe   = "$env:TEMP\dotnet8.exe";
          $vcExe     = "$env:TEMP\vcredist_x64.exe";
          $wpFile    = "C:\Windows\Web\Wallpaper\Zenova.png";

          New-Item -ItemType Directory -Force -Path 'C:\Bloxstrap', 'C:\EVKey', 'C:\PrismLauncher', 'C:\Windows\Web\Wallpaper' -ErrorAction SilentlyContinue | Out-Null;

          $parallelDownloads = @(
              '--url', 'https://raw.githubusercontent.com/Dunghoang397/rdp-freeee/2715203b1462985959767187a585efb637441f9f/Zenova%20Cloud%20Aurora%20Lake.png', '-o', "$wpFile",
              '--url', 'https://github.com/bloxstraplabs/bloxstrap/releases/download/v2.7.0/Bloxstrap-v2.7.0.exe', '-o', "$bloxExe",
              '--url', 'https://github.com/Diegiwg/PrismLauncher-Cracked/releases/download/11.0.3/PrismLauncher-Windows-MSVC-Portable-11.0.3.zip', '-o', "$mcZip",
              '--url', 'https://download.scdn.co/SpotifySetup.exe', '-o', "$spExe",
              '--url', 'https://dl.bandicam.com/bdcamsetup.exe', '-o', "$bdExe",
              '--url', 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip', '-o', "$evZip",
              '--url', 'https://aka.ms/vs/17/release/vc_redist.x64.exe', '-o', "$vcExe",
              '--url', 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe', '-o', "$net8Exe"
          );
          & curl.exe -L -s --retry 2 -Z @parallelDownloads;

          # Cài đặt ngầm .NET 8, VC++, Bloxstrap, EVKey, Spotify, Bandicam
          try {
              if (Test-Path "$vcExe") { Start-Process -FilePath "$vcExe" -ArgumentList "/install /quiet /norestart" -Wait -ErrorAction SilentlyContinue; }
              if (Test-Path "$net8Exe") { Start-Process -FilePath "$net8Exe" -ArgumentList "/install /quiet /norestart" -Wait -ErrorAction SilentlyContinue; }
              if (Test-Path "$spExe") { Start-Process -FilePath "$spExe" -ArgumentList "/silent" -ErrorAction SilentlyContinue; }
              if (Test-Path "$bdExe") { Start-Process -FilePath "$bdExe" -ArgumentList "/S" -ErrorAction SilentlyContinue; }
          } catch {}

          if ((Test-Path "$evZip") -and ((Get-Item "$evZip").Length -gt 50000)) {
              try {
                  Expand-Archive -Path "$evZip" -DestinationPath 'C:\EVKey' -Force;
                  $evExe = 'C:\EVKey\EVKey64.exe';
                  if (Test-Path "$evExe") {
                      Start-Process -FilePath "$evExe" -WorkingDirectory 'C:\EVKey' -ErrorAction SilentlyContinue;
                      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'EVKey' -Value "`"$evExe`"" -Force -ErrorAction SilentlyContinue;
                  }
              } catch {}
          }

          # Bloxstrap ClientAppSettings.json (Direct3D 11, 120 FPS)
          try {
              $bloxCfgDir = "C:\Users\zenova\AppData\Local\Bloxstrap\Modifications\ClientSettings";
              New-Item -ItemType Directory -Force -Path $bloxCfgDir -ErrorAction SilentlyContinue | Out-Null;
              $fastFlags = @{
                  "DFIntTaskSchedulerTargetFps" = 120;
                  "FFlagDisablePostFx" = "True";
                  "FFlagHandleAltEnterFullscreenManually" = "False";
                  "FFlagDebugGraphicsPreferD3D11" = "True"
              } | ConvertTo-Json;
              Set-Content -Path "$bloxCfgDir\ClientAppSettings.json" -Value $fastFlags -Encoding UTF8 -Force;
          } catch {}

          if (Test-Path "$mcZip") {
              try { Expand-Archive -Path "$mcZip" -DestinationPath 'C:\PrismLauncher' -Force; } catch {}
          }

          # Hình nền
          if (Test-Path "$wpFile") {
              try {
                  $winWp = "C:\Windows\Web\Wallpaper\Windows\img0.jpg";
                  takeown /f "$winWp" /a *> $null;
                  icacls "$winWp" /grant Everyone:F *> $null;
                  Copy-Item -Path "$wpFile" -Destination "$winWp" -Force -ErrorAction SilentlyContinue;
                  Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value "$wpFile" -Force -ErrorAction SilentlyContinue;
                  Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "10" -Force -ErrorAction SilentlyContinue;
              } catch {}
          }

          Write-Host "✅ Đã nạp đầy đủ toàn bộ ứng dụng!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 12. CÀI ĐẶT & KHỞI CHẠY STARDESK TRUNG + GAMEVIEWER & TRÍCH XUẤT DEVICE ID
      # ─────────────────────────────────────────────────────────────
      - name: 🎮 Cài đặt, Khởi chạy NetEase GameViewer & StarDesk & Trích xuất Device ID & PIN
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🎮 ĐANG CÀI ĐẶT & KẾT NỐI STARDESK TRUNG & GAMEVIEWER..." -ForegroundColor Yellow;

          $user = "$env:RDP_USER";
          $gvUrl1 = 'https://github.com/ddvdat-glitch/abcd/releases/download/app/uuyc_4.43.1.exe';
          $gvUrl2 = 'https://a56.gdl.netease.com/UURemote_Setup_4.43.1.3614_1016022822_gwqd.exe?key1=11cbe230b9ef214e4fa2470aabab147d&key2=6ad577fc&n=uuyc_4.43.1.exe';
          $gvInstaller = 'C:\uuyc_4.43.1.exe';

          $sdUrl = 'https://github.com/ddvdat-glitch/abcd/releases/download/app/StarDesk_1.5.3.exe';
          $sdInstaller = 'C:\StarDesk_1.5.3.exe';

          # Tải GameViewer & StarDesk
          & curl.exe -L -s --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "$gvUrl1" -o "$gvInstaller" 2>$null;
          if ((-not (Test-Path "$gvInstaller")) -or ((Get-Item "$gvInstaller").Length -lt 5MB)) {
              & curl.exe -L -s --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "$gvUrl2" -o "$gvInstaller" 2>$null;
          }
          & curl.exe -L -s --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "$sdUrl" -o "$sdInstaller" 2>$null;

          # 1. CÀI ĐẶT & KHỞI CHẠY GAMEVIEWER
          if ((Test-Path "$gvInstaller") -and ((Get-Item "$gvInstaller").Length -gt 5MB)) {
              Get-Service -Name '*GameViewer*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue;
              Get-Process -Name 'GameViewer*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
              Start-Process -FilePath "$gvInstaller" -ArgumentList '/S' -Wait;
              Start-Sleep -Seconds 3;
          }

          Get-Service -Name '*GameViewer*' -ErrorAction SilentlyContinue | ForEach-Object {
              Set-Service -Name ($_.Name) -StartupType Automatic -ErrorAction SilentlyContinue;
              Start-Service -Name ($_.Name) -ErrorAction SilentlyContinue;
          };

          $gvAppDir    = 'C:\Program Files\Netease\GameViewer\bin';
          $gvServerExe = 'C:\Program Files\Netease\GameViewer\bin\GameViewerServer.exe';
          $gvAppExe    = 'C:\Program Files\Netease\GameViewer\bin\GameViewer.exe';
          $gvCli       = 'C:\Program Files\Netease\GameViewer\bin\uuyc-cli.exe';

          if (Test-Path "$gvServerExe") {
              Start-Process -FilePath "$gvServerExe" -WorkingDirectory "$gvAppDir" -WindowStyle Hidden -ErrorAction SilentlyContinue;
          }
          if (Test-Path "$gvAppExe") {
              try {
                  & schtasks.exe /Create /TN "AISTV-Launch-GameViewer" /TR "`"$gvAppExe`"" /SC ONCE /ST 00:00 /RU "$user" /RL HIGHEST /IT /F *> $null;
                  & schtasks.exe /Run /TN "AISTV-Launch-GameViewer" *> $null;
              } catch {}
              Start-Process -FilePath "$gvAppExe" -WorkingDirectory "$gvAppDir" -WindowStyle Hidden -ErrorAction SilentlyContinue;
          }

          # 2. CÀI ĐẶT & KHỞI CHẠY STARDESK TRUNG
          if ((Test-Path "$sdInstaller") -and ((Get-Item "$sdInstaller").Length -gt 5MB)) {
              Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue;
              Get-Process -Name 'StarDesk*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
              Start-Process -FilePath "$sdInstaller" -ArgumentList '/S' -Wait;
              & 7z x "$sdInstaller" "-oC:\Program Files\StarDesk" -y *>$null;
              Start-Sleep -Seconds 3;
          }

          Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | ForEach-Object {
              Set-Service -Name ($_.Name) -StartupType Automatic -ErrorAction SilentlyContinue;
              Start-Service -Name ($_.Name) -ErrorAction SilentlyContinue;
          };

          $sdAppExe = 'C:\Program Files\StarDesk\StarDesk.exe';
          if (Test-Path "$sdAppExe") {
              try {
                  & schtasks.exe /Create /TN "AISTV-Launch-StarDesk" /TR "`"$sdAppExe`"" /SC ONCE /ST 00:00 /RU "$user" /RL HIGHEST /IT /F *> $null;
                  & schtasks.exe /Run /TN "AISTV-Launch-StarDesk" *> $null;
              } catch {}
              Start-Process -FilePath "$sdAppExe" -WorkingDirectory 'C:\Program Files\StarDesk' -WindowStyle Hidden -ErrorAction SilentlyContinue;
          }

          # 3. CẤU HÌNH MÃ PIN & LẤY DEVICE ID
          $pinInput = "$env:INPUT_PIN_CODE";
          if ([string]::IsNullOrWhiteSpace("$pinInput")) { $pinInput = "Zenova2026"; }
          $cleanPin = ($pinInput -replace '[^A-Za-z0-9]', '');
          if (($cleanPin.Length -lt 8) -or ($cleanPin.Length -gt 16)) { $cleanPin = 'Zenova2026'; }

          # Ghi mã PIN vào config.ini StarDesk
          $cfgData = "[General]`r`nPassword=$cleanPin`r`nAutoStart=1`r`n";
          foreach ($dir in @("C:\Program Files\StarDesk", "C:\Program Files (x86)\StarDesk", "C:\ProgramData\StarDesk", "$env:USERPROFILE\AppData\Roaming\StarDesk")) {
              New-Item -ItemType Directory -Force -Path $dir -ErrorAction SilentlyContinue | Out-Null;
              Set-Content -Path "$dir\config.ini" -Value $cfgData -Encoding ASCII -Force -ErrorAction SilentlyContinue;
          }

          Write-Host "│ ⏳ Đang đợi kết nối đám mây NetEase/StarDesk..." -ForegroundColor Cyan;
          if (Test-Path "$gvCli") {
              for ($i = 0; $i -lt 15; $i++) {
                  $echo = & "$gvCli" echo 2>$null;
                  if ($echo -match 'hello') { break; }
                  Start-Sleep -Seconds 2;
              }
              & "$gvCli" -c "$cleanPin" *> $null;
              Write-Host "│ ✅ Đã gán mã PIN GameViewer: $cleanPin" -ForegroundColor Green;
          }

          $sdId = "$env:STARDESK_ID_INPUT";
          if ([string]::IsNullOrWhiteSpace("$sdId")) {
              if (Test-Path "$gvCli") {
                  for ($i = 0; $i -lt 25; $i++) {
                      $cliOut = & "$gvCli" -d 2>$null;
                      if ($cliOut -match '(\d{6,12})') {
                          $sdId = $Matches[1];
                          break;
                      }
                      Start-Sleep -Seconds 2;
                  }
              }
          }

          if ([string]::IsNullOrWhiteSpace("$sdId") -or ($sdId -match 'chưa|đang|Đang')) {
              $cfgList = @(
                  "C:\Program Files\StarDesk\config.ini",
                  "C:\Program Files (x86)\StarDesk\config.ini",
                  "$env:USERPROFILE\AppData\Roaming\StarDesk\config.ini",
                  "C:\Users\runneradmin\AppData\Roaming\StarDesk\config.ini"
              );
              for ($i = 0; $i -lt 15; $i++) {
                  foreach ($cfg in $cfgList) {
                      if (Test-Path $cfg) {
                          $c = Get-Content $cfg -Raw -ErrorAction SilentlyContinue;
                          if ($c -match '(?:ID|cid|DeviceID|Account)\s*=\s*(\d{6,12})') {
                              $sdId = $Matches[1]; break;
                          }
                      }
                  }
                  if ($sdId -match '^\d+$') { break; }
                  Start-Sleep -Seconds 2;
              }
          }

          if ([string]::IsNullOrWhiteSpace("$sdId")) {
              $sdId = "Đang kết nối Server...";
          }

          Set-Content -Path "C:\stardesk-id.txt" -Value "$sdId" -Force;
          Set-Content -Path "C:\stardesk-pin.txt" -Value "$cleanPin" -Force;

          "STARDESK_ID=$sdId" >> "$env:GITHUB_ENV";
          "STARDESK_PIN=$cleanPin" >> "$env:GITHUB_ENV";

          Write-Host "│ 🌟 StarDesk Device ID: $sdId" -ForegroundColor Yellow;
          Write-Host "│ 🔑 StarDesk PIN Code : $cleanPin" -ForegroundColor Yellow;

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 13. TẠO ICON DESKTOP TIỆN ÍCH
      # ─────────────────────────────────────────────────────────────
      - name: 🖥️ Tạo các phím tắt tiện ích trên Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🖥️ Đang tạo các tiện ích Desktop và phím tắt..." -ForegroundColor Cyan;

          $ws = New-Object -ComObject WScript.Shell;
          $desktops = @("C:\Users\Public\Desktop", "C:\Users\zenova\Desktop", "C:\Users\runneradmin\Desktop");

          foreach ($d in $desktops) {
              if (-not (Test-Path $d)) { New-Item -ItemType Directory -Force -Path $d -ErrorAction SilentlyContinue | Out-Null; }

              # 1. StarDesk Trung
              $sdExe = 'C:\Program Files\StarDesk\StarDesk.exe';
              if (-not (Test-Path $sdExe)) {
                  $sdExe = (Get-ChildItem -Path @("C:\Program Files\StarDesk", "C:\Program Files (x86)\StarDesk") -Filter "StarDesk.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName;
              }
              if ($sdExe) {
                  $lnkGv = $ws.CreateShortcut("$d\🌟 StarDesk Trung (0ms Delay).lnk");
                  $lnkGv.TargetPath = $sdExe;
                  $lnkGv.Save();
              }

              # 2. Kho Ứng Dụng (Downloads Ổ C)
              $lnkApps = $ws.CreateShortcut("$d\📁 Kho Ứng Dụng (Downloads).lnk");
              $lnkApps.TargetPath = "C:\Users\zenova\Downloads";
              $lnkApps.Save();

              # 3. GameViewer
              $gvExe = 'C:\Program Files\Netease\GameViewer\bin\GameViewer.exe';
              if (Test-Path $gvExe) {
                  $lnkGv2 = $ws.CreateShortcut("$d\🎮 NetEase GameViewer.lnk");
                  $lnkGv2.TargetPath = $gvExe;
                  $lnkGv2.Save();
              }

              # 4. Roblox Bloxstrap 120 FPS
              $bloxExe = "C:\Bloxstrap\Bloxstrap.exe";
              if (Test-Path $bloxExe) {
                  $lnkRb = $ws.CreateShortcut("$d\🎮 Roblox (Bloxstrap 120 FPS).lnk");
                  $lnkRb.TargetPath = $bloxExe;
                  $lnkRb.Save();
              }

              # 5. AutoClicker
              $acExe = "C:\Users\zenova\Downloads\AutoClicker.exe";
              if (Test-Path $acExe) {
                  $lnkAc = $ws.CreateShortcut("$d\⚡ AutoClicker.lnk");
                  $lnkAc.TargetPath = $acExe;
                  $lnkAc.Save();
              }

              # 6. EVKey
              $evkExe = "C:\EVKey\EVKey64.exe";
              if (Test-Path $evkExe) {
                  $lnkEvk = $ws.CreateShortcut("$d\🇻🇳 EVKey Tiếng Việt.lnk");
                  $lnkEvk.TargetPath = $evkExe;
                  $lnkEvk.Save();
              }

              # 7. Spotify
              $spExe = (Get-ChildItem -Path @("C:\Users\runneradmin\AppData\Roaming\Spotify", "C:\Users\zenova\AppData\Roaming\Spotify") -Filter "Spotify.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName;
              if ($spExe) {
                  $lnkSp = $ws.CreateShortcut("$d\🎵 Spotify.lnk");
                  $lnkSp.TargetPath = $spExe;
                  $lnkSp.Save();
              }
          }

          Write-Host "│ ✅ Đã tạo đầy đủ icon Desktop!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 14. KHỞI CHẠY WEB QUẢN LÝ (PORT 8080) & SUNSHINE TUNNEL
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Khởi chạy Web Quản Lý VPS (Port 8080) & Sunshine Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🌐 Khởi chạy Web Quản Lý VPS & Tunnel Sunshine..." -ForegroundColor Cyan;
          $webDir = 'C:\zenova-web';
          New-Item -ItemType Directory -Force -Path $webDir -ErrorAction SilentlyContinue | Out-Null;
          $pyServerPath = [System.IO.Path]::Combine($webDir, 'server.py');

          $pyB64 = '';
          [System.IO.File]::WriteAllBytes($pyServerPath, [System.Convert]::FromBase64String($pyB64));

          $pyExe = (Get-Command python -ErrorAction SilentlyContinue).Source;
          if (-not $pyExe) { $pyExe = 'python'; }
          Start-Process -FilePath $pyExe -ArgumentList "`"$pyServerPath`"", "8080", "`"$env:CONTROL_SIGNAL_FILE`"" -WindowStyle Hidden -ErrorAction SilentlyContinue;

          Start-Sleep -Seconds 3;

          # Khởi chạy Cloudflare Tunnel cho cả Web Quản Lý và Sunshine Web
          $cfExe = 'C:\cloudflared.exe';
          try {
              & curl.exe -L --retry 2 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "$cfExe" 2>$null;
              if (Test-Path "$cfExe") {
                  Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url http://127.0.0.1:8080 --logfile C:\cloudflared-web.log" -WindowStyle Hidden;
                  Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url https://127.0.0.1:47990 --no-tls-verify --logfile C:\cloudflared-sunshine.log" -WindowStyle Hidden;
              }
          } catch {}

          Write-Host "✅ Web Panel và Sunshine Tunnel đang chạy ngầm!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 15. THÔNG TIN KẾT NỐI ZENOVA VPS
      # ─────────────────────────────────────────────────────────────
      - name: 🎉 Thông tin kết nối Zenova VPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;

          $cfWeb = "";
          $cfSunshine = "";

          for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500;
              if ((-not $cfWeb) -and (Test-Path "C:\cloudflared-web.log")) {
                  $log = Get-Content -Path "C:\cloudflared-web.log" -Raw -ErrorAction SilentlyContinue;
                  if ($log -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                      $cfWeb = $Matches[0];
                      Set-Content -Path "C:\cloudflared-web-url.txt" -Value "$cfWeb" -Force;
                  }
              }
              if ((-not $cfSunshine) -and (Test-Path "C:\cloudflared-sunshine.log")) {
                  $logS = Get-Content -Path "C:\cloudflared-sunshine.log" -Raw -ErrorAction SilentlyContinue;
                  if ($logS -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                      $cfSunshine = $Matches[0];
                      Set-Content -Path "C:\cloudflared-sunshine-url.txt" -Value "$cfSunshine" -Force;
                  }
              }
              if ($cfWeb -and $cfSunshine) { break; }
          }

          $publicWeb = if ($cfWeb) { $cfWeb } else { "http://127.0.0.1:8080" };
          $tsIp = if (Test-Path "C:\tailscale-ip.txt") { (Get-Content "C:\tailscale-ip.txt" -Raw).Trim() } else { "" };
          $pubIp = if (Test-Path "C:\machine-ip.txt") { (Get-Content "C:\machine-ip.txt" -Raw).Trim() } else { "" };
          $pass = "$env:FIXED_PASSWORD";

          # Link Web Sunshine: Tailscale trực tiếp và Cloudflare dự phòng
          $sunshineTsUrl = if ($tsIp -and ($tsIp -match '^100\.')) { "https://$($tsIp):47990" } else { "https://127.0.0.1:47990" };
          $sunshineCfUrl = if ($cfSunshine) { $cfSunshine } else { $sunshineTsUrl };

          $sdId = if (Test-Path "C:\stardesk-id.txt") { (Get-Content "C:\stardesk-id.txt" -Raw).Trim() } else { "$env:STARDESK_ID" };
          $sdPin = if (Test-Path "C:\stardesk-pin.txt") { (Get-Content "C:\stardesk-pin.txt" -Raw).Trim() } else { "$env:STARDESK_PIN" };
          $ngrokRdp = if (Test-Path "C:\rdp-ngrok.txt") { (Get-Content "C:\rdp-ngrok.txt" -Raw).Trim() } else { "" };

          $rdpTarget = if ($ngrokRdp) { $ngrokRdp } elseif ($tsIp -and ($tsIp -notmatch 'chưa|Chưa|127\.0\.0\.1|Không')) { "$tsIp:3389" } else { "$pubIp:3389" };

          Write-Host ""
          Write-Host "======================================================================" -ForegroundColor Green;
          Write-Host "                 🎉 ZENOVA ULTIMATE VPS ĐÃ SẴN SÀNG!                  " -ForegroundColor Green;
          Write-Host "======================================================================" -ForegroundColor Green;
          Write-Host "☀️ SUNSHINE WEB UI (TAILSCALE)  : $sunshineTsUrl" -ForegroundColor Cyan;
          Write-Host "☀️ SUNSHINE WEB UI (CLOUDFLARE) : $sunshineCfUrl" -ForegroundColor White;
          Write-Host "🌐 LINK WEB QUẢN LÝ (PORT 8080) : $publicWeb" -ForegroundColor Cyan;
          Write-Host "🌟 STARDESK TRUNG ID (0ms Delay): $sdId" -ForegroundColor Yellow;
          Write-Host "🔑 STARDESK TRUNG PIN           : $sdPin" -ForegroundColor Yellow;
          Write-Host "🖥️ REMOTE DESKTOP (RDP) HOST     : $rdpTarget" -ForegroundColor Magenta;
          Write-Host "🌐 TAILSCALE IP RIÊNG (P2P)     : $tsIp" -ForegroundColor Cyan;
          Write-Host "👤 TÀI KHOẢN RDP / WINDOWS      : zenova" -ForegroundColor Gray;
          Write-Host "🔐 MẬT KHẨU CỐ ĐỊNH             : $pass" -ForegroundColor Gray;
          Write-Host "======================================================================" -ForegroundColor Green;

          $sb = New-Object System.Text.StringBuilder;
          [void]$sb.AppendLine('# 🚀 Zenova Ultimate VPS (Windows) - Full Pro Max');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### ☀️ 1. Sunshine Streaming & Web Quản Lý');
          [void]$sb.AppendLine("- Sunshine Web UI (Qua Tailscale IP): $sunshineTsUrl (Khuyên dùng)");
          [void]$sb.AppendLine("- Sunshine Web UI (Qua Cloudflare): $sunshineCfUrl");
          [void]$sb.AppendLine("- Tài khoản: zenova | Mật khẩu: $pass");
          [void]$sb.AppendLine("- Web Quản Lý VPS (Port 8080): $publicWeb");
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 🌟 2. StarDesk Trung / GameViewer (0ms Delay - Khuyên Dùng)');
          [void]$sb.AppendLine('| Thông Tin | Giá Trị |');
          [void]$sb.AppendLine('|---|---|');
          [void]$sb.AppendLine("| Device ID | $sdId |");
          [void]$sb.AppendLine("| Mã PIN | $sdPin |");
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 🖥️ 3. Remote Desktop & Tailscale Mesh VPN');
          [void]$sb.AppendLine('| Mục | Thông Số |');
          [void]$sb.AppendLine('|---|---|');
          [void]$sb.AppendLine("| Địa chỉ RDP | $rdpTarget |");
          [void]$sb.AppendLine("| IP Tailscale | $tsIp |");
          [void]$sb.AppendLine("| IP Outbound Máy | $pubIp |");
          [void]$sb.AppendLine('| User | zenova |');
          [void]$sb.AppendLine("| Mật khẩu | $pass |");
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 📦 4. Ứng Dụng Tải Sẵn Trong Thư Mục Downloads (Ổ C)');
          [void]$sb.AppendLine('- Thư mục C:\Users\zenova\Downloads chứa đầy đủ 9 ứng dụng và công cụ từ app.');
          if ($env:GITHUB_STEP_SUMMARY) {
              Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($sb.ToString()) -Encoding UTF8;
          }

          [Console]::WriteLine("::notice title=THONG TIN KET NOI ZENOVA VPS::StarDesk ID: $sdId | PIN: $sdPin | Sunshine: $sunshineTsUrl | RDP: $rdpTarget | Web: $publicWeb");

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 16. DUY TRÌ PHIÊN LÀM VIỆC & LẮNG NGHE LỆNH TỪ WEB PANEL
      # ─────────────────────────────────────────────────────────────
      - name: ⏳ Duy trì phiên làm việc
        id: keepalive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $totalReq = [long]"$env:TOTAL_MINUTES";
          $sessionMinutes = [Math]::Min($totalReq, 350);
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + ($sessionMinutes * 60);
          $saveScript = "$env:SAVE_SCRIPT_PATH";
          $pushScript = "$env:PUSH_STATE_SCRIPT";
          $sigFile    = "$env:CONTROL_SIGNAL_FILE";

          Write-Host "🔄 Duy trì phiên [$env:MACHINE_ID]..." -ForegroundColor Yellow;
          $lastLog = Get-Date;

          while ($true) {
              if (Test-Path "$sigFile") {
                  $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim();
                  Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue;

                  if ("$cmd" -eq 'SAVE_NOW') {
                      Write-Host "💾 [WEB PANEL] Đã nhận lệnh lưu dữ liệu tức thì (Máy vẫn chạy, KHÔNG TẮT MÁY)..." -ForegroundColor Cyan;
                      if (Test-Path "$saveScript") { & "$saveScript" -Reason 'manual-web-save'; }
                      Write-Host "✅ Đã lưu xong dữ liệu lên GitHub! VPS vẫn tiếp tục hoạt động." -ForegroundColor Green;
                  } elseif ("$cmd" -eq 'RESTART_SESSION') {
                      Write-Host "🔁 [WEB PANEL] Đã nhận lệnh khởi động lại / chuyển tiếp phiên mới..." -ForegroundColor Yellow;
                      'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV";
                      break;
                  } elseif ("$cmd" -eq 'STOP_SESSION') {
                      Write-Host "🛑 [WEB PANEL] Đã nhận lệnh dừng VPS hoàn toàn..." -ForegroundColor Red;
                      'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV";
                      break;
                  }
              }

              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
              $remain = ($endEpoch) - ($now);
              if (($remain) -le 0) { break; }

              if (((Get-Date) - $lastLog).TotalSeconds -ge 60) {
                  $minLeft = [math]::Floor($remain / 60);
                  $secLeft = $remain % 60;
                  Write-Host "⏱️ [$(Get-Date -Format 'HH:mm:ss')] Còn $minLeft phút $secLeft giây" -ForegroundColor Gray;
                  if (Test-Path "$pushScript") { & "$pushScript" 2>&1 | Out-Null; }
                  $lastLog = Get-Date;
              }

              Start-Sleep -Seconds 5;
          }

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 17. LƯU TOÀN BỘ DỮ LIỆU CUỐI PHIÊN
      # ─────────────────────────────────────────────────────────────
      - name: 💾 Lưu dữ liệu cuối phiên
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $saveScript = "$env:SAVE_SCRIPT_PATH";
          if (Test-Path "$saveScript") { & "$saveScript" -Reason 'final-session-save'; }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 18. KÍCH HOẠT PHIÊN TIẾP THEO
      # ─────────────────────────────────────────────────────────────
      - name: 🔁 Kích hoạt phiên tiếp theo
        if: always()
        shell: pwsh
        env:
          AUTO_RESTART: ${{ github.event.inputs.auto_restart || true }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          if ("$env:FORCE_STOP_ONLY" -eq '1') {
              Write-Host "🛑 Đã ngắt VPS theo yêu cầu người dùng. Không khởi động lại." -ForegroundColor Yellow;
              exit 0;
          }
          if (("$env:AUTO_RESTART" -eq 'true') -or ("$env:FORCE_NEXT_SESSION" -eq '1')) {
              $wfFile = if ($env:GITHUB_WORKFLOW_REF) { ($env:GITHUB_WORKFLOW_REF -split '@')[0] -replace '^.*\.github/workflows/', '' } else { 'zenova_mega_vps.yml' };
              try {
                  gh workflow run "$wfFile" --repo "$env:RUNNER_REPO" `
                      -f machine_id="$env:MACHINE_ID" `
                      -f duration="5h" `
                      -f auto_restart="true" `
                      -f fixed_password="$env:FIXED_PASSWORD" `
                      -f pin_code="$env:INPUT_PIN_CODE" `
                      -f drive_letter="$env:MOUNT_LETTER" `
                      -f vhd_size_gb="$env:VHD_SIZE_GB" `
                      -f windows_image="${{ github.event.inputs.windows_image || 'windows-2022' }}" 2>&1 | Out-Null;
                  Write-Host "✅ Kích hoạt phiên mới thành công cho $wfFile!" -ForegroundColor Green;
              } catch {}
          }
          $global:LASTEXITCODE = 0;
          exit 0;
