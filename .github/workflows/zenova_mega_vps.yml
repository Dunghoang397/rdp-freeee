          # 3. Táº¯t Visual Effects, Animations & DWM Shadows Ä‘á»ƒ RDP siÃªu nháº¹
          Write-Host "ðŸŽ¨ Táº¯t toÃ n bá»™ hiá»‡u á»©ng hÃ¬nh áº£nh & chuyá»ƒn Ä‘á»™ng (Visual Effects)..." -ForegroundColor Cyan;
          try {
