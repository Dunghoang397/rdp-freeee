      - name: ðŸ¦† Cáº¬P NHáº¬T DUCKDNS TRá»Ž Vá»€ IP TAILSCALE
        if: ${{ inputs.enable_duckdns }}
        shell: pwsh
        env:
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
          DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}
        run: |
          Write-Host "";
          Write-Host "ðŸ¦† ÄANG Cáº¬P NHáº¬T DUCKDNS CHO MÃY [$env:MACHINE_ID]..." -ForegroundColor Yellow;

          if ((-not ("$env:DUCKDNS_TOKEN")) -or (-not ("$env:DUCKDNS_DOMAIN"))) {
              Write-Host "â„¹ï¸ Thiáº¿u secret DUCKDNS_TOKEN hoáº·c DUCKDNS_DOMAIN, bá» qua DuckDNS (Váº«n káº¿t ná»‘i qua IP Tailscale bÃ¬nh thÆ°á»ng)" -ForegroundColor Yellow;
              exit 0;
          }
          if (-not ("$env:TAILSCALE_IP")) {
              Write-Host "âš ï¸ ChÆ°a cÃ³ IP Tailscale, bá» qua DuckDNS" -ForegroundColor Yellow;
              exit 0;
          }

          $domain = (("$env:DUCKDNS_DOMAIN").Trim().ToLower()) -replace '\.duckdns\.org$', '';
          if ("$domain" -notmatch '^[a-z0-9-]+$') {
              Write-Host "âš ï¸ DUCKDNS_DOMAIN khÃ´ng há»£p lá»‡ (chá»‰ nháº­p tÃªn sub-domain, vd: myrdp)" -ForegroundColor Yellow;
              exit 0;
          }

          $ok = $false;
          1..3 | ForEach-Object {
              if (-not ($ok)) {
                  try {
                      $uri = "https://www.duckdns.org/update?domains=$domain&token=$($env:DUCKDNS_TOKEN)&ip=$($env:TAILSCALE_IP)";
                      $res = Invoke-RestMethod -Uri "$uri" -TimeoutSec 20;
                      if (("$res").Trim() -eq 'OK') {
                          $ok = $true;
                      }
                  } catch {
                      Write-Host "â”‚  âš ï¸  Lá»—i káº¿t ná»‘i DuckDNS láº§n $_: $($_.Exception.Message)" -ForegroundColor Yellow;
                  }
                  if (-not ($ok)) { Start-Sleep -Seconds 5; }
              }
          };

          if ($ok) {
              "DUCKDNS_HOST=${domain}.duckdns.org" >> "$env:GITHUB_ENV";
              Write-Host "âœ… DuckDNS Ä‘Ã£ cáº­p nháº­t thÃ nh cÃ´ng: ${domain}.duckdns.org -> $env:TAILSCALE_IP" -ForegroundColor Green;
          } else {
              Write-Host "âš ï¸ DuckDNS cáº­p nháº­t tháº¥t báº¡i hoáº·c tráº£ vá» KO (vui lÃ²ng kiá»ƒm tra láº¡i token vÃ  tÃªn miá»n)" -ForegroundColor Yellow;
          }
          exit 0;
