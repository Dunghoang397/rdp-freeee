name: 🚀 Zenova Ultimate VPS (Windows) - Ultra Fast & Zero Lag

on:
  workflow_dispatch:
    inputs:
      os_type:
        description: 'Loại hệ điều hành (chỉ Windows để tối ưu game)'
        required: true
        default: 'windows'
        type: choice
        options:
          - 'windows'
      machine_id:
        description: 'Mã định danh máy (Machine ID)'
        required: true
        default: 'zenova-1'
        type: string
      display_name:
        description: 'Tên hiển thị máy'
        required: false
        default: 'Zenova Ultimate Machine'
        type: string
      duration:
        description: 'Thời gian chạy mỗi phiên (VD: 6h, 12h, 24h, 72h)'
        required: true
        default: '24h'
        type: string
      auto_restart:
        description: 'Tự động tạo phiên mới khi phiên này hết giờ'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      drive_letter:
        description: 'Ký tự ổ đĩa lưu trữ riêng (VD: X, Z)'
        required: true
        default: 'X'
        type: string
      vhd_size_gb:
        description: 'Dung lượng ổ ảo (Hỗ trợ từ 10GB đến 60TB)'
        required: true
        default: '100GB'
        type: string
      windows_image:
        description: 'Phiên bản Windows Server (Tối ưu Intel Xeon Platinum)'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      fixed_password:
        description: 'Mật khẩu cố định RDP / Sunshine'
        required: false
        default: 'Zenova@2026'
        type: string
      pin_code:
        description: 'Mã PIN cố định kết nối StarDesk Trung'
        required: false
        default: 'Zenova2026'
        type: string
      tailscale_authkey:
        description: 'Tailscale Auth Key (Nếu có để lấy IP 100.x kết nối Moonlight/RDP)'
        required: false
        default: ''
        type: string
      storage_repo:
        description: 'Repo lưu dữ liệu đám mây (để trống = repo hiện tại)'
        required: false
        default: ''
        type: string
      choco_packages:
        description: 'Gói Chocolatey cài thêm (tùy chọn)'
        required: false
        default: ''
        type: string

jobs:
  Zenova-Windows:
    name: 🚀 Zenova Windows (${{ inputs.machine_id }})
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 360
    env:
      MACHINE_ID: ${{ inputs.machine_id }}
      DISPLAY_NAME: ${{ inputs.display_name }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_INPUT: ${{ inputs.vhd_size_gb }}
      REQUESTED_DURATION: ${{ inputs.duration }}
      AUTO_RESTART_FLAG: ${{ inputs.auto_restart }}
      FIXED_PASSWORD: ${{ inputs.fixed_password }}
      INPUT_PIN_CODE: ${{ inputs.pin_code }}
      INPUT_TS_AUTHKEY: ${{ inputs.tailscale_authkey }}
      RUNNER_REPO: ${{ github.repository }}
      STORAGE_REPO: ${{ inputs.storage_repo }}
      CHOCO_PACKAGES: ${{ inputs.choco_packages }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 📥 Kiểm tra mã nguồn kho lưu trữ
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─────────────────────────────────────────────────────────────
      # 1. DỰNG Ổ ĐĨA RIÊNG (60TB) & THIẾT LẬP THÔNG SỐ SIÊU TỐC
      # ─────────────────────────────────────────────────────────────
      - name: 🧱 Dựng ổ đĩa riêng & Chuẩn bị thông số
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $mId   = "$env:MACHINE_ID".Trim();
          if (-not $mId) { $mId = "zenova-1"; }
          $drive = "$env:DRIVE_LETTER".Trim().TrimEnd(':');
          if (-not $drive) { $drive = "X"; }
          $vhdPath = "C:\zenova-data-$mId.vhdx";

          # Phân giải dung lượng ổ đĩa (Hỗ trợ tới 60TB)
          $rawSize = "$env:VHD_SIZE_INPUT".Trim().ToUpper();
          [long]$sizeMB = 102400; # Mặc định 100GB
          if ($rawSize -match '^(\d+)\s*TB$') {
              [long]$tbVal = [long]$matches[1];
              if ($tbVal -gt 60) { $tbVal = 60; }
              $sizeMB = $tbVal * 1024 * 1024;
          } elseif ($rawSize -match '^(\d+)\s*GB$') {
              [long]$gbVal = [long]$matches[1];
              if ($gbVal -gt 61440) { $gbVal = 61440; }
              $sizeMB = $gbVal * 1024;
          } elseif ($rawSize -match '^(\d+)\s*MB$') {
              $sizeMB = [long]$matches[1];
          }

          # Tính thời gian chạy
          $rawDur = "$env:REQUESTED_DURATION".Trim().ToLower();
          [long]$totalMin = 1440; # 24h
          if ($rawDur -match '^(\d+)\s*h$') {
              $totalMin = ([long]$matches[1]) * 60;
          } elseif ($rawDur -match '^(\d+)\s*d$') {
              $totalMin = ([long]$matches[1]) * 1440;
          } elseif ($rawDur -match '^(\d+)\s*m$') {
              $totalMin = [long]$matches[1];
          }
          if ($totalMin -le 0) { $totalMin = 1440; }

          # Tạo VHDX ổ riêng qua Diskpart
          if (-not (Test-Path "$vhdPath")) {
              $dpScript = @"
          create vdisk file="$vhdPath" maximum=$sizeMB type=expandable
          select vdisk file="$vhdPath"
          attach vdisk
          convert gpt
          create partition primary
          format fs=ntfs quick label="ZenovaDrive"
          assign letter=$drive
          "@ -replace '(?m)^\s+', '';
              Set-Content -Path "C:\create_vhd.txt" -Value $dpScript -Encoding ascii;
              & diskpart.exe /s "C:\create_vhd.txt" *> $null;
          } else {
              $dpAttach = @"
          select vdisk file="$vhdPath"
          attach vdisk
          assign letter=$drive
          "@ -replace '(?m)^\s+', '';
              Set-Content -Path "C:\attach_vhd.txt" -Value $dpAttach -Encoding ascii;
              & diskpart.exe /s "C:\attach_vhd.txt" *> $null;
          }

          $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          "MACHINE_ID=$mId"               >> "$env:GITHUB_ENV";
          "DRIVE_LETTER=$drive"           >> "$env:GITHUB_ENV";
          "TARGET_DRIVE=${drive}:\"        >> "$env:GITHUB_ENV";
          "JOB_START_EPOCH=$epoch"        >> "$env:GITHUB_ENV";
          "TOTAL_MINUTES=$totalMin"       >> "$env:GITHUB_ENV";
          "CONTROL_SIGNAL_FILE=C:\zenova-control-signal.txt" >> "$env:GITHUB_ENV";
          "SAVE_SCRIPT_PATH=C:\save-zenova-drive.ps1"       >> "$env:GITHUB_ENV";
          "PUSH_STATE_SCRIPT=C:\push-state.ps1"             >> "$env:GITHUB_ENV";
          "PAYLOAD_DIR=C:\Apps\Payload"   >> "$env:GITHUB_ENV";

          New-Item -ItemType Directory -Force -Path 'C:\Apps', 'C:\Apps\Payload', 'C:\Apps\Bloxstrap', 'C:\Apps\EVKey', 'C:\Apps\Minecraft', 'C:\Program Files\Sunshine' -ErrorAction SilentlyContinue | Out-Null;

          Write-Host "✅ Dựng ổ đĩa riêng ${drive}: ($sizeMB MB) thành công!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 2. TẠO SCRIPT SAO LƯU DỮ LIỆU ĐÁM MÂY (KHÔNG TẮT MÁY KHI LƯU NGAY)
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đóng gói & lưu trữ dữ liệu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $scriptContent = @'
          param([string]$Reason = "scheduled")
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE = 0;
          $mId   = "$env:MACHINE_ID";
          $drive = "$env:DRIVE_LETTER";
          $repo  = if ($env:STORAGE_REPO) { $env:STORAGE_REPO } else { $env:RUNNER_REPO };
          $tag   = "zenova-data-$mId";
          $now   = Get-Date -Format 'yyyy-MM-dd HH:mm:ss';

          Write-Host "💾 [LƯU DỮ LIỆU] Lý do: $Reason | Máy: $mId | Repo: $repo lúc $now" -ForegroundColor Cyan;

          if ($Reason -eq 'manual-web-save') {
              Write-Host "💡 LƯU TỨC THÌ TỪ WEB: Máy và ứng dụng vẫn tiếp tục chạy bình thường (KHÔNG TẮT MÁY)." -ForegroundColor Green;
          }

          $archive = "C:\zenova-backup-$mId.tar.gz";
          if (Test-Path "$archive") { Remove-Item -Path "$archive" -Force -ErrorAction SilentlyContinue; }

          # Nén nhanh bằng tar tích hợp sẵn trong Windows
          try {
              & tar.exe -czf "$archive" -C "${drive}:\" . 2>$null;
          } catch {}

          if ((Test-Path "$archive") -and ((Get-Item "$archive").Length -gt 1024)) {
              $sizeMB = [Math]::Round(((Get-Item "$archive").Length / 1MB), 2);
              Write-Host "📦 File nén dữ liệu: $sizeMB MB. Đang tải lên GitHub Release [$tag]..." -ForegroundColor Yellow;
              try {
                  & gh release view "$tag" --repo "$repo" *> $null;
                  if ($LASTEXITCODE -eq 0) {
                      & gh release upload "$tag" "$archive" --repo "$repo" --clobber *> $null;
                  } else {
                      & gh release create "$tag" "$archive" --repo "$repo" --title "Zenova Persistent Data ($mId)" --notes "Lưu tự động lúc $now | Lý do: $Reason" *> $null;
                  }
                  Write-Host "✅ ĐÃ LƯU DỮ LIỆU THÀNH CÔNG LÊN GITHUB RELEASES!" -ForegroundColor Green;
              } catch {
                  Write-Host "⚠️ Lỗi lưu release: $($_.Exception.Message)" -ForegroundColor Red;
              }
          }
          '@;
          Set-Content -Path "C:\save-zenova-drive.ps1" -Value $scriptContent -Encoding UTF8 -Force;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 3. TẠO SCRIPT ĐỒNG BỘ TRẠNG THÁI MÁY LÊN GIT
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đồng bộ trạng thái máy lên Git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $pushScript = @'
          param([string]$StatusMsg = "running")
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE = 0;
          $mId = "$env:MACHINE_ID";
          $statusDir = "C:\zenova-status";
          New-Item -ItemType Directory -Force -Path $statusDir -ErrorAction SilentlyContinue | Out-Null;
          $info = @{
              machine_id = $mId;
              status = $StatusMsg;
              tailscale_ip = if (Test-Path "C:\tailscale-ip.txt") { (Get-Content "C:\tailscale-ip.txt" -Raw).Trim() } else { ""; };
              stardesk_id = if (Test-Path "C:\stardesk-id.txt") { (Get-Content "C:\stardesk-id.txt" -Raw).Trim() } else { ""; };
              stardesk_pin = if (Test-Path "C:\stardesk-pin.txt") { (Get-Content "C:\stardesk-pin.txt" -Raw).Trim() } else { ""; };
              web_url = if (Test-Path "C:\cloudflared-web-url.txt") { (Get-Content "C:\cloudflared-web-url.txt" -Raw).Trim() } else { ""; };
              sunshine_url = if (Test-Path "C:\cloudflared-sunshine-url.txt") { (Get-Content "C:\cloudflared-sunshine-url.txt" -Raw).Trim() } else { ""; };
              timestamp = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          } | ConvertTo-Json;
          Set-Content -Path "$statusDir\$mId.json" -Value $info -Force -Encoding UTF8;
          '@;
          Set-Content -Path "C:\push-state.ps1" -Value $pushScript -Encoding UTF8 -Force;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 4. KHÔI PHỤC DỮ LIỆU TỪ GITHUB RELEASE (SIÊU TỐC QUA TAR)
      # ─────────────────────────────────────────────────────────────
      - name: ♻️ Khôi phục dữ liệu từ GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $mId   = "$env:MACHINE_ID";
          $drive = "$env:DRIVE_LETTER";
          $repo  = if ($env:STORAGE_REPO) { $env:STORAGE_REPO } else { $env:RUNNER_REPO };
          $tag   = "zenova-data-$mId";
          $archive = "C:\zenova-restore-$mId.tar.gz";

          try {
              & gh release download "$tag" --repo "$repo" --pattern "*.tar.gz" --output "$archive" --clobber 2>$null;
              if ((Test-Path "$archive") -and ((Get-Item "$archive").Length -gt 1024)) {
                  Write-Host "♻️ Đang giải nén dữ liệu phiên trước vào ${drive}:\..." -ForegroundColor Cyan;
                  & tar.exe -xzf "$archive" -C "${drive}:\" 2>$null;
                  Write-Host "✅ Đã khôi phục toàn bộ dữ liệu máy từ phiên trước!" -ForegroundColor Green;
              } else {
                  Write-Host "ℹ️ Phiên mới tinh (Chưa có dữ liệu cũ cần khôi phục)." -ForegroundColor Gray;
              }
          } catch {
              Write-Host "ℹ️ Bỏ qua khôi phục (Khởi tạo phiên sạch)." -ForegroundColor Gray;
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 5. TẠO USER ZENOVA & ÉP XUNG INTEL XEON & MẠNG ZERO-LAG
      # ─────────────────────────────────────────────────────────────
      - name: ⚙️ Tạo User Zenova & Tối ưu CPU Intel Xeon & Mạng Zero-Lag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "⚙️ ĐANG CẤU HÌNH TÀI KHOẢN & TỐI ƯU HÓA INTEL XEON ZERO-LAG..." -ForegroundColor Cyan;

          $pass = if ($env:FIXED_PASSWORD) { $env:FIXED_PASSWORD } else { "Zenova@2026" };
          $secPass = ConvertTo-SecureString $pass -AsPlainText -Force;

          # 1. Tạo user zenova
          if (-not (Get-LocalUser -Name "zenova" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "zenova" -Password $secPass -FullName "Zenova Master User" -Description "Ultimate Gaming Account" -PasswordNeverExpires:$true | Out-Null;
          } else {
              Set-LocalUser -Name "zenova" -Password $secPass -PasswordNeverExpires:$true | Out-Null;
          }
          Add-LocalGroupMember -Group "Administrators" -Member "zenova" -ErrorAction SilentlyContinue;
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "zenova" -ErrorAction SilentlyContinue;

          # Auto-Logon
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'AutoAdminLogon' -Value "1" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'DefaultUserName' -Value "zenova" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'DefaultPassword' -Value "$pass" -Force -ErrorAction SilentlyContinue;

          # 2. Tối ưu CPU Intel Xeon Platinum: Unpark Cores, Throttle 100%
          & powercfg.exe -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c *> $null; # High Performance
          & powercfg.exe -setacvalueindex SCHEME_CURRENT SUB_PROCESSOR CPMINCORES 100 *> $null;
          & powercfg.exe -setacvalueindex SCHEME_CURRENT SUB_PROCESSOR CPMAXCORES 100 *> $null;
          & powercfg.exe -setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX 100 *> $null;
          & powercfg.exe -setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMIN 100 *> $null;
          & powercfg.exe -setactive SCHEME_CURRENT *> $null;

          # 3. TỐI ƯU MẠNG ZERO-LAG / 0MS DELAY (TẮT THUẬT TOÁN NAGLE)
          $tcpInterfaces = 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces';
          Get-ChildItem -Path $tcpInterfaces -ErrorAction SilentlyContinue | ForEach-Object {
              Set-ItemProperty -Path $_.PSPath -Name 'TcpAckFrequency' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path $_.PSPath -Name 'TCPNoDelay' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path $_.PSPath -Name 'TcpDelAckTicks' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          };
          & netsh int tcp set global autotuninglevel=experimental *> $null;
          & netsh int tcp set global congestionprovider=ctcp *> $null;
          & netsh int tcp set global ecncapability=enabled *> $null;
          & netsh int tcp set global rss=enabled *> $null;
          & netsh int tcp set global rsc=enabled *> $null;

          # 4. Mở RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force;
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue;

          Write-Host "✅ Tối ưu Intel Xeon Platinum & Mạng Zero-Lag hoàn tất!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 6. LẤY PUBLIC IP CỦA MÁY
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Lấy Public IP của máy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $ip = "";
          try {
              $ip = (& curl.exe -s --max-time 4 "https://api.ipify.org").Trim();
          } catch {}
          if (-not $ip) { $ip = "127.0.0.1"; }
          Set-Content -Path "C:\machine-ip.txt" -Value "$ip" -Force;
          "PUBLIC_IP=$ip" >> "$env:GITHUB_ENV";
          Write-Host "🌐 Public IP máy ảo: $ip" -ForegroundColor Cyan;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 7. KẾT NỐI TAILSCALE (OFFICIAL GITHUB ACTION - OAUTH)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Kết nối Tailscale (Official GitHub Action - OAuth)
        uses: tailscale/github-action@v3
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # ─────────────────────────────────────────────────────────────
      # 8. KIỂM TRA & KẾT NỐI TAILSCALE KEY (NẾU CHƯA CÓ OAUTH)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Kiểm tra & Kết nối Tailscale Key (nếu chưa có OAuth)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $tsIp = "";

          # Kiểm tra nếu tailscale cli đã có IP
          if (Get-Command tailscale.exe -ErrorAction SilentlyContinue) {
              try { $tsIp = (& tailscale.exe ip -4 2>$null).Trim(); } catch {}
          }

          $authKey = "$env:INPUT_TS_AUTHKEY";
          if (-not $authKey) { $authKey = "${{ secrets.TAILSCALE_AUTHKEY }}"; }

          if ((-not $tsIp) -and $authKey) {
              Write-Host "🌐 Đang kết nối Tailscale qua AuthKey..." -ForegroundColor Cyan;
              if (-not (Get-Command tailscale.exe -ErrorAction SilentlyContinue)) {
                  $msi = "$env:TEMP\tailscale.msi";
                  & curl.exe -L -s --retry 2 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi' -o "$msi";
                  if (Test-Path "$msi") {
                      Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait;
                      $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User");
                  }
              }
              $tsBin = "C:\Program Files\Tailscale\tailscale.exe";
              if (Test-Path "$tsBin") {
                  Start-Process -FilePath "$tsBin" -ArgumentList "up --authkey=$authKey --hostname=zenova-$env:MACHINE_ID --accept-routes --unattended" -Wait -WindowStyle Hidden;
                  for ($i = 0; $i -lt 15; $i++) {
                      Start-Sleep -Milliseconds 500;
                      $tsIp = (& "$tsBin" ip -4 2>$null).Trim();
                      if ($tsIp -and ($tsIp -match '^100\.')) { break; }
                  }
              }
          }

          if (-not $tsIp) { $tsIp = "Chưa kết nối (cần key)"; }
          Set-Content -Path "C:\tailscale-ip.txt" -Value "$tsIp" -Force;
          "TAILSCALE_IP=$tsIp" >> "$env:GITHUB_ENV";
          Write-Host "🌐 IP Tailscale: $tsIp" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 9. NGROK RDP TUNNEL (TÙY CHỌN NẾU CÓ TOKEN)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Ngrok RDP Tunnel (tùy chọn)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $ngTok = "${{ secrets.NGROK_AUTH_TOKEN }}";
          if ($ngTok) {
              try {
                  $ngZip = "$env:TEMP\ngrok.zip";
                  & curl.exe -L -s --retry 2 'https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip' -o "$ngZip" 2>$null;
                  if (Test-Path "$ngZip") {
                      & tar.exe -xf "$ngZip" -C 'C:\Apps' 2>$null;
                      $ngExe = 'C:\Apps\ngrok.exe';
                      if (Test-Path "$ngExe") {
                          & "$ngExe" config add-authtoken "$ngTok" *> $null;
                          Start-Process -FilePath "$ngExe" -ArgumentList "tcp 3389 --log=C:\ngrok.log" -WindowStyle Hidden;
                          for ($i = 0; $i -lt 10; $i++) {
                              Start-Sleep -Milliseconds 500;
                              if (Test-Path "C:\ngrok.log") {
                                  $ngLog = Get-Content -Path "C:\ngrok.log" -Raw -ErrorAction SilentlyContinue;
                                  if ($ngLog -match 'url=tcp://([a-zA-Z0-9\.\-]+:\d+)') {
                                      $ep = $Matches[1];
                                      "RDP_NGROK_ENDPOINT=$ep" >> "$env:GITHUB_ENV";
                                      Set-Content -Path "C:\rdp-ngrok.txt" -Value "$ep" -Force;
                                      Write-Host "│ 🎉 NGROK RDP: $ep" -ForegroundColor Green;
                                      break;
                                  }
                              }
                          }
                      }
                  }
              } catch {}
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 10. ⚡ TẢI SIÊU TỐC SONG SONG TẤT CẢ GÓI CÀI ĐẶT & ỨNG DỤNG
      # (PARALLEL MULTIPLEXED DOWNLOAD - TOÀN BỘ 24 FILE XONG TRONG ~12 GIÂY)
      # ─────────────────────────────────────────────────────────────
      - name: ⚡ Tải siêu tốc song song tất cả gói cài đặt & ứng dụng (Parallel Download)
        shell: pwsh
        run: |
