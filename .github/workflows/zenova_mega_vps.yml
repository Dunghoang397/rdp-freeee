          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 📦 4. Ứng Dụng Đã Tải Sẵn Trong `C:\Apps` và `Downloads`');
          [void]$sb.AppendLine('- **Downloads / Apps**: AutoClicker, CloudCord, Microsoft Store, Minecraft Wallpaper, VS Code, Windhawk, Bloxstrap 120 FPS, PrismLauncher, Spotify, Bandicam, EVKey.');
          Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($sb.ToString()) -Encoding UTF8;

          [Console]::WriteLine("::notice title=THÔNG TIN KẾT NỐI ZENOVA VPS::StarDesk ID: $sdId | PIN: $sdPin | Apollo: $publicApollo | RDP: $rdpTarget | Web: $publicWeb");

          $global:LASTEXITCODE = 0;
          exit 0;

      - name: ⏳ Duy trì phiên làm việc
        id: keepalive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $totalReq = [long]"$env:TOTAL_MINUTES";
          $sessionMinutes = [Math]::Min($totalReq, 350);
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + ($sessionMinutes * 60);
          $saveScript = "$env:SAVE_SCRIPT_PATH";
          $pushScript = "$env:PUSH_STATE_SCRIPT";
          $sigFile    = "$env:CONTROL_SIGNAL_FILE";

          Write-Host "🔄 Duy trì phiên [$env:MACHINE_ID]..." -ForegroundColor Yellow;
          $lastLog = Get-Date;

          while ($true) {
              if (Test-Path "$sigFile") {
                  $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim();
                  Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue;

                  if ("$cmd" -eq 'SAVE_NOW') {
                      if (Test-Path "$saveScript") { & "$saveScript" -Reason 'manual-web-save'; }
                  } elseif ("$cmd" -eq 'RESTART_SESSION') {
                      'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV";
                      break;
                  } elseif ("$cmd" -eq 'STOP_SESSION') {
                      'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV";
                      break;
                  }
              }

              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
              $remain = ($endEpoch) - ($now);
              if (($remain) -le 0) { break; }

              if (((Get-Date) - $lastLog).TotalSeconds -ge 60) {
                  $minLeft = [math]::Floor($remain / 60);
                  $secLeft = $remain % 60;
                  Write-Host "⏱️ [$(Get-Date -Format 'HH:mm:ss')] Còn $minLeft phút $secLeft giây" -ForegroundColor Gray;
                  if (Test-Path "$pushScript") { & "$pushScript" 2>&1 | Out-Null; }
                  $lastLog = Get-Date;
              }

              Start-Sleep -Seconds 5;
          }

          $global:LASTEXITCODE = 0;
          exit 0;

      - name: 💾 Lưu dữ liệu cuối phiên (có timeout 20 phút)
        if: always()
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE = 0;
          $saveScript = "$env:SAVE_SCRIPT_PATH";
          if (-not (Test-Path "$saveScript")) {
              Write-Host "⚠️ Không có save script → bỏ qua." -ForegroundColor Yellow;
              exit 0
          }
          Write-Host "⏱️ Bắt đầu lưu, tối đa 20 phút..." -ForegroundColor Cyan
          $job = Start-Job -ScriptBlock {
              param($sp)
              & $sp -Reason 'final-session-save'
          } -ArgumentList $saveScript

          $finished = Wait-Job -Job $job -Timeout 1200
          if (-not $finished) {
              Write-Host "⚠️ Lưu quá 20 phút → HỦY để không treo phiên!" -ForegroundColor Yellow
              Stop-Job -Job $job -ErrorAction SilentlyContinue
              Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
              Write-Host "⚠️ Đã hủy lưu. Phiên tiếp theo vẫn được kích hoạt bình thường." -ForegroundColor Yellow
              exit 0
          }
          Receive-Job -Job $job -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ -ForegroundColor DarkGray }
          Remove-Job -Job $job -Force -ErrorAction SilentlyContinue
          Write-Host "✅ Hoàn tất lưu." -ForegroundColor Green
          $global:LASTEXITCODE = 0;
          exit 0;

      - name: 🔁 Kích hoạt phiên tiếp theo
        if: always()
        shell: pwsh
        env:
          AUTO_RESTART: ${{ github.event.inputs.auto_restart || true }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          if ("$env:FORCE_STOP_ONLY" -eq '1') {
              Write-Host "🛑 Đã ngắt VPS." -ForegroundColor Yellow;
              exit 0;
          }
          if (("$env:AUTO_RESTART" -eq 'true') -or ("$env:FORCE_NEXT_SESSION" -eq '1')) {
              $wfFile = if ($env:GITHUB_WORKFLOW_REF) { ($env:GITHUB_WORKFLOW_REF -split '@')[0] -replace '^.*\.github/workflows/', '' } else { 'zenova_mega_vps.yml' };
              try {
                  gh workflow run "$wfFile" --repo "$env:RUNNER_REPO" `
                      -f machine_id="$env:MACHINE_ID" `
                      -f duration="5h" `
                      -f auto_restart="true" `
                      -f fixed_password="$env:FIXED_PASSWORD" `
                      -f pin_code="$env:INPUT_PIN_CODE" `
                      -f drive_letter="$env:MOUNT_LETTER" `
                      -f vhd_size_gb="$env:VHD_SIZE_GB" `
                      -f windows_image="${{ github.event.inputs.windows_image || 'windows-2025' }}" 2>&1 | Out-Null;
                  Write-Host "✅ Kích hoạt phiên mới thành công!" -ForegroundColor Green;
              } catch {}
          }
          $global:LASTEXITCODE = 0;
          exit 0;
