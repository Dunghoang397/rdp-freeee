name: 🚀 ZENOVA ULTIMATE VPS (Windows + Linux)

on:
  workflow_dispatch:
    inputs:
      os_type:
        description: '🖥️ Hệ điều hành (windows, linux, hoặc both)'
        required: false
        default: 'windows'
        type: choice
        options:
          - 'windows'
          - 'linux'
          - 'both'
      machine_id:
        description: '🏷️ Tên định danh máy (VD: zenova-1)'
        required: false
        default: 'zenova-1'
        type: string
      display_name:
        description: '🏷️ Tên hiển thị của máy'
        required: false
        default: 'Zenova Ultimate Machine'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng (tối đa 24h - có thể chọn)'
        required: false
        default: '24h'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h'
          - '6h'
          - '12h'
          - '24h'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới & lưu dữ liệu cho phiên mới'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo riêng biệt lưu dữ liệu (VD: X)'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo VHDX (GB - co giãn động)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Bản Windows (Đã loại bỏ Win 19 vì GitHub cấm)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      fixed_password:
        description: '🔐 Mật khẩu RDP / Sunshine / Windows cố định'
        required: false
        default: 'Zenova@2026'
        type: string
      pin_code:
        description: '🔑 Mã PIN StarDesk Trung / GameViewer (VD: Zenova2026)'
        required: false
        default: 'Zenova2026'
        type: string
      stardesk_id_trung:
        description: '🌟 ID StarDesk Trung (để trống hệ thống tự nhận diện)'
        required: false
        default: ''
        type: string
      storage_repo:
        description: '📦 Repo lưu trữ ổ đĩa (để trống dùng chính repo này)'
        required: false
        default: ''
        type: string
      root_machine_id:
        description: '🏷️ Tên máy gốc để kế thừa ổ đĩa lần đầu (nếu có)'
        required: false
        default: 'zenova-root'
        type: string
      choco_packages:
        description: '📦 App cài thêm qua choco (lưu vết sang phiên sau)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu tối thượng (Fix CPU 100%, Fix Lag, Múi giờ VN)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS'
        required: false
        default: true
        type: boolean
      ngrok_token:
        description: '🔑 Mã Ngrok Token để tạo IP Remote Desktop công khai (tuỳ chọn)'
        required: false
        default: ''
        type: string
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo VDD'
        required: false
        default: '1920x1080@60'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'

permissions:
  contents: write
  actions: write

concurrency:
  group: zenova-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: ZENOVA WINDOWS RUNNER (RDP + SUNSHINE + STARDESK TRUNG + VHD)
  # =========================================================================
  Zenova-Windows:
    name: 🪟 Windows VPS (RDP + Sunshine + StarDesk Trung)
    runs-on: windows-2022
    if: ${{ !github.event.inputs.os_type != 'linux' }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      STORAGE_GH_TOKEN: ${{ secrets.STORAGE_GH_TOKEN || secrets.PAT_TOKEN || github.token }}
      STORAGE_REPO: ${{ github.event.inputs.storage_repo || github.repository }}
      RUNNER_GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      RUNNER_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-1' }}
      ROOT_MACHINE_ID: ${{ github.event.inputs.root_machine_id || 'zenova-root' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || github.event.inputs.machine_id || 'Zenova Ultimate Machine' }}
      DRIVE_LETTER: ${{ github.event.inputs.drive_letter || 'X' }}
      VHD_SIZE_GB: ${{ github.event.inputs.vhd_size_gb || '45' }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      ENABLE_DUCKDNS: ${{ github.event.inputs.enable_duckdns }}
      INPUT_PIN_CODE: ${{ github.event.inputs.pin_code || 'Zenova2026' }}
      STARDESK_ID_INPUT: ${{ github.event.inputs.stardesk_id_trung || '' }}
      NGROK_TOKEN: ${{ github.event.inputs.ngrok_token || secrets.NGROK_AUTH_TOKEN || secrets.NGROK_TOKEN }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. DỰNG Ổ ĐĨA RIÊNG & CHUẨN BỊ THÔNG SỐ
      # ─────────────────────────────────────────────────────────────
      - name: 🧱 Dựng ổ đĩa riêng & Chuẩn bị thông số
        shell: pwsh
        env:
          INPUT_DURATION: ${{ github.event.inputs.duration }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV";

          # Chuẩn hóa Machine ID
          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', '';
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'zenova-1'; }
          $relTag      = "zenova-storage-$cleanId";
          $stateBranch = "zenova-state-$cleanId";
          $rootRelTag  = "zenova-storage-$($env:ROOT_MACHINE_ID)";

          "MACHINE_ID=$cleanId" >> "$env:GITHUB_ENV";
          "RELEASE_TAG=$relTag" >> "$env:GITHUB_ENV";
          "STATE_BRANCH=$stateBranch" >> "$env:GITHUB_ENV";
          "ROOT_RELEASE_TAG=$rootRelTag" >> "$env:GITHUB_ENV";

          # Parse thời lượng (Hỗ trợ tối đa 24h)
          $total = 1440;
          $display = '24 giờ (Tối đa)';
          switch ("$env:INPUT_DURATION") {
              '1h'  { $total = 60;   $display = '1 giờ'; }
              '3h'  { $total = 180;  $display = '3 giờ'; }
              '5h'  { $total = 300;  $display = '5 giờ'; }
              '6h'  { $total = 360;  $display = '6 giờ'; }
              '12h' { $total = 720;  $display = '12 giờ'; }
              '24h' { $total = 1440; $display = '24 giờ'; }
              default { $total = 1440; $display = '24 giờ'; }
          }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV";
          "DISPLAY_TIME=$display" >> "$env:GITHUB_ENV";

          # Cấu hình User mặc định
          $user     = "zenova";
          $profPath = "C:\Users\zenova";
          "RDP_USER=$user" >> "$env:GITHUB_ENV";
          "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV";

          # Ký tự ổ đĩa ảo
          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper();
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X'; }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV";

          # Khởi tạo VHDX ảo hoặc DOS Device
          $vhdContainer = 'C:\ZENOVA-VHD-HOST';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" -ErrorAction SilentlyContinue | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'zenova-os.vhdx');

          $sizeBytes = ([int64]"$env:VHD_SIZE_GB") * 1GB;
          Write-Host "💽 Đang khởi tạo ổ đĩa riêng ${dl}:\ ($env:VHD_SIZE_GB GB Dynamic VHDX)..." -ForegroundColor Cyan;
          $mounted = $false;
          try {
              if (Get-Command New-VHD -ErrorAction SilentlyContinue) {
                  if (-not (Test-Path "$vhdFile")) {
                      New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:($false) | Out-Null;
                  } else {
                      Mount-VHD -Path "$vhdFile";
                  }
                  $null = Get-PSDrive -Name "$dl" -ErrorAction Stop;
                  if (Test-Path "${dl}:\") { $mounted = $true; }
              }
          } catch {
              Write-Host "⚠️ Fallback sang cơ chế Kernel DOS Devices cho ${dl}:\..." -ForegroundColor Yellow;
          }

          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" -ErrorAction SilentlyContinue | Out-Null;
              try {
                  $typeDef = 'using System; using System.Runtime.InteropServices; public class KernelDisk { [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Auto)] public static extern bool DefineDosDevice(int dwFlags, string lpDeviceName, string lpTargetPath); }';
                  Add-Type -TypeDefinition $typeDef -ErrorAction SilentlyContinue;
                  [KernelDisk]::DefineDosDevice(0, "${dl}:", "$fallbackDir");
              } catch {}
              & subst "${dl}:" "$fallbackDir" 2>$null;
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue;
              $null = New-PSDrive -Name "$dl" -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue;
          }

          $sharedRoot       = "${dl}:\ZENOVA-SYSTEM";
          $sharedSessionDir = "$sharedRoot\sessions";
          $sharedDataDir    = "$sharedRoot\DATA";
          $sharedOsDir      = "$sharedRoot\OS-OVERLAY";
          $sharedStateFile  = "$sharedSessionDir\rdp-session-state.json";
          $profileStoreRoot = "$sharedRoot\Users";
          $baselineFile     = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'baseline-c-dirs.json');
          $controlSignal    = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'zenova-control-action.txt');

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "$sharedOsDir", "$profileStoreRoot", "${dl}:\Apps") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" -ErrorAction SilentlyContinue | Out-Null;
          };

          $baseline = @{
              PF64 = @(Get-ChildItem 'C:\Program Files' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
              PF86 = @(Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
              PD   = @(Get-ChildItem 'C:\ProgramData' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
          };
          $baseline | ConvertTo-Json -Depth 4 | Set-Content -Path "$baselineFile" -Encoding UTF8;

          "VHD_CONTAINER=$vhdContainer" >> "$env:GITHUB_ENV";
          "VHD_FILE=$vhdFile" >> "$env:GITHUB_ENV";
          "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV";
          "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV";
          "SHARED_DATA_DIR=$sharedDataDir" >> "$env:GITHUB_ENV";
          "SHARED_OS_DIR=$sharedOsDir" >> "$env:GITHUB_ENV";
          "SHARED_STATE_FILE=$sharedStateFile" >> "$env:GITHUB_ENV";
          "PROFILE_ROOT=$profileStoreRoot" >> "$env:GITHUB_ENV";
          "BASELINE_FILE=$baselineFile" >> "$env:GITHUB_ENV";
          "CONTROL_SIGNAL_FILE=$controlSignal" >> "$env:GITHUB_ENV";

          $build = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild;
          "OS_BUILD=$build" >> "$env:GITHUB_ENV";

          # Đảm bảo GitHub Release cho máy tồn tại
          try {
              $null = gh release view "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
              if (($LASTEXITCODE) -ne 0) {
                  $dummy = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'init.txt');
                  Set-Content -Path "$dummy" -Value "Zenova Persistent Storage Initialized for $cleanId" -Encoding UTF8;
                  gh release create "$env:RELEASE_TAG" "$dummy" --repo "$env:STORAGE_REPO" --title "Zenova Storage ($cleanId)" --notes "Kho lưu trữ ổ đĩa tự động cho máy [$cleanId]" 2>&1 | Out-Null;
              }
          } catch {}
          $global:LASTEXITCODE = 0;

          Write-Host "✅ Dựng ổ đĩa ${dl}:\ thành công | Định danh: $cleanId | Thời lượng: $display" -ForegroundColor Green;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 2. TẠO SCRIPT ĐÓNG GÓI & LƯU TRỮ Ổ ĐĨA (SAVE-DATA.PS1)
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đóng gói & lưu trữ dữ liệu
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-zenova-drive.ps1');

          $scriptLines = @(
              'param([string]$Reason = "manual")',
              '$ErrorActionPreference = "Continue";',
              '$global:LASTEXITCODE = 0;',
              'Write-Host "💾 [$Reason] Đang đóng gói và lưu toàn bộ dữ liệu..." -ForegroundColor Cyan;',
              '$appsToClose = @("chrome", "msedge", "brave", "firefox", "discord", "Spotify", "Bandicam", "EVKey", "RobloxPlayerBeta", "StarDesk", "GameViewer");',
              'foreach ($app in $appsToClose) {',
              '    Get-Process -Name "$app*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;',
              '    taskkill.exe /F /IM "$app*.exe" /T 2>$null | Out-Null;',
              '};',
              'Start-Sleep -Seconds 2;',
              '$stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", "save-stage");',
              'if (Test-Path "$stage") { Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$stage" -ErrorAction SilentlyContinue | Out-Null;',
              'robocopy "$env:SHARED_ROOT" "$stage" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '$global:LASTEXITCODE = 0;',
              '$userProf = "$env:PROFILE_PATH";',
              'if (Test-Path "$userProf") {',
              '    $profDst = [System.IO.Path]::Combine("$stage", "Users", "$env:RDP_USER");',
              '    New-Item -ItemType Directory -Force -Path "$profDst" -ErrorAction SilentlyContinue | Out-Null;',
              '    robocopy "$userProf" "$profDst" /E /XJ /COPY:DAT /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD "$userProf\AppData\Roaming\Microsoft\Protect" *> $null;',
              '    $global:LASTEXITCODE = 0;',
              '};',
              '$archivePrefix = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "zenova-drive.7z");',
              'Get-ChildItem -Path "$env:RUNNER_TEMP" -Filter "zenova-drive.7z.*" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue;',
              '& 7z a "$archivePrefix" "$stage\*" -v1900m -mx=1 -mmt=on *> $null;',
              '$chunks = @(Get-ChildItem -Path "$env:RUNNER_TEMP" -Filter "zenova-drive.7z.*" | Sort-Object Name);',
              'if ($chunks.Count -gt 0) {',
              '    $manifest = @{ chunkCount = $chunks.Count; timestamp = (Get-Date).ToString("o"); machineId = "$env:MACHINE_ID" };',
              '    $manifestFile = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "drive-manifest.json");',
              '    $manifest | ConvertTo-Json | Set-Content -Path "$manifestFile" -Encoding UTF8;',
              '    gh release upload "$env:RELEASE_TAG" "$manifestFile" ($chunks.FullName) --repo "$env:STORAGE_REPO" --clobber 2>&1 | Out-Null;',
              '    $global:LASTEXITCODE = 0;',
              '    Write-Host "✅ Đã lưu thành công $($chunks.Count) phân mảnh lên GitHub Release!" -ForegroundColor Green;',
              '};',
              'Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue;',
              '$global:LASTEXITCODE = 0;'
          );

          Set-Content -Path $saveScriptPath -Value ($scriptLines -join "`r`n") -Encoding UTF8;
          "SAVE_SCRIPT_PATH=$saveScriptPath" >> "$env:GITHUB_ENV";
          Write-Host "✅ Tạo script lưu trữ dữ liệu tự động thành công!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 3. TẠO SCRIPT ĐỒNG BỘ TRẠNG THÁI MÁY LÊN GIT BRANCH
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đồng bộ trạng thái máy lên Git
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $pushStatePath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'push-repo-state.ps1');

          $stateLines = @(
              'param([string]$Status = "Online", [string]$SdId = "", [string]$SdPin = "", [string]$Extra = "")',
              '$ErrorActionPreference = "Continue";',
              '$global:LASTEXITCODE = 0;',
              '$gitStage = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "git-state-repo");',
              'if (Test-Path "$gitStage") { Remove-Item -Path "$gitStage" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$gitStage" -ErrorAction SilentlyContinue | Out-Null;',
              'git config --global user.name "Zenova-Agent" 2>$null;',
              'git config --global user.email "zenova@cloud.local" 2>$null;',
              'git clone --depth 1 "https://x-access-token:$($env:STORAGE_GH_TOKEN)@github.com/$($env:STORAGE_REPO).git" "$gitStage" 2>&1 | Out-Null;',
              '$global:LASTEXITCODE = 0;',
              'Push-Location "$gitStage";',
              'git checkout -B "$env:STATE_BRANCH" 2>&1 | Out-Null;',
              '$st = @{ machineId = "$env:MACHINE_ID"; status = $Status; stardeskId = $SdId; stardeskPin = $SdPin; updatedAt = (Get-Date).ToString("o"); note = $Extra };',
              '$st | ConvertTo-Json | Set-Content -Path "status.json" -Encoding UTF8;',
              'git add status.json 2>&1 | Out-Null;',
              'git commit -m "Update state: $Status" 2>&1 | Out-Null;',
              'git push origin "$env:STATE_BRANCH" --force 2>&1 | Out-Null;',
              'Pop-Location;',
              'Remove-Item -Path "$gitStage" -Recurse -Force -ErrorAction SilentlyContinue;',
              '$global:LASTEXITCODE = 0;'
          );

          Set-Content -Path $pushStatePath -Value ($stateLines -join "`r`n") -Encoding UTF8;
          "PUSH_STATE_SCRIPT=$pushStatePath" >> "$env:GITHUB_ENV";
          Write-Host "✅ Tạo script đồng bộ trạng thái Git thành công!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 4. KHÔI PHỤC DỮ LIỆU TỪ GITHUB RELEASE
      # ─────────────────────────────────────────────────────────────
      - name: ♻️ Khôi phục dữ liệu từ GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $dl = "$env:MOUNT_LETTER";

          # Tắt mã hóa App-Bound của Chromium
          @(
              'HKLM:\SOFTWARE\Policies\Google\Chrome',
              'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
              'HKLM:\SOFTWARE\Policies\BraveSoftware\Brave',
              'HKLM:\SOFTWARE\Policies\CocCoc\Browser'
          ) | ForEach-Object {
              New-Item -Path "$_" -Force -ErrorAction SilentlyContinue | Out-Null;
              Set-ItemProperty -Path "$_" -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          };

          # Cố định Hostname
          $suffix = (("$env:MACHINE_ID").ToUpper() -replace '[^A-Z0-9]', '');
          if ($suffix.Length -gt 8) { $suffix = $suffix.Substring(0, 8); }
          $fixedHost = if ($suffix) { "ZENOVA-$suffix" } else { 'ZENOVA-VPS' };
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;

          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore');
          if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue; }
          New-Item -ItemType Directory -Force -Path "$dlDir" -ErrorAction SilentlyContinue | Out-Null;

          $isFirstRun = $false;
          $sourceTag = "$env:RELEASE_TAG";

          # Kiểm tra xem Release riêng của máy đã có chưa
          $null = gh release view "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $isFirstRun = $true;
          } else {
              # Kiểm tra file manifest
              gh release download "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
              $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json');
              if (-not (Test-Path "$manifestFile")) {
                  # Thử kế thừa từ ROOT_RELEASE_TAG lần đầu nếu có
                  if ("$env:ROOT_RELEASE_TAG" -and ("$env:ROOT_RELEASE_TAG" -ne "$env:RELEASE_TAG")) {
                      $null = gh release view "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
                      if (($LASTEXITCODE) -eq 0) {
                          gh release download "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
                          if (Test-Path "$manifestFile") {
                              $sourceTag = "$env:ROOT_RELEASE_TAG";
                              Write-Host "📦 Kế thừa bản lưu từ máy gốc [$env:ROOT_RELEASE_TAG]..." -ForegroundColor Cyan;
                          } else {
                              $isFirstRun = $true;
                          }
                      } else {
                          $isFirstRun = $true;
                      }
                  } else {
                      $isFirstRun = $true;
                  }
              }
          }

          # Luôn reset LASTEXITCODE về 0
          $global:LASTEXITCODE = 0;

          if ($isFirstRun) {
              Write-Host "ℹ️ Máy [$env:MACHINE_ID] là máy mới! Tạo phiên làm việc mới..." -ForegroundColor Cyan;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          # Tiến hành tải các phân mảnh lưu trữ
          $manifest = Get-Content -Raw -Path "$manifestFile" | ConvertFrom-Json;
          Write-Host "⬇️ Tìm thấy bản lưu từ [$sourceTag] ($($manifest.chunkCount) phân mảnh). Đang tải..." -ForegroundColor Cyan;
          gh release download "$sourceTag" --repo "$env:STORAGE_REPO" --pattern 'zenova-drive.7z.*' --dir "$dlDir";
          if (($LASTEXITCODE) -ne 0) {
              Write-Host "⚠️ Không tải được phân mảnh từ [$sourceTag], tiếp tục phiên mới..." -ForegroundColor Yellow;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          $firstChunk = [System.IO.Path]::Combine("$dlDir", 'zenova-drive.7z.001');
          if (Test-Path "$firstChunk") {
              $stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", 'restore-stage');
              if (Test-Path "$stage") { Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue; }
              New-Item -ItemType Directory -Force -Path "$stage" -ErrorAction SilentlyContinue | Out-Null;
              & 7z x "$firstChunk" "-o$stage" -y -mmt=on *> $null;

              robocopy "$stage" "$env:SHARED_ROOT" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;
              $global:LASTEXITCODE = 0;

              $oldProf = [System.IO.Path]::Combine("$env:SHARED_ROOT", 'Users', "$env:RDP_USER");
              if (Test-Path "$oldProf") {
                  robocopy "$oldProf" "$env:PROFILE_PATH" /E /XJ /COPY:DAT /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD "$oldProf\AppData\Roaming\Microsoft\Protect" *> $null;
                  $global:LASTEXITCODE = 0;
              }
              Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue;

              # Nạp lại Registry nếu có
              $regBk = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Registry');
              if (Test-Path "$regBk") {
                  Get-ChildItem -Path "$regBk" -Filter '*.reg' -Recurse | ForEach-Object { reg import ($_.FullName) *>$null; };
              }

              Write-Host "✅ Khôi phục thành công toàn bộ dữ liệu từ phiên trước!" -ForegroundColor Green;
          }
          Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue;
          'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 5. TẠO USER ZENOVA, AUTO-LOGON & TỐI ƯU TỐI THƯỢNG FIX CPU 100%
      # ─────────────────────────────────────────────────────────────
      - name: ⚙️ Tạo User Zenova & Tối ưu tối thượng (Fix CPU 100% & Fix Lag)
        shell: pwsh
        env:
          FIXED_PASS: ${{ github.event.inputs.fixed_password }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "⚙️ ĐANG THIẾT LẬP USER ZENOVA, RUNNERADMIN & TỐI ƯU TOÀN DIỆN..." -ForegroundColor Yellow;

          # Tắt chính sách mật khẩu phức tạp
          try {
              $secCfg = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.cfg');
              $secDb  = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.sdb');
              secedit /export /cfg "$secCfg" *> $null;
              if (Test-Path "$secCfg") {
                  (Get-Content $secCfg) -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' | Set-Content $secCfg;
                  secedit /configure /db "$secDb" /cfg "$secCfg" /areas SECURITYPOLICY *> $null;
                  Remove-Item "$secCfg", "$secDb" -Force -ErrorAction SilentlyContinue;
              }
          } catch {}

          $user = "zenova";
          $pass = if ($env:FIXED_PASS) { $env:FIXED_PASS } else { "Zenova@2026" };
          "FIXED_PASSWORD=$pass" >> "$env:GITHUB_ENV";

          # Tạo User zenova (Tương thích 100% Windows Server 2022 & Server 2025)
          $secPass = ConvertTo-SecureString "$pass" -AsPlainText -Force;
          try {
              $existingUser = Get-LocalUser -Name $user -ErrorAction SilentlyContinue;
              if (-not $existingUser) {
                  New-LocalUser -Name $user -Password $secPass -FullName "Zenova" -Description "Zenova Cloud User" -PasswordNeverExpires -ErrorAction SilentlyContinue;
              } else {
                  Set-LocalUser -Name $user -Password $secPass -PasswordNeverExpires $true -ErrorAction SilentlyContinue;
              }
          } catch {}

          # Fallback tạo bằng net user
          try {
              & net user $user $pass /add /comment:"Zenova Cloud User" /fullname:"Zenova" /expires:never 2>&1 | Out-Null;
              & net user $user $pass 2>&1 | Out-Null;
              # Cấu hình cả tài khoản runneradmin hiện tại cùng mật khẩu để đăng nhập RDP hoặc chạy tác vụ
              & net user runneradmin $pass 2>&1 | Out-Null;
          } catch {}

          # Đặt mật khẩu không bao giờ hết hạn
          try {
              Set-LocalUser -Name $user -PasswordNeverExpires $true -ErrorAction SilentlyContinue;
              Set-LocalUser -Name "runneradmin" -PasswordNeverExpires $true -ErrorAction SilentlyContinue;
          } catch {}

          # Thêm vào nhóm Administrators và Remote Desktop Users
          try {
              Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue;
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue;
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue;
          } catch {}

          # Cấu hình AutoAdminLogon
          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon';
          Set-ItemProperty -Path $winlogon -Name 'AutoAdminLogon' -Value '1' -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path $winlogon -Name 'DefaultUserName' -Value $user -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path $winlogon -Name 'DefaultPassword' -Value $pass -Force -ErrorAction SilentlyContinue;

          # ─────────────────────────────────────────────────────────────
          # 🚀 FIX CPU 100% & TỐI ƯU HIỆU NĂNG TỐI THƯỢNG
          # ─────────────────────────────────────────────────────────────
          Write-Host "🚀 Đang tối ưu CPU, tắt PowerThrottling và các tiến trình ngốn CPU..." -ForegroundColor Cyan;

          # 1. Tắt PowerThrottling
          $ptPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling';
          New-Item -Path $ptPath -Force -ErrorAction SilentlyContinue | Out-Null;
          Set-ItemProperty -Path $ptPath -Name 'PowerThrottlingOff' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;

          # 2. Tắt CPU Core Parking & Tối ưu lập lịch CPU
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Power' -Name 'CsEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' -Name 'Win32PrioritySeparation' -Value 0x26 -Type DWord -Force -ErrorAction SilentlyContinue;

          # 3. Kích hoạt Power Scheme High Performance / Ultimate
          powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null | Out-Null;
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null | Out-Null;
          powercfg /change standby-timeout-ac 0 2>$null;
          powercfg /change monitor-timeout-ac 0 2>$null;
          powercfg /change disk-timeout-ac 0 2>$null;
          powercfg /hibernate off 2>$null;

          # 4. Tắt Windows Defender Realtime (Tiết kiệm 40% CPU)
          try {
              Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -ErrorAction SilentlyContinue;
          } catch {}

          # 5. Tắt toàn bộ dịch vụ ngầm gây lag & CPU 100%
          $servicesToKill = @(
              'WSearch',             # Windows Search Indexer (Thủ phạm chính 100% CPU)
              'SysMain',             # Superfetch
              'wuauserv',            # Windows Update
              'UsoSvc',              # Update Orchestrator
              'DiagTrack',           # Connected User Telemetry
              'dmwappushservice',    # WAP Push Service
              'WerSvc',              # Windows Error Reporting
              'PcaSvc',              # Program Compatibility Assistant
              'DPS'                  # Diagnostic Policy Service
          );
          foreach ($svc in $servicesToKill) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue;
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue;
          }

          # 6. Múi giờ Việt Nam
          tzutil /s 'SE Asia Standard Time' 2>$null;

          # 7. Bật Remote Desktop & Tắt Firewall (Mở thông mọi kết nối P2P, StarDesk & RDP)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force -ErrorAction SilentlyContinue;
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue;
          Start-Service -Name TermService -ErrorAction SilentlyContinue;
          netsh advfirewall set allprofiles state off 2>&1 | Out-Null;

          # Tắt hoàn toàn Server Manager & Shutdown Event Tracker chống popup gây tắt máy nhầm
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Server\ServerManager' -Name 'DoNotOpenAtLogon' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\ServerManager' -Name 'DoNotOpenServerManagerAtLogon' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;
          $relKey = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Reliability';
          New-Item -Path $relKey -Force -ErrorAction SilentlyContinue | Out-Null;
          Set-ItemProperty -Path $relKey -Name 'ShutdownReasonOn' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path $relKey -Name 'ShutdownReasonUI' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;

          # 8. Bật DirectPlay cho Games
          try {
              Enable-WindowsOptionalFeature -Online -FeatureName DirectPlay -All -NoRestart -ErrorAction SilentlyContinue | Out-Null;
          } catch {}

          Write-Host "✅ Đã tối ưu CPU & Windows hoàn tất!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 6. CÀI TAILSCALE MESH NETWORK
      # ─────────────────────────────────────────────────────────────
      # ─────────────────────────────────────────────────────────────
      # 6. CẤU HÌNH IP MÁY, NGROK TCP TUNNEL CHO RDP & TAILSCALE
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Cấu hình IP Máy, Ngrok RDP & Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          NGROK_AUTH_TOKEN: ${{ env.NGROK_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🌐 Đang cấu hình các địa chỉ IP kết nối (Remote Desktop & Mạng)..." -ForegroundColor Cyan;

          # 1. Lấy IP Public Outbound của máy
          try {
              $pubIp = (& curl.exe -s --max-time 5 https://api.ipify.org 2>$null).Trim();
              if ($pubIp) {
                  "MACHINE_PUBLIC_IP=$pubIp" >> "$env:GITHUB_ENV";
                  Set-Content -Path "C:\machine-ip.txt" -Value "$pubIp" -Force;
                  Write-Host "│ 🌐 IP Outbound Công Khai của máy: $pubIp" -ForegroundColor Green;
              }
          } catch {}

          # 2. Ngrok TCP Tunnel cho Remote Desktop (Port 3389)
          $ngTok = if ($env:NGROK_TOKEN) { $env:NGROK_TOKEN } elseif ($env:NGROK_AUTH_TOKEN) { $env:NGROK_AUTH_TOKEN } else { "" };
          if ($ngTok) {
              Write-Host "│ 🔑 Tìm thấy Ngrok Token! Đang thiết lập Remote Desktop công khai..." -ForegroundColor Cyan;
              try {
                  $ngZip = "$env:TEMP\ngrok.zip";
                  & curl.exe -L --retry 3 --connect-timeout 15 "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -o "$ngZip" 2>$null;
                  if (Test-Path "$ngZip") {
                      Expand-Archive -Path "$ngZip" -DestinationPath 'C:\ngrok' -Force;
                      $ngExe = 'C:\ngrok\ngrok.exe';
                      if (Test-Path "$ngExe") {
                          & "$ngExe" config add-authtoken "$ngTok" *> $null;
                          Start-Process -FilePath "$ngExe" -ArgumentList "tcp 3389 --log=C:\ngrok.log" -WindowStyle Hidden;
                          for ($i = 0; $i -lt 15; $i++) {
                              Start-Sleep -Seconds 1;
                              if (Test-Path "C:\ngrok.log") {
                                  $ngLog = Get-Content -Path "C:\ngrok.log" -Raw -ErrorAction SilentlyContinue;
                                  if ($ngLog -match 'url=tcp://([a-zA-Z0-9\.\-]+:\d+)') {
                                      $ep = $Matches[1];
                                      "RDP_NGROK_ENDPOINT=$ep" >> "$env:GITHUB_ENV";
                                      Set-Content -Path "C:\rdp-ngrok.txt" -Value "$ep" -Force;
                                      Write-Host "│ 🎉 ĐÃ TẠO ĐỊA CHỈ REMOTE DESKTOP (NGROK): $ep" -ForegroundColor Green;
                                      [Console]::WriteLine("::notice title=REMOTE DESKTOP QUA NGROK SẴN SÀNG::Địa chỉ RDP: $ep | User: zenova | Pass: $env:FIXED_PASSWORD");
                                      break;
                                  }
                              }
                          }
                      }
                  }
              } catch {}
          }

          # 3. Kết nối Tailscale VPN (nếu có key)
          if ("$env:TAILSCALE_AUTH_KEY") {
              Write-Host "│ 🌐 Đang kết nối mạng Tailscale..." -ForegroundColor Cyan;
              try {
                  $msi = "$env:TEMP\tailscale.msi";
                  Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi' -OutFile $msi -UseBasicParsing -TimeoutSec 45;
                  Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait;
                  Start-Sleep -Seconds 3;
                  & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="zenova-$env:MACHINE_ID" --accept-routes;
                  $tsIp = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null).Trim();
                  if ($tsIp) {
                      "TAILSCALE_IP=$tsIp" >> "$env:GITHUB_ENV";
                      Write-Host "│ ✅ Tailscale IP: $tsIp" -ForegroundColor Green;
                  }
              } catch {}
          }
          $global:LASTEXITCODE = 0;
          exit 0;
      - name: 🖥️🔊☀️ Cài Driver Màn Hình Ảo (VDD), Âm Thanh Ảo & Sunshine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🖥️ Cài đặt Driver Ảo & Sunshine Streaming (Tốc Độ Siêu Tốc)..." -ForegroundColor Cyan;

          # 1. Màn hình ảo USBMMIDD v2
          try {
              $zip = "$env:TEMP\usbmmidd_v2.zip";
              & curl.exe -L --retry 3 --connect-timeout 20 'https://www.amyuni.com/downloads/usbmmidd_v2.zip' -o "$zip" 2>$null;
              if (Test-Path "$zip") {
                  Expand-Archive -Path $zip -DestinationPath 'C:\' -Force;
                  Push-Location 'C:\usbmmidd_v2';
                  Get-ChildItem -Filter '*.cer' | ForEach-Object {
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null;
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null;
                  };
                  & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null;
                  & .\deviceinstaller64.exe enableidd 1 *> $null;
                  Pop-Location;
                  Write-Host "│ ✅ Màn hình ảo VDD sẵn sàng!" -ForegroundColor Green;
              }
          } catch {}

          # 2. Card âm thanh ảo (Xử lý không chặn / Non-blocking chống treo pnputil)
          try {
              @('MMCSS', 'AudioEndpointBuilder', 'Audiosrv') | ForEach-Object {
                  Set-Service -Name $_ -StartupType Automatic -ErrorAction SilentlyContinue;
                  Start-Service -Name $_ -ErrorAction SilentlyContinue;
              };
              $vbZip = "$env:TEMP\VBCable.zip";
              & curl.exe -L --retry 2 --connect-timeout 10 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -o "$vbZip" 2>$null;
              if (Test-Path "$vbZip") {
                  Expand-Archive -Path "$vbZip" -DestinationPath 'C:\VBCable' -Force;
                  $setupExe = 'C:\VBCable\VBCABLE_Setup_x64.exe';
                  if (Test-Path "$setupExe") {
                      Start-Process -FilePath "$setupExe" -ArgumentList '-i', '-h' -WindowStyle Hidden;
                      Start-Sleep -Seconds 1;
                  }
              }
              Write-Host "│ ✅ Card âm thanh ảo sẵn sàng!" -ForegroundColor Green;
          } catch {}

          # 3. Sunshine Streaming Server (Cài siêu tốc qua MSI chính thức ~3s, KHÔNG dùng choco)
          try {
              $sunMsi = "$env:TEMP\Sunshine.msi";
              Write-Host "│ ⬇️ Đang tải Sunshine MSI chính thức từ GitHub..." -ForegroundColor Cyan;
              & curl.exe -L --retry 3 --connect-timeout 15 'https://github.com/LizardByte/Sunshine/releases/download/v2026.914.233613/Sunshine-Windows-AMD64-installer.msi' -o "$sunMsi" 2>$null;
              if (Test-Path "$sunMsi") {
                  Start-Process msiexec.exe -ArgumentList "/i `"$sunMsi`" /qn /norestart" -Wait;
                  Start-Sleep -Seconds 2;
              } else {
                  choco install sunshine -y --no-progress --limit-output;
              }

              $sunshineExe = 'C:\Program Files\Sunshine\sunshine.exe';
              if (Test-Path "$sunshineExe") {
                  & "$sunshineExe" --creds zenova Zenova@2026 2>&1 | Out-Null;
              }
              Set-Service -Name 'SunshineService' -StartupType Automatic -ErrorAction SilentlyContinue;
              Start-Service -Name 'SunshineService' -ErrorAction SilentlyContinue;
              Write-Host "│ ✅ Sunshine Streaming Server sẵn sàng tại cổng 47990!" -ForegroundColor Green;
          } catch {
              Write-Host "│ ⚠️ Lỗi cài Sunshine: $($_.Exception.Message)" -ForegroundColor Yellow;
          }

          # 4. Cấu hình độ phân giải 1920x1080 (Full HD) giúp StarDesk & GameViewer kết nối siêu tốc
          try {
              if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
                  Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction SilentlyContinue;
              }
              Get-ChildItem -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Video' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -eq '0000' } | ForEach-Object {
                  Set-ItemProperty -Path $_.PSPath -Name 'DefaultSettings.XResolution' -Value 1920 -Type DWord -Force -ErrorAction SilentlyContinue;
                  Set-ItemProperty -Path $_.PSPath -Name 'DefaultSettings.YResolution' -Value 1080 -Type DWord -Force -ErrorAction SilentlyContinue;
              };
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'LogPixels' -Value 96 -Type DWord -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'Win8DpiScaling' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
              Write-Host "│ ✅ Đã chuẩn hóa độ phân giải 1920x1080 cho StarDesk/Sunshine!" -ForegroundColor Green;
          } catch {}

          Write-Host "✅ Cài đặt Driver Màn Hình Ảo, Card Âm Thanh & Sunshine hoàn tất!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;
      - name: 📦 Cài đặt trọn bộ App (Discord, Spotify, Bandicam, EVKey, Roblox, StarDesk Trung) & Hình Nền
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "📦 CÀI ĐẶT NHANH TRỌN BỘ APP, TẠO TUNNEL PUBLIC & ÁP DỤNG HÌNH NỀN..." -ForegroundColor Cyan;
          $appsFolder = "$($env:MOUNT_LETTER):\Apps";
          New-Item -ItemType Directory -Force -Path "$appsFolder" -ErrorAction SilentlyContinue | Out-Null;

          # ─────────────────────────────────────────────────────────────
          # 1. HÌNH NỀN ZENOVA CLOUD AURORA LAKE (ÁP DỤNG ALL MÁY & ALL USER)
          # ─────────────────────────────────────────────────────────────
          Write-Host "│ 🖼️ Áp dụng hình nền Zenova Cloud Aurora Lake cho toàn bộ người dùng..." -ForegroundColor Cyan;
          $wpUrl = "https://raw.githubusercontent.com/Dunghoang397/rdp-freeee/2715203b1462985959767187a585efb637441f9f/Zenova%20Cloud%20Aurora%20Lake.png";
          $wpFile = "C:\Windows\Web\Wallpaper\Zenova.png";
          $wpDir = "C:\Windows\Web\Wallpaper";
          New-Item -ItemType Directory -Force -Path "$wpDir" -ErrorAction SilentlyContinue | Out-Null;

          & curl.exe -L --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "$wpUrl" -o "$wpFile" 2>$null;
          if ((-not (Test-Path "$wpFile")) -or ((Get-Item "$wpFile").Length -lt 10KB)) {
              Invoke-WebRequest -Uri "$wpUrl" -OutFile "$wpFile" -UseBasicParsing -TimeoutSec 30 -ErrorAction SilentlyContinue;
          }

          if (Test-Path "$wpFile") {
              # Ghi đè hình nền mặc định Windows (img0.jpg)
              $winWp = "C:\Windows\Web\Wallpaper\Windows\img0.jpg";
              try {
                  takeown /f "$winWp" /a *> $null;
                  icacls "$winWp" /grant Everyone:F *> $null;
                  Copy-Item -Path "$wpFile" -Destination "$winWp" -Force -ErrorAction SilentlyContinue;
              } catch {}

              # Default profile cho user mới
              try {
                  reg load HKU\DefaultUser C:\Users\Default\NTUSER.DAT *> $null;
                  Set-ItemProperty -Path 'HKU:\DefaultUser\Control Panel\Desktop' -Name Wallpaper -Value "$wpFile" -Force -ErrorAction SilentlyContinue;
                  Set-ItemProperty -Path 'HKU:\DefaultUser\Control Panel\Desktop' -Name WallpaperStyle -Value "10" -Force -ErrorAction SilentlyContinue;
                  reg unload HKU\DefaultUser *> $null;
              } catch {}

              # Chính sách hệ thống HKLM Personalization
              $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization';
              New-Item -Path "$policyPath" -Force -ErrorAction SilentlyContinue | Out-Null;
              Set-ItemProperty -Path "$policyPath" -Name 'LockScreenImage' -Value "$wpFile" -Force -ErrorAction SilentlyContinue;

              $cspPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP';
              New-Item -Path "$cspPath" -Force -ErrorAction SilentlyContinue | Out-Null;
              Set-ItemProperty -Path "$cspPath" -Name 'DesktopImagePath' -Value "$wpFile" -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path "$cspPath" -Name 'DesktopImageUrl' -Value "$wpFile" -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path "$cspPath" -Name 'DesktopImageStatus' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue;

              # Áp dụng cho HKCU và gọi Win32 API
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value "$wpFile" -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "10" -Force -ErrorAction SilentlyContinue;
              try {
                  $setterCode = 'using System; using System.Runtime.InteropServices; public class ZenovaWallpaper { [DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); public static void Set(string path) { SystemParametersInfo(20, 0, path, 0x01 | 0x02); } }';
                  Add-Type -TypeDefinition $setterCode -ErrorAction SilentlyContinue;
                  [ZenovaWallpaper]::Set("$wpFile");
              } catch {}
              Write-Host "│ ✅ Đã áp dụng hình nền Zenova Cloud Aurora Lake thành công!" -ForegroundColor Green;
          }

          # ─────────────────────────────────────────────────────────────
          # 2. KHỞI CHẠY WEB SERVER (PORT 8080) & DUAL TUNNELS (CLOUDFLARE + LOCALTUNNEL)
          # ─────────────────────────────────────────────────────────────
          Write-Host "│ 🌐 Đang kích hoạt Web Server (Port 8080) & tạo Link Public..." -ForegroundColor Cyan;
          $webDir = 'C:\zenova-web';
          New-Item -ItemType Directory -Force -Path $webDir -ErrorAction SilentlyContinue | Out-Null;
          $webScript = [System.IO.Path]::Combine($webDir, 'server.ps1');
          $b64 = '';
          $bytes = [Convert]::FromBase64String($b64);
          [System.IO.File]::WriteAllBytes($webScript, $bytes);

          # Chạy Web Server ngay để port 8080 lắng nghe
          Start-Process pwsh.exe -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', "`"$webScript`"", '-Port', "$env:WEB_PORT", '-SignalFile', "`"$env:CONTROL_SIGNAL_FILE`"";

          # Tunnel 1: Cloudflare Tunnel
          $cfExe = 'C:\cloudflared.exe';
          try {
              & curl.exe -L --retry 3 --connect-timeout 20 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -o "$cfExe" 2>$null;
              if (Test-Path "$cfExe") {
                  Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url http://127.0.0.1:8080 --logfile C:\cloudflared-web.log" -WindowStyle Hidden;
                  Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url https://127.0.0.1:47990 --no-tls-verify --logfile C:\cloudflared-sunshine.log" -WindowStyle Hidden;
              }
          } catch {}

          # Tunnel 2: Localtunnel dự phòng siêu tốc
          try {
              Start-Process cmd -ArgumentList "/c npx -y localtunnel --port 8080 > C:\localtunnel.log 2>&1" -WindowStyle Hidden;
          } catch {}

          # ─────────────────────────────────────────────────────────────
          # 3. CÀI ĐẶT STARDESK TRUNG (1.5.3) & NETEASE GAMEVIEWER (4.43.1)
          # ─────────────────────────────────────────────────────────────
          Write-Host "│ 🌟 Tải và cài đặt StarDesk Trung & NetEase GameViewer..." -ForegroundColor Cyan;
          $sdInstaller = 'C:\StarDesk_1.5.3.exe';
          $gvInstaller = 'C:\uuyc_4.43.1.exe';

          & curl.exe -L --retry 3 --connect-timeout 30 -A "Mozilla/5.0" "https://github.com/ddvdat-glitch/abcd/releases/download/app/StarDesk_1.5.3.exe" -o "$sdInstaller" 2>$null;
          & curl.exe -L --retry 3 --connect-timeout 30 -A "Mozilla/5.0" "https://github.com/ddvdat-glitch/abcd/releases/download/app/uuyc_4.43.1.exe" -o "$gvInstaller" 2>$null;

          # Cài đặt GameViewer
          if (Test-Path "$gvInstaller") {
              Start-Process -FilePath "$gvInstaller" -ArgumentList '/S' -Wait;
              Get-Service -Name '*GameViewer*' -ErrorAction SilentlyContinue | Set-Service -StartupType Automatic;
              Get-Service -Name '*GameViewer*' -ErrorAction SilentlyContinue | Start-Service;

              $gvServer = 'C:\Program Files\Netease\GameViewer\bin\GameViewerServer.exe';
              $gvApp    = 'C:\Program Files\Netease\GameViewer\bin\GameViewer.exe';
              if (Test-Path "$gvServer") { Start-Process "$gvServer" -WorkingDirectory 'C:\Program Files\Netease\GameViewer\bin' -ErrorAction SilentlyContinue; }
              if (Test-Path "$gvApp") {
                  & schtasks.exe /Create /TN "Zenova-GameViewer" /TR "`"$gvApp`"" /SC ONCE /ST 00:00 /RU runneradmin /RL HIGHEST /IT /F *> $null;
                  & schtasks.exe /Run /TN "Zenova-GameViewer" *> $null;
                  Start-Process -FilePath "$gvApp" -WorkingDirectory 'C:\Program Files\Netease\GameViewer\bin' -ErrorAction SilentlyContinue;
                  Start-Sleep -Seconds 1;
                  Get-Process -Name 'GameViewer*' -ErrorAction SilentlyContinue | ForEach-Object { $_.PriorityClass = [System.Diagnostics.ProcessPriorityClass]::High; };
              }
              Write-Host "│ ✅ NetEase GameViewer đã cài đặt & khởi chạy!" -ForegroundColor Green;
          }

          # Cài đặt StarDesk
          if (Test-Path "$sdInstaller") {
              Start-Process -FilePath "$sdInstaller" -ArgumentList '/S' -Wait;
              Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Set-Service -StartupType Automatic;
              Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Start-Service;

              $sdApp = 'C:\Program Files\StarDesk\StarDesk.exe';
              if (Test-Path "$sdApp") {
                  & schtasks.exe /Create /TN "Zenova-StarDesk" /TR "`"$sdApp`"" /SC ONCE /ST 00:00 /RU runneradmin /RL HIGHEST /IT /F *> $null;
                  & schtasks.exe /Run /TN "Zenova-StarDesk" *> $null;
                  Start-Process -FilePath "$sdApp" -WorkingDirectory 'C:\Program Files\StarDesk' -ErrorAction SilentlyContinue;
              }
              Write-Host "│ ✅ StarDesk Trung đã cài đặt & khởi chạy!" -ForegroundColor Green;
          }

          # ─────────────────────────────────────────────────────────────
          # 4. CÀI ĐẶT EVKEY (BỘ GÕ TIẾNG VIỆT SIÊU NHẸ)
          # ─────────────────────────────────────────────────────────────
          Write-Host "│ 🇻🇳 Tải và cài đặt EVKey Tiếng Việt..." -ForegroundColor Cyan;
          try {
              $evZip = "$env:TEMP\EVKey.zip";
              & curl.exe -L --retry 3 --connect-timeout 15 "https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip" -o "$evZip" 2>$null;
              if (Test-Path "$evZip") {
                  $evDir = 'C:\EVKey';
                  Expand-Archive -Path "$evZip" -DestinationPath "$evDir" -Force;
                  $evExe = "$evDir\EVKey64.exe";
                  if (Test-Path "$evExe") {
                      # Khởi chạy EVKey
                      Start-Process -FilePath "$evExe" -WorkingDirectory "$evDir" -ErrorAction SilentlyContinue;
                      # Thêm vào Run registry
                      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'EVKey' -Value "`"$evExe`"" -Force -ErrorAction SilentlyContinue;
                      Write-Host "│ ✅ EVKey đã sẵn sàng!" -ForegroundColor Green;
                  }
              }
          } catch {}

          # ─────────────────────────────────────────────────────────────
          # 5. CÀI ĐẶT DISCORD, SPOTIFY, BANDICAM (CHẠY NỀN SIÊU NHANH)
          # ─────────────────────────────────────────────────────────────
          Write-Host "│ 📦 Khởi động tiến trình cài đặt Discord, Spotify, Bandicam chạy ngầm..." -ForegroundColor Cyan;
          Start-Process powershell -ArgumentList "-NoProfile", "-Command", "choco install bandicam spotify discord -y --no-progress --limit-output" -WindowStyle Hidden;

          # ─────────────────────────────────────────────────────────────
          # 6. CÀI ĐẶT ROBLOX & FIX TƯƠNG THÍCH ĐỒ HỌA
          # ─────────────────────────────────────────────────────────────
          Write-Host "│ 🎮 Cài đặt Roblox Launcher & Fix tương thích DirectX 11..." -ForegroundColor Cyan;
          try {
              $rbxInstaller = "$env:TEMP\RobloxPlayerLauncher.exe";
              & curl.exe -L --retry 3 --connect-timeout 20 "https://setup.rbxcdn.com/RobloxPlayerLauncher.exe" -o "$rbxInstaller" 2>$null;
              if (Test-Path "$rbxInstaller") {
                  Start-Process -FilePath "$rbxInstaller" -ErrorAction SilentlyContinue;
              }

              # Fix Roblox Registry & Compatibility
              $appCompat = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers";
              New-Item -Path $appCompat -Force -ErrorAction SilentlyContinue | Out-Null;

              $robReg = "HKCU:\Software\Roblox\RobloxApp";
              New-Item -Path $robReg -Force -ErrorAction SilentlyContinue | Out-Null;
              Set-ItemProperty -Path $robReg -Name 'FFlagDebugGraphicsDisableDirect3D11' -Value 'false' -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path $robReg -Name 'FFlagDebugGraphicsPreferD3D11' -Value 'true' -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path $robReg -Name 'FFlagDebugGraphicsPreferOpenGL' -Value 'false' -Force -ErrorAction SilentlyContinue;

              # Quét thư mục Roblox để thêm layer WIN8RTM HIGHDPIAWARE
              @("C:\Program Files (x86)\Roblox", "$env:LOCALAPPDATA\Roblox", "C:\Users\zenova\AppData\Local\Roblox") | ForEach-Object {
                  if (Test-Path "$_") {
                      Get-ChildItem -Path "$_" -Filter 'RobloxPlayerBeta.exe' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                          Set-ItemProperty -Path $appCompat -Name ($_.FullName) -Value '~ HIGHDPIAWARE RUNASADMIN WIN8RTM' -Force -ErrorAction SilentlyContinue;
                      };
                  }
              };
              Write-Host "│ ✅ Đã áp dụng Fix tương thích Roblox hoàn tất!" -ForegroundColor Green;
          } catch {}

          # 7. Cài thêm gói choco phụ nếu người dùng nhập
          if ("${{ github.event.inputs.choco_packages }}") {
              $extra = "${{ github.event.inputs.choco_packages }}";
              try { choco install $extra -y --no-progress --limit-output; } catch {}
          }

          Write-Host "✅ Toàn bộ ứng dụng cốt lõi đã được cài đặt thần tốc!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 9. THIẾT LẬP MÃ PIN STARDESK TRUNG & LẤY DEVICE ID
      # ─────────────────────────────────────────────────────────────
      - name: 🔑 Cấu hình PIN StarDesk Trung & Lấy Device ID
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🔍 Đang trích xuất ID StarDesk Trung / GameViewer..." -ForegroundColor Cyan;
          $gvCli = 'C:\Program Files\Netease\GameViewer\bin\uuyc-cli.exe';

          $sdId = "$env:STARDESK_ID_INPUT";
          $sdPin = "$env:INPUT_PIN_CODE";
          if ([string]::IsNullOrWhiteSpace("$sdPin")) { $sdPin = "Zenova2026"; }
          $cleanPin = ($sdPin -replace '[^A-Za-z0-9]', '');
          if (($cleanPin.Length -lt 8) -or ($cleanPin.Length -gt 16) -or ($cleanPin -notmatch '[A-Za-z]') -or ($cleanPin -notmatch '[0-9]')) {
              $cleanPin = 'Zenova2026';
          }

          # Cài đặt mã PIN cho CLI GameViewer / StarDesk
          if (Test-Path "$gvCli") {
              for ($i = 0; $i -lt 15; $i++) {
                  $echo = & "$gvCli" echo 2>$null;
                  if ($echo -match 'hello') { break; }
                  Start-Sleep -Seconds 1;
              }
              & "$gvCli" -c "$cleanPin" *> $null;

              if ([string]::IsNullOrWhiteSpace("$sdId")) {
                  for ($i = 0; $i -lt 25; $i++) {
                      $cliOut = & "$gvCli" -d 2>$null;
                      if ($cliOut -match '(\d{6,12})') {
                          $sdId = $Matches[1];
                          break;
                      }
                      Start-Sleep -Seconds 2;
                  }
              }
          }

          if ([string]::IsNullOrWhiteSpace("$sdId")) {
              $sdId = "(Đang kết nối đám mây - sẽ tự cập nhật)";
          }

          # Lưu vào file để Web Quản Lý và keepalive đọc
          Set-Content -Path "C:\stardesk-id.txt" -Value "$sdId" -Force;
          Set-Content -Path "C:\stardesk-pin.txt" -Value "$cleanPin" -Force;

          "STARDESK_ID=$sdId" >> "$env:GITHUB_ENV";
          "STARDESK_PIN=$cleanPin" >> "$env:GITHUB_ENV";

          Write-Host "│ 🌟 StarDesk Trung / GameViewer ID : $sdId" -ForegroundColor Yellow;
          Write-Host "│ 🔑 StarDesk Trung / GameViewer PIN: $cleanPin" -ForegroundColor Yellow;

          if ($sdId -match '^\d+$') {
              [Console]::WriteLine("::notice title=STARDESK TRUNG THÀNH CÔNG::ID=$sdId | PIN=$cleanPin | Sẵn sàng kết nối");
          }

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 10. TẠO CÁC PHÍM TẮT TIỆN ÍCH (NGAT-VPS, NGAT-RDP-GIU-MAN-HINH, WEB)
      # ─────────────────────────────────────────────────────────────
      - name: 🖥️ Tạo các phím tắt tiện ích trên Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🖥️ Đang tạo các tiện ích Desktop và phím tắt ngắt VPS..." -ForegroundColor Cyan;

          # 1. Script NGAT-RDP-GIU-MAN-HINH-SUNSHINE.bat
          $ngatRdpLines = @(
              "@echo off",
              "echo ============================================================",
              "echo  DANG CHUYEN SESSION VE CONSOLE CHO SUNSHINE & STARDESK...",
              "echo ============================================================",
              "for /f ""skip=1 tokens=3"" %%s in ('query user %USERNAME%') do tscon %%s /dest:console",
              "for /f ""skip=1 tokens=2"" %%s in ('query user %USERNAME%') do tscon %%s /dest:console",
              "echo [OK] Da chuyen man hinh ve Console! Sunshine & StarDesk tiep tuc hoat dong!",
              "timeout /t 3"
          );
          $ngatRdpPath = "C:\NGAT-RDP-GIU-MAN-HINH-SUNSHINE.bat";
          Set-Content -Path $ngatRdpPath -Value ($ngatRdpLines -join "`r`n") -Encoding ASCII;

          # 2. Script NGAT-VPS.bat có xác nhận (Chống bấm nhầm tự tắt máy)
          $ngatVpsLines = @(
              "@echo off",
              "color 0C",
              "echo ============================================================",
              "echo        CANH BAO: XAC NHAN TAT MAY VA LUU DU LIEU",
              "echo ============================================================",
              "echo.",
              "echo Ban co thuc su muon DUNG MAY VPS Zenova khong?",
              "echo - Nhan phim Y (Yes) de xac nhan tat may.",
              "echo - Nhan phim N hoac DONG cua so nay de HUY BO.",
              "echo.",
              "set /p confirm=Nhap lua chon cua ban (Y/N): ",
              "if /i ""%confirm%"" neq ""Y"" (",
              "    echo [HUY BO] May tiep tuc hoat dong binh thuong!",
              "    timeout /t 3",
              "    exit /b",
              ")",
              "echo Dang gui lenh luu toan bo du lieu va ngat VPS...",
              "curl.exe -X POST http://127.0.0.1:8080/api/cmd -H ""Content-Type: application/json"" -d ""{\""cmd\"":\""STOP_SESSION\""}""",
              "timeout /t 5",
              "shutdown /s /t 2"
          );
          $ngatVpsPath = "C:\NGAT-VPS.bat";
          Set-Content -Path $ngatVpsPath -Value ($ngatVpsLines -join "`r`n") -Encoding ASCII;

          # 3. Script LUU-DU-LIEU-NGAY.bat
          $luuLines = @(
              "@echo off",
              "echo ============================================================",
              "echo  DANG GUI LENH LUU DU LIEU NGAY LEN GITHUB RELEASE...",
              "echo ============================================================",
              "curl.exe -X POST http://127.0.0.1:8080/api/cmd -H ""Content-Type: application/json"" -d ""{\""cmd\"":\""SAVE_NOW\""}""",
              "echo Da gui lenh luu thanh cong!",
              "timeout /t 3"
          );
          $luuPath = "C:\LUU-DU-LIEU-NGAY.bat";
          Set-Content -Path $luuPath -Value ($luuLines -join "`r`n") -Encoding ASCII;

          # 4. Tạo Shortcuts ra Desktop của user zenova, runneradmin và Public
          try {
              $desktopDirs = @("C:\Users\zenova\Desktop", "C:\Users\runneradmin\Desktop", "C:\Users\Public\Desktop");
              $ws = New-Object -ComObject WScript.Shell;
              foreach ($d in $desktopDirs) {
                  New-Item -ItemType Directory -Force -Path $d -ErrorAction SilentlyContinue | Out-Null;

                  $lnk1 = $ws.CreateShortcut("$d\NGAT-RDP-GIU-MAN-HINH-SUNSHINE.lnk");
                  $lnk1.TargetPath = $ngatRdpPath;
                  $lnk1.IconLocation = "shell32.dll,48";
                  $lnk1.Save();

                  $lnk2 = $ws.CreateShortcut("$d\🛑_TAT-VPS_(Can-than-khi-bam).lnk");
                  $lnk2.TargetPath = $ngatVpsPath;
                  $lnk2.IconLocation = "shell32.dll,27";
                  $lnk2.Save();

                  $lnk3 = $ws.CreateShortcut("$d\LUU-DU-LIEU-NGAY.lnk");
                  $lnk3.TargetPath = $luuPath;
                  $lnk3.IconLocation = "shell32.dll,258";
                  $lnk3.Save();

                  $lnk4 = $ws.CreateShortcut("$d\WEB-QUAN-LY-VPS.url");
                  $lnk4.TargetPath = "http://127.0.0.1:8080/";
                  $lnk4.Save();

                  $lnk5 = $ws.CreateShortcut("$d\SUNSHINE-STREAMING.url");
                  $lnk5.TargetPath = "https://localhost:47990/";
                  $lnk5.Save();

                  $lnk6 = $ws.CreateShortcut("$d\O-DIA-RIENG-ZENOVA.lnk");
                  $lnk6.TargetPath = "$($env:MOUNT_LETTER):\";
                  $lnk6.Save();

                  # Shortcut EVKey
                  if (Test-Path "C:\EVKey\EVKey64.exe") {
                      $lnkEv = $ws.CreateShortcut("$d\EVKey.lnk");
                      $lnkEv.TargetPath = "C:\EVKey\EVKey64.exe";
                      $lnkEv.Save();
                  }

                  # Shortcut StarDesk Trung
                  if (Test-Path "C:\Program Files\StarDesk\StarDesk.exe") {
                      $lnkSd = $ws.CreateShortcut("$d\StarDesk-Trung.lnk");
                      $lnkSd.TargetPath = "C:\Program Files\StarDesk\StarDesk.exe";
                      $lnkSd.Save();
                  }

                  # Shortcut GameViewer
                  if (Test-Path "C:\Program Files\Netease\GameViewer\bin\GameViewer.exe") {
                      $lnkGv = $ws.CreateShortcut("$d\GameViewer.lnk");
                      $lnkGv.TargetPath = "C:\Program Files\Netease\GameViewer\bin\GameViewer.exe";
                      $lnkGv.Save();
                  }
              }
          } catch {}

          'SESSION_READY=1' >> "$env:GITHUB_ENV";
          Write-Host "✅ Đã tạo đầy đủ các phím tắt tiện ích và ngắt VPS trên Desktop!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 11. KIỂM TRA TRẠNG THÁI WEB QUẢN LÝ VPS (PORT 8080)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Kiểm tra trạng thái Web Quản Lý VPS (Port 8080)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🌐 Đang kiểm tra Web Quản Lý VPS (Port 8080)..." -ForegroundColor Cyan;
          $webScript = 'C:\zenova-web\server.ps1';
          $running = $false;
          try {
              $test = Invoke-WebRequest -Uri "http://127.0.0.1:$env:WEB_PORT" -UseBasicParsing -TimeoutSec 3 -ErrorAction SilentlyContinue;
              if ($test.StatusCode -eq 200) { $running = $true; }
          } catch {}

          if (-not $running) {
              Write-Host "│ 🔄 Đang khởi động Web Server..." -ForegroundColor Yellow;
              if (Test-Path "$webScript") {
                  Start-Process pwsh.exe -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', "`"$webScript`"", '-Port', "$env:WEB_PORT", '-SignalFile', "`"$env:CONTROL_SIGNAL_FILE`"";
                  Start-Sleep -Seconds 2;
              }
          }
          Write-Host "│ ✅ Web Quản Lý VPS đang trực tuyến tại cổng $env:WEB_PORT!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;
      # 12. IN THÔNG TIN KẾT NỐI TOÀN DIỆN & STEP SUMMARY
      # ─────────────────────────────────────────────────────────────
      # ─────────────────────────────────────────────────────────────
      # 12. IN THÔNG TIN KẾT NỐI TOÀN DIỆN & STEP SUMMARY
      # ─────────────────────────────────────────────────────────────
      - name: 🎉 Thông tin kết nối Zenova VPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;

          # Lấy URLs Public cho Web Quản Lý (Cloudflare & Localtunnel)
          $cfWeb = "";
          $cfSunshine = "";
          $ltWeb = "";

          for ($i = 0; $i -lt 15; $i++) {
              if (Test-Path "C:\cloudflared-web.log") {
                  $log = Get-Content -Path "C:\cloudflared-web.log" -Raw -ErrorAction SilentlyContinue;
                  if ($log -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                      $cfWeb = $Matches[0];
                      Set-Content -Path "C:\cloudflared-web-url.txt" -Value "$cfWeb" -Force;
                  }
              }
              if (Test-Path "C:\cloudflared-sunshine.log") {
                  $logS = Get-Content -Path "C:\cloudflared-sunshine.log" -Raw -ErrorAction SilentlyContinue;
                  if ($logS -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                      $cfSunshine = $Matches[0];
                      Set-Content -Path "C:\cloudflared-sunshine-url.txt" -Value "$cfSunshine" -Force;
                  }
              }
              if (Test-Path "C:\localtunnel.log") {
                  $logL = Get-Content -Path "C:\localtunnel.log" -Raw -ErrorAction SilentlyContinue;
                  if ($logL -match 'https://[a-zA-Z0-9-]+\.loca\.lt') {
                      $ltWeb = $Matches[0];
                      Set-Content -Path "C:\localtunnel-web-url.txt" -Value "$ltWeb" -Force;
                  }
              }
              if (($cfWeb -or $ltWeb) -and $cfSunshine) { break; }
              Start-Sleep -Seconds 1;
          }

          $publicWeb = if ($cfWeb) { $cfWeb } elseif ($ltWeb) { $ltWeb } else { "http://127.0.0.1:8080" };
          $publicSun = if ($cfSunshine) { $cfSunshine } else { "https://127.0.0.1:47990" };

          $sdId = if (Test-Path "C:\stardesk-id.txt") { (Get-Content "C:\stardesk-id.txt" -Raw).Trim() } else { "$env:STARDESK_ID" };
          $sdPin = if (Test-Path "C:\stardesk-pin.txt") { (Get-Content "C:\stardesk-pin.txt" -Raw).Trim() } else { "$env:STARDESK_PIN" };
          $ngrokRdp = if (Test-Path "C:\rdp-ngrok.txt") { (Get-Content "C:\rdp-ngrok.txt" -Raw).Trim() } else { "" };
          $pubIp = if (Test-Path "C:\machine-ip.txt") { (Get-Content "C:\machine-ip.txt" -Raw).Trim() } else { "Đang lấy..." };
          $tsIp = if ($env:TAILSCALE_IP) { $env:TAILSCALE_IP } else { "127.0.0.1" };
          $pass = "$env:FIXED_PASSWORD";

          $rdpTarget = if ($ngrokRdp) { $ngrokRdp } elseif ($tsIp -and ($tsIp -ne "127.0.0.1")) { "$tsIp:3389" } else { "$pubIp:3389 (Cần mở Port/Ngrok)" };

          Write-Host ""
          Write-Host "======================================================================" -ForegroundColor Cyan
          Write-Host "                🎉 ZENOVA ULTIMATE VPS ĐÃ KHỞI CHẠY!                   " -ForegroundColor Yellow
          Write-Host "======================================================================" -ForegroundColor Cyan
          Write-Host "🌐 WEB QUẢN LÝ (PUBLIC) : $publicWeb" -ForegroundColor Green
          Write-Host "☀️ SUNSHINE STREAM (WEB) : $publicSun" -ForegroundColor Green
          Write-Host "----------------------------------------------------------------------" -ForegroundColor Gray
          Write-Host "🌟 1. STARDESK TRUNG (GAMEVIEWER) - 60-120 FPS KHÔNG ĐỘ TRỄ:" -ForegroundColor Yellow
          Write-Host "   - Device ID : $sdId" -ForegroundColor White
          Write-Host "   - Mã PIN    : $sdPin" -ForegroundColor White
          Write-Host "   - Cách dùng : Mở StarDesk/GameViewer -> Nhập ID & PIN -> Vào ngay!" -ForegroundColor Gray
          Write-Host "----------------------------------------------------------------------" -ForegroundColor Gray
          Write-Host "🖥️ 2. WINDOWS REMOTE DESKTOP (RDP):" -ForegroundColor Yellow
          Write-Host "   - Địa chỉ   : $rdpTarget" -ForegroundColor White
          Write-Host "   - User      : zenova (hoặc runneradmin)" -ForegroundColor White
          Write-Host "   - Password  : $pass" -ForegroundColor White
          Write-Host "   - IP Public : $pubIp" -ForegroundColor Gray
          Write-Host "----------------------------------------------------------------------" -ForegroundColor Gray
          Write-Host "☀️ 3. SUNSHINE STREAMING:" -ForegroundColor Yellow
          Write-Host "   - Web UI    : $publicSun" -ForegroundColor White
          Write-Host "   - User      : zenova (hoặc runneradmin)" -ForegroundColor White
          Write-Host "   - Password  : $pass" -ForegroundColor White
          Write-Host "======================================================================" -ForegroundColor Cyan

          # Ghi vào GitHub Actions Step Summary
          $sb = New-Object System.Text.StringBuilder;
          [void]$sb.AppendLine('# 🚀 ZENOVA ULTIMATE VPS - THÔNG TIN KẾT NỐI');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 🌐 1. Trang Quản Lý VPS (Port 8080)');
          [void]$sb.AppendLine("- **Link Public Trực Tiếp**: [$publicWeb]($publicWeb)");
          [void]$sb.AppendLine("- **Tailscale**: http://" + $tsIp + ":8080");
          [void]$sb.AppendLine('- **Local**: http://127.0.0.1:8080');
          [void]$sb.AppendLine('- **Tính năng**: Lưu dữ liệu ngay (Save Now), Khởi động lại phiên (Restart), Ngắt VPS (Stop)!');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 🌟 2. Kết Nối Qua StarDesk Trung / GameViewer (Cực Nhanh, Không Lag)');
          [void]$sb.AppendLine('| Thông Số | Giá Trị |');
          [void]$sb.AppendLine('|---|---|');
          [void]$sb.AppendLine("| **Device ID** | **$sdId** |");
          [void]$sb.AppendLine("| **Mã PIN** | **$sdPin** |");
          [void]$sb.AppendLine('| **Giao thức** | NetEase P2P Hardware Streaming (Direct 60-120fps) |');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 🖥️ 3. Kết Nối Windows Remote Desktop (RDP)');
          [void]$sb.AppendLine('| Thông Số | Giá Trị |');
          [void]$sb.AppendLine('|---|---|');
          [void]$sb.AppendLine("| **Địa chỉ RDP** | **$rdpTarget** |");
          [void]$sb.AppendLine('| **Tài khoản** | zenova (hoặc runneradmin) |');
          [void]$sb.AppendLine("| **Mật khẩu** | $pass |");
          [void]$sb.AppendLine("| **IP Outbound Máy** | $pubIp |");
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### ☀️ 4. Kết Nối Sunshine & Moonlight Streaming');
          [void]$sb.AppendLine('| Thông Số | Giá Trị |');
          [void]$sb.AppendLine('|---|---|');
          [void]$sb.AppendLine("| **Sunshine Web UI** | [$publicSun]($publicSun) |");
          [void]$sb.AppendLine('| **Tài khoản** | zenova (hoặc runneradmin) |');
          [void]$sb.AppendLine("| **Mật khẩu** | $pass |");
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 📦 5. Ứng Dụng Đã Cài Đặt Sẵn');
          [void]$sb.AppendLine('- **Discord**, **Spotify**, **Bandicam**, **EVKey Tiếng Việt**, **Roblox (Fix DirectX 11)**, **Google Chrome**, **StarDesk Trung 1.5.3**, **NetEase GameViewer 4.43.1**.');
          [void]$sb.AppendLine('- **Hình Nền**: Zenova Cloud Aurora Lake áp dụng toàn bộ hệ thống.');
          Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($sb.ToString()) -Encoding UTF8;

          [Console]::WriteLine("::notice title=THÔNG TIN KẾT NỐI ZENOVA VPS::StarDesk ID: $sdId | PIN: $sdPin | RDP: $rdpTarget | Web: $publicWeb");
          $global:LASTEXITCODE = 0;
          exit 0;
      - name: ⏳ Duy trì phiên làm việc & Lắng nghe lệnh Web Panel
        id: keepalive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $totalReq = [long]"$env:TOTAL_MINUTES";
          $sessionMinutes = [Math]::Min($totalReq, 350);
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + ($sessionMinutes * 60);
          $saveScript = "$env:SAVE_SCRIPT_PATH";
          $pushScript = "$env:PUSH_STATE_SCRIPT";
          $sigFile    = "$env:CONTROL_SIGNAL_FILE";
          $gvCli      = 'C:\Program Files\Netease\GameViewer\bin\uuyc-cli.exe';
          $gvApp      = 'C:\Program Files\Netease\GameViewer\bin\GameViewer.exe';
          $sdApp      = 'C:\Program Files\StarDesk\StarDesk.exe';

          Write-Host "🔄 Bắt đầu duy trì phiên làm việc cho máy [$env:MACHINE_ID]..." -ForegroundColor Yellow;
          $lastLog = Get-Date;
          $warned  = $false;

          while ($true) {
              # Kiểm tra lệnh từ Web Quản Lý hoặc NGAT-VPS.bat
              if (Test-Path "$sigFile") {
                  $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim();
                  Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue;

                  if ("$cmd" -eq 'SAVE_NOW') {
                      Write-Host "💾 [WEB-PANEL] Nhận lệnh LƯU NGAY từ Web Quản Lý..." -ForegroundColor Cyan;
                      if (Test-Path "$saveScript") { & "$saveScript" -Reason 'manual-web-save'; }
                  } elseif ("$cmd" -eq 'RESTART_SESSION') {
                      Write-Host "🔁 [WEB-PANEL] Nhận lệnh RESET PHIÊN MỚI từ Web Quản Lý!" -ForegroundColor Yellow;
                      'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV";
                      break;
                  } elseif ("$cmd" -eq 'STOP_SESSION') {
                      Write-Host "🛑 [WEB-PANEL] Nhận lệnh NGẮT VPS từ Web Quản Lý!" -ForegroundColor Red;
                      'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV";
                      break;
                  }
              }

              # Kiểm tra cập nhật StarDesk ID nếu chưa có
              $sdFile = "C:\stardesk-id.txt";
              $curId = if (Test-Path "$sdFile") { (Get-Content "$sdFile" -Raw).Trim() } else { "" };
              if ((-not $curId) -or ($curId -match 'Đang lấy|chưa|Chưa|\(')) {
                  if (Test-Path "$gvCli") {
                      $checkId = & "$gvCli" -d 2>$null;
                      if ($checkId -match '(\d{6,12})') {
                          $newId = $Matches[1];
                          Set-Content -Path "$sdFile" -Value "$newId" -Force;
                          "STARDESK_ID=$newId" >> "$env:GITHUB_ENV";
                          Write-Host "🎉 [KEEPALIVE] ĐÃ LẤY ĐƯỢC ID STARDESK TRUNG: $newId" -ForegroundColor Green;
                          [Console]::WriteLine("::notice title=STARDESK TRUNG ID SẴN SÀNG::ID=$newId | PIN=$env:STARDESK_PIN");
                      }
                  }
              }

              # Kiểm tra cập nhật Public URL Web Quản Lý (Cloudflare hoặc Localtunnel)
              $cfWebFile = "C:\cloudflared-web-url.txt";
              if ((-not (Test-Path "$cfWebFile")) -and (Test-Path "C:\cloudflared-web.log")) {
                  $cfLog = Get-Content -Path "C:\cloudflared-web.log" -Raw -ErrorAction SilentlyContinue;
                  if ($cfLog -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                      Set-Content -Path "$cfWebFile" -Value ($Matches[0]) -Force;
                      Write-Host "🎉 [KEEPALIVE] LINK WEB QUẢN LÝ (CLOUDFLARE): $($Matches[0])" -ForegroundColor Green;
                      [Console]::WriteLine("::notice title=WEB QUẢN LÝ ONLINE::URL=$($Matches[0])");
                  }
              }
              if ((-not (Test-Path "C:\localtunnel-web-url.txt")) -and (Test-Path "C:\localtunnel.log")) {
                  $ltLog = Get-Content -Path "C:\localtunnel.log" -Raw -ErrorAction SilentlyContinue;
                  if ($ltLog -match 'https://[a-zA-Z0-9-]+\.loca\.lt') {
                      Set-Content -Path "C:\localtunnel-web-url.txt" -Value ($Matches[0]) -Force;
                      Write-Host "🎉 [KEEPALIVE] LINK WEB QUẢN LÝ (LOCALTUNNEL): $($Matches[0])" -ForegroundColor Green;
                  }
              }

              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
              $remain = ($endEpoch) - ($now);
              if (($remain) -le 0) {
                  Write-Host "⏰ Hết thời gian phiên làm việc!" -ForegroundColor Yellow;
                  break;
              }

              if ((((Get-Date) - ($lastLog)).TotalMinutes) -ge 5) {
                  $h = [math]::Floor(($remain) / 3600);
                  $m = [math]::Floor((($remain) % 3600) / 60);
                  $displayId = if (Test-Path "$sdFile") { (Get-Content "$sdFile" -Raw).Trim() } else { "Chưa có ID" };
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 📊 [$env:MACHINE_ID] StarDesk ID: $displayId | Còn lại: ${h}h${m}m" -ForegroundColor Blue;
                  $lastLog = Get-Date;

                  # Giữ Sunshine & StarDesk luôn chạy
                  Get-Service -Name '*StarDesk*', '*GameViewer*', 'SunshineService' -ErrorAction SilentlyContinue | Where-Object { $_.Status -ne 'Running' } | ForEach-Object {
                      Start-Service -Name ($_.Name) -ErrorAction SilentlyContinue;
                  };

                  if ((Test-Path "$gvApp") -and (-not (Get-Process -Name 'GameViewer' -ErrorAction SilentlyContinue))) {
                      Start-Process -FilePath "$gvApp" -WorkingDirectory 'C:\Program Files\Netease\GameViewer\bin' -ErrorAction SilentlyContinue;
                  }
                  if ((Test-Path "$sdApp") -and (-not (Get-Process -Name 'StarDesk' -ErrorAction SilentlyContinue))) {
                      Start-Process -FilePath "$sdApp" -WorkingDirectory 'C:\Program Files\StarDesk' -ErrorAction SilentlyContinue;
                  }
              }

              if ((-not ($warned)) -and (($remain) -le 300)) {
                  Write-Host "⏰ [CẢNH BÁO] Phiên Zenova VPS còn 5 phút nữa sẽ hết giờ. Hệ thống sẽ tự động lưu dữ liệu!" -ForegroundColor Yellow;
                  $warned = $true;
              }

              Start-Sleep -Seconds 3;
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 14. LƯU TOÀN BỘ DỮ LIỆU CUỐI PHIÊN LÊN GITHUB RELEASE
      # ─────────────────────────────────────────────────────────────
      - name: 💾 Lưu toàn bộ dữ liệu cuối phiên lên GitHub
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "💾 Đang lưu toàn bộ dữ liệu cuối phiên lên GitHub Release..." -ForegroundColor Yellow;
          $saveScript = "$env:SAVE_SCRIPT_PATH";
          if (Test-Path "$saveScript") {
              & "$saveScript" -Reason 'final-session-save';
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 15. DỌN DẸP HỆ THỐNG
      # ─────────────────────────────────────────────────────────────
      - name: 🧹 Dọn dẹp hệ thống
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🧹 Đang dọn dẹp hệ thống..." -ForegroundColor Yellow;
          @("cloudflared", "GameViewer*", "StarDesk*", "sunshine") | ForEach-Object {
              Get-Process -Name $_ -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
          };
          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore');
          if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue; }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 16. KÍCH HOẠT PHIÊN TIẾP THEO (TỰ KHỞI ĐỘNG LIÊN TỤC)
      # ─────────────────────────────────────────────────────────────
      - name: 🔁 Kích hoạt phiên tiếp theo & Mở lại ổ đĩa
        if: always()
        shell: pwsh
        env:
          AUTO_RESTART: ${{ github.event.inputs.auto_restart }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          if ("$env:FORCE_STOP_ONLY" -eq '1') {
              Write-Host "🛑 Đã nhận lệnh NGẮT VPS từ người dùng. Không khởi động phiên tiếp theo." -ForegroundColor Yellow;
              exit 0;
          }
          $auto = "$env:AUTO_RESTART";
          $forceNext = "$env:FORCE_NEXT_SESSION";
          if (($auto -eq 'true') -or ($forceNext -eq '1')) {
              Write-Host "🔁 Đang kích hoạt phiên làm việc tiếp theo..." -ForegroundColor Cyan;
              try {
                  $wfFile = if ($env:GITHUB_WORKFLOW_REF) { ($env:GITHUB_WORKFLOW_REF -split '@')[0] -replace '^.*\.github/workflows/', '' } else { 'zenova-ultimate.yml' };
              if ([string]::IsNullOrWhiteSpace("$wfFile")) { $wfFile = 'zenova-ultimate.yml'; }
              gh workflow run "$wfFile" --repo "$env:RUNNER_REPO" `
                      -f machine_id="$env:MACHINE_ID" `
                      -f duration="${{ github.event.inputs.duration }}" `
                      -f auto_restart="true" `
                      -f fixed_password="$env:FIXED_PASSWORD" `
                      -f pin_code="$env:INPUT_PIN_CODE" `
                      -f drive_letter="$env:MOUNT_LETTER" `
                      -f vhd_size_gb="$env:VHD_SIZE_GB" `
                      -f windows_image="${{ github.event.inputs.windows_image }}" 2>&1 | Out-Null;
                  Write-Host "✅ Đã gửi lệnh kích hoạt phiên tiếp theo thành công!" -ForegroundColor Green;
              } catch {
                  Write-Host "⚠️ Không thể kích hoạt tự động: $($_.Exception.Message)" -ForegroundColor Yellow;
              }
          }
          $global:LASTEXITCODE = 0;
          exit 0;

  # =========================================================================
  # JOB 2: ZENOVA LINUX RUNNER (XFCE4 + XRDP + TAILSCALE + WEB PANEL)
  # =========================================================================
  Zenova-Linux:
    name: 🐧 Linux VPS (XFCE4 + XRDP + Web Quản Lý)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.os_type == 'linux' || github.event.inputs.os_type == 'both' }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      STORAGE_GH_TOKEN: ${{ secrets.STORAGE_GH_TOKEN || secrets.PAT_TOKEN || github.token }}
      STORAGE_REPO: ${{ github.event.inputs.storage_repo || github.repository }}
      RUNNER_GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      RUNNER_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-linux-1' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || github.event.inputs.machine_id || 'Zenova Linux Machine' }}
      WEB_PORT: '8080'
      FIXED_PASSWORD: ${{ github.event.inputs.fixed_password || 'Zenova@2026' }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. KHỞI TẠO MÔI TRƯỜNG LINUX & CHUẨN BỊ THÔNG SỐ
      # ─────────────────────────────────────────────────────────────
      - name: 🐧 Khởi tạo môi trường Linux & Chuẩn bị thông số
        run: |
          NOW=$(date +%s)
          echo "JOB_START_EPOCH=$NOW" >> $GITHUB_ENV
          CLEAN_ID=$(echo "$MACHINE_ID" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-')
          [ -z "$CLEAN_ID" ] && CLEAN_ID="zenova-linux-1"
          echo "MACHINE_ID=$CLEAN_ID" >> $GITHUB_ENV
          REL_TAG="zenova-storage-linux-$CLEAN_ID"
          echo "RELEASE_TAG=$REL_TAG" >> $GITHUB_ENV

          # Parse thời lượng
          TOTAL=1440
          case "${{ github.event.inputs.duration }}" in
            "1h") TOTAL=60 ;;
            "3h") TOTAL=180 ;;
            "5h") TOTAL=300 ;;
            "6h") TOTAL=360 ;;
            "12h") TOTAL=720 ;;
            "24h") TOTAL=1440 ;;
          esac
          echo "TOTAL_MINUTES=$TOTAL" >> $GITHUB_ENV

          # Đảm bảo Release tồn tại
          if ! gh release view "$REL_TAG" --repo "$STORAGE_REPO" >/dev/null 2>&1; then
            echo "Init Linux Storage" > /tmp/init-linux.txt
            gh release create "$REL_TAG" /tmp/init-linux.txt --repo "$STORAGE_REPO" --title "Zenova Linux Storage ($CLEAN_ID)" --notes "Bản lưu trữ tự động cho máy Linux [$CLEAN_ID]" || true
          fi
          echo "✅ Môi trường Linux đã chuẩn bị xong!"

      # ─────────────────────────────────────────────────────────────
      # 2. TẠO SCRIPT LƯU TRỮ DỮ LIỆU LINUX
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script lưu trữ dữ liệu Linux
        run: |
          cat << 'EOF' > /tmp/save-linux-data.sh
          #!/usr/bin/env bash
          echo "💾 Đang lưu dữ liệu Linux..."
          STAGE="/tmp/linux-save-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # Sao lưu thư mục người dùng
          rsync -a --exclude='.cache' --exclude='.local/share/Trash' /home/runner/ "$STAGE/home_runner/" || true
          ARCHIVE="/tmp/zenova-linux.tar.gz"
          tar -czf "$ARCHIVE" -C "$STAGE" . || true
          gh release upload "$RELEASE_TAG" "$ARCHIVE" --repo "$STORAGE_REPO" --clobber || true
          rm -rf "$STAGE" "$ARCHIVE"
          echo "✅ Đã lưu dữ liệu Linux thành công!"
          EOF
          chmod +x /tmp/save-linux-data.sh
          echo "SAVE_SCRIPT_LINUX=/tmp/save-linux-data.sh" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────────────
      # 3. KHÔI PHỤC DỮ LIỆU LINUX TỪ GITHUB RELEASE
      # ─────────────────────────────────────────────────────────────
      - name: ♻️ Khôi phục dữ liệu Linux từ GitHub Release
        run: |
          DL_DIR="/tmp/gh-restore-linux"
          rm -rf "$DL_DIR" && mkdir -p "$DL_DIR"
          if gh release download "$RELEASE_TAG" --repo "$STORAGE_REPO" --pattern 'zenova-linux.tar.gz' --dir "$DL_DIR" 2>/dev/null; then
            if [ -f "$DL_DIR/zenova-linux.tar.gz" ]; then
              echo "⬇️ Đang giải nén dữ liệu phiên trước..."
              tar -xzf "$DL_DIR/zenova-linux.tar.gz" -C /tmp/ || true
              if [ -d "/tmp/home_runner" ]; then
                rsync -a /tmp/home_runner/ /home/runner/ || true
                rm -rf /tmp/home_runner
              fi
              echo "✅ Đã khôi phục dữ liệu Linux thành công!"
            fi
          else
            echo "ℹ️ Phiên Linux mới, không có bản lưu cũ."
          fi
          rm -rf "$DL_DIR"

      # ─────────────────────────────────────────────────────────────
      # 4. TỐI ƯU TỐI THƯỢNG LINUX KERNEL & FIX LAG
      # ─────────────────────────────────────────────────────────────
      - name: ⚙️ Tối ưu tối thượng Linux Kernel & Fix Lag
        run: |
          echo "🚀 Tối ưu hóa hiệu năng Linux..."
          sudo sysctl -w vm.swappiness=10 || true
          sudo sysctl -w fs.file-max=2097152 || true
          sudo sysctl -w net.core.somaxconn=4096 || true
          sudo sysctl -w net.ipv4.tcp_fastopen=3 || true
          # Tắt các dịch vụ nặng không cần thiết
          sudo systemctl stop snapd unattended-upgrades man-db.timer 2>/dev/null || true
          sudo systemctl disable snapd unattended-upgrades 2>/dev/null || true
          echo "✅ Đã tối ưu Linux Kernel!"

      # ─────────────────────────────────────────────────────────────
      # 5. CÀI ĐẶT DESKTOP XFCE4 & XRDP SERVER
      # ─────────────────────────────────────────────────────────────
      - name: 🖥️ Cài đặt Desktop XFCE4 & XRDP Server
        run: |
          echo "🖥️ Cài đặt giao diện XFCE4 và XRDP..."
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xfce4-goodies xrdp dbus-x11 xorgxrdp curl wget
          echo "xfce4-session" > ~/.xsession
          sudo cp ~/.xsession /etc/skel/
          sudo sed -i 's/3389/3389/g' /etc/xrdp/xrdp.ini
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          echo "✅ XRDP Server đã hoạt động tại cổng 3389!"

      # ─────────────────────────────────────────────────────────────
      # 6. THIẾT LẬP TÀI KHOẢN RUNNER
      # ─────────────────────────────────────────────────────────────
      - name: 👤 Thiết lập tài khoản runner
        run: |
          echo "runner:$FIXED_PASSWORD" | sudo chpasswd
          echo "root:$FIXED_PASSWORD" | sudo chpasswd
          echo "✅ Đã cập nhật mật khẩu cho user runner!"

      # ─────────────────────────────────────────────────────────────
      # 7. CÀI ĐẶT ỨNG DỤNG LINUX (CHROME, VLC, DISCORD, SPOTIFY)
      # ─────────────────────────────────────────────────────────────
      - name: 📦 Cài đặt ứng dụng Linux (Chrome, VLC, Discord, Spotify)
        run: |
          echo "📦 Cài đặt Google Chrome, VLC..."
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo apt-get install -y -qq /tmp/chrome.deb vlc || true
          rm -f /tmp/chrome.deb
          echo "✅ Đã cài đặt xong ứng dụng Linux!"

      # ─────────────────────────────────────────────────────────────
      # 8. KẾT NỐI TAILSCALE LINUX
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Kết nối Tailscale Linux
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -n "$TAILSCALE_AUTH_KEY" ]; then
            curl -fsSL https://tailscale.com/install.sh | sh
            sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="zenova-linux-$MACHINE_ID" --accept-routes
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
            echo "✅ Tailscale IP: $TS_IP"
          else
            echo "ℹ️ Bỏ qua Tailscale, sử dụng Cloudflare Tunnel."
          fi

      # ─────────────────────────────────────────────────────────────
      # 9. KHỞI CHẠY CLOUDFLARE TUNNEL & WEB QUẢN LÝ LINUX (PORT 8080)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Khởi chạy Web Quản Lý Linux (Port 8080)
        run: |
          # Tải cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /tmp/cloudflared
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:8080 --logfile /tmp/cf-linux.log >/dev/null 2>&1 &

          # Web Server Python
          cat << 'EOF' > /tmp/server.py
          import http.server, socketserver, json, os

          SIGNAL_FILE = "/tmp/zenova-signal.txt"

          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_POST(self):
                  content_len = int(self.headers.get('Content-Length', 0))
                  post_body = self.rfile.read(content_len).decode('utf-8')
                  cmd = ""
                  try:
                      cmd = json.loads(post_body).get("cmd", "")
                  except:
                      cmd = post_body
                  if cmd:
                      with open(SIGNAL_FILE, "w") as f:
                          f.write(cmd.strip())
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.send_header('Access-Control-Allow-Origin', '*')
                      self.end_headers()
                      self.wfile.write(json.dumps({"ok": True, "message": f"Đã nhận lệnh: {cmd}"}).encode('utf-8'))

              def do_GET(self):
                  cf_url = ""
                  if os.path.exists("/tmp/cf-url.txt"):
                      with open("/tmp/cf-url.txt") as f:
                          cf_url = f.read().strip()
                  ts_ip = os.environ.get("TAILSCALE_IP", "127.0.0.1")
                  pwd = os.environ.get("FIXED_PASSWORD", "Zenova@2026")
                  html = f"""<!DOCTYPE html><html><head><meta charset="utf-8"><title>Zenova Linux VPS</title>
                  <style>body{{background:#0f172a;color:#f8fafc;font-family:sans-serif;padding:24px;text-align:center}}
                  .card{{max-width:600px;margin:auto;background:#1e293b;padding:24px;border-radius:12px;border:1px solid #334155}}
                  button{{padding:12px 18px;margin:6px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff}}
                  .s{{background:#0284c7}} .r{{background:#ea580c}} .x{{background:#dc2626}}
                  </style></head><body><div class="card">
                  <h2>🐧 ZENOVA LINUX VPS</h2><p style="color:#34d399">● HOẠT ĐỘNG</p>
                  <p>XRDP: <b>{ts_ip}:3389</b> | User: <b>runner</b> | Pass: <b>{pwd}</b></p>
                  {f'<p>Public Link: <a href="{cf_url}" target="_blank" style="color:#38bdf8">{cf_url}</a></p>' if cf_url else ''}
                  <button class="s" onclick="c('SAVE_NOW')">💾 LƯU NGAY</button>
                  <button class="r" onclick="c('RESTART_SESSION')">🔁 RESET PHIÊN</button>
                  <button class="x" onclick="c('STOP_SESSION')">🛑 NGẮT VPS</button>
                  </div><script>async function c(cmd){{ if(confirm("Lệnh: "+cmd)){{ let r=await fetch("/",{{method:"POST",body:JSON.stringify({{cmd:cmd}})}}); let d=await r.json(); alert(d.message); }} }}</script>
                  </body></html>"""
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/html; charset=utf-8')
                  self.end_headers()
                  self.wfile.write(html.encode('utf-8'))

          socketserver.TCPServer.allow_reuse_address = True
          with socketserver.TCPServer(("", 8080), Handler) as httpd:
              httpd.serve_forever()
          EOF

          nohup python3 /tmp/server.py >/dev/null 2>&1 &
          echo "✅ Web Quản Lý Linux đã chạy tại cổng 8080!"

      # ─────────────────────────────────────────────────────────────
      # 10. THÔNG TIN KẾT NỐI LINUX VPS
      # ─────────────────────────────────────────────────────────────
      - name: 🎉 Thông tin kết nối Linux VPS
        run: |
          sleep 5
          CF_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/cf-linux.log | head -n 1 || true)
          [ -n "$CF_URL" ] && echo "$CF_URL" > /tmp/cf-url.txt
          echo "======================================================================"
          echo "                 🎉 ZENOVA LINUX VPS ĐÃ SẴN SÀNG!                     "
          echo "======================================================================"
          echo "🌐 WEB QUẢN LÝ PUBLIC : $CF_URL"
          echo "🖥️ XRDP HOST          : ${TAILSCALE_IP:-127.0.0.1}:3389"
          echo "👤 USER               : runner"
          echo "🔐 PASSWORD           : $FIXED_PASSWORD"
          echo "======================================================================"
          echo "::notice title=LINUX VPS SẴN SÀNG::XRDP=${TAILSCALE_IP:-127.0.0.1}:3389 | User=runner | Pass=$FIXED_PASSWORD | Web=$CF_URL"

      # ─────────────────────────────────────────────────────────────
      # 11. DUY TRÌ PHIÊN LÀM VIỆC LINUX (KEEP-ALIVE)
      # ─────────────────────────────────────────────────────────────
      - name: ⏳ Duy trì phiên làm việc Linux (Keep-Alive)
        run: |
          END_EPOCH=$((JOB_START_EPOCH + TOTAL_MINUTES * 60))
          echo "🔄 Duy trì phiên Linux cho máy [$MACHINE_ID]..."
          while true; do
            if [ -f "/tmp/zenova-signal.txt" ]; then
              CMD=$(cat /tmp/zenova-signal.txt)
              rm -f /tmp/zenova-signal.txt
              if [ "$CMD" = "SAVE_NOW" ]; then
                bash /tmp/save-linux-data.sh || true
              elif [ "$CMD" = "RESTART_SESSION" ]; then
                echo "FORCE_NEXT_SESSION=1" >> $GITHUB_ENV
                break
              elif [ "$CMD" = "STOP_SESSION" ]; then
                echo "FORCE_STOP_ONLY=1" >> $GITHUB_ENV
                break
              fi
            fi

            NOW=$(date +%s)
            REMAIN=$((END_EPOCH - NOW))
            [ $REMAIN -le 0 ] && break

            sleep 5
          done

      # ─────────────────────────────────────────────────────────────
      # 12. LƯU DỮ LIỆU LINUX CUỐI PHIÊN
      # ─────────────────────────────────────────────────────────────
      - name: 💾 Lưu dữ liệu Linux cuối phiên
        if: always()
        run: |
          bash /tmp/save-linux-data.sh || true

      # ─────────────────────────────────────────────────────────────
      # 13. KÍCH HOẠT PHIÊN TIẾP THEO LINUX
      # ─────────────────────────────────────────────────────────────
      - name: 🔁 Kích hoạt phiên tiếp theo Linux
        if: always()
        run: |
          if [ "$FORCE_STOP_ONLY" = "1" ]; then
            echo "🛑 Người dùng đã ngắt VPS Linux. Dừng khởi động lại."
            exit 0
          fi
          if [ "${{ github.event.inputs.auto_restart }}" = "true" ] || [ "$FORCE_NEXT_SESSION" = "1" ]; then
            gh workflow run zenova-ultimate.yml --repo "$RUNNER_REPO" \
              -f os_type="linux" \
              -f machine_id="$MACHINE_ID" \
              -f duration="${{ github.event.inputs.duration }}" \
              -f auto_restart="true" \
              -f fixed_password="$FIXED_PASSWORD" || true
            echo "✅ Đã kích hoạt phiên Linux tiếp theo!"
          fi
