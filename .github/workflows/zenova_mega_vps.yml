          exit 0;

      - name: 🔑 Lấy StarDesk Trung Device ID (đa phương pháp, chờ tối đa 60s)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE = 0;
          Write-Host "🔍 Đang lấy ID StarDesk Trung / GameViewer..." -ForegroundColor Cyan;

          $sdPin = "$env:INPUT_PIN_CODE";
          if ([string]::IsNullOrWhiteSpace("$sdPin")) { $sdPin = "Zenova2026" }
          $cleanPin = ($sdPin -replace '[^A-Za-z0-9]', '')
          if (($cleanPin.Length -lt 8) -or ($cleanPin.Length -gt 16)) { $cleanPin = 'Zenova2026' }
          Set-Content -Path "C:\stardesk-pin.txt" -Value $cleanPin -Force

          $sdId = ""
          if ("$env:STARDESK_ID_INPUT" -match '^\d{6,12}$') {
              $sdId = "$env:STARDESK_ID_INPUT"
              Write-Host "│ ✅ Dùng ID từ input: $sdId" -ForegroundColor Green
          }

          # Phương pháp 1: Chạy StarDesk.exe và chờ nó tự lưu config
          if (-not $sdId) {
              $sdExe = (Get-ChildItem -Path @("C:\Program Files\StarDesk", "C:\Program Files (x86)\StarDesk") -Filter "StarDesk.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              if ($sdExe) {
                  Write-Host "│ 🚀 Khởi chạy StarDesk.exe để nó kết nối server TQ..." -ForegroundColor Cyan
                  $proc = Start-Process -FilePath "$sdExe" -WorkingDirectory (Split-Path $sdExe) -WindowStyle Minimized -PassThru -ErrorAction SilentlyContinue
                  $startTime = Get-Date
                  $idRegex = '(?:ID|cid|DeviceID|Account|device_id|deviceId|DeviceId)\s*[":=]\s*["'']?(\d{6,12})'

                  $allCfg = @(
                      "C:\ProgramData\StarDesk\config.ini",
                      "C:\ProgramData\StarDesk\config.dat",
                      "C:\ProgramData\StarDesk\user.dat",
                      "C:\ProgramData\StarDesk\data.ini",
                      "C:\Program Files\StarDesk\config.ini",
                      "C:\Program Files (x86)\StarDesk\config.ini",
                      "C:\Users\zenova\AppData\Roaming\StarDesk\config.ini",
                      "C:\Users\zenova\AppData\Roaming\StarDesk\user.dat",
                      "C:\Users\zenova\AppData\Local\StarDesk\config.ini",
                      "C:\Users\runneradmin\AppData\Roaming\StarDesk\config.ini",
                      "C:\Users\runneradmin\AppData\Local\StarDesk\config.ini"
                  )

                  for ($i = 0; $i -lt 20; $i++) {
                      Start-Sleep -Seconds 3
                      $elapsed = [int]((Get-Date) - $startTime).TotalSeconds

                      foreach ($cfg in $allCfg) {
                          if (Test-Path $cfg) {
                              try {
                                  $content = Get-Content $cfg -Raw -ErrorAction SilentlyContinue
                                  if ($content -match $idRegex) {
                                      $sdId = $Matches[1]
                                      break
                                  }
                              } catch {}
                          }
                      }
                      if ($sdId) { break }

                      $scanDirs = @("C:\ProgramData\StarDesk", "C:\Users\zenova\AppData\Roaming\StarDesk", "C:\Users\zenova\AppData\Local\StarDesk")
                      foreach ($dir in $scanDirs) {
                          if (Test-Path $dir) {
                              $files = Get-ChildItem $dir -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Length -lt 1MB -and $_.Extension -match '^\.(ini|dat|json|xml|conf|cfg|txt)$' }
                              foreach ($f in $files) {
                                  try {
                                      $txt = Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
                                      if ($txt -match $idRegex) {
                                          $sdId = $Matches[1]; break
                                      }
                                  } catch {}
                              }
                              if ($sdId) { break }
                          }
                      }
                      if ($sdId) {
                          Write-Host "│ ✅ Tìm thấy ID sau $elapsed giây: $sdId" -ForegroundColor Green
                          break
                      }
                      Write-Host "│ ⏳ Chờ StarDesk đăng nhập... ($elapsed/60 giây)" -ForegroundColor DarkGray
                  }
                  # Không kill app - để nó chạy, user có thể kết nối ngay
              }
          }

          # Phương pháp 2: GameViewer CLI nếu có
          if (-not $sdId) {
              $gvCli = 'C:\Program Files\Netease\GameViewer\bin\uuyc-cli.exe'
              if (Test-Path $gvCli) {
                  Write-Host "│ 🔄 Thử GameViewer CLI..." -ForegroundColor Cyan
                  & "$gvCli" -c "$cleanPin" *> $null
                  for ($i = 0; $i -lt 10; $i++) {
                      $out = & "$gvCli" -d 2>$null
                      if ($out -match '(\d{6,12})') { $sdId = $Matches[1]; break }
                      Start-Sleep -Seconds 1
                  }
              }
          }

          # Phương pháp 3: Quét Registry
          if (-not $sdId) {
              $regPaths = @(
                  'HKCU:\Software\StarDesk',
                  'HKLM:\Software\StarDesk',
                  'HKCU:\Software\WOW6432Node\StarDesk',
                  'HKLM:\Software\WOW6432Node\StarDesk'
              )
              foreach ($rp in $regPaths) {
                  if (Test-Path $rp) {
                      $props = Get-ItemProperty -Path $rp -ErrorAction SilentlyContinue
                      foreach ($p in $props.PSObject.Properties) {
                          if ($p.Value -match '^\d{6,12}$') { $sdId = $p.Value; break }
                      }
                      if ($sdId) { break }
                  }
              }
          }

          if ($sdId) {
              Set-Content -Path "C:\stardesk-id.txt" -Value "$sdId" -Force
              "STARDESK_ID=$sdId" >> "$env:GITHUB_ENV"
              Write-Host "│ 🌟 StarDesk ID : $sdId" -ForegroundColor Yellow
          } else {
              Set-Content -Path "C:\stardesk-id.txt" -Value "Đang kết nối - vào app xem ID" -Force
              Write-Host "│ ⚠️ Chưa lấy được ID. App đang chạy, sẽ tiếp tục thử ở keep-alive." -ForegroundColor Yellow
          }
          "STARDESK_PIN=$cleanPin" >> "$env:GITHUB_ENV"
          Write-Host "│ 🔑 StarDesk PIN: $cleanPin" -ForegroundColor Yellow

          $global:LASTEXITCODE = 0
          exit 0

