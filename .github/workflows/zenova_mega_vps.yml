                              Write-Host "ðŸ–¥ï¸ ÄÃ£ tráº£ phiÃªn User gá»‘c $u (ID:$sidNum) vá» mÃ n hÃ¬nh Console cho Sunshine & StarDesk!" -ForegroundColor Green;
                          }
                      }
                  };
              } catch {}

              $now    = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
              $remain = ($endEpoch) - ($now);
              if (($remain) -le 0) {
                  Write-Host "â° ÄÃ£ háº¿t thá»i gian phiÃªn lÃ m viá»‡c!" -ForegroundColor Yellow;
                  break;
              }

              if ((((Get-Date) - ($lastLog)).TotalMinutes) -ge 5) {
