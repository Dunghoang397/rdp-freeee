      - name: 🌐 Kết nối Tailscale (Official GitHub Action - OAuth)
        uses: tailscale/github-action@v4
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: 🌐 Kiểm tra & Kết nối Tailscale Key (nếu chưa có OAuth)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $tsIp = "";
          $tsCli = 'C:\Program Files\Tailscale\tailscale.exe';
          if (-not (Test-Path $tsCli)) {
              $tsCli = (Get-Command tailscale -ErrorAction SilentlyContinue).Source;
          }

          $authKey = "$env:TAILSCALE_KEY_INPUT".Trim();
          if ($authKey -and ($authKey -match '^tskey-')) {
              Write-Host "│ 🔑 Đang kết nối Tailscale qua AuthKey..." -ForegroundColor Cyan;
              if (Test-Path $tsCli) {
                  & "$tsCli" up --authkey="$authKey" --unattended=true --accept-routes=true --netfilter-mode=off 2>&1 | Out-Null;
              }
          }

          if ($tsCli -and (Test-Path $tsCli)) {
              for ($i = 0; $i -lt 25; $i++) {
                  $checkIp = (& "$tsCli" ip -4 2>$null) | Select-Object -First 1;
                  if ($checkIp -and $checkIp.Trim() -match '^100\.') {
                      $tsIp = $checkIp.Trim();
                      break;
                  }
                  Start-Sleep -Seconds 1;
              }
          }

          if ($tsIp) {
              "TAILSCALE_IP=$tsIp" >> "$env:GITHUB_ENV";
              Set-Content -Path "C:\tailscale-ip.txt" -Value "$tsIp" -Force;
              Write-Host "│ 🎉 Tailscale OK! IP: $tsIp" -ForegroundColor Green;
              [Console]::WriteLine("::notice title=TAILSCALE IP SẴN SÀNG::IP: $tsIp | RDP: $tsIp:3389");
          } else {
              Write-Host "│ ⚠️ Tailscale chưa có IP (kiểm tra Secret OAuth hoặc TAILSCALE_AUTHKEY)" -ForegroundColor Yellow;
              Set-Content -Path "C:\tailscale-ip.txt" -Value "Chưa có IP" -Force;
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      - name: 🌐 Ngrok RDP Tunnel (tùy chọn)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $ngTok = if ($env:NGROK_TOKEN) { $env:NGROK_TOKEN } else { "" };
          if ($ngTok) {
              Write-Host "│ 🔑 Tìm thấy Ngrok Token! Đang thiết lập RDP công khai..." -ForegroundColor Cyan;
              try {
                  $ngZip = "$env:TEMP\ngrok.zip";
                  & curl.exe -L --retry 3 --connect-timeout 15 "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -o "$ngZip" 2>$null;
                  if (Test-Path "$ngZip") {
                      Expand-Archive -Path "$ngZip" -DestinationPath 'C:\ngrok' -Force;
                      $ngExe = 'C:\ngrok\ngrok.exe';
                      if (Test-Path "$ngExe") {
                          & "$ngExe" config add-authtoken "$ngTok" *> $null;
                          Start-Process -FilePath "$ngExe" -ArgumentList "tcp 3389 --log=C:\ngrok.log" -WindowStyle Hidden;
                          for ($i = 0; $i -lt 15; $i++) {
                              Start-Sleep -Seconds 1;
                              if (Test-Path "C:\ngrok.log") {
                                  $ngLog = Get-Content -Path "C:\ngrok.log" -Raw -ErrorAction SilentlyContinue;
                                  if ($ngLog -match 'url=tcp://([a-zA-Z0-9\.\-]+:\d+)') {
                                      $ep = $Matches[1];
                                      "RDP_NGROK_ENDPOINT=$ep" >> "$env:GITHUB_ENV";
                                      Set-Content -Path "C:\rdp-ngrok.txt" -Value "$ep" -Force;
                                      Write-Host "│ 🎉 NGROK RDP: $ep" -ForegroundColor Green;
                                      break;
                                  }
                              }
                          }
                      }
                  }
              } catch {}
          } else {
              Write-Host "│ ℹ️ Không có NGROK_TOKEN — bỏ qua Ngrok" -ForegroundColor Gray;
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      - name: 🖥️🔊🚀 Cài Driver Màn Hình Ảo, Âm Thanh Ảo & Apollo Streaming
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🖥️🔊🚀 Cài Driver Ảo & Apollo Streaming (Tối ưu siêu tốc)..." -ForegroundColor Cyan;

          $dl7 = @(
              '--url', 'https://www.amyuni.com/downloads/usbmmidd_v2.zip', '-o', "$env:TEMP\usbmmidd_v2.zip",
              '--url', 'https://download.vb-audio.com/Download_EXTERNAL/VBCABLE_Driver_Pack43.zip', '-o', "$env:TEMP\VBCable.zip",
              '--url', 'https://github.com/ClassicOldSong/Apollo/releases/latest/download/Apollo-Windows-AMD64-installer.msi', '-o', "$env:TEMP\Apollo.msi"
          );
          & curl.exe -L -s --retry 2 -Z @dl7;

          # 1. MÀN HÌNH ẢO USBMMIDD v2
          try {
              $zip = "$env:TEMP\usbmmidd_v2.zip";
              if (Test-Path "$zip") {
                  Expand-Archive -Path $zip -DestinationPath 'C:\' -Force;
                  Push-Location 'C:\usbmmidd_v2';
                  Get-ChildItem -Filter '*.cer' | ForEach-Object {
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null;
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null;
                  };
                  & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null;
                  & .\deviceinstaller64.exe enableidd 1 *> $null;
                  Pop-Location;
                  Write-Host "│ ✅ Màn hình ảo VDD sẵn sàng!" -ForegroundColor Green;
              }
          } catch {}

          # 2. CÀI ĐẶT VB-CABLE AUDIO
          Write-Host "│ 🔊 Đang cài đặt VB-Cable Audio Driver..." -ForegroundColor Cyan;
          foreach ($svcName in @('Audiosrv', 'AudioEndpointBuilder', 'MMCSS')) {
              try {
                  Set-Service -Name $svcName -StartupType Automatic -ErrorAction SilentlyContinue;
                  Start-Service -Name $svcName -ErrorAction SilentlyContinue;
              } catch {}
          }

          try { bcdedit /set testsigning on 2>&1 | Out-Null; } catch {}

          try {
              $vbZip = "$env:TEMP\VBCable.zip";
              if (Test-Path "$vbZip") {
                  if (Test-Path 'C:\VBCable') { Remove-Item 'C:\VBCable' -Recurse -Force -ErrorAction SilentlyContinue; }
                  Expand-Archive -Path "$vbZip" -DestinationPath 'C:\VBCable' -Force;

                  $vbSetup = Get-ChildItem -Path 'C:\VBCable' -Filter 'VBCABLE_Setup_x64.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1;
                  if ($vbSetup) {
                      $proc = Start-Process -FilePath $vbSetup.FullName -ArgumentList "-i", "-h" -PassThru;
                      $proc.WaitForExit(10000);
                  }
                  & pnputil.exe /scan-devices 2>&1 | Out-Null;
              }
          } catch {}

          # SoundVolumeView set default device
          try {
              $svvZip = "$env:TEMP\soundvolumeview.zip";
              & curl.exe -L -s --retry 2 'https://www.nirsoft.net/utils/soundvolumeview-x64.zip' -o "$svvZip" 2>$null;
              if (Test-Path "$svvZip") {
                  Expand-Archive -Path "$svvZip" -DestinationPath 'C:\SoundVolumeView' -Force;
                  $svv = 'C:\SoundVolumeView\SoundVolumeView.exe';
                  if (Test-Path "$svv") {
                      & "$svv" /SetDefault "CABLE Input" all 2>&1 | Out-Null;
                      & "$svv" /SetDefault "CABLE Output" all 2>&1 | Out-Null;
                      Write-Host "│    ✅ Đã set default audio qua SoundVolumeView" -ForegroundColor Green;
                  }
              }
          } catch {}

          foreach ($svcName in @('AudioEndpointBuilder', 'Audiosrv')) {
              try { Restart-Service -Name $svcName -Force -ErrorAction SilentlyContinue; } catch {}
          }

          # 3. APOLLO STREAMING
          Write-Host "│ 🚀 Cấu hình Apollo Streaming & Mở Firewall..." -ForegroundColor Cyan;
          try {
              $apMsi = "$env:TEMP\Apollo.msi";
              if (Test-Path "$apMsi") {
                  Start-Process msiexec.exe -ArgumentList "/i `"$apMsi`" /qn /norestart" -Wait;
              }
              $apolloExe = 'C:\Program Files\Apollo\apollo.exe';
              if (-not (Test-Path $apolloExe)) {
                  $apolloExe = (Get-ChildItem -Path 'C:\Program Files\Apollo' -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'Apollo|Sunshine' } | Select-Object -First 1).FullName
              }
              
              $pass = "$env:FIXED_PASSWORD";
              if (-not $pass) { $pass = "Zenova@2026"; }
              
              if (Test-Path "$apolloExe") {
                  & "$apolloExe" --creds zenova "$pass" 2>&1 | Out-Null;
              }

              $apDir = "C:\Program Files\Apollo\config";
              if (-not (Test-Path $apDir)) { $apDir = "C:\Program Files\Sunshine\config" }
              New-Item -ItemType Directory -Force -Path $apDir -ErrorAction SilentlyContinue | Out-Null;
              $apConf = "origin_pin_allowed = pc`r`nupnp = disabled`r`nencoder = nvenc`r`nnvenc_preset = p1`r`nlatency = ultra_low`r`npacket_size = 1024`r`nfec_percentage = 20`r`nfps = [60, 120]`r`n";
              Set-Content -Path "$apDir\sunshine.conf" -Value $apConf -Encoding UTF8 -Force;

              netsh advfirewall firewall add rule name="Apollo_TCP" dir=in action=allow protocol=TCP localport=47984,47989,47990,48010 2>&1 | Out-Null;
              netsh advfirewall firewall add rule name="Apollo_UDP" dir=in action=allow protocol=UDP localport=47998,47999,48000,48002,48010 2>&1 | Out-Null;

              $svcName = Get-Service -Name '*Apollo*', '*Sunshine*' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Name
              if ($svcName) {
                  Set-Service -Name $svcName -StartupType Automatic -ErrorAction SilentlyContinue;
                  Restart-Service -Name $svcName -Force -ErrorAction SilentlyContinue;
              }
              Write-Host "│ ✅ Apollo Streaming Server sẵn sàng tại cổng 47990!" -ForegroundColor Green;
          } catch {
              Write-Host "│ ⚠️ Lỗi khi cài Apollo: $_" -ForegroundColor Yellow;
          }

          # 4. ĐỘ PHÂN GIẢI
          try {
              if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
                  Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction SilentlyContinue;
              }
          } catch {}

          $global:LASTEXITCODE = 0;
          exit 0;

