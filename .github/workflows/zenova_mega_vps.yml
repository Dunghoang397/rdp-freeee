name: ZENOVA COSMIC VPS (Siêu Tốc - Chạy Ngầm)
on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy'
        required: true
        default: 'zenova-1'
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h00m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h00m'
      windows_image:
        description: '🪟 Bản Windows'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      fixed_password:
        description: '🔐 Mật khẩu RDP'
        required: false
        default: 'Aistv@2026'

permissions:
  contents: write
  actions: write

concurrency:
  group: zenova-cosmic-${{ inputs.machine_id }}
  cancel-in-progress: false

jobs:
  Zenova-Cosmic-Setup:
    runs-on: ${{ inputs.windows_image }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'zenova-1' }}
      WEB_PORT: '8080'

    steps:
      # =========================================================================
      # PHẦN 1: KHỞI TẠO Ổ ĐĨA ẢO (CHẠY SIÊU TỐC)
      # =========================================================================
      - name: 🧱 Dựng ổ đĩa X:\ & Chuẩn bị
        shell: pwsh
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV";

          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', '';
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'zenova-1' }
          "MACHINE_ID=$cleanId" >> "$env:GITHUB_ENV"
          "RELEASE_TAG=zenova-storage-$cleanId" >> "$env:GITHUB_ENV"

          $total = if ("$env:INPUT_DURATION" -eq '1h') { 60 } elseif ("$env:INPUT_DURATION" -eq '3h') { 180 } else { 300 }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV"

          "RDP_USER=$env:USERNAME" >> "$env:GITHUB_ENV"
          "PROFILE_PATH=$env:USERPROFILE" >> "$env:GITHUB_ENV"

          $vhdContainer = 'C:\ZENOVA-VHD';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'zenova-os.vhdx');

          $mounted = $false;
          try {
              if (-not (Test-Path "$vhdFile")) {
                  New-VHD -Path "$vhdFile" -SizeBytes (45GB) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "X" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:($false) | Out-Null;
              } else { Mount-VHD -Path "$vhdFile"; }
              $null = Get-PSDrive -Name "X" -ErrorAction Stop;
              $mounted = $true;
          } catch {}

          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" | Out-Null;
              & subst "X:" "$fallbackDir";
          }

          $sharedRoot = "X:\ZENOVA-SYSTEM";
          @("$sharedRoot", "$sharedRoot\sessions", "$sharedRoot\DATA", "$sharedRoot\OS-OVERLAY", "$sharedRoot\Users") | ForEach-Object { New-Item -ItemType Directory -Force -Path "$_" | Out-Null }

          "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV";
          "SHARED_OS_DIR=$sharedRoot\OS-OVERLAY" >> "$env:GITHUB_ENV";
          "CONTROL_SIGNAL_FILE=$env:RUNNER_TEMP\zenova-control-action.txt" >> "$env:GITHUB_ENV";

          $null = gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $dummy = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'init.txt');
              Set-Content -Path "$dummy" -Value "Zenova" -Encoding UTF8;
              gh release create "$env:RELEASE_TAG" "$dummy" --repo "$env:GH_REPO" --title "Zenova Storage ($cleanId)" --notes "Auto persistent drive";
          }
          $global:LASTEXITCODE = 0;

      # =========================================================================
      # PHẦN 2: KHÔI PHỤC & TỐI ƯU HỆ THỐNG NGAY LẬP TỨC
      # =========================================================================
      - name: ⚙️ Tối ưu Windows & Khôi phục (Siêu tốc)
        shell: pwsh
        run: |
          # Tắt dịch vụ ngầm gây lag
          Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue; Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue;
          Set-Service -Name SysMain -StartupType Disabled -ErrorAction SilentlyContinue; Stop-Service -Name SysMain -Force -ErrorAction SilentlyContinue;
          Set-Service -Name wuauserv -StartupType Disabled -ErrorAction SilentlyContinue; Stop-Service -Name wuauserv -Force -ErrorAction SilentlyContinue;

          # Bật RDP & Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force;
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name TermService -ErrorAction SilentlyContinue;
          netsh advfirewall firewall add rule name="ALL-IN" dir=in action=allow protocol=any profile=any | Out-Null;

          # Đặt pass
          $u = $env:RDP_USER
          net user $u "${{ inputs.fixed_password }}" /active:yes /expires:never | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue

      # =========================================================================
      # PHẦN 3: CÀI TAILSCALE & LẤY IP (BƯỚC QUYẾT ĐỊNH ĐỂ KẾT NỐI)
      # =========================================================================
      - name: 🌐 Cài Tailscale
        shell: pwsh
        run: |
          $msiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          Set-Service -Name "Tailscale" -StartupType Automatic; Start-Service -Name "Tailscale"
          Start-Sleep -Seconds 2
          & "$ts" up "--authkey=${{ secrets.TAILSCALE_AUTH_KEY }}" "--hostname=zenova-$env:MACHINE_ID-$env:GITHUB_RUN_ID" --accept-routes --accept-dns --reset
          $ip = (& "$ts" ip -4 | Out-String).Trim()
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "┌────────────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│ 🚀 VPS SẴN SÀNG! KẾT NỐI NGAY BÂY GIỜ!           │" -ForegroundColor Cyan
          Write-Host "│ 🌐 IP Tailscale : $ip                             │" -ForegroundColor White
          Write-Host "│ 👤 User         : $env:RDP_USER                  │" -ForegroundColor White
          Write-Host "│ 🔑 Password     : ${{ inputs.fixed_password }}   │" -ForegroundColor White
          Write-Host "└────────────────────────────────────────────────────┘" -ForegroundColor Cyan
          Write-Host "⏳ Các tác vụ cài App, Driver, Sunshine đang chạy ngầm. Mày cứ vào dùng RDP trước!" -ForegroundColor Yellow

      # =========================================================================
      # PHẦN 4: TẠO WEB QUẢN LÝ (CHẠY NGẦM)
      # =========================================================================
      - name: 🌐 Web Quản Lý & Ngắt VPS
        shell: pwsh
        run: |
          $webScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'web.ps1')
          $lines = @(
              '$listener = [System.Net.HttpListener]::new();'
              '$listener.Prefixes.Add("http://+:8080/");'
              '$listener.Start();'
              'while ($listener.IsListening) {'
              '  $ctx = $listener.GetContext(); $req = $ctx.Request; $resp = $ctx.Response;'
              '  if ($req.HttpMethod -eq "POST" -and $req.Url.AbsolutePath.ToLower() -eq "/stop") {'
              '    Start-Process "shutdown.exe" -ArgumentList "/s /t 0";'
              '  }'
              '  $html = "<html><body><h1>ZENOVA VPS</h1><p>IP: $($env:TAILSCALE_IP)</p><p>Pass: ${{ inputs.fixed_password }}</p><form method=''POST'' action=''/stop''><button style=''padding:20px;background:red;color:white;''>NGẮT VPS</button></form></body></html>";'
              '  $buf = [System.Text.Encoding]::UTF8.GetBytes("$html");'
              '  $resp.ContentType = "text/html; charset=utf-8"; $resp.ContentLength64 = $buf.Length;'
              '  $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close();'
              '}'
          )
          Set-Content -Path "$webScript" -Value ($lines -join "`r`n") -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', "`"$webScript`"" -PassThru

      # =========================================================================
      # PHẦN 5: CHẠY NGẦM SIÊU TỐC (DRIVER ẢO, SUNSHINE, APP, WALLPAPER)
      # =========================================================================
      - name: 🚀 Kích hoạt Tiến Trình Ngầm (Zero-Lag)
        shell: pwsh
        run: |
          # Tạo file script riêng để chạy ngầm, không block luồng chính
          $bgScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'background-setup.ps1')
          $bgLines = @(
              'Start-Sleep -Seconds 10 # Chờ mày vào máy'
              '# 1. Cài Driver Ảo & Sunshine'
              'Start-Process pwsh.exe -ArgumentList "-NoProfile", "-Command", "& { $vdd = ''C:\usbmmidd_v2''; if (-not (Test-Path $vdd)) { Invoke-WebRequest -Uri ''https://www.amyuni.com/downloads/usbmmidd_v2.zip'' -OutFile ''$env:TEMP\usbmmidd_v2.zip''; Expand-Archive -Path ''$env:TEMP\usbmmidd_v2.zip'' -DestinationPath ''C:\'' -Force }; Push-Location $vdd; Get-ChildItem -Filter ''*.cer'' | ForEach-Object { Import-Certificate -FilePath ($_.FullName) -CertStoreLocation ''Cert:\LocalMachine\Root'' }; & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd; & .\deviceinstaller64.exe enableidd 1; Pop-Location; choco install sunshine -y --no-progress; choco install vb-cable -y --no-progress }" -WindowStyle Hidden'
              '# 2. Cài App & Wallpaper'
              'Start-Process pwsh.exe -ArgumentList "-NoProfile", "-Command", "& { $wpUrl = ''https://raw.githubusercontent.com/Dunghoang397/rdp-freeee/main/Zenova%20Cloud%20Aurora%20Lake.png''; $wpPath = ''C:\Windows\Web\Wallpaper\Zenova.png''; Invoke-WebRequest -Uri $wpUrl -OutFile $wpPath; Set-ItemProperty -Path ''HKCU:\Control Panel\Desktop'' -Name Wallpaper -Value $wpPath; Set-ItemProperty -Path ''HKCU:\Control Panel\Desktop'' -Name WallpaperStyle -Value ''10''; RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters; New-Item -Path ''HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\ActiveDesktop'' -Force | Out-Null; Set-ItemProperty -Path ''HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\ActiveDesktop'' -Name NoChangingWallPaper -Value 1; choco install discord -y --no-progress; choco install spotify -y --no-progress }" -WindowStyle Hidden'
              '# 3. Cài StarDesk'
              'Start-Process pwsh.exe -ArgumentList "-NoProfile", "-Command", "& { $url = ''https://download943.mediafire.com/be95vz5kgnig_m7acKGr-mRjXQQKAN0i2WdjIR_d-q70MeLboolFJnUHit6ZmqJYm8_rJigOgY0P5NhtdANnLGXOaEmKg9eWSEUGCEEIZdCrV2NNZ0ubdEO1hyPHR6l2Re85XT5kJpCd3Q4GXpeU0ZD2QSr5gc_6aPfM7r15_YltcA/mf82krdrzcy3dz8/StarDesk_1.5.3.exe''; $path = ''C:\temp\StarDesk.exe''; New-Item -ItemType Directory -Force -Path ''C:\temp''; Invoke-WebRequest -Uri $url -OutFile $path; Start-Process -FilePath $path -ArgumentList ''/S'' -Wait; Start-Sleep -Seconds 5; Get-Service -Name ''*StarDesk*'' | Set-Service -StartupType Automatic; Get-Service -Name ''*StarDesk*'' | Start-Service }" -WindowStyle Hidden'
          )
          Set-Content -Path "$bgScript" -Value ($bgLines -join "`r`n") -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', "`"$bgScript`"" -PassThru

      # =========================================================================
      # PHẦN 6: GIỮ MÁY CHẠY VÀ TỰ ĐỘNG KHỞI ĐỘNG LẠI
      # =========================================================================
      - name: ⏳ Giữ Máy Chạy
        id: keepalive
        shell: pwsh
        run: |
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60)
          while ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() -lt $endEpoch) {
              Start-Sleep -Seconds 60
          }

      # =========================================================================
      # PHẦN 7: KẾT THÚC VÀ KHỞI ĐỘNG PHIÊN MỚI
      # =========================================================================
      - name: 🔁 Kích hoạt phiên tiếp theo
        if: ${{ always() && steps.keepalive.outcome == 'success' }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
        run: |
          $wf = [System.IO.Path]::GetFileName(("$env:GITHUB_WORKFLOW_REF" -split '@')[0])
          gh workflow run "$wf" --ref "$env:GITHUB_REF_NAME" -f "machine_id=$env:MACHINE_ID" -f "duration=$env:DURATION" -f auto_restart=true -f "windows_image=$env:WIN_IMAGE" -f "fixed_password=$env:FIXED_PASS"
