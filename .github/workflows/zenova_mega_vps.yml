name: ZENOVA ULTIMATE VPS (Windows + Linux)
on:
  workflow_dispatch:
    inputs:
      os_type:
        description: '🖥️ Hệ điều hành (Windows, Linux, hoặc Cả hai)'
        required: false
        default: 'windows'
        type: choice
        options:
          - 'windows'
          - 'linux'
          - 'both'
      machine_id:
        description: '🏷️ Tên định danh máy'
        required: true
        default: 'zenova-1'
      duration:
        description: '🕐 Thời gian sử dụng'
        required: false
        default: '5h00m'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h00m'
      auto_restart:
        description: '🔁 Tự khởi động lại khi hết giờ'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo (GB)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Bản Windows'
        required: true
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2019'
          - 'windows-2022'
          - 'windows-2025'
      fixed_password:
        description: '🔐 Mật khẩu RDP / Sunshine / StarDesk'
        required: false
        default: 'Zenova@2026'
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo'
        required: false
        default: '1920x1080@60'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'
      choco_packages:
        description: '📦 App cài thêm bằng choco'
        required: false
        default: 'discord spotify evkey bandicam googlechrome vlc 7zip notepadplusplus'
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu Windows (Fix lag)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: zenova-ultimate-${{ inputs.machine_id }}-${{ inputs.os_type || 'windows' }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: WINDOWS RUNNER
  # =========================================================================
  Zenova-Windows:
    name: 🪟 Windows RDP (Sunshine + VDD + StarDesk)
    runs-on: ${{ inputs.windows_image }}
    if: ${{ inputs.os_type != 'linux' }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'zenova-1' }}
      DRIVE_LETTER: ${{ inputs.drive_letter }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      ENABLE_DUCKDNS: ${{ inputs.enable_duckdns }}

    steps:
      # =====================================================================
      # 1. DỰNG Ổ ĐĨA RIÊNG & CHUẨN BỊ THÔNG SỐ
      # =====================================================================
      - name: 🧱 Dựng ổ đĩa riêng & Chuẩn bị thông số
        shell: pwsh
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV";

          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', '';
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'zenova-1' }
          $relTag = "zenova-storage-$cleanId"
          $stateBranch = "zenova-state-$cleanId"
          "MACHINE_ID=$cleanId" >> "$env:GITHUB_ENV"
          "RELEASE_TAG=$relTag" >> "$env:GITHUB_ENV"
          "STATE_BRANCH=$stateBranch" >> "$env:GITHUB_ENV"

          $total = if ("$env:INPUT_DURATION" -eq '1h') { 60 } elseif ("$env:INPUT_DURATION" -eq '3h') { 180 } else { 300 }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV"

          # User gốc ban đầu (sẽ tạo zenova ở bước sau)
          $user = "zenova"
          $profPath = "C:\Users\zenova"
          "RDP_USER=$user" >> "$env:GITHUB_ENV";
          "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV";

          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper();
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X'; }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV";

          $vhdContainer = 'C:\ZENOVA-VHD-HOST';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'zenova-os.vhdx');

          $sizeBytes = ([int64]"$env:VHD_SIZE_GB") * 1GB;
          $mounted = $false;
          try {
              if (-not (Test-Path "$vhdFile")) {
                  New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:($false) | Out-Null;
              } else { Mount-VHD -Path "$vhdFile"; }
              $null = Get-PSDrive -Name "$dl" -ErrorAction Stop;
              if (Test-Path "${dl}:\") { $mounted = $true; }
          } catch {}

          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" | Out-Null;
              & subst "${dl}:" "$fallbackDir";
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force;
          }

          $sharedRoot       = "${dl}:\ZENOVA-SYSTEM";
          $sharedSessionDir = "$sharedRoot\sessions";
          $sharedDataDir    = "$sharedRoot\DATA";
          $sharedOsDir      = "$sharedRoot\OS-OVERLAY";
          $sharedStateFile  = "$sharedSessionDir\rdp-session-state.json";
          $profileStoreRoot = "$sharedRoot\Users";
          $baselineFile     = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'baseline-c-dirs.json');
          $controlSignal    = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'zenova-control-action.txt');

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "$sharedOsDir", "$profileStoreRoot", "${dl}:\Apps") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" | Out-Null;
          };

          $baseline = @{
              PF64 = @(Get-ChildItem 'C:\Program Files' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
              PF86 = @(Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
              PD   = @(Get-ChildItem 'C:\ProgramData' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
          };
          $baseline | ConvertTo-Json -Depth 4 | Set-Content -Path "$baselineFile" -Encoding UTF8;

          "VHD_CONTAINER=$vhdContainer" >> "$env:GITHUB_ENV";
          "VHD_FILE=$vhdFile" >> "$env:GITHUB_ENV";
          "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV";
          "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV";
          "SHARED_DATA_DIR=$sharedDataDir" >> "$env:GITHUB_ENV";
          "SHARED_OS_DIR=$sharedOsDir" >> "$env:GITHUB_ENV";
          "SHARED_STATE_FILE=$sharedStateFile" >> "$env:GITHUB_ENV";
          "PROFILE_ROOT=$profileStoreRoot" >> "$env:GITHUB_ENV";
          "BASELINE_FILE=$baselineFile" >> "$env:GITHUB_ENV";
          "CONTROL_SIGNAL_FILE=$controlSignal" >> "$env:GITHUB_ENV";

          $build = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild;
          "OS_BUILD=$build" >> "$env:GITHUB_ENV";

          $null = gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $dummy = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'init.txt');
              Set-Content -Path "$dummy" -Value "Zenova" -Encoding UTF8;
              gh release create "$env:RELEASE_TAG" "$dummy" --repo "$env:GH_REPO" --title "Zenova Storage ($cleanId)" --notes "Auto persistent drive";
          }
          $global:LASTEXITCODE = 0;

      # =====================================================================
      # 2. TẠO SCRIPT LƯU TRỮ
      # =====================================================================
      - name: 🧰 Tạo script lưu trữ ổ đĩa
        shell: pwsh
        run: |
          $scriptLines = @(
              'param([string]$Reason = "session-end")',
              '$ErrorActionPreference = "Continue";',
              'if (("$env:DATA_RESTORED" -ne "1") -or ("$env:SESSION_READY" -ne "1")) { exit 0; }',
              '$root  = "$env:SHARED_ROOT";',
              '$osDir = "$env:SHARED_OS_DIR";',
              '$appsToClose = @("chrome", "msedge", "discord", "Spotify", "StarDesk", "Bandicam", "EVKey");',
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | ForEach-Object { $null = $_.CloseMainWindow(); };',
              'Start-Sleep -Seconds 3;',
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;',
              '$regBk = [System.IO.Path]::Combine("$osDir", "Registry");',
              'New-Item -ItemType Directory -Force -Path "$regBk" | Out-Null;',
              'reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x64.reg" /y *> $null;',
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" "$regBk\System-Env.reg" /y *> $null;',
              'reg export "HKLM\SOFTWARE\Microsoft\Cryptography" "$regBk\Machine-Cryptography.reg" /y *> $null;',
              'reg export "HKCU\Control Panel\Desktop" "$regBk\User-Desktop.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes" "$regBk\User-Themes.reg" /y *> $null;',
              'if (("$env:RDP_USER") -and ("$env:PROFILE_PATH") -and (Test-Path "$env:PROFILE_PATH")) {',
              '    $profDst = [System.IO.Path]::Combine("$root", "Users", "$env:RDP_USER");',
              '    New-Item -ItemType Directory -Force -Path "$profDst" | Out-Null;',
              '    robocopy "$env:PROFILE_PATH" "$profDst" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD "$env:PROFILE_PATH\AppData\Roaming\Microsoft\Protect" "$env:PROFILE_PATH\AppData\Local\Temp" *> $null;',
              '    $global:LASTEXITCODE = 0;',
              '}',
              '$packDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "gh-pack");',
              'if (Test-Path "$packDir") { Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$packDir" | Out-Null;',
              '$archiveBase = [System.IO.Path]::Combine("$packDir", "zenova-drive.7z");',
              'Push-Location "$root";',
              '& 7z a -t7z -mx=1 -mmt=on -ssw -v1900m "$archiveBase" "*" "-xr!Pagefile.sys" "-xr!swapfile.sys" *> $null;',
              'Pop-Location;',
              '$chunks = @(Get-ChildItem -Path "$packDir" -Filter "zenova-drive.7z.*" | Sort-Object Name);',
              'if (($chunks.Count) -eq 0) { exit 1; }',
              '$manifest = [ordered]@{ machineId = "$env:MACHINE_ID"; updatedUtc = (Get-Date).ToUniversalTime().ToString("o"); chunkCount = $chunks.Count; };',
              '$manifestPath = [System.IO.Path]::Combine("$packDir", "drive-manifest.json");',
              '$manifest | ConvertTo-Json | Set-Content -Path "$manifestPath" -Encoding UTF8;',
              '$uploadFiles = @($chunks | ForEach-Object { $_.FullName }) + @("$manifestPath");',
              'gh release upload "$env:RELEASE_TAG" @uploadFiles --repo "$env:GH_REPO" --clobber;',
              'Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue;',
              'exit 0;'
          );
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1');
          Set-Content -Path "$saveScriptPath" -Value ($scriptLines -join "`r`n") -Encoding UTF8;

      # =====================================================================
      # 3. KHÔI PHỤC DỮ LIỆU
      # =====================================================================
      - name: ♻️ Khôi phục ổ đĩa
        shell: pwsh
        run: |
          @('HKLM:\SOFTWARE\Policies\Google\Chrome', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge') | ForEach-Object {
              New-Item -Path "$_" -Force | Out-Null; Set-ItemProperty -Path "$_" -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force;
          };

          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore');
          if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue; }
          New-Item -ItemType Directory -Force -Path "$dlDir" | Out-Null;

          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
          $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json');

          if (-not (Test-Path "$manifestFile")) {
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              exit 0;
          }

          gh release download "$env:RELEASE_TAG" --repo "$env:GH_REPO" --pattern 'zenova-drive.7z.*' --dir "$dlDir";
          $firstChunk = [System.IO.Path]::Combine("$dlDir", 'zenova-drive.7z.001');
          if (-not (Test-Path "$firstChunk")) { exit 1; }

          $stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", 'restore-stage');
          if (Test-Path "$stage") { Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue; }
          New-Item -ItemType Directory -Force -Path "$stage" | Out-Null;

          & 7z x "$firstChunk" "-o$stage" -y -mmt=on *> $null;
          Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue;

          $stateHit = Get-ChildItem -Path "$stage" -Recurse -Depth 6 -Filter 'rdp-session-state.json' -File -Force -ErrorAction SilentlyContinue | Select-Object -First 1;
          $sourceRoot = if ($stateHit) { $stateHit.Directory.Parent.FullName } else { "$stage" };

          robocopy "$sourceRoot" "$env:SHARED_ROOT" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;
          $global:LASTEXITCODE = 0;

          $oldProf = [System.IO.Path]::Combine("$env:SHARED_ROOT", 'Users', "$env:RDP_USER");
          if (Test-Path "$oldProf") {
              robocopy "$oldProf" "$env:PROFILE_PATH" /E /XJ /COPY:DAT /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD "$oldProf\AppData\Roaming\Microsoft\Protect" *> $null;
              $global:LASTEXITCODE = 0;
          }
          Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue;

          $regBk = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Registry');
          if (Test-Path "$regBk") {
              Get-ChildItem -Path "$regBk" -Filter '*.reg' -Recurse | ForEach-Object { reg import ($_.FullName) *>$null; };
              & RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters 1, True;
          }

          'DATA_RESTORED=1' >> "$env:GITHUB_ENV";

      # =====================================================================
      # 4. TẠO USER ZENOVA + BẬT RDP + FIX LAG
      # =====================================================================
      - name: ⚙️ Tạo User Zenova, bật RDP & Fix lag
        shell: pwsh
        run: |
          # Tắt chính sách mật khẩu phức tạp
          $secCfg = "$env:TEMP\secpol.cfg"
          $secDb = "$env:TEMP\secpol.sdb"
          secedit /export /cfg $secCfg
          (Get-Content $secCfg) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' | Set-Content $secCfg
          secedit /configure /db $secDb /cfg $secCfg /areas SECURITYPOLICY
          Remove-Item $secCfg, $secDb -Force

          $user = "zenova"
          $pass = "${{ inputs.fixed_password }}"

          # Tạo user bằng net user
          $userExists = net user $user 2>$null
          if ($LASTEXITCODE -ne 0) {
              net user $user $pass /add /comment:"Zenova User" /fullname:"Zenova"
              Add-LocalGroupMember -Group "Administrators" -Member $user
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user
          } else {
              net user $user $pass
          }

          # Fix lag
          Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue; Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue;
          Set-Service -Name SysMain -StartupType Disabled -ErrorAction SilentlyContinue; Stop-Service -Name SysMain -Force -ErrorAction SilentlyContinue;
          Set-Service -Name wuauserv -StartupType Disabled -ErrorAction SilentlyContinue; Stop-Service -Name wuauserv -Force -ErrorAction SilentlyContinue;

          # Bật RDP & Firewall
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force;
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name TermService -ErrorAction SilentlyContinue;
          netsh advfirewall firewall add rule name="ALL-IN" dir=in action=allow protocol=any profile=any | Out-Null;

          # Bắt buộc nhập mật khẩu
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'AutoAdminLogon' -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'DefaultPassword' -Value "" -Force;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -Name 'DefaultUserName' -Value "" -Force;

      # =====================================================================
      # 5. TAILSCALE
      # =====================================================================
      - name: 🌐 Cài Tailscale
        shell: pwsh
        run: |
          $msiPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          Set-Service -Name "Tailscale" -StartupType Automatic; Start-Service -Name "Tailscale"
          Start-Sleep -Seconds 2
          & "$ts" up "--authkey=${{ secrets.TAILSCALE_AUTH_KEY }}" "--hostname=zenova-$env:MACHINE_ID-$env:GITHUB_RUN_ID" --accept-routes --accept-dns --reset
          $ip = (& "$ts" ip -4 | Out-String).Trim()
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "┌────────────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│ 🚀 VPS SẴN SÀNG! KẾT NỐI NGAY BÂY GIỜ!           │" -ForegroundColor Cyan
          Write-Host "│ 🌐 IP Tailscale : $ip                             │" -ForegroundColor White
          Write-Host "│ 👤 User         : zenova                          │" -ForegroundColor White
          Write-Host "│ 🔑 Password     : ${{ inputs.fixed_password }}   │" -ForegroundColor White
          Write-Host "└────────────────────────────────────────────────────┘" -ForegroundColor Cyan

      # =====================================================================
      # 6. CÀI DRIVER ẢO & SUNSHINE
      # =====================================================================
      - name: 🖥️🔊☀️ Cài Driver Ảo & Sunshine
        shell: pwsh
        run: |
          Start-Job -ScriptBlock {
              Invoke-WebRequest -Uri 'https://www.amyuni.com/downloads/usbmmidd_v2.zip' -OutFile "$env:TEMP\usbmmidd_v2.zip" -UseBasicParsing
              Expand-Archive -Path "$env:TEMP\usbmmidd_v2.zip" -DestinationPath 'C:\' -Force
              Push-Location 'C:\usbmmidd_v2'
              Get-ChildItem -Filter '*.cer' | ForEach-Object { Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' }
              & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd
              & .\deviceinstaller64.exe enableidd 1
              Pop-Location
          } | Out-Null

          Start-Job -ScriptBlock {
              Invoke-WebRequest -Uri 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -OutFile "$env:TEMP\VBCable.zip" -UseBasicParsing
              Expand-Archive -Path "$env:TEMP\VBCable.zip" -DestinationPath "C:\VBCable" -Force
              $inf = Get-ChildItem -Path "C:\VBCable" -Filter '*.inf' -Recurse | Select-Object -First 1
              if ($inf) { pnputil /add-driver ($inf.FullName) /install }
          } | Out-Null

          Start-Job -ScriptBlock {
              choco install sunshine -y --no-progress --limit-output
              Start-Service -Name 'SunshineService' -ErrorAction SilentlyContinue
          } | Out-Null

      # =====================================================================
      # 7. CÀI APP & HÌNH NỀN
      # =====================================================================
      - name: 📦 Cài App & Hình Nền
        shell: pwsh
        run: |
          Start-Job -ScriptBlock {
              $wallpaperUrl = "https://raw.githubusercontent.com/Dunghoang397/rdp-freeee/main/Zenova%20Cloud%20Aurora%20Lake.png"
              $wallpaperPath = "C:\Windows\Web\Wallpaper\Zenova.png"
              try {
                  Invoke-WebRequest -Uri "$wallpaperUrl" -OutFile "$wallpaperPath" -UseBasicParsing -ErrorAction SilentlyContinue
                  Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value "$wallpaperPath"
                  Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "10"
                  RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters
                  
                  $regPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\ActiveDesktop'
                  New-Item -Path "$regPath" -Force | Out-Null
                  Set-ItemProperty -Path "$regPath" -Name 'NoChangingWallPaper' -Value 1 -Type DWord
              } catch {}

              choco install discord -y --no-progress --limit-output
              choco install spotify -y --no-progress --limit-output
              choco install evkey -y --no-progress --limit-output
              choco install bandicam -y --no-progress --limit-output

              $installerUrl = 'https://download943.mediafire.com/be95vz5kgnig_m7acKGr-mRjXQQKAN0i2WdjIR_d-q70MeLboolFJnUHit6ZmqJYm8_rJigOgY0P5NhtdANnLGXOaEmKg9eWSEUGCEEIZdCrV2NNZ0ubdEO1hyPHR6l2Re85XT5kJpCd3Q4GXpeU0ZD2QSr5gc_6aPfM7r15_YltcA/mf82krdrzcy3dz8/StarDesk_1.5.3.exe'
              $installerPath = [System.IO.Path]::Combine("$env:USERPROFILE", 'Downloads', 'StarDesk.exe')
              New-Item -ItemType Directory -Force -Path (Split-Path "$installerPath") | Out-Null
              Invoke-WebRequest -Uri "$installerUrl" -OutFile "$installerPath" -UseBasicParsing -ErrorAction SilentlyContinue
              if (Test-Path "$installerPath") {
                  Start-Process -FilePath "$installerPath" -ArgumentList '/S' -Wait
                  Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Set-Service -StartupType Automatic
                  Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Start-Service
              }
          } | Out-Null

      # =====================================================================
      # 8. WEB QUẢN LÝ VPS
      # =====================================================================
      - name: 🌐 Web Quản Lý & Ngắt VPS
        shell: pwsh
        run: |
          $webScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'web.ps1')
          $lines = @(
              '$listener = [System.Net.HttpListener]::new();'
              '$listener.Prefixes.Add("http://+:8080/");'
              '$listener.Start();'
              'while ($listener.IsListening) {'
              '  $ctx = $listener.GetContext(); $req = $ctx.Request; $resp = $ctx.Response;'
              '  if ($req.HttpMethod -eq "POST" -and $req.Url.AbsolutePath.ToLower() -eq "/stop") {'
              '    Start-Process "shutdown.exe" -ArgumentList "/s /t 0";'
              '  }'
              '  if ($req.HttpMethod -eq "POST" -and $req.Url.AbsolutePath.ToLower() -eq "/restart") {'
              '    Set-Content -Path "$env:CONTROL_SIGNAL_FILE" -Value "RESTART_SESSION" -Encoding UTF8;'
              '  }'
              '  $html = "<html><body><h1>ZENOVA VPS CONTROL</h1><p>IP: $($env:TAILSCALE_IP)</p><p>User: zenova</p><p>Pass: ${{ inputs.fixed_password }}</p><br><form method=''POST'' action=''/restart''><button style=''padding:20px;background:orange;color:white;''>LƯU & KHỞI ĐỘNG LẠI</button></form><br><form method=''POST'' action=''/stop''><button style=''padding:20px;background:red;color:white;''>LƯU & NGẮT VPS</button></form></body></html>";'
              '  $buf = [System.Text.Encoding]::UTF8.GetBytes("$html");'
              '  $resp.ContentType = "text/html; charset=utf-8"; $resp.ContentLength64 = $buf.Length;'
              '  $resp.OutputStream.Write($buf, 0, $buf.Length); $resp.OutputStream.Close();'
              '}'
          )
          Set-Content -Path "$webScript" -Value ($lines -join "`r`n") -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', "`"$webScript`""

      # =====================================================================
      # 9. GIỮ MÁY CHẠY
      # =====================================================================
      - name: ⏳ Giữ Máy Chạy
        id: keepalive
        shell: pwsh
        run: |
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60)
          while ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() -lt $endEpoch) {
              Start-Sleep -Seconds 60
          }

      # =====================================================================
      # 10. KHỞI ĐỘNG PHIÊN MỚI
      # =====================================================================
      - name: 🔁 Kích hoạt phiên tiếp theo
        if: ${{ always() && steps.keepalive.outcome == 'success' }}
        shell: pwsh
        env:
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
        run: |
          $wf = [System.IO.Path]::GetFileName(("$env:GITHUB_WORKFLOW_REF" -split '@')[0])
          gh workflow run "$wf" --ref "$env:GITHUB_REF_NAME" -f "machine_id=$env:MACHINE_ID" -f "duration=$env:DURATION" -f auto_restart=true -f "windows_image=$env:WIN_IMAGE" -f "fixed_password=$env:FIXED_PASS"

  # =========================================================================
  # JOB 2: LINUX RUNNER
  # =========================================================================
  Zenova-Linux:
    name: 🐧 Linux RDP (Ubuntu + XFCE4 + XRDP + Tailscale)
    runs-on: ubuntu-latest
    if: ${{ inputs.os_type == 'linux' || inputs.os_type == 'both' }}
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'zenova-1' }}
      WEB_PORT: '8080'
      ENABLE_DUCKDNS: ${{ inputs.enable_duckdns }}
      FIXED_PASSWORD: ${{ inputs.fixed_password || 'Zenova@2026' }}
      INPUT_DURATION: ${{ inputs.duration }}
      AUTO_RESTART: ${{ inputs.auto_restart }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
      DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}

    steps:
      - name: 🐧 Dựng môi trường Ubuntu Linux & Chuẩn bị thông số
        shell: bash
        run: |
          set -e
          NOW_EPOCH=$(date +%s)
          echo "JOB_START_EPOCH=$NOW_EPOCH" >> "$GITHUB_ENV"

          RAW_ID="${MACHINE_ID:-zenova-1}"
          CLEAN_ID=$(echo "$RAW_ID" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g' | sed -E 's/-+/-/g' | sed -E 's/^-|-$//g')
          if [ -z "$CLEAN_ID" ]; then CLEAN_ID="linux-1"; fi

          RELEASE_TAG="zenova-linux-$CLEAN_ID"
          STATE_BRANCH="zenova-linux-state-$CLEAN_ID"
          echo "MACHINE_ID=$CLEAN_ID" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "STATE_BRANCH=$STATE_BRANCH" >> "$GITHUB_ENV"

          TOTAL=300
          if [ "$INPUT_DURATION" = "1h" ]; then
            TOTAL=60
          elif [ "$INPUT_DURATION" = "3h" ]; then
            TOTAL=180
          elif [ "$INPUT_DURATION" = "5h00m" ]; then
            TOTAL=300
          fi
          echo "TOTAL_MINUTES=$TOTAL" >> "$GITHUB_ENV"

          STORAGE_ROOT="/home/runner/persistent_storage"
          mkdir -p "$STORAGE_ROOT" "$STORAGE_ROOT/config" "$STORAGE_ROOT/data" "$STORAGE_ROOT/apps"
          echo "STORAGE_ROOT=$STORAGE_ROOT" >> "$GITHUB_ENV"

          CONTROL_SIGNAL_FILE="/tmp/linux_control_signal.txt"
          rm -f "$CONTROL_SIGNAL_FILE"
          echo "CONTROL_SIGNAL_FILE=$CONTROL_SIGNAL_FILE" >> "$GITHUB_ENV"

          echo "=========================================================="
          echo "🐧 KHỞI TẠO LINUX VPS (UBUNTU) - MACHINE ID: $CLEAN_ID"
          echo "🏷️ Release Tag: $RELEASE_TAG"
          echo "🌿 State Branch: $STATE_BRANCH"
          echo "⏱️ Thời gian hoạt động: ${TOTAL} phút"
          echo "=========================================================="

          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "📦 Tạo mới GitHub Release lưu trữ cho máy Linux ($RELEASE_TAG)..."
            INIT_FILE="/tmp/linux_init.txt"
            echo "Zenova Linux Storage initialized at $(date -u)" > "$INIT_FILE"
            gh release create "$RELEASE_TAG" "$INIT_FILE" --repo "$GH_REPO" --title "Linux Storage ($CLEAN_ID)" --notes "Bản lưu trữ dữ liệu tự động cho máy Linux $CLEAN_ID"
          else
            echo "✅ Đã tìm thấy GitHub Release: $RELEASE_TAG"
          fi

      - name: 🧰 Tạo script đóng gói & đẩy dữ liệu Linux lên GitHub
        shell: bash
        run: |
          cat << 'EOF' > /tmp/save-linux.sh
          #!/usr/bin/env bash
          REASON="${1:-session-end}"
          echo "💾 [$REASON] Bắt đầu quá trình lưu trữ an toàn dữ liệu Linux..."

          if [ ! -f /tmp/session_ready.flag ] || [ ! -f /tmp/data_restored.flag ]; then
            echo "⚠️ Phiên Linux chưa khởi tạo hoàn chỉnh hoặc chưa khôi phục xong, bỏ qua lưu để bảo vệ dữ liệu gốc!"
            exit 0
          fi

          echo "🛑 [$REASON] Đang đóng các ứng dụng (Chrome, Discord, Spotify)..."
          pkill -f "chrome" || true
          pkill -f "chromium" || true
          pkill -f "discord" || true
          pkill -f "spotify" || true
          pkill -f "vlc" || true
          sleep 2

          PACK_DIR="/tmp/linux-pack-$REASON"
          rm -rf "$PACK_DIR"
          mkdir -p "$PACK_DIR"

          STAGE_DIR="$PACK_DIR/stage"
          mkdir -p "$STAGE_DIR"

          echo "📦 [$REASON] Đang gom dữ liệu người dùng..."
          cp -r /home/runner/persistent_storage "$STAGE_DIR/" 2>/dev/null || true
          cp -r /home/runner/Desktop "$STAGE_DIR/" 2>/dev/null || true
          cp -r /home/runner/Documents "$STAGE_DIR/" 2>/dev/null || true
          cp -r /home/runner/Downloads "$STAGE_DIR/" 2>/dev/null || true
          mkdir -p "$STAGE_DIR/user_config"
          cp -r /home/runner/.config "$STAGE_DIR/user_config/" 2>/dev/null || true

          ARCHIVE_BASE="$PACK_DIR/linux-data.7z"
          echo "🗜️ [$REASON] Đang nén dữ liệu bằng 7z (chia nhỏ 1900MB)..."
          cd "$STAGE_DIR"
          7z a -t7z -mx=1 -mmt=on -v1900m "$ARCHIVE_BASE" * >/dev/null 2>&1
          cd - >/dev/null

          CHUNKS=($(ls "$PACK_DIR"/linux-data.7z.* 2>/dev/null | sort))
          CHUNK_COUNT=${#CHUNKS[@]}
          if [ "$CHUNK_COUNT" -eq 0 ]; then
            echo "❌ Không tạo được gói nén dữ liệu Linux!"
            exit 1
          fi

          MANIFEST="$PACK_DIR/drive-manifest.json"
          cat << JSON_EOF > "$MANIFEST"
          {
            "machineId": "$MACHINE_ID",
            "updatedUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "reason": "$REASON",
            "os": "ubuntu-linux",
            "chunkCount": $CHUNK_COUNT
          }
          JSON_EOF

          UPLOAD_FILES=("${CHUNKS[@]}" "$MANIFEST")
          UPLOAD_OK=0
          for attempt in 1 2 3; do
            echo "⬆️ [$REASON] Đang tải lên GitHub Release $RELEASE_TAG (Lần $attempt)..."
            if gh release upload "$RELEASE_TAG" "${UPLOAD_FILES[@]}" --repo "$GH_REPO" --clobber; then
              UPLOAD_OK=1
              break
            else
              echo "⚠️ Upload thất bại lần $attempt, chờ 5s..."
              sleep 5
            fi
          done

          if [ "$UPLOAD_OK" -eq 0 ]; then
            echo "❌ Upload lên GitHub Release thất bại sau 3 lần thử!"
            rm -rf "$PACK_DIR"
            exit 1
          fi

          VALID_NAMES=($(basename -a "${UPLOAD_FILES[@]}"))
          VALID_NAMES+=("init.txt")
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets | jq -r '.assets[].name' 2>/dev/null | while read -r asset; do
            if [[ "$asset" == linux-data.7z.* ]]; then
              KEEP=0
              for v in "${VALID_NAMES[@]}"; do
                if [ "$v" = "$asset" ]; then KEEP=1; break; fi
              done
              if [ "$KEEP" -eq 0 ]; then
                echo "🗑️ Xóa mảnh cũ: $asset"
                gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GH_REPO" -y >/dev/null 2>&1 || true
              fi
            fi
          done

          rm -rf "$PACK_DIR"
          echo "✅ [$REASON] Đã lưu thành công dữ liệu Linux lên GitHub Release ($RELEASE_TAG)!"
          exit 0
          EOF
          chmod +x /tmp/save-linux.sh
          echo "✅ Đã tạo /tmp/save-linux.sh"

      - name: ♻️ Khôi phục dữ liệu Linux từ GitHub Release
        shell: bash
        run: |
          echo "♻️ Đang kiểm tra bản sao lưu dữ liệu trên GitHub Release ($RELEASE_TAG)..."
          RESTORE_DIR="/tmp/linux-restore"
          rm -rf "$RESTORE_DIR"
          mkdir -p "$RESTORE_DIR"

          if ! gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "drive-manifest.json" --dir "$RESTORE_DIR" 2>/dev/null; then
            echo "ℹ️ Chưa có bản sao lưu trước đó (Lần đầu khởi chạy). Tạo phiên làm việc mới tinh!"
            touch /tmp/data_restored.flag
            echo "DATA_RESTORED=1" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f "$RESTORE_DIR/drive-manifest.json" ]; then
            echo "ℹ️ Manifest không tồn tại. Tạo phiên làm việc mới!"
            touch /tmp/data_restored.flag
            echo "DATA_RESTORED=1" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "📦 Tìm thấy bản lưu. Đang tải các phân mảnh dữ liệu..."
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern "linux-data.7z.*" --dir "$RESTORE_DIR"

          FIRST_CHUNK="$RESTORE_DIR/linux-data.7z.001"
          if [ -f "$FIRST_CHUNK" ]; then
            echo "🗜️ Đang giải nén dữ liệu..."
            STAGE_EXTRACT="/tmp/linux-stage-extract"
            rm -rf "$STAGE_EXTRACT"
            mkdir -p "$STAGE_EXTRACT"
            7z x "$FIRST_CHUNK" -o"$STAGE_EXTRACT" -y >/dev/null 2>&1

            if [ -d "$STAGE_EXTRACT/persistent_storage" ]; then
              cp -rf "$STAGE_EXTRACT/persistent_storage"/* /home/runner/persistent_storage/ 2>/dev/null || true
            fi
            if [ -d "$STAGE_EXTRACT/Desktop" ]; then
              mkdir -p /home/runner/Desktop
              cp -rf "$STAGE_EXTRACT/Desktop"/* /home/runner/Desktop/ 2>/dev/null || true
            fi
            if [ -d "$STAGE_EXTRACT/Documents" ]; then
              mkdir -p /home/runner/Documents
              cp -rf "$STAGE_EXTRACT/Documents"/* /home/runner/Documents/ 2>/dev/null || true
            fi
            if [ -d "$STAGE_EXTRACT/Downloads" ]; then
              mkdir -p /home/runner/Downloads
              cp -rf "$STAGE_EXTRACT/Downloads"/* /home/runner/Downloads/ 2>/dev/null || true
            fi
            if [ -d "$STAGE_EXTRACT/user_config/.config" ]; then
              mkdir -p /home/runner/.config
              cp -rf "$STAGE_EXTRACT/user_config/.config"/* /home/runner/.config/ 2>/dev/null || true
            fi

            rm -rf "$STAGE_EXTRACT"
            echo "✅ Đã khôi phục hoàn chỉnh dữ liệu và cấu hình từ phiên trước!"
          fi

          rm -rf "$RESTORE_DIR"
          touch /tmp/data_restored.flag
          echo "DATA_RESTORED=1" >> "$GITHUB_ENV"

      - name: ⚙️ Tối ưu hệ thống Linux
        shell: bash
        run: |
          echo "⚙️ ĐANG TỐI ƯU HỆ THỐNG LINUX KERNEL & TẮT DỊCH VỤ GÂY LAG..."
          sudo tee /etc/sysctl.d/99-performance.conf > /dev/null << 'SYSCTL_EOF'
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
          fs.file-max = 2097152
          net.core.somaxconn = 4096
          net.core.netdev_max_backlog = 5000
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_slow_start_after_idle = 0
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.tcp_fin_timeout = 15
          SYSCTL_EOF

          sudo sysctl --system >/dev/null 2>&1 || true
          echo "│  ✅ Đã nạp cấu hình tối ưu sysctl (vm.swappiness=10, tcp_fastopen=3)"

          SERVICES_TO_STOP=(
            "unattended-upgrades.service"
            "motd-news.timer"
            "apport.service"
            "whoopsie.service"
            "snapd.seeded.service"
          )
          for svc in "${SERVICES_TO_STOP[@]}"; do
            sudo systemctl stop "$svc" 2>/dev/null || true
            sudo systemctl disable "$svc" 2>/dev/null || true
          done
          echo "│  ✅ Đã vô hiệu hóa các dịch vụ nền làm chậm hệ thống"

          sudo timedatectl set-timezone Asia/Ho_Chi_Minh || true
          echo "│  ✅ Đã đặt múi giờ Việt Nam (Asia/Ho_Chi_Minh - UTC+7)"

      - name: 🖥️ Cài đặt giao diện Desktop XFCE4 & XRDP Server
        shell: bash
        run: |
          echo "🖥️ Đang cài đặt môi trường đồ họa nhẹ XFCE4 và dịch vụ XRDP Server..."
          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-goodies \
            xrdp xorgxrdp \
            dbus-x11 x11-xserver-utils \
            p7zip-full curl wget git htop jq net-tools >/dev/null 2>&1

          echo "xfce4-session" > /home/runner/.xsession
          chmod +x /home/runner/.xsession
          sudo chown runner:runner /home/runner/.xsession

          sudo adduser xrdp ssl-cert || true

          sudo sed -i 's/max_bpp=32/max_bpp=16/g' /etc/xrdp/xrdp.ini || true
          sudo sed -i 's/xserverbpp=24/xserverbpp=16/g' /etc/xrdp/xrdp.ini || true
          sudo sed -i 's/crypt_level=high/crypt_level=low/g' /etc/xrdp/xrdp.ini || true

          mkdir -p /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml
          cat << 'XFCONF_EOF' > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="use_compositing" type="bool" value="false"/>
            </property>
          </channel>
          XFCONF_EOF
          sudo chown -R runner:runner /home/runner/.config

          sudo systemctl restart xrdp
          sudo systemctl enable xrdp
          echo "✅ Đã cài đặt và khởi động dịch vụ XRDP Server thành công (Port 3389)!"

      - name: 👤 Đặt mật khẩu tài khoản Runner cho RDP
        shell: bash
        run: |
          echo "👤 Đang thiết lập mật khẩu truy cập RDP cho user 'runner'..."
          PASS="${FIXED_PASSWORD:-Zenova@2026}"
          echo "runner:$PASS" | sudo chpasswd
          echo "root:$PASS" | sudo chpasswd

          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner >/dev/null
          sudo chmod 0440 /etc/sudoers.d/runner
          echo "✅ Đã cập nhật mật khẩu cho user 'runner'!"

      - name: 📦 Cài đặt ứng dụng Linux (Chrome, Discord, Spotify, VLC, Tools)
        shell: bash
        run: |
          echo "📦 Đang cài đặt bộ ứng dụng tiêu chuẩn trên Linux..."

          echo "🌐 Đang cài đặt Google Chrome..."
          wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb || true
          if [ -f /tmp/google-chrome.deb ]; then
            sudo apt-get install -y -qq /tmp/google-chrome.deb >/dev/null 2>&1 || sudo apt-get -f install -y -qq >/dev/null 2>&1
            rm -f /tmp/google-chrome.deb
            echo "│  ✅ Đã cài Google Chrome"
          fi

          echo "🎬 Đang cài đặt VLC..."
          sudo apt-get install -y -qq vlc >/dev/null 2>&1 || true
          echo "│  ✅ Đã cài VLC"

          echo "💬 Đang cài đặt Discord & Spotify..."
          if command -v snap >/dev/null 2>&1; then
            sudo snap install discord --classic 2>/dev/null || true
            sudo snap install spotify 2>/dev/null || true
          fi

          mkdir -p /home/runner/Desktop
          if [ -f /usr/share/applications/google-chrome.desktop ]; then
            cp /usr/share/applications/google-chrome.desktop /home/runner/Desktop/
            chmod +x /home/runner/Desktop/google-chrome.desktop
          fi
          if [ -f /usr/share/applications/vlc.desktop ]; then
            cp /usr/share/applications/vlc.desktop /home/runner/Desktop/
            chmod +x /home/runner/Desktop/vlc.desktop
          fi

          cat << 'URL_EOF' > /home/runner/Desktop/Web-Quan-Ly.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Web Quản Lý VPS
          Comment=Truy cập Web Quản Lý VPS
          Exec=google-chrome http://127.0.0.1:8080/
          Icon=network-workgroup
          Terminal=false
          StartupNotify=true
          URL_EOF
          chmod +x /home/runner/Desktop/Web-Quan-Ly.desktop

          sudo chown -R runner:runner /home/runner/Desktop
          echo "✅ Cài đặt ứng dụng Linux và tạo biểu tượng Desktop hoàn tất!"

      - name: 🌐 Thiết lập mạng Tailscale trên Linux
        shell: bash
        run: |
          echo "🌐 Đang thiết lập mạng Tailscale cho máy Linux [$MACHINE_ID]..."
          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "❌ Thiếu secret TAILSCALE_AUTH_KEY!"
            exit 1
          fi

          if ! command -v tailscale >/dev/null 2>&1; then
            curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
          fi

          sudo systemctl enable --now tailscaled >/dev/null 2>&1
          sleep 3

          TS_HOSTNAME="zenova-linux-$MACHINE_ID-$GITHUB_RUN_ID"
          echo "🔗 Đang kết nối vào mạng Tailscale với Hostname: $TS_HOSTNAME..."
          sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="$TS_HOSTNAME" --accept-routes --accept-dns --reset

          IP=""
          for i in {1..20}; do
            IP=$(tailscale ip -4 2>/dev/null | tr -d '[:space:]')
            if [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              break
            fi
            sleep 2
          done

          if [ -z "$IP" ]; then
            echo "❌ Không lấy được địa chỉ IP Tailscale!"
            exit 1
          fi

          echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
          echo "✅ Kết nối Tailscale thành công! IP Linux: $IP (Hostname: $TS_HOSTNAME)"

      - name: 🦆 Cập nhật DuckDNS trên Linux
        if: ${{ inputs.enable_duckdns }}
        shell: bash
        run: |
          echo "🦆 Đang cập nhật DuckDNS cho máy Linux..."
          if [ -z "$DUCKDNS_TOKEN" ] || [ -z "$DUCKDNS_DOMAIN" ]; then
            echo "ℹ️ Thiếu secret DUCKDNS_TOKEN hoặc DUCKDNS_DOMAIN, bỏ qua DuckDNS"
            exit 0
          fi

          DOMAIN=$(echo "$DUCKDNS_DOMAIN" | tr '[:upper:]' '[:lower:]' | sed 's/\.duckdns\.org$//')
          IP="${TAILSCALE_IP}"
          if [ -z "$IP" ]; then
            echo "⚠️ Chưa có IP Tailscale, bỏ qua DuckDNS"
            exit 0
          fi

          RES=$(curl -s "https://www.duckdns.org/update?domains=$DOMAIN&token=$DUCKDNS_TOKEN&ip=$IP" || true)
          if [ "$RES" = "OK" ]; then
            echo "DUCKDNS_HOST=${DOMAIN}.duckdns.org" >> "$GITHUB_ENV"
            echo "✅ DuckDNS đã cập nhật thành công: ${DOMAIN}.duckdns.org -> $IP"
          else
            echo "⚠️ DuckDNS trả về kết quả: $RES"
          fi

      - name: 🌐 Khởi chạy Web Quản Lý Linux (Port 8080)
        shell: bash
        run: |
          echo "🌐 Đang khởi chạy Web Quản Lý VPS Linux trên port $WEB_PORT..."
          cat << 'PY_EOF' > /tmp/web_server.py
          import http.server
          import socketserver
          import os
          import json
          from datetime import datetime

          PORT = int(os.environ.get("WEB_PORT", 8080))
          SIG_FILE = os.environ.get("CONTROL_SIGNAL_FILE", "/tmp/linux_control_signal.txt")
          MACHINE_ID = os.environ.get("MACHINE_ID", "linux-1")
          IP = os.environ.get("TAILSCALE_IP", "127.0.0.1")
          PASS = os.environ.get("FIXED_PASSWORD", "Zenova@2026")

          class VPSHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-type", "text/html; charset=utf-8")
                  self.end_headers()
                  html = f"""<!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>Zenova Linux VPS Control Panel</title>
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <style>
                  body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }}
                  .card {{ max-width: 650px; margin: 30px auto; background: #1e293b; border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }}
                  h1 {{ color: #38bdf8; margin-top: 0; }}
                  .info {{ background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-family: monospace; font-size: 15px; }}
                  .btn {{ display: block; width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }}
                  .btn-save {{ background: #0284c7; }}
                  .btn-save:hover {{ background: #0369a1; }}
                  .btn-restart {{ background: #ea580c; }}
                  .btn-restart:hover {{ background: #c2410c; }}
                  .btn-stop {{ background: #dc2626; }}
                  .btn-stop:hover {{ background: #b91c1c; }}
              </style>
          </head>
          <body>
              <div class="card">
                  <h1>🐧 ZENOVA LINUX VPS DASHBOARD</h1>
                  <p>Môi trường: <strong>Ubuntu Linux (XFCE4 + XRDP)</strong></p>
                  <div class="info">
                      <div>📌 Machine ID: <strong>{MACHINE_ID}</strong></div>
                      <div>🌐 IP Tailscale: <strong>{IP}</strong></div>
                      <div>👤 RDP User: <strong>runner</strong></div>
                      <div>🔐 RDP Password: <strong>{PASS}</strong></div>
                      <div>🔌 RDP Port: <strong>3389</strong></div>
                  </div>
                  <form method="POST" action="/save">
                      <button class="btn btn-save">💾 LƯU DỮ LIỆU NGAY LẬP TỨC</button>
                  </form>
                  <form method="POST" action="/restart">
                      <button class="btn btn-restart">🔁 LƯU & KHỞI ĐỘNG LẠI PHIÊN MỚI</button>
                  </form>
                  <form method="POST" action="/stop">
                      <button class="btn btn-stop">🛑 LƯU & DỪNG MÁY CHỦ</button>
                  </form>
              </div>
          </body>
          </html>"""
                  self.wfile.write(html.encode("utf-8"))

              def do_POST(self):
                  action = self.path.strip("/")
                  if action in ["save", "restart", "stop"]:
                      cmd = {"save": "SAVE_NOW", "restart": "RESTART_SESSION", "stop": "STOP_SESSION"}[action]
                      with open(SIG_FILE, "w", encoding="utf-8") as f:
                          f.write(cmd)
                  self.send_response(200)
                  self.send_header("Content-type", "text/html; charset=utf-8")
                  self.end_headers()
                  msg = f"Đã gửi lệnh {action.upper()} thành công! Hệ thống đang xử lý..."
                  self.wfile.write(f"<html><head><meta http-equiv='refresh' content='3;url=/'></head><body style='background:#0f172a;color:#38bdf8;padding:40px;font-family:sans-serif;'><h2>✅ {msg}</h2><p>Tự động quay lại trang chủ sau 3 giây...</p></body></html>".encode("utf-8"))

          server = socketserver.TCPServer(("", PORT), VPSHandler)
          server.serve_forever()
          PY_EOF

          nohup python3 /tmp/web_server.py >/dev/null 2>&1 &
          sleep 2
          echo "✅ Web Quản Lý Linux đã chạy nền trên cổng $WEB_PORT!"

      - name: 🩺 Kiểm tra sức khỏe Linux & Xác nhận sẵn sàng (Health Check)
        shell: bash
        run: |
          echo "🩺 ĐANG KIỂM TRA SỨC KHỎE HỆ THỐNG LINUX TRƯỚC KHI BÀN GIAO..."

          if systemctl is-active --quiet xrdp; then
            echo "│  ✅ Dịch vụ XRDP: HOẠT ĐỘNG TỐT"
          else
            echo "│  ⚠️  Dịch vụ XRDP chưa chạy, đang khởi động lại..."
            sudo systemctl restart xrdp
          fi

          if [ -n "$TAILSCALE_IP" ]; then
            echo "│  ✅ Mạng Tailscale: HOẠT ĐỘNG TỐT ($TAILSCALE_IP)"
          else
            echo "│  ⚠️  Mạng Tailscale chưa có IP!"
          fi

          touch /tmp/session_ready.flag
          echo "SESSION_READY=1" >> "$GITHUB_ENV"
          echo "🎯 ĐÃ KÍCH HOẠT CỜ SESSION_READY=1"

      - name: 🎉 Thông tin kết nối Linux RDP
        shell: bash
        run: |
          IP="${TAILSCALE_IP}"
          PASS="${FIXED_PASSWORD:-Zenova@2026}"
          DNS="${DUCKDNS_HOST:-Chưa cấu hình}"

          echo ""
          echo "┌──────────────────────────────────────────────────────────────┐"
          echo "│ 🚀 LINUX UBUNTU VPS (XFCE4 DESKTOP) ĐÃ SẴN SÀNG! KẾT NỐI NGAY! │"
          echo "├──────────────────────────────────────────────────────────────┤"
          echo "│ 🌐 IP Tailscale : $IP"
          echo "│ 🦆 DuckDNS Host : $DNS"
          echo "│ 👤 RDP User     : runner"
          echo "│ 🔑 Password     : $PASS"
          echo "│ 🖥️ RDP Client   : Kết nối qua Remote Desktop tới: $IP:3389"
          echo "│ 🎛️ Web Quản Lý : http://$IP:$WEB_PORT/"
          echo "└──────────────────────────────────────────────────────────────┘"
          echo ""

      - name: ⏳ Duy trì phiên làm việc Linux (Keep-Alive & Tự phục hồi dịch vụ)
        id: keepalive_linux
        shell: bash
        run: |
          END_EPOCH=$(( JOB_START_EPOCH + (TOTAL_MINUTES * 60) ))
          SIG_FILE="/tmp/linux_control_signal.txt"
          LAST_LOG=0
          WARNED=0

          echo "🔄 BẮT ĐẦU DUY TRÌ PHIÊN LÀM VIỆC CHO MÁY LINUX [$MACHINE_ID]..."

          while true; do
            if [ -f "$SIG_FILE" ]; then
              CMD=$(cat "$SIG_FILE" | tr -d '[:space:]')
              rm -f "$SIG_FILE"
              if [ "$CMD" = "SAVE_NOW" ]; then
                echo "💾 [WEB-PANEL] Nhận lệnh LƯU NGAY từ Web Quản Lý..."
                /tmp/save-linux.sh "manual-web-save" || true
              elif [ "$CMD" = "RESTART_SESSION" ]; then
                echo "🔁 [WEB-PANEL] Nhận lệnh LƯU & KHỞI ĐỘNG LẠI PHIÊN MỚI!"
                echo "FORCE_NEXT_SESSION=1" >> "$GITHUB_ENV"
                break
              elif [ "$CMD" = "STOP_SESSION" ]; then
                echo "🛑 [WEB-PANEL] Nhận lệnh LƯU & DỪNG MÁY CHỦ!"
                echo "FORCE_STOP_ONLY=1" >> "$GITHUB_ENV"
                break
              fi
            fi

            NOW=$(date +%s)
            REMAIN=$(( END_EPOCH - NOW ))
            if [ "$REMAIN" -le 0 ]; then
              echo "⏰ Đã hết thời gian phiên làm việc Linux!"
              break
            fi

            if [ "$WARNED" -eq 0 ] && [ "$REMAIN" -le 300 ]; then
              echo "⚠️ Phiên Linux chỉ còn 5 phút! Dữ liệu sẽ tự động đóng gói lưu lên GitHub Release."
              WARNED=1
            fi

            if [ $(( NOW - LAST_LOG )) -ge 300 ]; then
              if ! systemctl is-active --quiet xrdp; then
                sudo systemctl restart xrdp
              fi
              REMAIN_H=$(( REMAIN / 3600 ))
              REMAIN_M=$(( (REMAIN % 3600) / 60 ))
              XRDP_STAT=$(systemctl is-active xrdp || echo "inactive")
              echo "[$(date +'%H:%M:%S')] 📊 [$MACHINE_ID] XRDP: $XRDP_STAT | IP: $TAILSCALE_IP | Còn lại: ${REMAIN_H}h${REMAIN_M}m"
              LAST_LOG=$NOW
            fi

            sleep 5
          done

      - name: 💾 Lưu toàn bộ dữ liệu Linux cuối phiên lên GitHub
        if: always()
        shell: bash
        run: |
          echo "💾 ĐANG ĐÓNG GÓI VÀ LƯU DỮ LIỆU LINUX CUỐI PHIÊN LÊN GITHUB RELEASE..."
          if [ -f /tmp/save-linux.sh ]; then
            /tmp/save-linux.sh "session-end" || true
          fi

      - name: 🧹 Dọn dẹp hệ thống Linux
        if: always()
        shell: bash
        run: |
          echo "🧹 Đang dọn dẹp hệ thống Linux trước khi kết thúc..."
          sudo apt-get clean 2>/dev/null || true
          rm -rf /tmp/linux-pack* /tmp/linux-restore* 2>/dev/null || true
          echo "✅ Đã dọn dẹp sạch sẽ!"

      - name: 🔁 Kích hoạt phiên tiếp theo & Khởi động lại Linux VPS
        if: ${{ always() && (inputs.auto_restart || env.FORCE_NEXT_SESSION == '1') && env.FORCE_STOP_ONLY != '1' }}
        shell: bash
        run: |
          echo "🔁 ĐANG KÍCH HOẠT PHIÊN LÀM VIỆC MỚI QUA WORKFLOW DISPATCH..."
          WF=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          gh workflow run "$WF" --ref "$GITHUB_REF_NAME" \
            -f "os_type=linux" \
            -f "machine_id=$MACHINE_ID" \
            -f "duration=$INPUT_DURATION" \
            -f "auto_restart=true" \
            -f "fixed_password=${{ inputs.fixed_password }}" \
            -f "enable_duckdns=${{ inputs.enable_duckdns }}"
          echo "✅ ĐÃ KÍCH HOẠT PHIÊN LINUX TIẾP THEO THÀNH CÔNG!"
