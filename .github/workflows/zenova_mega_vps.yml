          Write-Host "ðŸŽ›ï¸ Web Quáº£n LÃ½     : http://$($env:TAILSCALE_IP):$($env:WEB_PORT)/" -ForegroundColor Yellow;
          Write-Host "ðŸ• Káº¿t thÃºc dá»± kiáº¿n: $($endLocal.ToString('HH:mm:ss'))" -ForegroundColor Green;
          Write-Host "";

          $lastLog = (Get-Date).AddHours(-1);
