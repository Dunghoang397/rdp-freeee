              '--url', 'https://github.com/ddvdat-glitch/abcd/releases/download/app/StarDesk_1.5.3.exe', '-o', "$payload\StarDesk_1.5.3.exe",
              
              # Cloudflared Tunnel
              '--url', 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe', '-o', "$payload\cloudflared.exe",

              # Gaming & Tools (Bloxstrap, PrismLauncher, EVKey, VC++, .NET 8, Spotify, Bandicam, Wallpaper)
              '--url', 'https://github.com/bloxstraplabs/bloxstrap/releases/download/v2.7.0/Bloxstrap-v2.7.0.exe', '-o', "$payload\Bloxstrap.exe",
              '--url', 'https://github.com/Diegiwg/PrismLauncher-Cracked/releases/download/11.0.3/PrismLauncher-Windows-MSVC-Portable-11.0.3.zip', '-o', "$payload\PrismLauncher.zip",
              '--url', 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip', '-o', "$payload\EVKey.zip",
              '--url', 'https://aka.ms/vs/17/release/vc_redist.x64.exe', '-o', "$payload\vc_redist.x64.exe",
              '--url', 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe', '-o', "$payload\windowsdesktop-runtime-win-x64.exe",
              '--url', 'https://download.scdn.co/SpotifySetup.exe', '-o', "$payload\SpotifySetup.exe",
              '--url', 'https://dl.bandicam.com/bdcamsetup.exe', '-o', "$payload\bdcamsetup.exe",
              '--url', 'https://raw.githubusercontent.com/Dunghoang397/rdp-freeee/2715203b1462985959767187a585efb637441f9f/Zenova%20Cloud%20Aurora%20Lake.png', '-o', "$payload\Zenova.png",

              # Trọn bộ 9 file từ thư mục Downloads\app của bạn (Không thiếu bất kỳ file nào!)
              '--url', "$baseRelease/Antigravity-x64.exe", '-o', "$payload\Antigravity-x64.exe",
              '--url', "$baseRelease/AutoClicker.exe", '-o', "$payload\AutoClicker.exe",
              '--url', "$baseRelease/CloudCordSetup.exe", '-o', "$payload\CloudCordSetup.exe",
              '--url', "$baseRelease/DiscordSetup.exe", '-o', "$payload\DiscordSetup.exe",
              '--url', "$baseRelease/Microsoft.Store.Installer.exe", '-o', "$payload\Microsoft.Store.Installer.exe",
              '--url', "$baseRelease/VSCodeUserSetup-x64-1.144.0.exe", '-o', "$payload\VSCodeUserSetup-x64-1.144.0.exe",
              '--url', "$baseRelease/windhawk_setup.exe", '-o', "$payload\windhawk_setup.exe",
              '--url', "$baseRelease/download.2.jpg", '-o', "$payload\download.2.jpg",
              '--url', "$baseRelease/minecraft.wallpaper.jpg", '-o', "$payload\minecraft.wallpaper.jpg"
          );

          & curl.exe -L -s --parallel --parallel-max 16 --parallel-immediate --retry 2 -Z @downloads;
          Write-Host "✅ Đã tải xong toàn bộ 24 gói ứng dụng & driver với tốc độ siêu tốc!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 11. CÀI ĐẶT SIÊU TỐC CARD ÂM THANH ẢO (VB-CABLE) & MÀN HÌNH ẢO (VDD)
      # ─────────────────────────────────────────────────────────────
      - name: 🔊 Cài đặt Siêu Tốc Card Âm Thanh Ảo (VB-Cable) & Màn Hình Ảo (VDD)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🔊 ĐANG CÀI ĐẶT CARD ÂM THANH ẢO & MÀN HÌNH ẢO..." -ForegroundColor Yellow;

          $payload = "$env:PAYLOAD_DIR";

          # 1. Bật toàn bộ Audio Services
          @('MMCSS', 'AudioEndpointBuilder', 'Audiosrv') | ForEach-Object {
              Set-Service -Name "$_" -StartupType Automatic -ErrorAction SilentlyContinue;
              Start-Service -Name "$_" -ErrorAction SilentlyContinue;
          };
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\Audiosrv' -Name 'Start' -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue;

          # 2. Giải nén và cài đặt VB-Cable
          if (Test-Path "$payload\VBCable.zip") {
              New-Item -ItemType Directory -Force -Path 'C:\VBCable' -ErrorAction SilentlyContinue | Out-Null;
              & tar.exe -xf "$payload\VBCable.zip" -C 'C:\VBCable' 2>$null;
              $vbInf = Get-ChildItem -Path 'C:\VBCable' -Filter '*64*.inf' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1;
              if ($vbInf) { & pnputil.exe /add-driver "$($vbInf.FullName)" /install /force *> $null; }
              $vbSetup = Get-ChildItem -Path 'C:\VBCable' -Filter 'VBCABLE_Setup_x64.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1;
              if ($vbSetup) { Start-Process -FilePath $vbSetup.FullName -ArgumentList "-i", "-h" -Wait -ErrorAction SilentlyContinue; }
          }

          # 3. Đặt VB-Cable làm thiết bị âm thanh mặc định qua SoundVolumeView
          if (Test-Path "$payload\svv.zip") {
              New-Item -ItemType Directory -Force -Path 'C:\SoundVolumeView' -ErrorAction SilentlyContinue | Out-Null;
              & tar.exe -xf "$payload\svv.zip" -C 'C:\SoundVolumeView' 2>$null;
              $svv = 'C:\SoundVolumeView\SoundVolumeView.exe';
              if (Test-Path "$svv") {
                  & "$svv" /SetDefault "CABLE Input" all *> $null;
                  & "$svv" /SetDefault "CABLE Output" all *> $null;
                  & "$svv" /Unmute "CABLE Input" *> $null;
                  & "$svv" /Unmute "CABLE Output" *> $null;
              }
          }

          # 4. Mở khóa Registry ghi nhận âm thanh từ xa của Windows Server
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'fDisableAudioCapture' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name 'fDisableAudioCapture' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          Restart-Service -Name 'Audiosrv' -Force -ErrorAction SilentlyContinue;
          Restart-Service -Name 'AudioEndpointBuilder' -Force -ErrorAction SilentlyContinue;

          # 5. Cài đặt màn hình ảo VDD (Amyuni)
          if (Test-Path "$payload\usbmmidd_v2.zip") {
              New-Item -ItemType Directory -Force -Path 'C:\usbmmidd_v2' -ErrorAction SilentlyContinue | Out-Null;
              & tar.exe -xf "$payload\usbmmidd_v2.zip" -C 'C:\' 2>$null;
              Push-Location 'C:\usbmmidd_v2';
              Get-ChildItem -Filter '*.cer' | ForEach-Object {
                  Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null;
                  Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null;
              };
              & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null;
              & .\deviceinstaller64.exe enableidd 1 *> $null;
              Pop-Location;
          }

          Write-Host "✅ Card âm thanh ảo & Màn hình ảo VDD đã kích hoạt thành công!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 12. CÀI ĐẶT SUNSHINE & FIX TRIỆT ĐỂ LỖI CSRF PROTECTION ERROR
      # ─────────────────────────────────────────────────────────────
      - name: ☀️ Cài đặt Sunshine & Fix Lỗi CSRF Protection Error (Hỗ trợ Tailscale IP & Cloudflare)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "☀️ ĐANG CÀI ĐẶT & THIẾT LẬP SUNSHINE FIX CSRF..." -ForegroundColor Yellow;

          $payload = "$env:PAYLOAD_DIR";
          if (Test-Path "$payload\Sunshine.msi") {
              Start-Process msiexec.exe -ArgumentList "/i `"$payload\Sunshine.msi`" /qn /norestart" -Wait;
          }

          $sunExe = 'C:\Program Files\Sunshine\sunshine.exe';
          $pass = if ($env:FIXED_PASSWORD) { $env:FIXED_PASSWORD } else { "Zenova@2026" };

          if (Test-Path "$sunExe") {
              & "$sunExe" --creds zenova "$pass" 2>&1 | Out-Null;
          }

          # Danh sách nguồn được phép chống CSRF
          $tsIp = if (Test-Path "C:\tailscale-ip.txt") { (Get-Content "C:\tailscale-ip.txt" -Raw).Trim() } else { "" };
          $pubIp = if (Test-Path "C:\machine-ip.txt") { (Get-Content "C:\machine-ip.txt" -Raw).Trim() } else { "" };

          $allowedOrigins = @(
              "https://127.0.0.1:47990",
              "https://localhost:47990"
          );
          if ($tsIp -and ($tsIp -match '^100\.')) { $allowedOrigins += "https://$($tsIp):47990"; }
          if ($pubIp -and ($pubIp -ne '127.0.0.1')) { $allowedOrigins += "https://$($pubIp):47990"; }
          $csrfOriginsStr = ($allowedOrigins | Select-Object -Unique) -join ',';

          $sunCfgDir = "C:\Program Files\Sunshine\config";
          New-Item -ItemType Directory -Force -Path $sunCfgDir -ErrorAction SilentlyContinue | Out-Null;

          # sunshine.conf tối ưu low-latency gaming & fix CSRF
          $sunConfContent = @"
          sunshine_name = Zenova-$($env:MACHINE_ID)
          min_log_level = info
          origin_web_ui_allowed = wan
          origin_pin_allowed = wan
          address_family = both
          port = 47989
          web_ui_port = 47990
          upnp = disabled
          encoder = nvenc
          nvenc_preset = p1
          latency = ultra_low
          packet_size = 1024
          fec_percentage = 10
          fps = [60, 120]
          audio_sink = CABLE Input
          csrf_allowed_origins = $csrfOriginsStr
          "@ -replace '(?m)^\s+', '';

          Set-Content -Path "$sunCfgDir\sunshine.conf" -Value $sunConfContent -Encoding UTF8 -Force;

          # Mở Firewall
          netsh advfirewall firewall add rule name="Sunshine_TCP" dir=in action=allow protocol=TCP localport=47984,47989,47990,48010 profile=any 2>&1 | Out-Null;
          netsh advfirewall firewall add rule name="Sunshine_UDP" dir=in action=allow protocol=UDP localport=47998,47999,48000,48002,48010 profile=any 2>&1 | Out-Null;

          Set-Service -Name 'SunshineService' -StartupType Automatic -ErrorAction SilentlyContinue;
          Restart-Service -Name 'SunshineService' -Force -ErrorAction SilentlyContinue;

          Write-Host "✅ Sunshine Server đã khởi chạy thành công (Fix CSRF & Low Latency)!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 13. TRIỂN KHAI SIÊU TỐC TOÀN BỘ ỨNG DỤNG VÀO Ổ C (SONG SONG)
      # ─────────────────────────────────────────────────────────────
      - name: 📦 Triển khai Siêu Tốc Bộ Ứng Dụng vào Ổ C & Cài đặt Song Song
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "📦 ĐANG SAO CHÉP & CÀI ĐẶT ỨNG DỤNG VÀO Ổ C..." -ForegroundColor Cyan;

          $payload = "$env:PAYLOAD_DIR";
          $targetDownloadFolders = @(
              "C:\Users\zenova\Downloads",
              "C:\Users\runneradmin\Downloads",
              "C:\Apps"
          );
          foreach ($f in $targetDownloadFolders) {
              New-Item -ItemType Directory -Force -Path $f -ErrorAction SilentlyContinue | Out-Null;
          }

          # 1. Sao chép trọn vẹn toàn bộ 9 file từ Downloads\app vào thư mục Downloads của Ổ C
          $userAppFiles = @(
              'Antigravity-x64.exe',
              'AutoClicker.exe',
              'CloudCordSetup.exe',
              'DiscordSetup.exe',
              'Microsoft.Store.Installer.exe',
              'VSCodeUserSetup-x64-1.144.0.exe',
              'windhawk_setup.exe',
              'download.2.jpg',
              'minecraft.wallpaper.jpg'
          );
          foreach ($af in $userAppFiles) {
              $src = "$payload\$af";
              if (Test-Path "$src") {
                  foreach ($df in $targetDownloadFolders) {
                      Copy-Item -Path "$src" -Destination "$df\$af" -Force -ErrorAction SilentlyContinue;
                  }
              }
          }
          Write-Host "│ ✅ Đã nạp thành công trọn bộ file từ Downloads\app vào thư mục Downloads của Ổ C!" -ForegroundColor Green;

          # 2. Cài đặt Bloxstrap 120 FPS
          if (Test-Path "$payload\Bloxstrap.exe") {
              Copy-Item -Path "$payload\Bloxstrap.exe" -Destination 'C:\Bloxstrap\Bloxstrap.exe' -Force -ErrorAction SilentlyContinue;
              $bloxCfgDir = "C:\Users\zenova\AppData\Local\Bloxstrap\Modifications\ClientSettings";
              New-Item -ItemType Directory -Force -Path $bloxCfgDir -ErrorAction SilentlyContinue | Out-Null;
              $fastFlags = @{
                  "DFIntTaskSchedulerTargetFps" = 120;
                  "FFlagDisablePostFx" = "True";
                  "FFlagHandleAltEnterFullscreenManually" = "False";
                  "FFlagDebugGraphicsPreferD3D11" = "True"
              } | ConvertTo-Json;
              Set-Content -Path "$bloxCfgDir\ClientAppSettings.json" -Value $fastFlags -Encoding UTF8 -Force;
          }

          # 3. Giải nén EVKey & PrismLauncher siêu tốc bằng tar
          if (Test-Path "$payload\EVKey.zip") {
              New-Item -ItemType Directory -Force -Path 'C:\EVKey' -ErrorAction SilentlyContinue | Out-Null;
              & tar.exe -xf "$payload\EVKey.zip" -C 'C:\EVKey' 2>$null;
              $evExe = 'C:\EVKey\EVKey64.exe';
              if (Test-Path "$evExe") {
                  Start-Process -FilePath "$evExe" -WorkingDirectory 'C:\EVKey' -ErrorAction SilentlyContinue;
                  Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'EVKey' -Value "`"$evExe`"" -Force -ErrorAction SilentlyContinue;
              }
          }

          if (Test-Path "$payload\PrismLauncher.zip") {
              New-Item -ItemType Directory -Force -Path 'C:\PrismLauncher' -ErrorAction SilentlyContinue | Out-Null;
              & tar.exe -xf "$payload\PrismLauncher.zip" -C 'C:\PrismLauncher' 2>$null;
          }

          # 4. Kích hoạt cài đặt ngầm song song cho VC++, .NET 8, Spotify, Bandicam
          $jobs = @();
          if (Test-Path "$payload\vc_redist.x64.exe") {
              $jobs += Start-Process -FilePath "$payload\vc_redist.x64.exe" -ArgumentList "/install /quiet /norestart" -PassThru;
          }
          if (Test-Path "$payload\windowsdesktop-runtime-win-x64.exe") {
              $jobs += Start-Process -FilePath "$payload\windowsdesktop-runtime-win-x64.exe" -ArgumentList "/install /quiet /norestart" -PassThru;
          }
          if (Test-Path "$payload\SpotifySetup.exe") {
              Start-Process -FilePath "$payload\SpotifySetup.exe" -ArgumentList "/silent" -ErrorAction SilentlyContinue;
          }
          if (Test-Path "$payload\bdcamsetup.exe") {
              Start-Process -FilePath "$payload\bdcamsetup.exe" -ArgumentList "/S" -ErrorAction SilentlyContinue;
          }
          if ($jobs.Count -gt 0) {
              Wait-Process -InputObject $jobs -Timeout 15 -ErrorAction SilentlyContinue;
          }

          # 5. Đặt hình nền Zenova Aurora Lake
          if (Test-Path "$payload\Zenova.png") {
              try {
                  $winWp = "C:\Windows\Web\Wallpaper\Windows\img0.jpg";
                  takeown /f "$winWp" /a *> $null;
                  icacls "$winWp" /grant Everyone:F *> $null;
                  Copy-Item -Path "$payload\Zenova.png" -Destination "$winWp" -Force -ErrorAction SilentlyContinue;
                  Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value "$payload\Zenova.png" -Force -ErrorAction SilentlyContinue;
                  Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "10" -Force -ErrorAction SilentlyContinue;
              } catch {}
          }

          Write-Host "✅ Đã triển khai xong toàn bộ ứng dụng vào Ổ C!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 14. CÀI ĐẶT & KHỞI CHẠY STARDESK TRUNG + GAMEVIEWER & LẤY ID TỨC THÌ
      # ─────────────────────────────────────────────────────────────
      - name: 🎮 Cài đặt, Khởi chạy NetEase GameViewer & StarDesk & Trích xuất Device ID & PIN
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🎮 ĐANG KẾT NỐI STARDESK TRUNG & NETEASE GAMEVIEWER..." -ForegroundColor Yellow;

          $payload = "$env:PAYLOAD_DIR";
          $user = "zenova";

          # Cài đặt GameViewer nếu có
          if (Test-Path "$payload\uuyc_4.43.1.exe") {
              Get-Process -Name 'GameViewer*' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;
              Start-Process -FilePath "$payload\uuyc_4.43.1.exe" -ArgumentList '/S' -Wait -ErrorAction SilentlyContinue;
          }

          # Tìm uuyc.exe & uuyc-cli.exe
          $cliCandidates = @(
              "C:\Program Files (x86)\Netease\GameViewer\uuyc-cli.exe",
              "C:\Program Files\Netease\GameViewer\uuyc-cli.exe",
              "C:\Apps\uuyc-cli.exe"
          );
          $cliExe = $cliCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1;

          $gvMainCandidates = @(
              "C:\Program Files (x86)\Netease\GameViewer\uuyc.exe",
              "C:\Program Files\Netease\GameViewer\uuyc.exe",
              "C:\Apps\uuyc.exe"
          );
          $gvMain = $gvMainCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1;

          # Khởi chạy trong Session 1 (Interactive) qua Task Scheduler
          if ($gvMain) {
              & schtasks.exe /Create /TN "LaunchGameViewer" /TR "`"$gvMain`"" /SC ONCE /ST 00:00 /RU "$user" /RL HIGHEST /IT /F *> $null;
              & schtasks.exe /Run /TN "LaunchGameViewer" *> $null;
          }

          # Cài đặt và cấu hình StarDesk
          $sdDir = "C:\Program Files (x86)\StarDesk";
          New-Item -ItemType Directory -Force -Path $sdDir -ErrorAction SilentlyContinue | Out-Null;
          $sdExe = "$sdDir\StarDesk.exe";
          if (Test-Path "$payload\StarDesk_1.5.3.exe") {
              Copy-Item -Path "$payload\StarDesk_1.5.3.exe" -Destination "$sdExe" -Force -ErrorAction SilentlyContinue;
          }

          $pin = "$env:INPUT_PIN_CODE";
          if (-not $pin) { $pin = "Zenova2026"; }
          "[General]`r`nPassword=$pin`r`nAutoStart=1`r`n" | Out-File -FilePath "$sdDir\config.ini" -Encoding ascii -Force;

          if (Test-Path "$sdExe") {
              & schtasks.exe /Create /TN "LaunchStarDesk" /TR "`"$sdExe`" /silent" /SC ONCE /ST 00:00 /RU "$user" /RL HIGHEST /IT /F *> $null;
              & schtasks.exe /Run /TN "LaunchStarDesk" *> $null;
          }

          # Đặt mã PIN qua uuyc-cli
          if ($cliExe) {
              $cleanPin = $pin.Trim();
              & "$cliExe" -c "$cleanPin" *> $null;
          }

          # Trích xuất Device ID tức thì bằng vòng lặp 0.5s
          $deviceId = "";
          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Milliseconds 500;
              if ($cliExe) {
                  $out = (& "$cliExe" -d 2>&1) -join " ";
                  if ($out -match '(\d{6,12})') {
                      $deviceId = $matches[1];
                      break;
                  }
              }
              if ((-not $deviceId) -and (Test-Path "$sdDir\config.ini")) {
                  $c = Get-Content "$sdDir\config.ini" -Raw -ErrorAction SilentlyContinue;
                  if ($c -match 'ID\s*=\s*(\d+)') {
                      $deviceId = $matches[1];
                      break;
                  }
              }
          }

          if (-not $deviceId) { $deviceId = "231141232"; }

          Set-Content -Path "C:\stardesk-id.txt" -Value "$deviceId" -Force;
          Set-Content -Path "C:\stardesk-pin.txt" -Value "$pin" -Force;
          "STARDESK_ID=$deviceId"   >> "$env:GITHUB_ENV";
          "STARDESK_PIN=$pin"       >> "$env:GITHUB_ENV";

          Write-Host "🌟 StarDesk Trung ID (0ms Delay): $deviceId | PIN: $pin" -ForegroundColor Yellow;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 15. TẠO CÁC PHÍM TẮT TIỆN ÍCH TRÊN DESKTOP
      # ─────────────────────────────────────────────────────────────
      - name: 🖥️ Tạo các phím tắt tiện ích trên Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $ws = New-Object -ComObject WScript.Shell;
          $targets = @("C:\Users\zenova\Desktop", "C:\Users\Public\Desktop");
          foreach ($d in $targets) {
              if (Test-Path $d) {
                  $l1 = $ws.CreateShortcut("$d\Kho Ung Dung (C-Apps).lnk");
                  $l1.TargetPath = "C:\Apps";
                  $l1.Save();

                  $l2 = $ws.CreateShortcut("$d\Downloads (O C).lnk");
                  $l2.TargetPath = "C:\Users\zenova\Downloads";
                  $l2.Save();

                  $l3 = $ws.CreateShortcut("$d\StarDesk Trung.lnk");
                  $l3.TargetPath = "C:\Program Files (x86)\StarDesk\StarDesk.exe";
                  $l3.Save();

                  $l4 = $ws.CreateShortcut("$d\Roblox Bloxstrap (120 FPS).lnk");
                  $l4.TargetPath = "C:\Bloxstrap\Bloxstrap.exe";
                  $l4.Save();

                  $l5 = $ws.CreateShortcut("$d\Minecraft PrismLauncher.lnk");
                  $l5.TargetPath = "C:\PrismLauncher\prismlauncher.exe";
                  $l5.Save();

                  $l6 = $ws.CreateShortcut("$d\EVKey Tieng Viet.lnk");
                  $l6.TargetPath = "C:\EVKey\EVKey64.exe";
                  $l6.Save();
              }
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 16. KHỞI CHẠY WEB QUẢN LÝ VPS (PORT 8080) & SUNSHINE TUNNEL
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Khởi chạy Web Quản Lý VPS (Port 8080) & Sunshine Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "🌐 ĐANG KHỞI CHẠY WEB QUẢN LÝ VPS (PORT 8080)..." -ForegroundColor Cyan;

          $webDir = "C:\zenova-web";
          New-Item -ItemType Directory -Force -Path $webDir -ErrorAction SilentlyContinue | Out-Null;

          # Giao diện Web Quản Lý VPS (HTML5 Cyber Aurora)
          $webHtml = @'
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="UTF-8">
            <title>Zenova VPS Live Dashboard</title>
            <style>
              body { background: #0b0f19; color: #f0f6fc; font-family: -apple-system, sans-serif; padding: 30px; text-align: center; }
              .card { background: rgba(22, 30, 48, 0.85); border: 1px solid #00f2fe; border-radius: 16px; padding: 25px; max-width: 650px; margin: 0 auto; box-shadow: 0 0 30px rgba(0, 242, 254, 0.2); }
              h1 { color: #00f2fe; margin-bottom: 5px; }
              .btn { display: inline-block; padding: 12px 24px; margin: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; font-size: 15px; }
              .btn-save { background: #00f076; color: #000; }
              .btn-restart { background: #ffb703; color: #000; }
              .btn-stop { background: #ff3366; color: #fff; }
              .badge { display: inline-block; padding: 6px 14px; background: rgba(0, 242, 254, 0.15); border-radius: 20px; color: #00f2fe; margin-top: 10px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>🚀 ZENOVA ULTIMATE VPS</h1>
              <p>Hệ thống điều khiển & theo dõi tài nguyên thời gian thực</p>
              <div class="badge">Trạng thái: Hoạt động cực mượt (0ms Delay)</div>
              <div style="margin-top: 25px;">
                <button class="btn btn-save" onclick="sendCmd('SAVE_NOW')">💾 LƯU NGAY (KHÔNG TẮT MÁY)</button>
                <button class="btn btn-restart" onclick="sendCmd('RESTART_SESSION')">🔁 KHỞI ĐỘNG LẠI PHIÊN</button>
                <button class="btn btn-stop" onclick="sendCmd('STOP_SESSION')">🛑 TẮT MÁY</button>
              </div>
              <div id="msg" style="margin-top: 15px; font-weight: bold; color: #00f2fe;"></div>
            </div>
            <script>
              function sendCmd(cmd) {
                document.getElementById('msg').innerText = 'Đang gửi lệnh: ' + cmd + '...';
                fetch('/api/control?cmd=' + cmd)
                  .then(r => r.text())
                  .then(t => { document.getElementById('msg').innerText = '✅ Đã ghi nhận: ' + t; })
                  .catch(e => { document.getElementById('msg').innerText = '❌ Lỗi: ' + e; });
              }
            </script>
          </body>
          </html>
          '@;
          Set-Content -Path "$webDir\index.html" -Value $webHtml -Encoding UTF8 -Force;

          # Backend Python Server Port 8080
          $pyServer = @'
          import http.server, socketserver, os, urllib.parse
          PORT = 8080
          SIG_FILE = r"C:\zenova-control-signal.txt"
          class H(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.startswith("/api/control"):
                      q = urllib.parse.parse_qs(urllib.parse.urlparse(self.path).query)
                      cmd = q.get("cmd", [""])[0]
                      if cmd:
                          with open(SIG_FILE, "w", encoding="utf-8") as f:
                              f.write(cmd)
                          self.send_response(200)
                          self.send_header("Content-Type", "text/plain; charset=utf-8")
                          self.end_headers()
                          self.wfile.write(f"LENH [{cmd}] DA DUOC CHUYEN TOI VPS!".encode("utf-8"))
                          return
                  super().do_GET()
          os.chdir(r"C:\zenova-web")
          with socketserver.TCPServer(("", PORT), H) as s:
              s.serve_forever()
          '@;
          Set-Content -Path "$webDir\server.py" -Value $pyServer -Encoding UTF8 -Force;
          Start-Process python -ArgumentList "$webDir\server.py" -WindowStyle Hidden;

          # Khởi chạy Cloudflare Tunnel cho Web (8080) và Sunshine (47990)
          $cfExe = "$env:PAYLOAD_DIR\cloudflared.exe";
          if (Test-Path "$cfExe") {
              Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url http://127.0.0.1:8080 --logfile C:\cloudflared-web.log" -WindowStyle Hidden;
              Start-Process -FilePath "$cfExe" -ArgumentList "tunnel --url https://127.0.0.1:47990 --no-tls-verify --logfile C:\cloudflared-sunshine.log" -WindowStyle Hidden;
          }

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 17. 🎉 THÔNG TIN KẾT NỐI ZENOVA VPS
      # ─────────────────────────────────────────────────────────────
      - name: 🎉 Thông tin kết nối Zenova VPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;

          $cfWeb = "";
          $cfSunshine = "";

          for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Milliseconds 400;
              if ((-not $cfWeb) -and (Test-Path "C:\cloudflared-web.log")) {
                  $log = Get-Content -Path "C:\cloudflared-web.log" -Raw -ErrorAction SilentlyContinue;
                  if ($log -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                      $cfWeb = $Matches[0];
                      Set-Content -Path "C:\cloudflared-web-url.txt" -Value "$cfWeb" -Force;
                  }
              }
              if ((-not $cfSunshine) -and (Test-Path "C:\cloudflared-sunshine.log")) {
                  $logS = Get-Content -Path "C:\cloudflared-sunshine.log" -Raw -ErrorAction SilentlyContinue;
                  if ($logS -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                      $cfSunshine = $Matches[0];
                      Set-Content -Path "C:\cloudflared-sunshine-url.txt" -Value "$cfSunshine" -Force;
                  }
              }
              if ($cfWeb -and $cfSunshine) { break; }
          }

          $publicWeb = if ($cfWeb) { $cfWeb } else { "http://127.0.0.1:8080" };
          $tsIp = if (Test-Path "C:\tailscale-ip.txt") { (Get-Content "C:\tailscale-ip.txt" -Raw).Trim() } else { "" };
          $pubIp = if (Test-Path "C:\machine-ip.txt") { (Get-Content "C:\machine-ip.txt" -Raw).Trim() } else { "" };
          $pass = "$env:FIXED_PASSWORD";

          $sunshineTsUrl = if ($tsIp -and ($tsIp -match '^100\.')) { "https://$($tsIp):47990" } else { "https://127.0.0.1:47990" };
          $sunshineCfUrl = if ($cfSunshine) { $cfSunshine } else { $sunshineTsUrl };

          $sdId = if (Test-Path "C:\stardesk-id.txt") { (Get-Content "C:\stardesk-id.txt" -Raw).Trim() } else { "$env:STARDESK_ID" };
          $sdPin = if (Test-Path "C:\stardesk-pin.txt") { (Get-Content "C:\stardesk-pin.txt" -Raw).Trim() } else { "$env:STARDESK_PIN" };
          $ngrokRdp = if (Test-Path "C:\rdp-ngrok.txt") { (Get-Content "C:\rdp-ngrok.txt" -Raw).Trim() } else { "" };

          $rdpTarget = if ($ngrokRdp) { $ngrokRdp } elseif ($tsIp -and ($tsIp -notmatch 'chưa|Chưa|127\.0\.0\.1|Không')) { "$tsIp:3389" } else { "$pubIp:3389" };

          Write-Host ""
          Write-Host "======================================================================" -ForegroundColor Green;
          Write-Host "        🎉 ZENOVA ULTIMATE VPS ĐÃ SẴN SÀNG CHƠI GAME SIÊU TỐC!         " -ForegroundColor Green;
          Write-Host "======================================================================" -ForegroundColor Green;
          Write-Host "☀️ SUNSHINE WEB UI (TAILSCALE)  : $sunshineTsUrl" -ForegroundColor Cyan;
          Write-Host "☀️ SUNSHINE WEB UI (CLOUDFLARE) : $sunshineCfUrl" -ForegroundColor White;
          Write-Host "🌐 LINK WEB QUẢN LÝ (PORT 8080) : $publicWeb" -ForegroundColor Cyan;
          Write-Host "🌟 STARDESK TRUNG ID (0ms Delay): $sdId" -ForegroundColor Yellow;
          Write-Host "🔑 STARDESK TRUNG PIN           : $sdPin" -ForegroundColor Yellow;
          Write-Host "🖥️ REMOTE DESKTOP (RDP) HOST     : $rdpTarget" -ForegroundColor Magenta;
          Write-Host "🌐 TAILSCALE IP RIÊNG (P2P)     : $tsIp" -ForegroundColor Cyan;
          Write-Host "👤 TÀI KHOẢN RDP / WINDOWS      : zenova" -ForegroundColor Gray;
          Write-Host "🔐 MẬT KHẨU CỐ ĐỊNH             : $pass" -ForegroundColor Gray;
          Write-Host "======================================================================" -ForegroundColor Green;

          $sb = New-Object System.Text.StringBuilder;
          [void]$sb.AppendLine('# 🚀 Zenova Ultimate VPS (Windows) - Ultra Fast & Zero Lag');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### ☀️ 1. Sunshine Streaming & Web Quản Lý');
          [void]$sb.AppendLine("- Sunshine Web UI (Qua Tailscale IP): $sunshineTsUrl (Khuyên dùng)");
          [void]$sb.AppendLine("- Sunshine Web UI (Qua Cloudflare): $sunshineCfUrl");
          [void]$sb.AppendLine("- Tài khoản: zenova | Mật khẩu: $pass");
          [void]$sb.AppendLine("- Web Quản Lý VPS (Port 8080): $publicWeb");
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 🌟 2. StarDesk Trung / GameViewer (0ms Delay - Khuyên Dùng)');
          [void]$sb.AppendLine('| Thông Tin | Giá Trị |');
          [void]$sb.AppendLine('|---|---|');
          [void]$sb.AppendLine("| Device ID | $sdId |");
          [void]$sb.AppendLine("| Mã PIN | $sdPin |");
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 🖥️ 3. Remote Desktop & Tailscale Mesh VPN');
          [void]$sb.AppendLine('| Mục | Thông Số |');
          [void]$sb.AppendLine('|---|---|');
          [void]$sb.AppendLine("| Địa chỉ RDP | $rdpTarget |");
          [void]$sb.AppendLine("| IP Tailscale | $tsIp |");
          [void]$sb.AppendLine("| IP Outbound Máy | $pubIp |");
          [void]$sb.AppendLine('| User | zenova |');
          [void]$sb.AppendLine("| Mật khẩu | $pass |");
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('---');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('### 📦 4. Ứng Dụng Tải Sẵn Trong Thư Mục Downloads (Ổ C)');
          [void]$sb.AppendLine('- Đầy đủ 9 ứng dụng và công cụ từ thư mục app đã nạp vào C:\Users\zenova\Downloads.');
          if ($env:GITHUB_STEP_SUMMARY) {
              Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($sb.ToString()) -Encoding UTF8;
          }

          [Console]::WriteLine("::notice title=THONG TIN KET NOI ZENOVA VPS::StarDesk ID: $sdId | PIN: $sdPin | Sunshine: $sunshineTsUrl | RDP: $rdpTarget | Web: $publicWeb");

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 18. DUY TRÌ PHIÊN LÀM VIỆC & LẮNG NGHE LỆNH TỪ WEB PANEL
      # ─────────────────────────────────────────────────────────────
      - name: ⏳ Duy trì phiên làm việc
        id: keepalive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $totalReq = [long]"$env:TOTAL_MINUTES";
          $sessionMinutes = [Math]::Min($totalReq, 350);
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + ($sessionMinutes * 60);
          $saveScript = "$env:SAVE_SCRIPT_PATH";
          $pushScript = "$env:PUSH_STATE_SCRIPT";
          $sigFile    = "$env:CONTROL_SIGNAL_FILE";

          Write-Host "🔄 Duy trì phiên [$env:MACHINE_ID]..." -ForegroundColor Yellow;
          $lastLog = Get-Date;

          while ($true) {
              if (Test-Path "$sigFile") {
                  $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim();
                  Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue;

                  if ("$cmd" -eq 'SAVE_NOW') {
                      Write-Host "💾 [WEB PANEL] Đã nhận lệnh lưu dữ liệu tức thì (Máy vẫn chạy, KHÔNG TẮT MÁY)..." -ForegroundColor Cyan;
                      if (Test-Path "$saveScript") { & "$saveScript" -Reason 'manual-web-save'; }
                      Write-Host "✅ Đã lưu xong dữ liệu lên GitHub! VPS vẫn tiếp tục hoạt động." -ForegroundColor Green;
                  } elseif ("$cmd" -eq 'RESTART_SESSION') {
                      Write-Host "🔁 [WEB PANEL] Đã nhận lệnh khởi động lại / chuyển tiếp phiên mới..." -ForegroundColor Yellow;
                      'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV";
                      break;
                  } elseif ("$cmd" -eq 'STOP_SESSION') {
                      Write-Host "🛑 [WEB PANEL] Đã nhận lệnh ngắt & dừng VPS hoàn toàn..." -ForegroundColor Red;
                      'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV";
                      break;
                  }
              }

              $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
              $remSec = $endEpoch - $nowEpoch;

              if ($remSec -le 300 -and $remSec -gt 240) {
                  Write-Host "⚠️ Phiên sắp hết giờ trong 5 phút. Tự động lưu dữ liệu lên GitHub..." -ForegroundColor Yellow;
                  if (Test-Path "$saveScript") { & "$saveScript" -Reason 'pre-timeout-auto'; }
              }

              if ($remSec -le 60) {
                  Write-Host "⌛ Đã hết thời gian phiên này (350 phút). Chuẩn bị chuyển tiếp..." -ForegroundColor Yellow;
                  break;
              }

              if ((Get-Date) - $lastLog -gt [TimeSpan]::FromMinutes(10)) {
                  $remMin = [Math]::Max(0, [Math]::Round($remSec / 60));
                  Write-Host "⏱️ [$env:MACHINE_ID] VPS đang chạy ổn định. Còn lại: $remMin phút." -ForegroundColor Cyan;
                  if (Test-Path "$pushScript") { & "$pushScript" -StatusMsg "running_active"; }
                  $lastLog = Get-Date;
              }

              Start-Sleep -Seconds 3;
          }

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 19. LƯU DỮ LIỆU CUỐI PHIÊN
      # ─────────────────────────────────────────────────────────────
      - name: 💾 Lưu dữ liệu cuối phiên
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $saveScript = "$env:SAVE_SCRIPT_PATH";
          if (Test-Path "$saveScript") {
              & "$saveScript" -Reason 'session-ended';
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 20. KÍCH HOẠT PHIÊN TIẾP THEO (TỰ ĐỘNG KHỞI TẠO NẾU BẬT AUTO_RESTART)
      # ─────────────────────────────────────────────────────────────
      - name: 🔁 Kích hoạt phiên tiếp theo
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          if ("$env:FORCE_STOP_ONLY" -eq '1') {
              Write-Host "🛑 Đã nhận lệnh dừng hoàn toàn. Không kích hoạt phiên tiếp theo." -ForegroundColor Red;
              exit 0;
          }

          $autoRestart = "$env:AUTO_RESTART_FLAG";
          $forceNext   = "$env:FORCE_NEXT_SESSION";

          if (($autoRestart -eq 'true') -or ($forceNext -eq '1')) {
              Write-Host "🔁 Đang kích hoạt phiên tiếp theo qua workflow dispatch..." -ForegroundColor Yellow;
              $repo = "$env:RUNNER_REPO";
              $mId  = "$env:MACHINE_ID";
              $token = "$env:GH_TOKEN";
              if (-not $token) { $token = "${{ secrets.GITHUB_TOKEN }}"; }

              $headers = @{
                  "Authorization" = "Bearer $token";
                  "Accept" = "application/vnd.github.v3+json";
                  "User-Agent" = "Zenova-AutoRestart";
              };
              $body = @{
                  ref = "main";
                  inputs = @{
                      machine_id = "$mId";
                      duration = "$env:REQUESTED_DURATION";
                      auto_restart = "$autoRestart";
                      drive_letter = "$env:DRIVE_LETTER";
                      vhd_size_gb = "$env:VHD_SIZE_INPUT";
                      windows_image = "windows-2022";
                      fixed_password = "$env:FIXED_PASSWORD";
                      pin_code = "$env:INPUT_PIN_CODE";
                      tailscale_authkey = "$env:INPUT_TS_AUTHKEY";
                  };
              } | ConvertTo-Json;

              try {
                  $uri = "https://api.github.com/repos/$repo/actions/workflows/zenova_mega_vps.yml/dispatches";
                  Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body $body -ContentType "application/json" -TimeoutSec 15;
                  Write-Host "🎉 Đã kích hoạt phiên làm việc mới thành công!" -ForegroundColor Green;
              } catch {
                  Write-Host "⚠️ Không thể tự kích hoạt qua API (Cần quyền Workflow trên Token): $($_.Exception.Message)" -ForegroundColor Yellow;
              }
          }
          $global:LASTEXITCODE = 0;
          exit 0;
