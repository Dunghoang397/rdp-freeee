name: 'Zenova Ultimate VPS (Windows) - Full Pro Max'

on:
  workflow_dispatch:
    inputs:
      machine_id:
        description: '🏷️ Tên định danh máy (VD: zenova-1)'
        required: false
        default: 'zenova-1'
        type: string
      display_name:
        description: '🏷️ Tên hiển thị của máy'
        required: false
        default: 'Zenova Ultimate Machine'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng (tối đa 24h - tự động chuyển tiếp)'
        required: false
        default: '5h'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h'
          - '6h'
          - '12h'
          - '24h'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới & lưu dữ liệu cho phiên mới'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo riêng biệt lưu dữ liệu (VD: X)'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo riêng (Hỗ trợ GB/TB, tối đa 60TB - Dynamic)'
        required: false
        default: '60TB'
        type: string
      fixed_password:
        description: '🔐 Mật khẩu Windows/RDP (để trống = tự tạo mật khẩu mạnh riêng cho máy)'
        required: false
        default: ''
        type: string
      pin_code:
        description: '🔑 Mã PIN StarDesk Trung / GameViewer (VD: Zenova2026)'
        required: false
        default: 'Zenova2026'
        type: string
      stardesk_id_trung:
        description: '🌟 ID StarDesk Trung (để trống hệ thống tự nhận diện)'
        required: false
        default: ''
        type: string
      tailscale_authkey:
        description: '🔑 Key Tailscale Auth (tskey-auth-... hoặc lưu trong Secret TAILSCALE_AUTHKEY / OAuth)'
        required: false
        default: ''
        type: string

      storage_repo:
        description: '📦 Repo lưu trữ ổ đĩa (để trống dùng chính repo này)'
        required: false
        default: ''
        type: string
      root_machine_id:
        description: '🏷️ Tên máy gốc để kế thừa ổ đĩa lần đầu (nếu có)'
        required: false
        default: 'zenova-root'
        type: string
      choco_packages:
        description: '📦 App cài thêm qua choco (lưu vết sang phiên sau)'
        required: false
        default: ''
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu tối thượng (Fix CPU 100%, Fix Lag, Múi giờ VN)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS'
        required: false
        default: true
        type: boolean
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo VDD'
        required: false
        default: '1920x1080@60'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  # =========================================================================
  # ZENOVA WINDOWS RUNNER (INTEL XEON + APOLLO STREAM + STARDESK + APPS)
  # =========================================================================
  Zenova-Windows:
    name: '🪟 Windows VPS (RDP + Apollo + StarDesk Trung)'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 350

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      STORAGE_GH_TOKEN: ${{ secrets.STORAGE_GH_TOKEN || secrets.PAT_TOKEN || github.token }}
      STORAGE_REPO: ${{ github.event.inputs.storage_repo || github.repository }}
      RUNNER_GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      RUNNER_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ github.event.inputs.machine_id || 'zenova-1' }}
      ROOT_MACHINE_ID: ${{ github.event.inputs.root_machine_id || 'zenova-root' }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name || github.event.inputs.machine_id || 'Zenova Ultimate Machine' }}
      DRIVE_LETTER: ${{ github.event.inputs.drive_letter || 'X' }}
      VHD_SIZE_GB: ${{ github.event.inputs.vhd_size_gb || '60TB' }}
      WEB_PORT: '8080'
      APOLLO_WEB_PORT: '47990'
      ENABLE_DUCKDNS: ${{ github.event.inputs.enable_duckdns || 'true' }}
      INPUT_PIN_CODE: ${{ github.event.inputs.pin_code || 'Zenova2026' }}
      STARDESK_ID_INPUT: ${{ github.event.inputs.stardesk_id_trung || '' }}
      TAILSCALE_KEY_INPUT: ${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY || '' }}
      CHOCO_PACKAGES: ${{ github.event.inputs.choco_packages || '' }}

    steps:
      - name: 📥 Checkout Zenova files
        uses: actions/checkout@v4

      - name: 🔎 Kiểm tra công cụ trên Windows host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          foreach ($tool in @('gh.exe', 'git.exe', 'curl.exe')) {
              if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Thiếu $tool. Cài GitHub CLI, Git và curl trên Windows host trước khi chạy workflow."; }
          }
          $sevenZip = Get-Command '7z.exe' -ErrorAction SilentlyContinue;
          if (-not $sevenZip) {
              $candidate = 'C:\Program Files\7-Zip\7z.exe';
              if (Test-Path $candidate) { Split-Path $candidate | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8; }
              else { throw 'Thiếu 7-Zip (7z.exe). Cài 7-Zip trên Windows host trước khi chạy workflow.'; }
          }
          Write-Host '✅ Git, GitHub CLI, curl và 7-Zip đã sẵn sàng.' -ForegroundColor Green

      # ─────────────────────────────────────────────────────────────
      # 1. DỰNG Ổ ĐĨA RIÊNG & CHUẨN BỊ THÔNG SỐ (HỖ TRỢ LÊN ĐẾN 60TB)
      # ─────────────────────────────────────────────────────────────
      - name: 🧱 Dựng ổ đĩa riêng & Chuẩn bị thông số
        shell: powershell
        env:
          INPUT_DURATION: ${{ github.event.inputs.duration || '5h' }}
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV";

          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', '';
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'zenova-1'; }
          $relTag      = "zenova-storage-$cleanId";
          $stateBranch = "zenova-state-$cleanId";
          $rootRelTag  = "zenova-storage-$($env:ROOT_MACHINE_ID)";

          "MACHINE_ID=$cleanId" >> "$env:GITHUB_ENV";
          "RELEASE_TAG=$relTag" >> "$env:GITHUB_ENV";
          "STATE_BRANCH=$stateBranch" >> "$env:GITHUB_ENV";
          "ROOT_RELEASE_TAG=$rootRelTag" >> "$env:GITHUB_ENV";

          $total = 300;
          $display = '5 giờ';
          switch ("$env:INPUT_DURATION") {
              '1h'  { $total = 60;   $display = '1 giờ'; }
              '3h'  { $total = 180;  $display = '3 giờ'; }
              '5h'  { $total = 300;  $display = '5 giờ'; }
              '6h'  { $total = 360;  $display = '6 giờ'; }
              '12h' { $total = 720;  $display = '12 giờ'; }
              '24h' { $total = 1440; $display = '24 giờ (Tự chuyển tiếp)'; }
              default { $total = 300; $display = '5 giờ'; }
          }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV";
          "DISPLAY_TIME=$display" >> "$env:GITHUB_ENV";

          $user     = "zenova";
          $profPath = "C:\Users\zenova";
          "RDP_USER=$user" >> "$env:GITHUB_ENV";
          "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV";

          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper();
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X'; }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV";

          $vhdContainer = 'C:\ZENOVA-VHD-HOST';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" -ErrorAction SilentlyContinue | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'zenova-os.vhdx');

          $rawSize = ("$env:VHD_SIZE_GB").Trim().ToUpper();
          $sizeBytes = 100GB;
          
          if ($rawSize -match '^(\d+)\s*TB$') {
              $tbValue = [int64]$Matches[1];
              $sizeBytes = $tbValue * 1TB;
              Write-Host "📦 Phát hiện dung lượng: $tbValue TB" -ForegroundColor Cyan;
          } elseif ($rawSize -match '^(\d+)\s*GB$') {
              $sizeBytes = ([int64]$Matches[1]) * 1GB;
              Write-Host "📦 Phát hiện dung lượng: $($Matches[1]) GB" -ForegroundColor Cyan;
          } elseif ($rawSize -match '^(\d+)$') {
              $sizeBytes = ([int64]$Matches[1]) * 1GB;
              Write-Host "📦 Phát hiện dung lượng: $($Matches[1]) GB (mặc định)" -ForegroundColor Cyan;
          }

          $maxBytes = 60TB;
          if ($sizeBytes -gt $maxBytes) {
              $sizeBytes = $maxBytes;
              Write-Host "⚠️ Giới hạn tối đa 60TB!" -ForegroundColor Yellow;
          }

          Write-Host "💽 Đang khởi tạo ổ đĩa riêng ${dl}:\ ($(($sizeBytes / 1TB).ToString('0.##')) TB Dynamic VHDX)..." -ForegroundColor Cyan;
          
          $mounted = $false;
          try {
              if (Get-Command New-VHD -ErrorAction SilentlyContinue) {
                  if (-not (Test-Path "$vhdFile")) {
                      New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:($false) | Out-Null;
                  } else {
                      Mount-VHD -Path "$vhdFile";
                  }
                  $null = Get-PSDrive -Name "$dl" -ErrorAction Stop;
                  if (Test-Path "${dl}:\") { $mounted = $true; }
              }
          } catch {
              Write-Host "⚠️ Fallback sang cơ chế Kernel DOS Devices cho ${dl}:\..." -ForegroundColor Yellow;
          }

          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" -ErrorAction SilentlyContinue | Out-Null;
              try {
                  $typeDef = 'using System; using System.Runtime.InteropServices; public class KernelDisk { [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Auto)] public static extern bool DefineDosDevice(int dwFlags, string lpDeviceName, string lpTargetPath); }';
                  Add-Type -TypeDefinition $typeDef -ErrorAction SilentlyContinue;
                  [KernelDisk]::DefineDosDevice(0, "${dl}:", "$fallbackDir");
              } catch {}
              & subst "${dl}:" "$fallbackDir" 2>$null;
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force -ErrorAction SilentlyContinue;
              $null = New-PSDrive -Name "$dl" -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue;
          }

          $sharedRoot       = "${dl}:\ZENOVA-SYSTEM";
          $sharedSessionDir = "$sharedRoot\sessions";
          $sharedDataDir    = "$sharedRoot\DATA";
          $ctrlSigFile      = [System.IO.Path]::Combine($vhdContainer, 'control-signal.txt');
          $stateJsonFile    = [System.IO.Path]::Combine($vhdContainer, 'machine-state.json');

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "${dl}:\Apps", "${dl}:\Games", "${dl}:\Downloads") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" -ErrorAction SilentlyContinue | Out-Null;
          };

          "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV";
          "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV";
          "SHARED_DATA_DIR=$sharedDataDir" >> "$env:GITHUB_ENV";
          "CONTROL_SIGNAL_FILE=$ctrlSigFile" >> "$env:GITHUB_ENV";
          "STATE_JSON_FILE=$stateJsonFile" >> "$env:GITHUB_ENV";
          "VHD_CONTAINER=$vhdContainer" >> "$env:GITHUB_ENV";

          Write-Host "✅ Đã thiết lập xong không gian ổ đĩa riêng ${dl}:\" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 2. TẠO SCRIPT ĐÓNG GÓI & LƯU TRỮ DỮ LIỆU (SIÊU TỐC, KO TẮT MÁY)
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đóng gói & lưu trữ dữ liệu
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-zenova-drive.ps1');

          $scriptLines = @(
              'param([string]$Reason = "manual")',
              '$ErrorActionPreference = "Continue";',
              '$global:LASTEXITCODE = 0;',
              'Write-Host "💾 [$Reason] Đang đóng gói và lưu toàn bộ dữ liệu..." -ForegroundColor Cyan;',
              '$appsToClose = @("chrome", "msedge", "brave", "firefox", "discord", "Spotify", "Bandicam", "EVKey", "RobloxPlayerBeta", "StarDesk", "GameViewer", "prismlauncher", "javaw", "Code");',
              'foreach ($app in $appsToClose) {',
              '    Get-Process -Name "$app*" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;',
              '    taskkill.exe /F /IM "$app*.exe" /T 2>$null | Out-Null;',
              '};',
              'Start-Sleep -Seconds 2;',
              '$stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", "save-stage");',
              'if (Test-Path "$stage") { Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$stage" -ErrorAction SilentlyContinue | Out-Null;',
              'robocopy "$env:SHARED_ROOT" "$stage" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '$global:LASTEXITCODE = 0;',
              '$userProf = "$env:PROFILE_PATH";',
              'if (Test-Path "$userProf") {',
              '    $profDst = [System.IO.Path]::Combine("$stage", "Users", "$env:RDP_USER");',
              '    New-Item -ItemType Directory -Force -Path "$profDst" -ErrorAction SilentlyContinue | Out-Null;',
              '    @("Desktop", "Documents", "Downloads", "Pictures") | ForEach-Object {',
              '        $src = [System.IO.Path]::Combine($userProf, $_);',
              '        $dst = [System.IO.Path]::Combine($profDst, $_);',
              '        if (Test-Path $src) { robocopy $src $dst /E /XJ /R:1 /W:1 /NFL /NDL /NJH /NJS /NP *> $null; }',
              '    };',
              '};',
              '$out7zDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "save-7z");',
              'if (Test-Path "$out7zDir") { Remove-Item -Path "$out7zDir" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$out7zDir" -ErrorAction SilentlyContinue | Out-Null;',
              '$outPrefix = [System.IO.Path]::Combine($out7zDir, "zenova-drive.7z");',
              '& 7z a -t7z -m0=lzma2 -mx=1 -md=16m -mfb=32 -ms=on -mmt=on -v1900m "$outPrefix" "$stage\*" *>$null;',
              '$chunks = Get-ChildItem -Path "$out7zDir" -Filter "zenova-drive.7z.*" | Sort-Object Name;',
              'if ($chunks.Count -gt 0) {',
              '    $manifest = [PSCustomObject]@{ machineId = "$env:MACHINE_ID"; savedAt = [DateTimeOffset]::UtcNow.ToString("o"); chunkCount = $chunks.Count; reason = $Reason; };',
              '    $manifestPath = [System.IO.Path]::Combine($out7zDir, "drive-manifest.json");',
              '    $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding UTF8;',
              '    $uploadArgs = @("release", "upload", "$env:RELEASE_TAG", "--repo", "$env:STORAGE_REPO", "--clobber", "$manifestPath");',
              '    foreach ($c in $chunks) { $uploadArgs += $c.FullName; }',
              '    & gh @uploadArgs 2>&1 | Out-Null;',
              '    Write-Host "✅ Đã lưu xong $($chunks.Count) phân mảnh lên GitHub Release!" -ForegroundColor Green;',
              '};',
              '$global:LASTEXITCODE = 0;'
          );

          Set-Content -Path $saveScriptPath -Value ($scriptLines -join "`r`n") -Encoding UTF8;
          "SAVE_SCRIPT_PATH=$saveScriptPath" >> "$env:GITHUB_ENV";
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 3. TẠO SCRIPT ĐỒNG BỘ TRẠNG THÁI MÁY LÊN GIT (WEB PANEL DATA)
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đồng bộ trạng thái máy lên Git
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $pushScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'push-zenova-state.ps1');

          $lines = @(
              '$ErrorActionPreference = "Continue";',
              '$global:LASTEXITCODE = 0;',
              '$state = [PSCustomObject]@{ machineId = "$env:MACHINE_ID"; displayName = "$env:DISPLAY_NAME"; lastSeen = [DateTimeOffset]::UtcNow.ToString("o"); releaseTag = "$env:RELEASE_TAG"; tailscaleIp = if (Test-Path "C:\tailscale-ip.txt") { (Get-Content "C:\tailscale-ip.txt" -Raw).Trim() } else { "" }; stardeskId = if (Test-Path "C:\stardesk-id.txt") { (Get-Content "C:\stardesk-id.txt" -Raw).Trim() } else { "" }; stardeskPin = if (Test-Path "C:\stardesk-pin.txt") { (Get-Content "C:\stardesk-pin.txt" -Raw).Trim() } else { "Zenova2026" }; cloudflareWeb = if (Test-Path "C:\cloudflared-web-url.txt") { (Get-Content "C:\cloudflared-web-url.txt" -Raw).Trim() } else { "" }; cloudflareApollo = if (Test-Path "C:\cloudflared-apollo-url.txt") { (Get-Content "C:\cloudflared-apollo-url.txt" -Raw).Trim() } else { "" }; };',
              '$state | ConvertTo-Json -Depth 5 | Set-Content -Path "$env:STATE_JSON_FILE" -Encoding UTF8;',
              '$stateRepoDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "state-repo");',
              'if (-not (Test-Path "$stateRepoDir")) {',
              '    & git clone --depth 1 "https://x-access-token:$($env:STORAGE_GH_TOKEN)@github.com/$($env:STORAGE_REPO).git" "$stateRepoDir" 2>&1 | Out-Null;',
              '};',
              'if (Test-Path "$stateRepoDir") {',
              '    Push-Location "$stateRepoDir";',
              '    & git config user.name "Zenova-Automation" 2>&1 | Out-Null;',
              '    & git config user.email "zenova@cloud.local" 2>&1 | Out-Null;',
              '    & git checkout -B "$env:STATE_BRANCH" 2>&1 | Out-Null;',
              '    $destState = [System.IO.Path]::Combine("$stateRepoDir", "state.json");',
              '    Copy-Item -Path "$env:STATE_JSON_FILE" -Destination "$destState" -Force -ErrorAction SilentlyContinue;',
              '    & git add state.json 2>&1 | Out-Null;',
              '    & git commit -m "Auto-sync state [$env:MACHINE_ID]" --allow-empty 2>&1 | Out-Null;',
              '    & git push origin "$env:STATE_BRANCH" --force 2>&1 | Out-Null;',
              '    Pop-Location;',
              '};',
              '$global:LASTEXITCODE = 0;'
          );

          Set-Content -Path $pushScriptPath -Value ($lines -join "`r`n") -Encoding UTF8;
          "PUSH_STATE_SCRIPT=$pushScriptPath" >> "$env:GITHUB_ENV";
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 4. KHÔI PHỤC DỮ LIỆU TỪ GITHUB RELEASE
      # ─────────────────────────────────────────────────────────────
      - name: ♻️ Khôi phục dữ liệu từ GitHub Release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $dl = "$env:MOUNT_LETTER";

          $suffix = (("$env:MACHINE_ID").ToUpper() -replace '[^A-Z0-9]', '');
          if ($suffix.Length -gt 8) { $suffix = $suffix.Substring(0, 8); }
          $fixedHost = if ($suffix) { "ZENOVA-$suffix" } else { 'ZENOVA-VPS' };
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;

          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore');
          if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue; }
          New-Item -ItemType Directory -Force -Path "$dlDir" -ErrorAction SilentlyContinue | Out-Null;

          $isFirstRun = $false;
          $sourceTag = "$env:RELEASE_TAG";

          $null = gh release view "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $isFirstRun = $true;
          } else {
              gh release download "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
              $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json');
              if (-not (Test-Path "$manifestFile")) {
                  if ("$env:ROOT_RELEASE_TAG" -and ("$env:ROOT_RELEASE_TAG" -ne "$env:RELEASE_TAG")) {
                      $null = gh release view "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
                      if (($LASTEXITCODE) -eq 0) {
                          gh release download "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
                          if (Test-Path "$manifestFile") {
                              $sourceTag = "$env:ROOT_RELEASE_TAG";
                              Write-Host "📦 Kế thừa bản lưu từ máy gốc [$env:ROOT_RELEASE_TAG]..." -ForegroundColor Cyan;
                          } else {
                              $isFirstRun = $true;
                          }
                      } else {
                          $isFirstRun = $true;
                      }
                  } else {
                      $isFirstRun = $true;
                  }
              }
          }

          $global:LASTEXITCODE = 0;

          if ($isFirstRun) {
              Write-Host "ℹ️ Máy [$env:MACHINE_ID] là máy mới! Tạo phiên làm việc mới..." -ForegroundColor Cyan;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          $manifest = Get-Content -Raw -Path "$manifestFile" | ConvertFrom-Json;
          Write-Host "⬇️ Tìm thấy bản lưu từ [$sourceTag] ($($manifest.chunkCount) phân mảnh). Đang tải..." -ForegroundColor Cyan;
          gh release download "$sourceTag" --repo "$env:STORAGE_REPO" --pattern 'zenova-drive.7z.*' --dir "$dlDir";
          if (($LASTEXITCODE) -ne 0) {
              Write-Host "⚠️ Không tải được phân mảnh từ [$sourceTag], tiếp tục phiên mới..." -ForegroundColor Yellow;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          $firstChunk = [System.IO.Path]::Combine("$dlDir", 'zenova-drive.7z.001');
          if (Test-Path "$firstChunk") {
              Write-Host "📦 Đang giải nén dữ liệu vào ${dl}:\..." -ForegroundColor Cyan;
              & 7z x "$firstChunk" "-o${dl}:\" -y -mmt=on *>$null;
          }

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 5. TẠO USER ZENOVA & TỐI ƯU WINDOWS AN TOÀN
      # ─────────────────────────────────────────────────────────────
      - name: ⚙️ Tạo User Zenova & tối ưu Windows an toàn
        shell: powershell
        env:
          FIXED_PASS: ${{ github.event.inputs.fixed_password || '' }}
        run: |
          $ErrorActionPreference = 'Stop';
          $global:LASTEXITCODE = 0;
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent());
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'Self-hosted Windows runner phải chạy với quyền Administrator.';
          }

          # Tạo mật khẩu ngẫu nhiên nếu người dùng không nhập; không dùng mật khẩu mặc định dùng chung.
          $pass = "$env:FIXED_PASS".Trim();
          if ([string]::IsNullOrWhiteSpace($pass)) {
              $alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%*-_';
              $bytes = New-Object byte[] 28;
              $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create();
              $rng.GetBytes($bytes);
              $passChars = for ($i = 0; $i -lt 24; $i++) { $alphabet[[int]($bytes[$i] % $alphabet.Length)] };
              $pass = -join $passChars;
              $rng.Dispose();
          }
          if ($pass.Length -lt 14) { throw 'Mật khẩu Windows phải có ít nhất 14 ký tự.'; }
          "FIXED_PASSWORD=$pass" >> "$env:GITHUB_ENV";
          "::add-mask::$pass";

          $user = 'zenova';
          $secPass = ConvertTo-SecureString $pass -AsPlainText -Force;
          $existing = Get-LocalUser -Name $user -ErrorAction SilentlyContinue;
          if ($existing) {
              Set-LocalUser -Name $user -Password $secPass -ErrorAction Stop;
          } else {
              New-LocalUser -Name $user -Password $secPass -FullName 'Zenova' -Description 'Zenova Windows user' -ErrorAction Stop | Out-Null;
          }
          Add-LocalGroupMember -Group 'Administrators' -Member $user -ErrorAction SilentlyContinue;
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $user -ErrorAction SilentlyContinue;
          Write-Host '✅ Tài khoản Zenova đã sẵn sàng.' -ForegroundColor Green;

          # Không bật tự đăng nhập và không lưu mật khẩu rõ trong Winlogon.
          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon';
          Set-ItemProperty -Path $winlogon -Name 'AutoAdminLogon' -Value '0' -Force -ErrorAction SilentlyContinue;
          Remove-ItemProperty -Path $winlogon -Name 'DefaultPassword' -ErrorAction SilentlyContinue;

          # Hiệu năng vừa phải, không ép xung / giả mạo CPU / tắt dịch vụ bảo vệ.
          powercfg /setactive SCHEME_MIN 2>$null | Out-Null;
          powercfg /change standby-timeout-ac 0 2>$null | Out-Null;
          powercfg /change monitor-timeout-ac 0 2>$null | Out-Null;
          tzutil /s 'SE Asia Standard Time' 2>$null;
          netsh int tcp set global autotuninglevel=normal 2>$null | Out-Null;
          netsh int tcp set global rss=enabled 2>$null | Out-Null;
          netsh int tcp set global rsc=enabled 2>$null | Out-Null;

          # Bảo vệ hệ thống phải tiếp tục hoạt động.
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -ErrorAction SilentlyContinue;
          try { Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction SilentlyContinue; } catch {}

          # RDP chỉ bật khi cần, có NLA + TLS; firewall sẽ giới hạn trong mạng Tailscale ở bước sau.
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Force;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 2 -Force;
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue;
          Start-Service -Name TermService -ErrorAction SilentlyContinue;
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue | Disable-NetFirewallRule -ErrorAction SilentlyContinue;
          New-NetFirewallRule -DisplayName 'Zenova RDP - Tailscale only' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -RemoteAddress '100.64.0.0/10' -Profile Any -ErrorAction SilentlyContinue | Out-Null;

          Write-Host '✅ Tối ưu hoàn tất; Defender và Windows Firewall vẫn bật.' -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 6. LẤY PUBLIC IP CỦA MÁY
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Lấy Public IP của máy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $pubIp = "";
          @('https://api.ipify.org', 'https://ifconfig.me/ip', 'https://icanhazip.com', 'https://ipinfo.io/ip') | ForEach-Object {
              if (-not $pubIp) {
                  try { $pubIp = (Invoke-RestMethod -Uri $_ -TimeoutSec 4).Trim(); } catch {}
              }
          };
          if (-not $pubIp) { $pubIp = "127.0.0.1"; }
          "MACHINE_PUBLIC_IP=$pubIp" >> "$env:GITHUB_ENV";
          Set-Content -Path "C:\machine-ip.txt" -Value "$pubIp" -Force;
          Write-Host "│ 🌐 IP Outbound: $pubIp" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 7. KẾT NỐI TAILSCALE (OAUTH + KEY CLI DỰ PHÒNG)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Kết nối Tailscale (Official GitHub Action - OAuth)
        uses: tailscale/github-action@v4
        continue-on-error: true
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: 🌐 Kiểm tra & Kết nối Tailscale Key (nếu chưa có OAuth)
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $tsIp = "";
          $tsCli = 'C:\Program Files\Tailscale\tailscale.exe';
          if (-not (Test-Path $tsCli)) {
              $tsCli = (Get-Command tailscale -ErrorAction SilentlyContinue).Source;
          }

          $authKey = "$env:TAILSCALE_KEY_INPUT".Trim();
          if ($authKey -and ($authKey -match '^tskey-')) {
              Write-Host "│ 🔑 Đang kết nối Tailscale qua AuthKey..." -ForegroundColor Cyan;
              if (Test-Path $tsCli) {
                  & "$tsCli" up --authkey="$authKey" --unattended=true --accept-routes=true --netfilter-mode=off 2>&1 | Out-Null;
              }
          }

          if ($tsCli -and (Test-Path $tsCli)) {
              for ($i = 0; $i -lt 25; $i++) {
                  $checkIp = (& "$tsCli" ip -4 2>$null) | Select-Object -First 1;
                  if ($checkIp -and $checkIp.Trim() -match '^100\.') {
                      $tsIp = $checkIp.Trim();
                      break;
                  }
                  Start-Sleep -Seconds 1;
              }
          }

          if ($tsIp) {
              "TAILSCALE_IP=$tsIp" >> "$env:GITHUB_ENV";
              Set-Content -Path "C:\tailscale-ip.txt" -Value "$tsIp" -Force;
              Write-Host "│ 🎉 Tailscale OK! IP: $tsIp" -ForegroundColor Green;
              [Console]::WriteLine("::notice title=TAILSCALE IP SẴN SÀNG::IP: $tsIp | RDP: $tsIp:3389");
          } else {
              Write-Host "│ ⚠️ Tailscale chưa có IP (kiểm tra Secret OAuth hoặc TAILSCALE_AUTHKEY)" -ForegroundColor Yellow;
              Set-Content -Path "C:\tailscale-ip.txt" -Value "Chưa có IP" -Force;
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 9. CÀI APOLLO CHÍNH CHỦ & MỞ CỔNG CHỈ TRONG TAILSCALE
      # ─────────────────────────────────────────────────────────────
      - name: 🚀 Cài Apollo chính chủ cho Moonlight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          Write-Host '🚀 Đang tải Apollo từ kho phát hành chính thức...' -ForegroundColor Cyan;
          $cacheDir = 'C:\ProgramData\Zenova\cache';
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null;
          $apMsi = Join-Path $cacheDir 'Apollo-Windows-AMD64-installer.msi';
          $apolloUrl = 'https://github.com/ClassicOldSong/Apollo/releases/latest/download/Apollo-Windows-AMD64-installer.msi';
          if (-not (Test-Path $apMsi) -or (Get-Item $apMsi).Length -lt 1000000) {
              Remove-Item $apMsi -Force -ErrorAction SilentlyContinue;
              & curl.exe -fL --retry 3 --connect-timeout 20 $apolloUrl -o $apMsi;
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path $apMsi) -or (Get-Item $apMsi).Length -lt 1000000) {
                  throw 'Tải Apollo MSI thất bại hoặc tệp tải về không hợp lệ.';
              }
          }
          $sig = Get-AuthenticodeSignature -FilePath $apMsi;
          Write-Host "ℹ️ Authenticode Apollo MSI: $($sig.Status); nguồn tải là GitHub Releases chính thức." -ForegroundColor Gray;
          $install = Start-Process -FilePath 'msiexec.exe' -ArgumentList "/i `"$apMsi`" /qn /norestart" -PassThru -Wait;
          if ($install.ExitCode -notin @(0, 3010)) { throw "Apollo MSI cài lỗi, mã: $($install.ExitCode)"; }

          $apolloExe = @(
              "$env:ProgramFiles\Apollo\apollo.exe",
              "$env:ProgramFiles\Apollo\Apollo.exe",
              "${env:ProgramFiles(x86)}\Apollo\apollo.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1;
          if (-not $apolloExe) {
              $apolloExe = (Get-ChildItem -Path "$env:ProgramFiles\Apollo" -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^apollo\.exe$' } | Select-Object -First 1).FullName;
          }
          if (-not $apolloExe) { throw 'Đã chạy MSI nhưng không tìm thấy Apollo.exe trong thư mục cài đặt.'; }

          $apolloServices = Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'apollo|sunshine' -or $_.DisplayName -match 'apollo|sunshine' };
          foreach ($svc in $apolloServices) {
              Set-Service -Name $svc.Name -StartupType Automatic -ErrorAction SilentlyContinue;
              if ($svc.Status -ne 'Running') { Start-Service -Name $svc.Name -ErrorAction SilentlyContinue; }
          }
          if (-not (Get-Process -Name 'apollo' -ErrorAction SilentlyContinue)) {
              Start-Process -FilePath $apolloExe -WorkingDirectory (Split-Path $apolloExe) -WindowStyle Hidden;
          }

          # Apollo Web UI uses HTTPS on 47990. Do not publish it through a public tunnel.
          Get-NetFirewallRule -DisplayName 'Zenova Apollo *' -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue;
          New-NetFirewallRule -DisplayName 'Zenova Apollo TCP - Tailscale only' -Direction Inbound -Action Allow -Protocol TCP -LocalPort '47984,47989,47990,48010' -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null;
          New-NetFirewallRule -DisplayName 'Zenova Apollo UDP - Tailscale only' -Direction Inbound -Action Allow -Protocol UDP -LocalPort '47998,47999,48000,48002,48010' -RemoteAddress '100.64.0.0/10' -Profile Any | Out-Null;

          $ready = $false;
          for ($i = 0; $i -lt 30; $i++) {
              $tcp = New-Object System.Net.Sockets.TcpClient;
              try {
                  $ar = $tcp.BeginConnect('127.0.0.1', 47990, $null, $null);
                  if ($ar.AsyncWaitHandle.WaitOne(1000) -and $tcp.Connected) { $ready = $true; }
              } catch {} finally { $tcp.Close(); }
              if ($ready) { break; }
              Start-Sleep -Seconds 2;
          }
          if (-not $ready) { throw 'Apollo đã cài nhưng Web UI chưa mở được trên cổng 47990. Xem log Apollo trong Program Files\Apollo\config.'; }
          Write-Host '✅ Apollo đã cài và cổng HTTPS 47990 đang lắng nghe.' -ForegroundColor Green;
          Write-Host 'ℹ️ Lần đầu mở Web UI, hãy tự tạo tài khoản quản trị Apollo; sau đó ghép đôi Moonlight.' -ForegroundColor Yellow;

          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 10. TẢI TRỌN BỘ APP VÀO C:\Apps & DOWNLOADS (ĐÃ BỎ DISCORD)
      # ─────────────────────────────────────────────────────────────
      - name: 📦 Tải trọn bộ App vào C:\Apps và Downloads
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          Write-Host "📦 ĐANG TẢI & CÀI ĐẶT TRỌN BỘ ỨNG DỤNG (KHÔNG CÓ DISCORD)..." -ForegroundColor Cyan;
          
          $dl = "$env:MOUNT_LETTER";
          $allDownloadFolders = @(
              "C:\Users\zenova\Downloads",
              "C:\Users\runneradmin\Downloads",
              "${dl}:\Downloads",
              "C:\Apps"
          );
          foreach ($f in $allDownloadFolders) {
              New-Item -ItemType Directory -Force -Path $f -ErrorAction SilentlyContinue | Out-Null;
          }
          New-Item -ItemType Directory -Force -Path 'C:\Bloxstrap', 'C:\EVKey', 'C:\PrismLauncher', 'C:\Program Files (x86)\StarDesk' -ErrorAction SilentlyContinue | Out-Null;

          # 1. TẢI TOÀN BỘ FILE TỪ BUNDLE GITHUB RELEASE 'zenova-apps'
          try {
              $bundleDir = "$env:TEMP\zenova-apps-bundle";
              New-Item -ItemType Directory -Force -Path $bundleDir -ErrorAction SilentlyContinue | Out-Null;
              & gh release download zenova-apps --repo "$env:RUNNER_REPO" --dir "$bundleDir" 2>&1 | Out-Null;
              if (Test-Path "$bundleDir") {
                  Get-ChildItem -Path "$bundleDir" | ForEach-Object {
                      $file = $_;
                      foreach ($df in $allDownloadFolders) {
                          Copy-Item -Path $file.FullName -Destination $df -Force -ErrorAction SilentlyContinue;
                      }
                  }
                  Write-Host "│ ✅ Đã tải toàn bộ file app vào C:\Apps và Downloads!" -ForegroundColor Green;
              }
          } catch {
              Write-Host "│ ⚠️ Lỗi khi tải release bundle (Bỏ qua)" -ForegroundColor Yellow;
          }

          # 2. TẢI SONG SONG CÁC APP CHÍNH
          $sdInstaller  = 'C:\StarDesk_1.5.3.exe';
          $gvInstaller  = 'C:\uuyc_4.43.1.exe';
          $evZip        = "$env:TEMP\EVKey.zip";
          $spInstaller  = "$env:TEMP\SpotifySetup.exe";
          $bdInstaller  = "$env:TEMP\bdcamsetup.exe";
          $bloxExe      = 'C:\Bloxstrap\Bloxstrap.exe';
          $mcZip        = "$env:TEMP\PrismLauncher.zip";
          $net8Exe      = "$env:TEMP\dotnet8.exe";
          $vcExe        = "$env:TEMP\vcredist_x64.exe";
          $vsCodeSetup  = "C:\Users\zenova\Downloads\VSCodeUserSetup-x64.exe";
          $windhawkExe  = "C:\Users\zenova\Downloads\windhawk_setup.exe";
          $autoClickExe = "C:\Users\zenova\Downloads\AutoClicker.exe";

          $parallelDownloads = @(
              '--url', 'https://github.com/ddvdat-glitch/abcd/releases/download/app/StarDesk_1.5.3.exe', '-o', "$sdInstaller",
              '--url', 'https://github.com/ddvdat-glitch/abcd/releases/download/app/uuyc_4.43.1.exe', '-o', "$gvInstaller",
              '--url', 'https://github.com/lamquangminh/EVKey/releases/download/Release/EVKey.zip', '-o', "$evZip",
              '--url', 'https://aka.ms/vs/17/release/vc_redist.x64.exe', '-o', "$vcExe",
              '--url', 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe', '-o', "$net8Exe",
              '--url', 'https://github.com/bloxstraplabs/bloxstrap/releases/download/v2.7.0/Bloxstrap-v2.7.0.exe', '-o', "$bloxExe",
              '--url', 'https://github.com/Diegiwg/PrismLauncher-Cracked/releases/download/11.0.3/PrismLauncher-Windows-MSVC-Portable-11.0.3.zip', '-o', "$mcZip",
              '--url', 'https://download.scdn.co/SpotifySetup.exe', '-o', "$spInstaller",
              '--url', 'https://dl.bandicam.com/bdcamsetup.exe', '-o', "$bdInstaller",
              '--url', 'https://update.code.visualstudio.com/latest/win32-x64-user/stable', '-o', "$vsCodeSetup",
              '--url', 'https://github.com/ramensoftware/windhawk/releases/download/v1.5.1/windhawk_setup.exe', '-o', "$windhawkExe",
              '--url', 'https://github.com/chrisd1100/OP-AutoClicker/releases/download/v4.0/OPAutoClicker.exe', '-o', "$autoClickExe"
          );
          & curl.exe -L -s --retry 2 -Z @parallelDownloads;

          # Sao chép các file vừa tải vào all Downloads folders
          foreach ($appPath in @("$vsCodeSetup", "$windhawkExe", "$autoClickExe", "$bloxExe")) {
              if (Test-Path $appPath) {
                  Copy-Item -Path $appPath -Destination "C:\Users\runneradmin\Downloads\" -Force -ErrorAction SilentlyContinue;
                  Copy-Item -Path $appPath -Destination "${dl}:\Downloads\" -Force -ErrorAction SilentlyContinue;
                  Copy-Item -Path $appPath -Destination "C:\Apps\" -Force -ErrorAction SilentlyContinue;
              }
          }

          # Hình nền mặc định (Không áp dụng hình Zenova, trả về mặc định của Windows)
          try {
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value "" -Force -ErrorAction SilentlyContinue;
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "10" -Force -ErrorAction SilentlyContinue;
          } catch {}

          # .NET 8 & VC++
          try {
              if (Test-Path "$vcExe") { Start-Process -FilePath "$vcExe" -ArgumentList "/install /quiet /norestart" -Wait -ErrorAction SilentlyContinue; }
              if (Test-Path "$net8Exe") { Start-Process -FilePath "$net8Exe" -ArgumentList "/install /quiet /norestart" -Wait -ErrorAction SilentlyContinue; }
          } catch {}

          # STAR DESK CHINESE CLIENT: chỉ chạy installer có chữ ký Authenticode hợp lệ.
          $pin = "$env:INPUT_PIN_CODE";
          if (-not $pin) { $pin = 'Zenova2026'; }
          $cleanPin = ($pin -replace '[^A-Za-z0-9]', '');
          if (($cleanPin.Length -lt 8) -or ($cleanPin.Length -gt 16)) { $cleanPin = 'Zenova2026'; }
          if (-not (Test-Path $sdInstaller) -or (Get-Item $sdInstaller).Length -lt 100000) {
              throw 'Không tìm thấy bộ cài StarDesk 1.5.3 hợp lệ.';
          }
          $sdSignature = Get-AuthenticodeSignature -FilePath $sdInstaller;
          if ($sdSignature.Status -ne 'Valid') {
              throw "Bộ cài StarDesk 1.5.3 không có chữ ký số hợp lệ ($($sdSignature.Status)); dừng để tránh cài nhầm phần mềm điều khiển từ xa.";
          }
          $sdInstall = Start-Process -FilePath $sdInstaller -ArgumentList '/S' -PassThru -Wait -ErrorAction Stop;
          if ($sdInstall.ExitCode -notin @(0, 1641, 3010)) {
              Write-Host "⚠️ StarDesk installer trả mã $($sdInstall.ExitCode); sẽ kiểm tra app ở bước lấy ID." -ForegroundColor Yellow;
          }
          Set-Content -Path 'C:\stardesk-pin.txt' -Value $cleanPin -Force;
          Write-Host "✅ Đã xử lý bộ cài StarDesk; nhà phát hành: $($sdSignature.SignerCertificate.Subject)" -ForegroundColor Green;

          # EVKey
          if ((Test-Path "$evZip") -and ((Get-Item "$evZip").Length -gt 50000)) {
              try {
                  $evDir = 'C:\EVKey';
                  Expand-Archive -Path "$evZip" -DestinationPath "$evDir" -Force;
                  $evExe = "$evDir\EVKey64.exe";
                  if (Test-Path "$evExe") {
                      Start-Process -FilePath "$evExe" -WorkingDirectory "$evDir" -ErrorAction SilentlyContinue;
                      Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'EVKey' -Value "`"$evExe`"" -Force -ErrorAction SilentlyContinue;
                  }
              } catch {}
          }

          # Spotify & Bandicam
          try {
              if (Test-Path "$spInstaller") { Start-Process -FilePath "$spInstaller" -ArgumentList '/silent' -ErrorAction SilentlyContinue; }
              if (Test-Path "$bdInstaller") { Start-Process -FilePath "$bdInstaller" -ArgumentList '/S' -ErrorAction SilentlyContinue; }
          } catch {}

          # Bloxstrap Fix Lag
          try {
              $bloxCfgDir = "C:\Users\zenova\AppData\Local\Bloxstrap\Modifications\ClientSettings";
              New-Item -ItemType Directory -Force -Path $bloxCfgDir -ErrorAction SilentlyContinue | Out-Null;
              $fastFlags = @{ "DFIntTaskSchedulerTargetFps" = 120; "FFlagDisablePostFx" = "True"; "FFlagDebugGraphicsPreferD3D11" = "True" } | ConvertTo-Json;
              Set-Content -Path "$bloxCfgDir\ClientAppSettings.json" -Value $fastFlags -Encoding UTF8 -Force;
          } catch {}

          # Minecraft PrismLauncher
          if (Test-Path "$mcZip") {
              try {
                  $mcDir = 'C:\PrismLauncher';
                  Expand-Archive -Path "$mcZip" -DestinationPath "$mcDir" -Force;
              } catch {}
          }

          if ("$env:CHOCO_PACKAGES") {
              try { choco install "$env:CHOCO_PACKAGES" -y --no-progress --limit-output; } catch {}
          }

          Write-Host "✅ Toàn bộ ứng dụng đã được tải và cài đặt hoàn tất!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 10A. CÀI HÌNH NỀN MINECRAFT SUNSET MẶC ĐỊNH CHO MỌI USER
      # ─────────────────────────────────────────────────────────────
      - name: 🖼️ Cài hình nền Minecraft mặc định
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          $source = Join-Path $env:GITHUB_WORKSPACE 'assets\minecraft-wallpaper.jpg';
          if (-not (Test-Path $source)) { throw "Thiếu assets\minecraft-wallpaper.jpg trong repository."; }
          $targetDir = 'C:\ProgramData\Zenova';
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null;
          $target = Join-Path $targetDir 'minecraft-wallpaper.jpg';
          Copy-Item -Path $source -Destination $target -Force;
          $scriptPath = Join-Path $targetDir 'Apply-Wallpaper.ps1';
          $wallScript = @'
          $wall = 'C:\ProgramData\Zenova\minecraft-wallpaper.jpg'
          if (Test-Path $wall) {
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value $wall -Force
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value '10' -Force
              Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name TileWallpaper -Value '0' -Force
              Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class ZenovaWallpaperNative {
              [DllImport("user32.dll", SetLastError=true, CharSet=CharSet.Auto)]
              public static extern bool SystemParametersInfo(uint action, uint param, string path, uint flags);
          }
          "@
              [ZenovaWallpaperNative]::SystemParametersInfo(20, 0, $wall, 3) | Out-Null
          }
          '@;
          Set-Content -Path $scriptPath -Value $wallScript -Encoding UTF8 -Force;
          $runKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run';
          New-Item -Path $runKey -Force | Out-Null;
          Set-ItemProperty -Path $runKey -Name 'ZenovaMinecraftWallpaper' -Value "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$scriptPath`"" -Force;
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $scriptPath;
          Write-Host '✅ Hình nền đã được cài; mọi user sẽ nhận hình này khi đăng nhập.' -ForegroundColor Green;

      # ─────────────────────────────────────────────────────────────
      # 11. MỞ STARDESK TRUNG & ĐỌC DEVICE ID THẬT
      # ─────────────────────────────────────────────────────────────
      - name: 🔑 Mở StarDesk 中文版 và nhận diện Device ID
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          $dataDir = 'C:\ProgramData\Zenova';
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null;
          $helper = Join-Path $dataDir 'Find-StarDeskId.ps1';
          $helperContent = @'
          $ErrorActionPreference = 'SilentlyContinue'
          $id = "$env:STARDESK_ID_INPUT".Trim()
          if ($id -notmatch '^\d{6,20}$') { $id = '' }
          $idPattern = '(?im)(?:device[\s_-]*id|deviceid|computer[\s_-]*id|client[\s_-]*id|设备\s*ID|设备编号|设备号|本机\s*ID|本机编号)\s*["'']?\s*[:=：]\s*["'']?(\d{6,20})'
          $roots = @(
              'C:\ProgramData\StarDesk',
              'C:\Program Files\StarDesk',
              'C:\Program Files (x86)\StarDesk',
              "$env:APPDATA\StarDesk",
              "$env:LOCALAPPDATA\StarDesk",
              'C:\Users\zenova\AppData\Roaming\StarDesk',
              'C:\Users\zenova\AppData\Local\StarDesk',
              'C:\Users\runneradmin\AppData\Roaming\StarDesk',
              'C:\Users\runneradmin\AppData\Local\StarDesk'
          )
          if (-not $id) {
              foreach ($root in $roots) {
                  if (-not (Test-Path $root)) { continue }
                  $files = Get-ChildItem -Path $root -File -Recurse -ErrorAction SilentlyContinue |
                      Where-Object { $_.Length -lt 2097152 -and $_.Extension -match '^\.(ini|json|conf|log|xml|txt|dat)$' } |
                      Select-Object -First 500
                  foreach ($file in $files) {
                      $body = Get-Content -Path $file.FullName -Raw -ErrorAction SilentlyContinue
                      if ($body -match $idPattern) { $id = $Matches[1]; break }
                  }
                  if ($id) { break }
              }
          }
          # UI Automation: đọc text của cửa sổ StarDesk (có thể cần runner chạy ở phiên desktop tương tác).
          if (-not $id) {
              try {
                  Add-Type -AssemblyName UIAutomationClient
                  Add-Type -AssemblyName UIAutomationTypes
                  $procs = Get-Process -Name 'StarDesk' -ErrorAction SilentlyContinue
                  $rootElement = [System.Windows.Automation.AutomationElement]::RootElement
                  $wins = $rootElement.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)
                  foreach ($win in $wins) {
                      if ($procs.Id -contains $win.Current.ProcessId) {
                          $els = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
                          $labels = @($win.Current.Name) + @($els | ForEach-Object { $_.Current.Name })
                          $joined = $labels -join "`n"
                          if ($joined -match '(?is)(?:设备\s*ID|设备编号|设备号|本机\s*ID|Device\s*ID|ID)\s*[:：]?\s*(\d{6,20})') { $id = $Matches[1]; break }
                      }
                  }
              } catch {}
          }
          if ($id -match '^\d{6,20}$') {
              Set-Content -Path 'C:\stardesk-id.txt' -Value $id -Encoding ASCII -Force
          } else {
              Set-Content -Path 'C:\stardesk-id.txt' -Value 'Đang chờ StarDesk đăng nhập / chưa đọc được ID' -Encoding UTF8 -Force
          }
          $pin = if (Test-Path 'C:\stardesk-pin.txt') { (Get-Content 'C:\stardesk-pin.txt' -Raw).Trim() } else { 'Zenova2026' }
          Set-Content -Path 'C:\stardesk-pin.txt' -Value $pin -Encoding ASCII -Force
          '@;
          Set-Content -Path $helper -Value $helperContent -Encoding UTF8 -Force;

          $sdExe = (Get-ChildItem -Path @('C:\Program Files\StarDesk','C:\Program Files (x86)\StarDesk') -Filter 'StarDesk.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName;
          if (-not $sdExe) { throw 'Không tìm thấy StarDesk.exe sau khi cài đặt. Kiểm tra bộ cài StarDesk 1.5.3.'; }
          if (-not (Get-Process -Name 'StarDesk' -ErrorAction SilentlyContinue)) {
              Start-Process -FilePath $sdExe -WorkingDirectory (Split-Path $sdExe) -ErrorAction Stop | Out-Null;
          }
          Start-Sleep -Seconds 15;
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $helper;
          $sdId = (Get-Content 'C:\stardesk-id.txt' -Raw).Trim();
          if ($sdId -match '^\d{6,20}$') {
              Write-Host "✅ StarDesk 中文版 Device ID: $sdId" -ForegroundColor Green;
          } else {
              Write-Host '⚠️ StarDesk đang mở; ID chưa đọc được tự động. Dashboard sẽ tiếp tục dò khi app đăng nhập xong.' -ForegroundColor Yellow;
          }
          $sdPin = (Get-Content 'C:\stardesk-pin.txt' -Raw).Trim();
          "STARDESK_ID=$sdId" >> "$env:GITHUB_ENV";
          "STARDESK_PIN=$sdPin" >> "$env:GITHUB_ENV";
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 12. TẠO ICON DESKTOP ĐẦY ĐỦ TIỆN ÍCH (FIX LỖI EMOJI TRONG TÊN FILE)
      # ─────────────────────────────────────────────────────────────
      - name: 🖥️ Tạo các phím tắt tiện ích trên Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
