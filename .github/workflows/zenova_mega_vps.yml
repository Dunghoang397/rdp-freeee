          # 4. KÃ­ch hoáº¡t Power Scheme High Performance & Cháº·n Sleep/Hibernate
          Write-Host "ðŸ”‹ Thiáº¿t láº­p cháº¿ Ä‘á»™ nguá»“n High Performance (KhÃ´ng bao giá» táº¯t)..." -ForegroundColor Cyan;
          try {
