          # 5. Tá»‘i Æ°u TCP/IP Stack & Táº¯t Nagle Algorithm Ä‘á»ƒ giáº£m Ping RDP tá»‘i Ä‘a
          Write-Host "ðŸŒ Tá»‘i Æ°u hÃ³a Network Stack TCP/IP cho RDP Ä‘á»™ trá»… cá»±c tháº¥p..." -ForegroundColor Cyan;
          try {
