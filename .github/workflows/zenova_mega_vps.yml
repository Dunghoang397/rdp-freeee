name: 🚀 ZENOVA ULTIMATE VPS (Windows + Linux)

'on':
  workflow_dispatch:
    inputs:
      os_type:
        description: '🖥️ Hệ điều hành (windows, linux, hoặc both)'
        required: false
        default: 'windows'
        type: choice
        options:
          - 'windows'
          - 'linux'
          - 'both'
      machine_id:
        description: '🏷️ Tên định danh máy (VD: zenova-1)'
        required: false
        default: 'zenova-1'
        type: string
      display_name:
        description: '🏷️ Tên hiển thị của máy'
        required: false
        default: 'Zenova Ultimate Machine'
        type: string
      duration:
        description: '🕐 Thời gian sử dụng (tối đa 24h - có thể chọn)'
        required: false
        default: '24h'
        type: choice
        options:
          - '1h'
          - '3h'
          - '5h'
          - '6h'
          - '12h'
          - '24h'
      auto_restart:
        description: '🔁 Tự khởi động phiên mới & lưu dữ liệu cho phiên mới'
        required: false
        default: true
        type: boolean
      drive_letter:
        description: '💽 Ký tự ổ đĩa ảo riêng biệt lưu dữ liệu (VD: X)'
        required: false
        default: 'X'
        type: string
      vhd_size_gb:
        description: '📦 Dung lượng ổ đĩa ảo VHDX (GB - co giãn động)'
        required: false
        default: '45'
        type: string
      windows_image:
        description: '🪟 Bản Windows (Đã loại bỏ Win 19 vì GitHub cấm)'
        required: false
        default: 'windows-2022'
        type: choice
        options:
          - 'windows-2022'
          - 'windows-2025'
      fixed_password:
        description: '🔐 Mật khẩu RDP / Sunshine / Windows cố định'
        required: false
        default: 'Zenova@2026'
        type: string
      pin_code:
        description: '🔑 Mã PIN StarDesk Trung / GameViewer (VD: Zenova2026)'
        required: false
        default: 'Zenova2026'
        type: string
      stardesk_id_trung:
        description: '🌟 ID StarDesk Trung (để trống hệ thống tự nhận diện)'
        required: false
        default: ''
        type: string
      storage_repo:
        description: '📦 Repo lưu trữ ổ đĩa (để trống dùng chính repo này)'
        required: false
        default: ''
        type: string
      root_machine_id:
        description: '🏷️ Tên máy gốc để kế thừa ổ đĩa lần đầu (nếu có)'
        required: false
        default: 'zenova-root'
        type: string
      choco_packages:
        description: '📦 App cài thêm qua choco (lưu vết sang phiên sau)'
        required: false
        default: 'googlechrome vlc 7zip notepadplusplus'
        type: string
      optimize_windows:
        description: '⚙️ Tối ưu tối thượng (Fix CPU 100%, Fix Lag, Múi giờ VN)'
        required: false
        default: true
        type: boolean
      enable_duckdns:
        description: '🦆 Cập nhật DuckDNS'
        required: false
        default: true
        type: boolean
      vdd_resolution:
        description: '🖥️ Độ phân giải màn hình ảo VDD'
        required: false
        default: '1920x1080@60'
        type: choice
        options:
          - '1920x1080@60'
          - '1920x1080@120'
          - '2560x1440@60'
          - '3840x2160@60'

permissions:
  contents: write
  actions: write

concurrency:
  group: zenova-vps-${{ inputs.machine_id || 'zenova-1' }}-${{ inputs.os_type || 'windows' }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # JOB 1: ZENOVA WINDOWS RUNNER (RDP + SUNSHINE + STARDESK TRUNG + VHD)
  # =========================================================================
  Zenova-Windows:
    name: 🪟 Windows VPS (RDP + Sunshine + StarDesk Trung)
    runs-on: ${{ inputs.windows_image || 'windows-2022' }}
    if: ${{ inputs.os_type != 'linux' }}
    timeout-minutes: 1440

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.STORAGE_GH_TOKEN || secrets.GH_TOKEN || github.token }}
      STORAGE_GH_TOKEN: ${{ secrets.STORAGE_GH_TOKEN || secrets.PAT_TOKEN || github.token }}
      STORAGE_REPO: ${{ inputs.storage_repo || github.repository }}
      RUNNER_GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      RUNNER_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'zenova-1' }}
      ROOT_MACHINE_ID: ${{ inputs.root_machine_id || 'zenova-root' }}
      DISPLAY_NAME: ${{ inputs.display_name || inputs.machine_id || 'Zenova Ultimate Machine' }}
      DRIVE_LETTER: ${{ inputs.drive_letter || 'X' }}
      VHD_SIZE_GB: ${{ inputs.vhd_size_gb || '45' }}
      WEB_PORT: '8080'
      SUNSHINE_WEB_PORT: '47990'
      ENABLE_DUCKDNS: ${{ inputs.enable_duckdns }}
      INPUT_PIN_CODE: ${{ inputs.pin_code || 'Zenova2026' }}
      STARDESK_ID_INPUT: ${{ inputs.stardesk_id_trung || '' }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. DỰNG Ổ ĐĨA RIÊNG & CHUẨN BỊ THÔNG SỐ
      # ─────────────────────────────────────────────────────────────
      - name: 🧱 Dựng ổ đĩa riêng & Chuẩn bị thông số
        shell: pwsh
        env:
          INPUT_DURATION: ${{ inputs.duration }}
        run: |
          $nowEpoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
          "JOB_START_EPOCH=$nowEpoch" >> "$env:GITHUB_ENV";

          # Chuẩn hóa Machine ID
          $cleanId = (("$env:MACHINE_ID").Trim().ToLower() -replace '[^a-z0-9\-]', '-') -replace '\-+', '-' -replace '^\-|\-$', '';
          if ([string]::IsNullOrWhiteSpace("$cleanId")) { $cleanId = 'zenova-1'; }
          $relTag      = "zenova-storage-$cleanId";
          $stateBranch = "zenova-state-$cleanId";
          $rootRelTag  = "zenova-storage-$($env:ROOT_MACHINE_ID)";

          "MACHINE_ID=$cleanId" >> "$env:GITHUB_ENV";
          "RELEASE_TAG=$relTag" >> "$env:GITHUB_ENV";
          "STATE_BRANCH=$stateBranch" >> "$env:GITHUB_ENV";
          "ROOT_RELEASE_TAG=$rootRelTag" >> "$env:GITHUB_ENV";

          # Parse thời lượng (Hỗ trợ tối đa 24h)
          $total = 1440;
          $display = '24 giờ (Tối đa)';
          switch ("$env:INPUT_DURATION") {
              '1h'  { $total = 60;   $display = '1 giờ'; }
              '3h'  { $total = 180;  $display = '3 giờ'; }
              '5h'  { $total = 300;  $display = '5 giờ'; }
              '6h'  { $total = 360;  $display = '6 giờ'; }
              '12h' { $total = 720;  $display = '12 giờ'; }
              '24h' { $total = 1440; $display = '24 giờ'; }
              default { $total = 1440; $display = '24 giờ'; }
          }
          "TOTAL_MINUTES=$total" >> "$env:GITHUB_ENV";
          "DISPLAY_TIME=$display" >> "$env:GITHUB_ENV";

          # Cấu hình User zenova chuyên biệt
          $user     = "zenova";
          $profPath = "C:\Users\zenova";
          "RDP_USER=$user" >> "$env:GITHUB_ENV";
          "PROFILE_PATH=$profPath" >> "$env:GITHUB_ENV";

          # Ký tự ổ đĩa ảo
          $dl = (("$env:DRIVE_LETTER").Trim() -replace '[^A-Za-z]', '').ToUpper();
          if ((-not ("$dl")) -or ("$dl" -in @('C', 'D'))) { $dl = 'X'; }
          "MOUNT_LETTER=$dl" >> "$env:GITHUB_ENV";

          # Khởi tạo VHDX ảo hoặc DOS Device
          $vhdContainer = 'C:\ZENOVA-VHD-HOST';
          New-Item -ItemType Directory -Force -Path "$vhdContainer" | Out-Null;
          $vhdFile = [System.IO.Path]::Combine("$vhdContainer", 'zenova-os.vhdx');

          $sizeBytes = ([int64]"$env:VHD_SIZE_GB") * 1GB;
          Write-Host "💽 Đang khởi tạo ổ đĩa riêng ${dl}:\ ($env:VHD_SIZE_GB GB Dynamic VHDX)..." -ForegroundColor Cyan;
          $mounted = $false;
          try {
              if (-not (Test-Path "$vhdFile")) {
                  New-VHD -Path "$vhdFile" -SizeBytes ($sizeBytes) -Dynamic | Mount-VHD -PassThru | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -DriveLetter "$dl" -UseMaximumSize | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'ZENOVA-OS' -Confirm:($false) | Out-Null;
              } else {
                  Mount-VHD -Path "$vhdFile";
              }
              $null = Get-PSDrive -Name "$dl" -ErrorAction Stop;
              if (Test-Path "${dl}:\") { $mounted = $true; }
          } catch {
              Write-Host "⚠️ Fallback sang cơ chế Kernel DOS Devices cho ${dl}:\..." -ForegroundColor Yellow;
          }

          if (-not ($mounted)) {
              $fallbackDir = [System.IO.Path]::Combine("$vhdContainer", 'VIRTUAL-DRIVE-ROOT');
              New-Item -ItemType Directory -Force -Path "$fallbackDir" | Out-Null;
              & subst "${dl}:" "$fallbackDir";
              Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\DOS Devices' -Name "${dl}:" -Value "\??\$fallbackDir" -Type String -Force;
              $null = New-PSDrive -Name "$dl" -PSProvider FileSystem -Root "${dl}:\" -Scope Global -ErrorAction SilentlyContinue;
          }

          $sharedRoot       = "${dl}:\ZENOVA-SYSTEM";
          $sharedSessionDir = "$sharedRoot\sessions";
          $sharedDataDir    = "$sharedRoot\DATA";
          $sharedOsDir      = "$sharedRoot\OS-OVERLAY";
          $sharedStateFile  = "$sharedSessionDir\rdp-session-state.json";
          $profileStoreRoot = "$sharedRoot\Users";
          $baselineFile     = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'baseline-c-dirs.json');
          $controlSignal    = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'zenova-control-action.txt');

          @("$sharedRoot", "$sharedSessionDir", "$sharedDataDir", "$sharedOsDir", "$profileStoreRoot", "${dl}:\Apps") | ForEach-Object {
              New-Item -ItemType Directory -Force -Path "$_" | Out-Null;
          };

          $baseline = @{
              PF64 = @(Get-ChildItem 'C:\Program Files' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
              PF86 = @(Get-ChildItem 'C:\Program Files (x86)' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
              PD   = @(Get-ChildItem 'C:\ProgramData' -Directory -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name);
          };
          $baseline | ConvertTo-Json -Depth 4 | Set-Content -Path "$baselineFile" -Encoding UTF8;

          "VHD_CONTAINER=$vhdContainer" >> "$env:GITHUB_ENV";
          "VHD_FILE=$vhdFile" >> "$env:GITHUB_ENV";
          "SHARED_ROOT=$sharedRoot" >> "$env:GITHUB_ENV";
          "SHARED_SESSION_DIR=$sharedSessionDir" >> "$env:GITHUB_ENV";
          "SHARED_DATA_DIR=$sharedDataDir" >> "$env:GITHUB_ENV";
          "SHARED_OS_DIR=$sharedOsDir" >> "$env:GITHUB_ENV";
          "SHARED_STATE_FILE=$sharedStateFile" >> "$env:GITHUB_ENV";
          "PROFILE_ROOT=$profileStoreRoot" >> "$env:GITHUB_ENV";
          "BASELINE_FILE=$baselineFile" >> "$env:GITHUB_ENV";
          "CONTROL_SIGNAL_FILE=$controlSignal" >> "$env:GITHUB_ENV";

          $build = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').CurrentBuild;
          "OS_BUILD=$build" >> "$env:GITHUB_ENV";

          # Đảm bảo GitHub Release cho máy tồn tại
          $null = gh release view "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $dummy = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'init.txt');
              Set-Content -Path "$dummy" -Value "Zenova Persistent Storage Initialized for $cleanId" -Encoding UTF8;
              gh release create "$env:RELEASE_TAG" "$dummy" --repo "$env:STORAGE_REPO" --title "Zenova Storage ($cleanId)" --notes "Kho lưu trữ ổ đĩa tự động cho máy [$cleanId]";
          }
          $global:LASTEXITCODE = 0;
          Write-Host "✅ Dựng ổ đĩa ${dl}:\ thành công | Định danh: $cleanId | Thời lượng: $display" -ForegroundColor Green;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 2. TẠO SCRIPT ĐÓNG GÓI & LƯU TRỮ Ổ ĐĨA (SAVE-DATA.PS1)
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đóng gói & lưu trữ dữ liệu
        shell: pwsh
        run: |
          $scriptLines = @(
              'param([string]$Reason = "session-end")',
              '$ErrorActionPreference = "Continue";',
              'if ("$env:STORAGE_GH_TOKEN") { $env:GH_TOKEN = "$env:STORAGE_GH_TOKEN"; $env:GITHUB_TOKEN = "$env:STORAGE_GH_TOKEN"; }',
              'if (("$env:DATA_RESTORED" -ne "1") -or ("$env:SESSION_READY" -ne "1")) {',
              '    Write-Host "⚠️ Phiên chưa sẵn sàng hoàn toàn, bỏ qua lưu dữ liệu!" -ForegroundColor Yellow;',
              '    exit 0;',
              '}',
              '$root  = "$env:SHARED_ROOT";',
              '$osDir = "$env:SHARED_OS_DIR";',
              '$dl    = "$env:MOUNT_LETTER";',
              'if ((-not ("$root")) -or (-not (Test-Path "$root"))) { exit 0; }',
              '',
              'Write-Host "💾 [$Reason] Đang đóng các ứng dụng để nhả khóa file an toàn..." -ForegroundColor Cyan;',
              '$appsToClose = @("chrome", "msedge", "brave", "coccoc", "firefox", "discord", "Spotify", "StarDesk", "GameViewer", "GameViewerServer", "Bandicam", "EVKey", "Roblox", "RobloxPlayerBeta");',
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | ForEach-Object { $null = $_.CloseMainWindow(); };',
              'Start-Sleep -Seconds 3;',
              'Get-Process -Name $appsToClose -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue;',
              'if ("$Reason" -eq "session-end") {',
              '    Get-Service -Name "*StarDesk*", "*GameViewer*" -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue;',
              '    & taskkill.exe /F /IM "StarDesk*" /T *> $null;',
              '    & taskkill.exe /F /IM "GameViewer*" /T *> $null;',
              '}',
              'Start-Sleep -Seconds 2;',
              '',
              'Write-Host "🔑 [$Reason] Đang giải mã khóa DPAPI Chromium để bảo tồn Cookie..." -ForegroundColor Cyan;',
              'Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue;',
              '$u = "$env:RDP_USER";',
              '$profSrc = "$env:PROFILE_PATH";',
              'if (("$profSrc") -and (Test-Path "$profSrc\AppData")) {',
              '    Get-ChildItem -Path "$profSrc\AppData" -Filter "Local State" -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {',
              '        try {',
              '            $lsFile = $_.FullName;',
              '            $lsJson = Get-Content -Raw -Path "$lsFile" -Encoding UTF8 | ConvertFrom-Json;',
              '            if ($lsJson.os_crypt -and $lsJson.os_crypt.encrypted_key) {',
              '                $encBytes = [Convert]::FromBase64String($lsJson.os_crypt.encrypted_key);',
              '                if ($encBytes.Length -gt 5) {',
              '                    $prefix = [System.Text.Encoding]::ASCII.GetString($encBytes[0..4]);',
              '                    if ($prefix -eq "DPAPI") {',
              '                        $cipher = $encBytes[5..($encBytes.Length - 1)];',
              '                        $rawKey = [System.Security.Cryptography.ProtectedData]::Unprotect($cipher, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser);',
              '                        [Convert]::ToBase64String($rawKey) | Set-Content -Path "$lsFile.zenovakey" -Encoding ASCII -Force;',
              '                    }',
              '                }',
              '            }',
              '        } catch {}',
              '    };',
              '}',
              '',
              'Write-Host "💾 [$Reason] Đang xuất Registry & sao lưu Profile..." -ForegroundColor Cyan;',
              '$regBk = [System.IO.Path]::Combine("$osDir", "Registry");',
              'New-Item -ItemType Directory -Force -Path "$regBk" | Out-Null;',
              'reg export "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x64.reg" /y *> $null;',
              'reg export "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall" "$regBk\Uninstall-x86.reg" /y *> $null;',
              'reg export "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" "$regBk\System-Env.reg" /y *> $null;',
              'reg export "HKLM\SOFTWARE\Microsoft\Cryptography" "$regBk\Machine-Cryptography.reg" /y *> $null;',
              'New-Item -ItemType Directory -Force -Path "$regBk\AppSoftware" | Out-Null;',
              'Get-ChildItem "HKCU:\Software" -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -notin @("Microsoft", "Classes", "Policies", "RegisteredApplications") } | ForEach-Object {',
              '    $subName = $_.PSChildName;',
              '    $safeName = ($subName -replace ''[^A-Za-z0-9._\-]'', ''_'');',
              '    reg export "HKCU\Software\$subName" "$regBk\AppSoftware\App-$safeName.reg" /y *> $null;',
              '};',
              'reg export "HKCU\Environment" "$regBk\User-Env.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" "$regBk\User-StartupRun.reg" /y *> $null;',
              'reg export "HKCU\Control Panel\Desktop" "$regBk\User-Desktop.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes" "$regBk\User-Themes.reg" /y *> $null;',
              'reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers" "$regBk\User-Wallpapers.reg" /y *> $null;',
              '',
              'if (("$u") -and ("$profSrc") -and (Test-Path "$profSrc")) {',
              '    $profDst = [System.IO.Path]::Combine("$root", "Users", "$u");',
              '    New-Item -ItemType Directory -Force -Path "$profDst" | Out-Null;',
              '    $excludeDirs = @(',
              '        "$profSrc\AppData\Roaming\Microsoft\Protect",',
              '        "$profSrc\AppData\Roaming\Microsoft\Crypto",',
              '        "$profSrc\AppData\Local\Microsoft\Credentials",',
              '        "$profSrc\AppData\Local\Temp",',
              '        "$profSrc\AppData\Local\Packages",',
              '        "$profSrc\AppData\Local\Microsoft\Windows\Explorer",',
              '        "$profSrc\AppData\Local\Microsoft\Windows\INetCache",',
              '        "$profSrc\AppData\Local\Microsoft\Windows\WebCache"',
              '    );',
              '    robocopy "$profSrc" "$profDst" /MIR /XJ /R:2 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* WebCacheV01.dat parent.lock lockfile /XD $excludeDirs *> $null;',
              '    $global:LASTEXITCODE = 0;',
              '}',
              '',
              'if (("$env:BASELINE_FILE") -and (Test-Path "$env:BASELINE_FILE")) {',
              '    try {',
              '        $base = Get-Content -Raw -Path "$env:BASELINE_FILE" | ConvertFrom-Json;',
              '        $skipNames = @("Tailscale", "Sunshine", "chocolatey", "Package Cache", "Microsoft", "Windows Defender");',
              '        $cOverlay = [System.IO.Path]::Combine("$osDir", "C-Drive-Overlay");',
              '        New-Item -ItemType Directory -Force -Path "$cOverlay\PF64" | Out-Null;',
              '        New-Item -ItemType Directory -Force -Path "$cOverlay\PF86" | Out-Null;',
              '        New-Item -ItemType Directory -Force -Path "$cOverlay\PD" | Out-Null;',
              '        Get-ChildItem "C:\Program Files" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -notin ($base.PF64)) -and ($_.Name -notin ($skipNames)) } | ForEach-Object {',
              '            $dest = [System.IO.Path]::Combine("$cOverlay\PF64", $_.Name);',
              '            robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '        };',
              '        Get-ChildItem "C:\Program Files (x86)" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -notin ($base.PF86)) -and ($_.Name -notin ($skipNames)) } | ForEach-Object {',
              '            $dest = [System.IO.Path]::Combine("$cOverlay\PF86", $_.Name);',
              '            robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '        };',
              '        Get-ChildItem "C:\ProgramData" -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -notin ($base.PD)) -and ($_.Name -notin ($skipNames)) } | ForEach-Object {',
              '            $dest = [System.IO.Path]::Combine("$cOverlay\PD", $_.Name);',
              '            robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;',
              '        };',
              '    } catch {}',
              '}',
              '',
              'try {',
              '    $extraRoot = [System.IO.Path]::Combine("$osDir", "DriveRoot-Extra");',
              '    New-Item -ItemType Directory -Force -Path "$extraRoot" | Out-Null;',
              '    Get-ChildItem "${dl}:\" -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin @("ZENOVA-SYSTEM", "System Volume Information", "`$RECYCLE.BIN", "Pagefile.sys") } | ForEach-Object {',
              '        $dest = [System.IO.Path]::Combine("$extraRoot", $_.Name);',
              '        if ($_.PSIsContainer) { robocopy ($_.FullName) "$dest" /MIR /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null; }',
              '        else { Copy-Item -Path ($_.FullName) -Destination "$dest" -Force -ErrorAction SilentlyContinue; }',
              '    };',
              '} catch {}',
              '$global:LASTEXITCODE = 0;',
              '',
              '# Đóng gói và đẩy dữ liệu lên GitHub Release',
              '$packDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "gh-pack-$Reason");',
              'if (Test-Path "$packDir") { Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue; }',
              'New-Item -ItemType Directory -Force -Path "$packDir" | Out-Null;',
              '$archiveBase = [System.IO.Path]::Combine("$packDir", "zenova-drive.7z");',
              'Write-Host "📦 [$Reason] Đang nén ổ đĩa bằng 7z (phân mảnh 1900MB)..." -ForegroundColor Cyan;',
              'Push-Location "$root";',
              '& 7z a -t7z -mx=1 -mmt=on -ssw -v1900m "$archiveBase" "*" "-xr!Pagefile.sys" "-xr!swapfile.sys" "-xr!System Volume Information" *> $null;',
              'Pop-Location;',
              '$chunks = @(Get-ChildItem -Path "$packDir" -Filter "zenova-drive.7z.*" | Sort-Object Name);',
              'if (($chunks.Count) -eq 0) { exit 1; }',
              '$manifest = [ordered]@{',
              '    machineId   = "$env:MACHINE_ID";',
              '    updatedUtc  = (Get-Date).ToUniversalTime().ToString("o");',
              '    reason      = "$Reason";',
              '    osBuild     = "$env:OS_BUILD";',
              '    storageRepo = "$env:STORAGE_REPO";',
              '    chunkCount  = $chunks.Count;',
              '    chunks      = @($chunks | ForEach-Object { [ordered]@{ name = $_.Name; size = $_.Length } });',
              '};',
              '$manifestPath = [System.IO.Path]::Combine("$packDir", "drive-manifest.json");',
              '$manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "$manifestPath" -Encoding UTF8;',
              'Write-Host "⬆️ [$Reason] Đang tải $($chunks.Count) phân mảnh lên GitHub Release [$env:RELEASE_TAG]..." -ForegroundColor Cyan;',
              '$uploadFiles = @($chunks | ForEach-Object { $_.FullName }) + @("$manifestPath");',
              'gh release upload "$env:RELEASE_TAG" @uploadFiles --repo "$env:STORAGE_REPO" --clobber;',
              'if (($LASTEXITCODE) -ne 0) { Write-Host "❌ Upload GitHub Release thất bại!" -ForegroundColor Red; exit 1; }',
              '',
              '# Dọn dẹp phân mảnh cũ',
              'try {',
              '    $relJson = gh release view "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" --json assets | ConvertFrom-Json;',
              '    $validNames = @($chunks.Name) + @("drive-manifest.json", "init.txt");',
              '    @($relJson.assets) | ForEach-Object {',
              '        if (($_.name -like "zenova-drive.7z.*") -and ($_.name -notin ($validNames))) {',
              '            gh release delete-asset "$env:RELEASE_TAG" ($_.name) --repo "$env:STORAGE_REPO" -y *> $null;',
              '        }',
              '    };',
              '} catch {}',
              'Remove-Item -Path "$packDir" -Recurse -Force -ErrorAction SilentlyContinue;',
              'Write-Host "✅ [$Reason] Đã lưu trữ hoàn tất dữ liệu lên GitHub Release ($env:RELEASE_TAG)!" -ForegroundColor Green;',
              'exit 0;'
          );
          $saveScriptPath = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1');
          Set-Content -Path "$saveScriptPath" -Value ($scriptLines -join "`r`n") -Encoding UTF8;
          "SAVE_SCRIPT_PATH=$saveScriptPath" >> "$env:GITHUB_ENV";
          Write-Host "✅ Đã tạo save-data.ps1" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 3. TẠO SCRIPT ĐỒNG BỘ TRẠNG THÁI (PUSH-REPO-STATE.PS1)
      # ─────────────────────────────────────────────────────────────
      - name: 🧰 Tạo script đồng bộ trạng thái máy lên Git
        shell: pwsh
        run: |
          $stateLines = @(
              'param([string]$Status = "Online", [string]$SdId = "", [string]$SdPin = "", [string]$ExtraNote = "")',
              '$ErrorActionPreference = "Continue";',
              '$token = if ("$env:STORAGE_GH_TOKEN") { "$env:STORAGE_GH_TOKEN" } else { "$env:GH_TOKEN" };',
              'if (-not $token) { return; }',
              '$cleanId     = "$env:MACHINE_ID";',
              '$stateBranch = "$env:STATE_BRANCH";',
              '$storageRepo = "$env:STORAGE_REPO";',
              '$runnerRepo  = "$env:RUNNER_REPO";',
              '$runId       = "$env:GITHUB_RUN_ID";',
              '$passText    = if ("$env:FIXED_PASSWORD") { "$env:FIXED_PASSWORD" } else { "Zenova@2026" };',
              '$userText    = "zenova";',
              'if ((-not $SdId) -and ("$env:STARDESK_ID")) { $SdId = "$env:STARDESK_ID"; }',
              'if ((-not $SdPin) -and ("$env:INPUT_PIN_CODE")) { $SdPin = "$env:INPUT_PIN_CODE"; }',
              '$nowIso = (Get-Date).ToUniversalTime().ToString("o");',
              '$tz = [System.TimeZoneInfo]::FindSystemTimeZoneById("SE Asia Standard Time");',
              '$nowVn = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $tz).ToString("yyyy-MM-dd HH:mm:ss");',
              '$tsIp = if ("$env:TAILSCALE_IP") { "$env:TAILSCALE_IP" } else { "Đang kết nối..." };',
              '',
              '$stateObj = [ordered]@{',
              '    machineId       = "$cleanId";',
              '    displayName     = "$env:DISPLAY_NAME";',
              '    status          = "$Status";',
              '    isOnline        = ($Status -eq "Online" -or $Status -eq "Running");',
              '    tailscaleIp     = "$tsIp";',
              '    stardeskId      = "$SdId";',
              '    stardeskPin     = "$SdPin";',
              '    sunshinePort    = "47990";',
              '    user            = "$userText";',
              '    pass            = "$passText";',
              '    storageRepo     = "$storageRepo";',
              '    runnerRepo      = "$runnerRepo";',
              '    runId           = "$runId";',
              '    updatedUtc      = "$nowIso";',
              '    updatedVn       = "$nowVn (UTC+7)";',
              '    durationMinutes = [int]"$env:TOTAL_MINUTES";',
              '    connections     = [ordered]@{',
              '        remoteDesktop  = "$tsIp:3389";',
              '        sunshineStream = "https://$tsIp:47990";',
              '        stardeskTrung  = [ordered]@{ id = "$SdId"; pin = "$SdPin" };',
              '    };',
              '    note            = "$ExtraNote"',
              '};',
              '$statusJson = $stateObj | ConvertTo-Json -Depth 6;',
              '$ipLines = @(',
              '    "===========================================================",',
              '    "         THÔNG TIN MÁY CHỦ ZENOVA ULTIMATE VPS             ",',
              '    "===========================================================",',
              '    "Tên hiển thị    : $env:DISPLAY_NAME ($cleanId)",',
              '    "Trạng thái      : $Status",',
              '    "IP Tailscale    : $tsIp",',
              '    "User Windows    : $userText",',
              '    "Mật khẩu máy    : $passText",',
              '    "-----------------------------------------------------------",',
              '    "3 LỰA CHỌN KẾT NỐI:",',
              '    "1. Remote Desktop : $tsIp:3389 (User: $userText | Pass: $passText)",',
              '    "2. Sunshine Stream: https://$tsIp:47990 (User: $userText | Pass: $passText)",',
              '    "3. StarDesk Trung : ID: $SdId | PIN: $SdPin",',
              '    "-----------------------------------------------------------",',
              '    "Web Quản Lý VPS : http://$tsIp:8080/",',
              '    "Kho lưu ổ đĩa   : $storageRepo ($($env:RELEASE_TAG))",',
              '    "Cập nhật lúc    : $nowVn (Giờ Việt Nam)",',
              '    "==========================================================="',
              ');',
              '$ipText = $ipLines -join "`r`n";',
              'Set-Content -Path "$env:RUNNER_TEMP\status.json" -Value "$statusJson" -Encoding UTF8 -Force;',
              'Set-Content -Path "$env:RUNNER_TEMP\ip.txt" -Value "$ipText" -Encoding UTF8 -Force;',
              '',
              '$gitStage = [System.IO.Path]::Combine("$env:RUNNER_TEMP", "git-repo-status");',
              'try {',
              '    if (Test-Path "$gitStage") { Remove-Item -Path "$gitStage" -Recurse -Force -ErrorAction SilentlyContinue; }',
              '    New-Item -ItemType Directory -Force -Path "$gitStage" | Out-Null;',
              '    Push-Location "$gitStage";',
              '    git init -q;',
              '    git config user.name "Zenova-Bot";',
              '    git config user.email "bot@zenova.cloud";',
              '    $remoteUrl = "https://x-access-token:$token@github.com/$storageRepo.git";',
              '    git remote add origin "$remoteUrl";',
              '    git fetch origin "$stateBranch" -q 2>$null;',
              '    if (($LASTEXITCODE) -eq 0) { git checkout -B "$stateBranch" "origin/$stateBranch" -q; }',
              '    else { git checkout --orphan "$stateBranch" -q; }',
              '    Set-Content -Path "$gitStage\status.json" -Value "$statusJson" -Encoding UTF8 -Force;',
              '    Set-Content -Path "$gitStage\ip.txt" -Value "$ipText" -Encoding UTF8 -Force;',
              '    git add status.json ip.txt;',
              '    git commit -m "Update VPS State: $Status [$cleanId - ID: $SdId]" -q 2>$null;',
              '    git push -u origin "$stateBranch" --force -q 2>$null;',
              '    Pop-Location;',
              '} catch {',
              '    if (((Get-Location).Path) -eq "$gitStage") { Pop-Location; }',
              '}'
          );
          $pushStateScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'push-repo-state.ps1');
          Set-Content -Path "$pushStateScript" -Value ($stateLines -join "`r`n") -Encoding UTF8;
          "PUSH_STATE_SCRIPT=$pushStateScript" >> "$env:GITHUB_ENV";
          Write-Host "✅ Đã tạo push-repo-state.ps1" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 4. KHÔI PHỤC TOÀN BỘ Ổ ĐĨA TỪ GITHUB RELEASE
      # ─────────────────────────────────────────────────────────────
      - name: ♻️ Khôi phục dữ liệu từ GitHub Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE   = 0;
          $dl = "$env:MOUNT_LETTER";

          # Tắt mã hóa App-Bound của Chromium
          @(
              'HKLM:\SOFTWARE\Policies\Google\Chrome',
              'HKLM:\SOFTWARE\Policies\Microsoft\Edge',
              'HKLM:\SOFTWARE\Policies\BraveSoftware\Brave',
              'HKLM:\SOFTWARE\Policies\CocCoc\Browser'
          ) | ForEach-Object {
              New-Item -Path "$_" -Force -ErrorAction SilentlyContinue | Out-Null;
              Set-ItemProperty -Path "$_" -Name 'ApplicationBoundEncryptionEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          };

          # Cố định Hostname
          $suffix = (("$env:MACHINE_ID").ToUpper() -replace '[^A-Z0-9]', '');
          if ($suffix.Length -gt 8) { $suffix = $suffix.Substring(0, 8); }
          $fixedHost = if ($suffix) { "ZENOVA-$suffix" } else { 'ZENOVA-VPS' };
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ActiveComputerName' -Name 'ComputerName' -Value "$fixedHost" -Force -ErrorAction SilentlyContinue;

          $dlDir = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'gh-restore');
          if (Test-Path "$dlDir") { Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue; }
          New-Item -ItemType Directory -Force -Path "$dlDir" | Out-Null;

          $isFirstRun = $false;
          $sourceTag = "$env:RELEASE_TAG";

          # Kiểm tra xem Release riêng của máy đã có chưa
          $null = gh release view "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
          if (($LASTEXITCODE) -ne 0) {
              $isFirstRun = $true;
          } else {
              # Kiểm tra file manifest
              gh release download "$env:RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
              $manifestFile = [System.IO.Path]::Combine("$dlDir", 'drive-manifest.json');
              if (-not (Test-Path "$manifestFile")) {
                  # Thử kế thừa từ ROOT_RELEASE_TAG lần đầu nếu có
                  if ("$env:ROOT_RELEASE_TAG" -and ("$env:ROOT_RELEASE_TAG" -ne "$env:RELEASE_TAG")) {
                      $null = gh release view "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" 2>&1;
                      if (($LASTEXITCODE) -eq 0) {
                          gh release download "$env:ROOT_RELEASE_TAG" --repo "$env:STORAGE_REPO" --pattern 'drive-manifest.json' --dir "$dlDir" 2>$null;
                          if (Test-Path "$manifestFile") {
                              $sourceTag = "$env:ROOT_RELEASE_TAG";
                              Write-Host "📦 Kế thừa bản lưu từ máy gốc [$env:ROOT_RELEASE_TAG]..." -ForegroundColor Cyan;
                          } else {
                              $isFirstRun = $true;
                          }
                      } else {
                          $isFirstRun = $true;
                      }
                  } else {
                      $isFirstRun = $true;
                  }
              }
          }

          # Reset LASTEXITCODE về 0 ngay lập tức sau các lệnh gh
          $global:LASTEXITCODE = 0;

          if ($isFirstRun) {
              Write-Host "ℹ️ Máy [$env:MACHINE_ID] là máy mới! Tạo phiên làm việc mới..." -ForegroundColor Cyan;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          # Tiến hành tải các phân mảnh lưu trữ
          $manifest = Get-Content -Raw -Path "$manifestFile" | ConvertFrom-Json;
          Write-Host "⬇️ Tìm thấy bản lưu từ [$sourceTag] ($($manifest.chunkCount) phân mảnh). Đang tải..." -ForegroundColor Cyan;
          gh release download "$sourceTag" --repo "$env:STORAGE_REPO" --pattern 'zenova-drive.7z.*' --dir "$dlDir";
          if (($LASTEXITCODE) -ne 0) {
              Write-Host "⚠️ Không tải được phân mảnh từ [$sourceTag], tiếp tục phiên mới..." -ForegroundColor Yellow;
              'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
              $global:LASTEXITCODE = 0;
              exit 0;
          }

          $firstChunk = [System.IO.Path]::Combine("$dlDir", 'zenova-drive.7z.001');
          if (Test-Path "$firstChunk") {
              $stage = [System.IO.Path]::Combine("$env:VHD_CONTAINER", 'restore-stage');
              if (Test-Path "$stage") { Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue; }
              New-Item -ItemType Directory -Force -Path "$stage" | Out-Null;
              & 7z x "$firstChunk" "-o$stage" -y -mmt=on *> $null;

              robocopy "$stage" "$env:SHARED_ROOT" /E /XJ /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP *> $null;
              $global:LASTEXITCODE = 0;

              $oldProf = [System.IO.Path]::Combine("$env:SHARED_ROOT", 'Users', "$env:RDP_USER");
              if (Test-Path "$oldProf") {
                  robocopy "$oldProf" "$env:PROFILE_PATH" /E /XJ /COPY:DAT /R:1 /W:1 /MT:8 /NFL /NDL /NJH /NJS /NP /XF NTUSER.DAT* ntuser.ini UsrClass.dat* /XD "$oldProf\AppData\Roaming\Microsoft\Protect" *> $null;
                  $global:LASTEXITCODE = 0;
              }
              Remove-Item -Path "$stage" -Recurse -Force -ErrorAction SilentlyContinue;

              # Nạp lại Registry
              $regBk = [System.IO.Path]::Combine("$env:SHARED_OS_DIR", 'Registry');
              if (Test-Path "$regBk") {
                  Get-ChildItem -Path "$regBk" -Filter '*.reg' -Recurse | ForEach-Object { reg import ($_.FullName) *>$null; };
              }

              # Nạp lại DPAPI Keys cho Chromium
              try {
                  Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue;
                  $profPath = "$env:PROFILE_PATH";
                  if (Test-Path "$profPath\AppData") {
                      Get-ChildItem -Path "$profPath\AppData" -Filter 'Local State.zenovakey' -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {
                          try {
                              $keyFile = $_.FullName;
                              $lsFile  = $keyFile -replace '\.zenovakey$', '';
                              if (Test-Path "$lsFile") {
                                  $rawB64  = (Get-Content -Raw -Path "$keyFile" -Encoding ASCII).Trim();
                                  $rawKey  = [Convert]::FromBase64String("$rawB64");
                                  $newEnc  = [System.Security.Cryptography.ProtectedData]::Protect($rawKey, $null, [System.Security.Cryptography.DataProtectionScope]::CurrentUser);
                                  $dpapiPrefix = [System.Text.Encoding]::ASCII.GetBytes('DPAPI');
                                  $finalBytes  = New-Object byte[] ($dpapiPrefix.Length + $newEnc.Length);
                                  [Array]::Copy($dpapiPrefix, 0, $finalBytes, 0, $dpapiPrefix.Length);
                                  [Array]::Copy($newEnc, 0, $finalBytes, $dpapiPrefix.Length, $newEnc.Length);

                                  $lsJson = Get-Content -Raw -Path "$lsFile" -Encoding UTF8 | ConvertFrom-Json;
                                  if ($lsJson.os_crypt) {
                                      $lsJson.os_crypt.encrypted_key = [Convert]::ToBase64String($finalBytes);
                                      if ($lsJson.os_crypt.PSObject.Properties['app_bound_encrypted_key']) {
                                          $lsJson.os_crypt.PSObject.Properties.Remove('app_bound_encrypted_key');
                                      }
                                      $lsJson | ConvertTo-Json -Depth 32 -Compress | Set-Content -Path "$lsFile" -Encoding UTF8 -Force;
                                  }
                              }
                          } catch {}
                      };
                  }
              } catch {}

              Write-Host "✅ Khôi phục thành công toàn bộ dữ liệu từ phiên trước!" -ForegroundColor Green;
          }
          Remove-Item -Path "$dlDir" -Recurse -Force -ErrorAction SilentlyContinue;
          'DATA_RESTORED=1' >> "$env:GITHUB_ENV";
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 5. TẠO USER ZENOVA, AUTO-LOGON & TỐI ƯU TỐI THƯỢNG FIX CPU 100%
      # ─────────────────────────────────────────────────────────────
      - name: ⚙️ Tạo User Zenova & Tối ưu tối thượng (Fix CPU 100% & Fix Lag)
        shell: pwsh
        env:
          FIXED_PASS: ${{ inputs.fixed_password }}
        run: |
          Write-Host "⚙️ ĐANG THIẾT LẬP USER ZENOVA & TỐI ƯU TOÀN DIỆN..." -ForegroundColor Yellow;

          # Tắt chính sách mật khẩu phức tạp
          try {
              $secCfg = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.cfg');
              $secDb  = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'secpol.sdb');
              secedit /export /cfg "$secCfg" *> $null;
              if (Test-Path "$secCfg") {
                  (Get-Content $secCfg) -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' -replace 'MinimumPasswordLength\s*=\s*\d+', 'MinimumPasswordLength = 0' | Set-Content $secCfg;
                  secedit /configure /db "$secDb" /cfg "$secCfg" /areas SECURITYPOLICY *> $null;
                  Remove-Item "$secCfg", "$secDb" -Force -ErrorAction SilentlyContinue;
              }
          } catch {}

          $user = "zenova";
          $pass = "$env:FIXED_PASS";
          "FIXED_PASSWORD=$pass" >> "$env:GITHUB_ENV";

          # Tạo User zenova
          $userExists = net user $user 2>$null;
          if ($LASTEXITCODE -ne 0) {
              net user $user $pass /add /comment:"Zenova Cloud User" /fullname:"Zenova" /expires:never;
              Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue;
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue;
          } else {
              net user $user $pass;
          }
          & wmic useraccount where name='zenova' set PasswordExpires=FALSE *> $null;

          # Cấu hình AutoAdminLogon cho zenova
          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon';
          Set-ItemProperty -Path $winlogon -Name 'AutoAdminLogon' -Value '1' -Force;
          Set-ItemProperty -Path $winlogon -Name 'DefaultUserName' -Value $user -Force;
          Set-ItemProperty -Path $winlogon -Name 'DefaultPassword' -Value $pass -Force;

          # ─────────────────────────────────────────────────────────────
          # 🚀 FIX CPU 100% & TỐI ƯU HIỆU NĂNG TỐI THƯỢNG
          # ─────────────────────────────────────────────────────────────
          Write-Host "🚀 Đang tối ưu CPU, tắt PowerThrottling và các tiến trình ngốn CPU..." -ForegroundColor Cyan;

          # 1. Tắt PowerThrottling
          $ptPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling';
          New-Item -Path $ptPath -Force -ErrorAction SilentlyContinue | Out-Null;
          Set-ItemProperty -Path $ptPath -Name 'PowerThrottlingOff' -Value 1 -Type DWord -Force;

          # 2. Tắt CPU Core Parking & Tối ưu lập lịch CPU
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Power' -Name 'CsEnabled' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue;
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' -Name 'Win32PrioritySeparation' -Value 0x26 -Type DWord -Force;

          # 3. Kích hoạt Power Scheme High Performance / Ultimate
          powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 2>$null | Out-Null;
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null | Out-Null;
          powercfg /change standby-timeout-ac 0;
          powercfg /change monitor-timeout-ac 0;
          powercfg /change disk-timeout-ac 0;
          powercfg /hibernate off;

          # 4. Tắt Windows Defender Realtime (Tiết kiệm 40% CPU)
          try {
              Set-MpPreference -DisableRealtimeMonitoring $true -DisableBehaviorMonitoring $true -DisableIOAVProtection $true -DisableScriptScanning $true -ErrorAction SilentlyContinue;
          } catch {}

          # 5. Tắt toàn bộ dịch vụ ngầm gây lag & CPU 100%
          $servicesToKill = @(
              'WSearch',             # Windows Search Indexer (Thủ phạm chính 100% CPU)
              'SysMain',             # Superfetch
              'wuauserv',            # Windows Update
              'UsoSvc',              # Update Orchestrator
              'DiagTrack',           # Connected User Telemetry
              'dmwappushservice',    # WAP Push Service
              'WerSvc',              # Windows Error Reporting
              'PcaSvc',              # Program Compatibility Assistant
              'DPS'                  # Diagnostic Policy Service
          );
          foreach ($svc in $servicesToKill) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue;
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue;
          }

          # 6. Múi giờ Việt Nam
          tzutil /s 'SE Asia Standard Time';

          # 7. Bật Remote Desktop & Mở Firewall RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force;
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 0 -Force;
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue;
          Start-Service -Name TermService -ErrorAction SilentlyContinue;
          netsh advfirewall firewall add rule name="ZENOVA-ALL-IN" dir=in action=allow protocol=any profile=any | Out-Null;

          # 8. Bật DirectPlay cho Games
          try {
              Enable-WindowsOptionalFeature -Online -FeatureName DirectPlay -All -NoRestart -ErrorAction SilentlyContinue | Out-Null;
          } catch {}

          Write-Host "✅ Đã tối ưu CPU & Windows hoàn tất!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 6. CÀI TAILSCALE MESH NETWORK
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Cài đặt Tailscale Mesh Network
        shell: pwsh
        run: |
          Write-Host "🌐 Đang cài đặt Tailscale..." -ForegroundColor Cyan;
          $msiPath = "$env:TEMP\tailscale.msi";
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msiPath -UseBasicParsing;
          Start-Process msiexec.exe -ArgumentList "/i", "`"$msiPath`"", "/quiet", "/norestart" -Wait;
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe";
          Set-Service -Name "Tailscale" -StartupType Automatic;
          Start-Service -Name "Tailscale";
          Start-Sleep -Seconds 2;

          if ("${{ secrets.TAILSCALE_AUTH_KEY }}") {
              & "$ts" up "--authkey=${{ secrets.TAILSCALE_AUTH_KEY }}" "--hostname=zenova-$env:MACHINE_ID-$env:GITHUB_RUN_ID" --accept-routes --accept-dns --reset;
              $ip = (& "$ts" ip -4 | Out-String).Trim();
              "TAILSCALE_IP=$ip" >> "$env:GITHUB_ENV";
              Write-Host "✅ IP Tailscale: $ip" -ForegroundColor Green;
          } else {
              Write-Host "⚠️ Chưa cấu hình secret TAILSCALE_AUTH_KEY!" -ForegroundColor Yellow;
              "TAILSCALE_IP=127.0.0.1" >> "$env:GITHUB_ENV";
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 7. CÀI DRIVER MÀN HÌNH ẢO (VDD), ÂM THANH ẢO & SUNSHINE
      # ─────────────────────────────────────────────────────────────
      - name: 🖥️🔊☀️ Cài Driver Màn Hình Ảo (VDD), Âm Thanh Ảo & Sunshine
        shell: pwsh
        run: |
          Write-Host "🖥️ Cài đặt Driver Ảo & Sunshine Streaming..." -ForegroundColor Cyan;

          # Job 1: Màn hình ảo USBMMIDD v2
          $jobVdd = Start-Job -ScriptBlock {
              try {
                  $zip = "$env:TEMP\usbmmidd_v2.zip";
                  Invoke-WebRequest -Uri 'https://www.amyuni.com/downloads/usbmmidd_v2.zip' -OutFile $zip -UseBasicParsing -TimeoutSec 45;
                  Expand-Archive -Path $zip -DestinationPath 'C:\' -Force;
                  Push-Location 'C:\usbmmidd_v2';
                  Get-ChildItem -Filter '*.cer' | ForEach-Object {
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\Root' *>$null;
                      Import-Certificate -FilePath ($_.FullName) -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' *>$null;
                  };
                  & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd *> $null;
                  & .\deviceinstaller64.exe enableidd 1 *> $null;
                  Pop-Location;
              } catch {}
          };

          # Job 2: Card âm thanh ảo VB-Audio
          $jobAudio = Start-Job -ScriptBlock {
              try {
                  @('MMCSS', 'AudioEndpointBuilder', 'Audiosrv') | ForEach-Object {
                      Set-Service -Name $_ -StartupType Automatic -ErrorAction SilentlyContinue;
                      Start-Service -Name $_ -ErrorAction SilentlyContinue;
                  };
                  $vbZip = "$env:TEMP\VBCable.zip";
                  try {
                      Invoke-WebRequest -Uri 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack43.zip' -OutFile $vbZip -UseBasicParsing -TimeoutSec 30;
                  } catch {
                      Invoke-WebRequest -Uri 'https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip' -OutFile $vbZip -UseBasicParsing -TimeoutSec 30;
                  }
                  Expand-Archive -Path $vbZip -DestinationPath "C:\VBCable" -Force;
                  $inf = Get-ChildItem -Path "C:\VBCable" -Filter '*.inf' -Recurse | Select-Object -First 1;
                  if ($inf) { pnputil /add-driver ($inf.FullName) /install *> $null; }
              } catch {}
          };

          # Job 3: Sunshine Game Streaming Server
          $jobSunshine = Start-Job -ScriptBlock {
              choco install sunshine -y --no-progress --limit-output;
              Start-Service -Name 'SunshineService' -ErrorAction SilentlyContinue;
          };

          # Đợi các job hoàn tất
          Wait-Job -Job @($jobVdd, $jobAudio, $jobSunshine) -Timeout 180 | Out-Null;
          Get-Job | Remove-Job -Force -ErrorAction SilentlyContinue;
          Write-Host "✅ Cài đặt Driver Màn Hình Ảo, Card Âm Thanh & Sunshine hoàn tất!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 8. CÀI ĐẶT TRỌN BỘ ỨNG DỤNG & STARDESK TRUNG & HÌNH NỀN ZENOVA
      # ─────────────────────────────────────────────────────────────
      - name: 📦 Cài đặt trọn bộ App (Discord, Spotify, Bandicam, EVKey, Roblox, StarDesk Trung) & Hình Nền
        shell: pwsh
        run: |
          Write-Host "📦 Đang cài đặt các ứng dụng và áp dụng hình nền Zenova..." -ForegroundColor Cyan;
          $appsFolder = "$($env:MOUNT_LETTER):\Apps";
          New-Item -ItemType Directory -Force -Path "$appsFolder" | Out-Null;

          # 1. Tải và áp dụng Hình Nền Mặc Định Zenova
          $wpUrl = "https://raw.githubusercontent.com/Dunghoang397/rdp-freeee/2715203b1462985959767187a585efb637441f9f/Zenova%20Cloud%20Aurora%20Lake.png";
          $wpPath = "C:\Windows\Web\Wallpaper\Zenova.png";
          New-Item -ItemType Directory -Force -Path (Split-Path "$wpPath") | Out-Null;
          try {
              Invoke-WebRequest -Uri "$wpUrl" -OutFile "$wpPath" -UseBasicParsing -TimeoutSec 45;
              if (Test-Path "$wpPath") {
                  Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value "$wpPath";
                  Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name WallpaperStyle -Value "10";
                  $setterCode = "using System; using System.Runtime.InteropServices; public class WallSetter { [DllImport(`"user32.dll`", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }";
                  Add-Type -TypeDefinition $setterCode -ErrorAction SilentlyContinue;
                  [WallSetter]::SystemParametersInfo(20, 0, "$wpPath", 3);
                  Write-Host "│ ✅ Đã áp dụng hình nền Zenova Cloud Aurora Lake" -ForegroundColor Green;
              }
          } catch {
              Write-Host "│ ⚠️ Lỗi tải hình nền (bỏ qua): $($_.Exception.Message)" -ForegroundColor Yellow;
          }

          # 2. Cài đặt các ứng dụng qua Chocolatey
          Write-Host "│ 📦 Cài Discord, Spotify, Bandicam, EVKey, Chrome, Roblox & VC Runtimes..." -ForegroundColor Cyan;
          $chocoCore = "discord spotify bandicam evkey googlechrome vcredist-all directx";
          choco install $chocoCore -y --no-progress --limit-output;

          # 3. Cài đặt Roblox & Fix lỗi không vào được Roblox
          Write-Host "│ 🎮 Cài đặt Roblox & Fix tương thích DirectX 11/OpenGL..." -ForegroundColor Cyan;
          choco install roblox -y --no-progress --limit-output;

          # Fix Roblox Registry & Compatibility
          $robReg = "HKCU:\Software\Roblox\RobloxApp";
          New-Item -Path $robReg -Force -ErrorAction SilentlyContinue | Out-Null;
          Set-ItemProperty -Path $robReg -Name 'FFlagDebugGraphicsDisableDirect3D11' -Value 'false' -Force;
          Set-ItemProperty -Path $robReg -Name 'FFlagDebugGraphicsPreferD3D11' -Value 'true' -Force;
          Set-ItemProperty -Path $robReg -Name 'FFlagDebugGraphicsPreferOpenGL' -Value 'false' -Force;

          # Fix Roblox Layer Compatibility
          $appCompat = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers";
          New-Item -Path $appCompat -Force -ErrorAction SilentlyContinue | Out-Null;
          @("C:\Program Files (x86)\Roblox\Versions", "C:\Users\zenova\AppData\Local\Roblox\Versions") | ForEach-Object {
              if (Test-Path "$_") {
                  Get-ChildItem -Path "$_" -Filter 'RobloxPlayerBeta.exe' -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                      Set-ItemProperty -Path $appCompat -Name ($_.FullName) -Value '~ HIGHDPIAWARE RUNASADMIN WIN8RTM' -Force;
                  };
              }
          };
          Write-Host "│ ✅ Đã áp dụng Fix tương thích Roblox hoàn tất!" -ForegroundColor Green;

          # 4. Cài đặt StarDesk Trung (Bản chuẩn 1.5.3 từ abcd release)
          Write-Host "│ 🌟 Cài đặt StarDesk Trung..." -ForegroundColor Cyan;
          $sdUrl = 'https://github.com/ddvdat-glitch/abcd/releases/download/app/StarDesk_1.5.3.exe';
          $sdInstaller = 'C:\StarDesk_1.5.3.exe';
          try {
              & curl.exe -L --retry 3 --connect-timeout 30 -A "Mozilla/5.0" "$sdUrl" -o "$sdInstaller" 2>$null;
              if (Test-Path "$sdInstaller") {
                  Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Stop-Service -Force -ErrorAction SilentlyContinue;
                  Start-Process -FilePath "$sdInstaller" -ArgumentList '/S' -Wait;
                  Start-Sleep -Seconds 3;
                  Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Set-Service -StartupType Automatic;
                  Get-Service -Name '*StarDesk*' -ErrorAction SilentlyContinue | Start-Service;
                  Write-Host "│ ✅ Cài đặt StarDesk Trung thành công!" -ForegroundColor Green;
              }
          } catch {
              Write-Host "│ ⚠️ Lỗi cài StarDesk: $($_.Exception.Message)" -ForegroundColor Yellow;
          }

          # 5. Cài đặt NetEase GameViewer (Hỗ trợ remote tốc độ cao bổ sung)
          $gvUrl = 'https://github.com/ddvdat-glitch/abcd/releases/download/app/uuyc_4.43.1.exe';
          $gvInstaller = 'C:\uuyc_4.43.1.exe';
          try {
              & curl.exe -L --retry 3 --connect-timeout 30 -A "Mozilla/5.0" "$gvUrl" -o "$gvInstaller" 2>$null;
              if (Test-Path "$gvInstaller") {
                  Start-Process -FilePath "$gvInstaller" -ArgumentList '/S' -Wait;
                  Get-Service -Name '*GameViewer*' -ErrorAction SilentlyContinue | Set-Service -StartupType Automatic;
                  Get-Service -Name '*GameViewer*' -ErrorAction SilentlyContinue | Start-Service;
              }
          } catch {}

          # 6. Cài thêm các gói Chocolatey phụ (nếu có yêu cầu)
          if ("${{ inputs.choco_packages }}") {
              $extra = "${{ inputs.choco_packages }}";
              choco install $extra -y --no-progress --limit-output;
          }
          Write-Host "✅ Toàn bộ ứng dụng đã được cài đặt sẵn sàng!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 9. THIẾT LẬP MÃ PIN STARDESK & LẤY ID KẾT NỐI
      # ─────────────────────────────────────────────────────────────
      - name: 🔑 Cấu hình PIN StarDesk Trung & Lấy Device ID
        shell: pwsh
        run: |
          Write-Host "🔍 Đang trích xuất ID StarDesk Trung / GameViewer..." -ForegroundColor Cyan;
          $gvCli = 'C:\Program Files\Netease\GameViewer\bin\uuyc-cli.exe';

          # Khởi động dịch vụ
          $gvServer = 'C:\Program Files\Netease\GameViewer\bin\GameViewerServer.exe';
          if (Test-Path "$gvServer") { Start-Process "$gvServer" -ErrorAction SilentlyContinue; }

          $sdId = "$env:STARDESK_ID_INPUT";
          $sdPin = "$env:INPUT_PIN_CODE";
          if ([string]::IsNullOrWhiteSpace("$sdPin")) { $sdPin = "Zenova2026"; }

          # Cài đặt mã PIN cho CLI GameViewer / StarDesk
          if (Test-Path "$gvCli") {
              for ($i = 0; $i -lt 15; $i++) {
                  $echo = & "$gvCli" echo 2>$null;
                  if ($echo -match 'hello') { break; }
                  Start-Sleep -Seconds 2;
              }
              & "$gvCli" -c "$sdPin" *> $null;

              if ([string]::IsNullOrWhiteSpace("$sdId")) {
                  for ($i = 0; $i -lt 20; $i++) {
                      $cliOut = & "$gvCli" -d 2>$null;
                      if ($cliOut -match '(\d{6,12})') {
                          $sdId = $Matches[1];
                          break;
                      }
                      Start-Sleep -Seconds 2;
                  }
              }
          }

          if ([string]::IsNullOrWhiteSpace("$sdId")) { $sdId = "(Xem trực tiếp trên màn hình)"; }

          "STARDESK_ID=$sdId" >> "$env:GITHUB_ENV";
          "STARDESK_PIN=$sdPin" >> "$env:GITHUB_ENV";
          Write-Host "│ 🌟 StarDesk / GameViewer ID : $sdId" -ForegroundColor Yellow;
          Write-Host "│ 🔑 StarDesk / GameViewer PIN: $sdPin" -ForegroundColor Yellow;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 10. TẠO CÁC PHÍM TẮT TIỆN ÍCH (NGAT-VPS, NGAT-RDP-GIU-MAN-HINH, WEB)
      # ─────────────────────────────────────────────────────────────
      - name: 🖥️ Tạo các phím tắt tiện ích trên Desktop
        shell: pwsh
        run: |
          Write-Host "🖥️ Đang tạo các tiện ích Desktop..." -ForegroundColor Cyan;

          # 1. Script NGAT-RDP-GIU-MAN-HINH-SUNSHINE.bat
          $ngatRdpLines = @(
              "@echo off",
              "echo ============================================================",
              "echo  DANG CHUYEN SESSION VE CONSOLE CHO SUNSHINE & STARDESK...",
              "echo ============================================================",
              "for /f ""skip=1 tokens=3"" %%s in ('query user %USERNAME%') do tscon %%s /dest:console",
              "for /f ""skip=1 tokens=2"" %%s in ('query user %USERNAME%') do tscon %%s /dest:console",
              "echo [OK] Da chuyen man hinh ve Console! Sunshine & StarDesk tiep tuc hoat dong!",
              "pause"
          );
          $ngatRdpPath = "C:\NGAT-RDP-GIU-MAN-HINH-SUNSHINE.bat";
          Set-Content -Path $ngatRdpPath -Value ($ngatRdpLines -join "`r`n") -Encoding ASCII;

          # 2. Script NGAT-VPS.bat
          $ngatVpsLines = @(
              "@echo off",
              "echo ============================================================",
              "echo  DANG GUI LENH LUU DU LIEU VA NGAT VPS AN TOAN...",
              "echo ============================================================",
              "curl.exe -X POST http://127.0.0.1:8080/api/cmd -H ""Content-Type: application/json"" -d ""{\""cmd\"":\""STOP_SESSION\""}""",
              "echo Da gui lenh ngat VPS den he thong!",
              "timeout /t 3",
              "shutdown /s /t 2"
          );
          $ngatVpsPath = "C:\NGAT-VPS.bat";
          Set-Content -Path $ngatVpsPath -Value ($ngatVpsLines -join "`r`n") -Encoding ASCII;

          # 3. Tạo Shortcuts ra Desktop của user zenova và Public
          $desktopDirs = @("C:\Users\zenova\Desktop", "C:\Users\Public\Desktop");
          $ws = New-Object -ComObject WScript.Shell;
          foreach ($d in $desktopDirs) {
              New-Item -ItemType Directory -Force -Path $d | Out-Null;

              # Shortcut Ngắt RDP giữ màn hình
              $lnk1 = $ws.CreateShortcut("$d\NGAT-RDP-GIU-MAN-HINH-SUNSHINE.lnk");
              $lnk1.TargetPath = $ngatRdpPath;
              $lnk1.IconLocation = "shell32.dll,48";
              $lnk1.Save();

              # Shortcut Ngắt VPS
              $lnk2 = $ws.CreateShortcut("$d\NGAT-VPS.lnk");
              $lnk2.TargetPath = $ngatVpsPath;
              $lnk2.IconLocation = "shell32.dll,27";
              $lnk2.Save();

              # Shortcut Web Quản Lý VPS
              $lnk3 = $ws.CreateShortcut("$d\WEB-QUAN-LY-VPS.url");
              $lnk3.TargetPath = "http://127.0.0.1:8080/";
              $lnk3.Save();

              # Shortcut Sunshine Streaming Web UI
              $lnk4 = $ws.CreateShortcut("$d\SUNSHINE-STREAMING.url");
              $lnk4.TargetPath = "https://localhost:47990/";
              $lnk4.Save();

              # Shortcut Ổ Đĩa Riêng X:\
              $lnk5 = $ws.CreateShortcut("$d\O-DIA-RIENG-ZENOVA.lnk");
              $lnk5.TargetPath = "$($env:MOUNT_LETTER):\";
              $lnk5.Save();
          }

          'SESSION_READY=1' >> "$env:GITHUB_ENV";
          Write-Host "✅ Đã tạo đầy đủ các phím tắt tiện ích và ngắt VPS trên Desktop!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 11. KHỞI CHẠY WEB QUẢN LÝ VPS (PORT 8080)
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Khởi chạy Web Quản Lý VPS (Port 8080)
        shell: pwsh
        run: |
          Write-Host "🌐 Đang khởi chạy Web Quản Lý VPS..." -ForegroundColor Cyan;
          $webDir = 'C:\zenova-web';
          New-Item -ItemType Directory -Force -Path $webDir | Out-Null;
          $webScript = [System.IO.Path]::Combine($webDir, 'server.ps1');

          $srvLines = @(
              'param([int]$Port = 8080, [string]$SignalFile = "")',
              '$listener = New-Object System.Net.HttpListener;',
              '$listener.Prefixes.Add("http://*:" + $Port + "/");',
              '$listener.Start();',
              'while ($listener.IsListening) {',
              '    $ctx = $listener.GetContext();',
              '    $req = $ctx.Request;',
              '    $res = $ctx.Response;',
              '    $res.Headers.Add("Access-Control-Allow-Origin", "*");',
              '    $path = $req.Url.AbsolutePath.ToLower();',
              '    if ($req.HttpMethod -eq "POST") {',
              '        $cmd = "";',
              '        if ($path -eq "/stop") { $cmd = "STOP_SESSION"; }',
              '        elseif ($path -eq "/restart") { $cmd = "RESTART_SESSION"; }',
              '        elseif ($path -eq "/save") { $cmd = "SAVE_NOW"; }',
              '        else {',
              '            $sr = New-Object System.IO.StreamReader($req.InputStream);',
              '            $body = $sr.ReadToEnd();',
              '            try { $cmd = ($body | ConvertFrom-Json).cmd; } catch { $cmd = $body; }',
              '        }',
              '        if ($cmd) {',
              '            Set-Content -Path $SignalFile -Value $cmd.Trim() -Encoding UTF8;',
              '            $json = ''{"ok":true,"message":"Da nhan lenh: '' + $cmd.Trim() + ''"}'';',
              '            $b = [System.Text.Encoding]::UTF8.GetBytes($json);',
              '            $res.ContentType = "application/json; charset=utf-8";',
              '            $res.OutputStream.Write($b, 0, $b.Length);',
              '            $res.Close();',
              '            continue;',
              '        }',
              '    }',
              '    $tsIp = if ($env:TAILSCALE_IP) { $env:TAILSCALE_IP } else { "127.0.0.1" };',
              '    $pass = if ($env:FIXED_PASSWORD) { $env:FIXED_PASSWORD } else { "Zenova@2026" };',
              '    $sdId = if ($env:STARDESK_ID) { $env:STARDESK_ID } else { "Chua co ID" };',
              '    $sdPin = if ($env:STARDESK_PIN) { $env:STARDESK_PIN } else { "Zenova2026" };',
              '    $html = @"',
              '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Zenova VPS</title>',
              '<style>body{background:#0b0f19;color:#fff;font-family:sans-serif;padding:24px;text-align:center}',
              '.box{max-width:700px;margin:auto;background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}',
              '.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}',
              '.item{background:#1f2937;padding:12px;border-radius:8px;font-size:13px;line-height:1.6}',
              'button{padding:12px 18px;margin:6px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff}',
              '.s{background:#0284c7}.r{background:#ea580c}.x{background:#dc2626}',
              '</style></head><body><div class="box">',
              '<h1>🚀 ZENOVA ULTIMATE VPS</h1><p style="color:#34d399">● HE THONG DANG HOAT DONG</p>',
              '<div class="grid">',
              '<div class="item"><h3 style="color:#f59e0b">1. Remote Desktop</h3>IP: <b>'' + $tsIp + '':3389</b><br>User: <b>zenova</b><br>Pass: <b>'' + $pass + ''</b></div>',
              '<div class="item"><h3 style="color:#f59e0b">2. Sunshine Stream</h3>URL: <b>https://'' + $tsIp + '':47990</b><br>User: <b>zenova</b><br>Pass: <b>'' + $pass + ''</b></div>',
              '<div class="item"><h3 style="color:#f59e0b">3. StarDesk Trung</h3>ID: <b>'' + $sdId + ''</b><br>PIN: <b>'' + $sdPin + ''</b><br>(Cuc nhanh, 60fps)</div>',
              '</div>',
              '<div>',
              '<button class="s" onclick="c(''SAVE_NOW'')">💾 LUU DU LIEU</button>',
              '<button class="r" onclick="c(''RESTART_SESSION'')">🔁 RESET PHIEN MOI</button>',
              '<button class="x" onclick="c(''STOP_SESSION'')">🛑 NGAT VPS</button>',
              '</div>',
              '</div><script>async function c(cmd){ if(confirm("Xac nhan: "+cmd)){ let r=await fetch("/api/cmd",{method:"POST",body:JSON.stringify({cmd:cmd})}); let d=await r.json(); alert(d.message); } }</script>',
              '</body></html>',
              '"@;',
              '    $b = [System.Text.Encoding]::UTF8.GetBytes($html);',
              '    $res.ContentType = "text/html; charset=utf-8";',
              '    $res.OutputStream.Write($b, 0, $b.Length);',
              '    $res.Close();',
              '}'
          );
          Set-Content -Path $webScript -Value ($srvLines -join "`r`n") -Encoding UTF8;
          Start-Process pwsh.exe -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-File', "`"$webScript`"", '-Port', "$env:WEB_PORT", '-SignalFile', "`"$env:CONTROL_SIGNAL_FILE`"";
          Write-Host "✅ Web Quản Lý VPS đã chạy nền tại cổng $env:WEB_PORT" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 12. IN THÔNG TIN KẾT NỐI TOÀN DIỆN
      # ─────────────────────────────────────────────────────────────
      - name: 🎉 Thông tin kết nối Zenova VPS
        shell: pwsh
        run: |
          $pushScript = "$env:PUSH_STATE_SCRIPT";
          if (Test-Path "$pushScript") {
              & "$pushScript" -Status "Online" -SdId "$env:STARDESK_ID" -SdPin "$env:STARDESK_PIN" -ExtraNote "Máy sẵn sàng";
          }

          $ip = "$env:TAILSCALE_IP";
          $pass = "$env:FIXED_PASSWORD";
          $sdId = "$env:STARDESK_ID";
          $sdPin = "$env:STARDESK_PIN";

          [Console]::WriteLine("::notice title=ZENOVA VPS::IP=$ip | STARDESK_ID=$sdId | PIN=$sdPin | USER=zenova | PASS=$pass");

          Write-Host ""
          Write-Host "┌──────────────────────────────────────────────────────────────┐" -ForegroundColor Cyan
          Write-Host "│          🎉 ZENOVA ULTIMATE VPS ĐÃ SẴN SÀNG KẾT NỐI!         │" -ForegroundColor Cyan
          Write-Host "├──────────────────────────────────────────────────────────────┤" -ForegroundColor Cyan
          Write-Host "│ 🏷️  Tên máy         : $env:DISPLAY_NAME ($env:MACHINE_ID)" -ForegroundColor Yellow
          Write-Host "│ 🌐  IP Tailscale    : $ip" -ForegroundColor White
          Write-Host "│ 👤  User Windows    : zenova" -ForegroundColor White
          Write-Host "│ 🔐  Mật khẩu        : $pass" -ForegroundColor White
          Write-Host "│                                                              │" -ForegroundColor Cyan
          Write-Host "│ ─── 3 LỰA CHỌN KẾT NỐI CỰC NHANH ─────────────────────────── │" -ForegroundColor Yellow
          Write-Host "│ 1️⃣  Remote Desktop  : $ip:3389" -ForegroundColor Green
          Write-Host "│ 2️⃣  Sunshine Stream : https://$ip:47990" -ForegroundColor Green
          Write-Host "│     (Tài khoản: zenova | Mật khẩu: $pass)" -ForegroundColor Green
          Write-Host "│ 3️⃣  StarDesk Trung  : ID: $sdId | PIN: $sdPin" -ForegroundColor Green
          Write-Host "│                                                              │" -ForegroundColor Cyan
          Write-Host "│ 🎛️  Web Quản Lý VPS : http://$ip:8080/ hoặc http://127.0.0.1:8080/" -ForegroundColor Yellow
          Write-Host "│ ⏰  Thời lượng máy  : $env:DISPLAY_TIME" -ForegroundColor Magenta
          Write-Host "│ 📦  Kho lưu trữ     : $env:STORAGE_REPO ($env:RELEASE_TAG)" -ForegroundColor Cyan
          Write-Host "└──────────────────────────────────────────────────────────────┘" -ForegroundColor Cyan
          Write-Host ""
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 13. DUY TRÌ PHIÊN LÀM VIỆC & LẮNG NGHE LỆNH (KEEP-ALIVE)
      # ─────────────────────────────────────────────────────────────
      - name: ⏳ Duy trì phiên làm việc & Lắng nghe lệnh Web Panel
        id: keepalive
        shell: pwsh
        run: |
          $endEpoch = ([long]"$env:JOB_START_EPOCH") + (([long]"$env:TOTAL_MINUTES") * 60);
          $saveScript = "$env:SAVE_SCRIPT_PATH";
          $pushScript = "$env:PUSH_STATE_SCRIPT";
          $sigFile    = "$env:CONTROL_SIGNAL_FILE";

          Write-Host "🔄 Bắt đầu duy trì phiên làm việc cho máy [$env:MACHINE_ID]..." -ForegroundColor Yellow;
          $lastLog = Get-Date;
          $warned  = $false;

          while ($true) {
              if (Test-Path "$sigFile") {
                  $cmd = (Get-Content -Raw -Path "$sigFile" -ErrorAction SilentlyContinue).Trim();
                  Remove-Item -Path "$sigFile" -Force -ErrorAction SilentlyContinue;

                  if ("$cmd" -eq 'SAVE_NOW') {
                      Write-Host "💾 [WEB-PANEL] Nhận lệnh LƯU NGAY từ Web Quản Lý..." -ForegroundColor Cyan;
                      if (Test-Path "$saveScript") { & "$saveScript" -Reason 'manual-web-save'; }
                  } elseif ("$cmd" -eq 'RESTART_SESSION') {
                      Write-Host "🔁 [WEB-PANEL] Nhận lệnh RESET PHIÊN MỚI từ Web Quản Lý!" -ForegroundColor Yellow;
                      'FORCE_NEXT_SESSION=1' >> "$env:GITHUB_ENV";
                      break;
                  } elseif ("$cmd" -eq 'STOP_SESSION') {
                      Write-Host "🛑 [WEB-PANEL] Nhận lệnh NGẮT VPS từ Web Quản Lý!" -ForegroundColor Red;
                      'FORCE_STOP_ONLY=1' >> "$env:GITHUB_ENV";
                      break;
                  }
              }

              $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds();
              $remain = ($endEpoch) - ($now);
              if (($remain) -le 0) {
                  Write-Host "⏰ Hết thời gian phiên làm việc!" -ForegroundColor Yellow;
                  break;
              }

              if ((((Get-Date) - ($lastLog)).TotalMinutes) -ge 5) {
                  $h = [math]::Floor(($remain) / 3600);
                  $m = [math]::Floor((($remain) % 3600) / 60);
                  Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 📊 [$env:MACHINE_ID] IP: $env:TAILSCALE_IP | Còn lại: ${h}h${m}m" -ForegroundColor Blue;
                  $lastLog = Get-Date;

                  # Giữ Sunshine & StarDesk luôn chạy
                  Get-Service -Name '*StarDesk*', 'SunshineService' -ErrorAction SilentlyContinue | Where-Object { $_.Status -ne 'Running' } | ForEach-Object {
                      Start-Service -Name ($_.Name) -ErrorAction SilentlyContinue;
                  };
              }

              if ((-not ($warned)) -and (($remain) -le 300)) {
                  try { msg * /TIME:290 "Phien Zenova VPS sap het gio (5 phut). He thong se tu dong luu du lieu!"; } catch {}
                  $warned = $true;
              }

              Start-Sleep -Seconds 2;
          }
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 14. LƯU DỮ LIỆU CUỐI PHIÊN LÊN GITHUB RELEASE
      # ─────────────────────────────────────────────────────────────
      - name: 💾 Lưu toàn bộ dữ liệu cuối phiên lên GitHub
        if: always()
        shell: pwsh
        run: |
          Write-Host "💾 Đang đóng gói và lưu toàn bộ dữ liệu cuối phiên..." -ForegroundColor Yellow;
          $pushScript = "$env:PUSH_STATE_SCRIPT";
          if (Test-Path "$pushScript") {
              & "$pushScript" -Status "Stopped" -SdId "$env:STARDESK_ID" -SdPin "$env:STARDESK_PIN" -ExtraNote "Máy đã tắt phiên";
          }

          $saveScript = "$env:SAVE_SCRIPT_PATH";
          if (Test-Path "$saveScript") {
              & "$saveScript" -Reason 'session-end';
          }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 15. DỌN DẸP HỆ THỐNG
      # ─────────────────────────────────────────────────────────────
      - name: 🧹 Dọn dẹp hệ thống
        if: always()
        shell: pwsh
        run: |
          Write-Host "🧹 Đang dọn dẹp hệ thống..." -ForegroundColor Yellow;
          Remove-Item -Path "$env:RUNNER_TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue;
          Write-Host "✅ Dọn dẹp hoàn tất!" -ForegroundColor Green;
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 16. KÍCH HOẠT PHIÊN TIẾP THEO (AUTO RESTART)
      # ─────────────────────────────────────────────────────────────
      - name: 🔁 Kích hoạt phiên tiếp theo & Mở lại ổ đĩa
        if: ${{ always() && steps.keepalive.outcome == 'success' && env.FORCE_STOP_ONLY != '1' && (inputs.auto_restart || env.FORCE_NEXT_SESSION == '1') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          DURATION: ${{ inputs.duration }}
          WIN_IMAGE: ${{ inputs.windows_image }}
          FIXED_PASS: ${{ inputs.fixed_password }}
          PKGS: ${{ inputs.choco_packages }}
          OPT: ${{ inputs.optimize_windows }}
          SD_ID: ${{ env.STARDESK_ID }}
        run: |
          $wf = [System.IO.Path]::GetFileName(("$env:GITHUB_WORKFLOW_REF" -split '@')[0]);
          Write-Host "🔁 Đang kích hoạt phiên làm việc mới: $wf..." -ForegroundColor Cyan;
          gh workflow run "$wf" --repo "$env:RUNNER_REPO" --ref "$env:GITHUB_REF_NAME" `
            -f "os_type=windows" `
            -f "machine_id=$env:MACHINE_ID" `
            -f "display_name=$env:DISPLAY_NAME" `
            -f "duration=$env:DURATION" `
            -f "auto_restart=true" `
            -f "drive_letter=$env:MOUNT_LETTER" `
            -f "vhd_size_gb=$env:VHD_SIZE_GB" `
            -f "windows_image=$env:WIN_IMAGE" `
            -f "fixed_password=$env:FIXED_PASS" `
            -f "pin_code=$env:STARDESK_PIN" `
            -f "stardesk_id_trung=$env:SD_ID" `
            -f "storage_repo=$env:STORAGE_REPO" `
            -f "choco_packages=$env:PKGS" `
            -f "optimize_windows=$env:OPT";
          Write-Host "✅ Đã kích hoạt phiên mới thành công!" -ForegroundColor Green;

  # =========================================================================
  # JOB 2: ZENOVA LINUX RUNNER (UBUNTU + XFCE4 + XRDP + TAILSCALE)
  # =========================================================================
  Zenova-Linux:
    name: 🐧 Linux VPS (Ubuntu + XFCE4 + XRDP)
    runs-on: ubuntu-latest
    if: ${{ inputs.os_type == 'linux' || inputs.os_type == 'both' }}
    timeout-minutes: 1440

    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      STORAGE_GH_TOKEN: ${{ secrets.STORAGE_GH_TOKEN || secrets.PAT_TOKEN || github.token }}
      STORAGE_REPO: ${{ inputs.storage_repo || github.repository }}
      RUNNER_REPO: ${{ github.repository }}
      MACHINE_ID: ${{ inputs.machine_id || 'zenova-1' }}
      WEB_PORT: '8080'
      ENABLE_DUCKDNS: ${{ inputs.enable_duckdns }}
      FIXED_PASSWORD: ${{ inputs.fixed_password || 'Zenova@2026' }}
      INPUT_DURATION: ${{ inputs.duration }}
      AUTO_RESTART: ${{ inputs.auto_restart }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
      DUCKDNS_DOMAIN: ${{ secrets.DUCKDNS_DOMAIN }}

    steps:
      - name: 🐧 Khởi tạo môi trường Linux & Chuẩn bị thông số
        shell: bash
        run: |
          set -e
          NOW_EPOCH=$(date +%s)
          echo "JOB_START_EPOCH=$NOW_EPOCH" >> "$GITHUB_ENV"

          RAW_ID="${MACHINE_ID:-zenova-1}"
          CLEAN_ID=$(echo "$RAW_ID" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g' | sed -E 's/-+/-/g' | sed -E 's/^-|-$//g')
          if [ -z "$CLEAN_ID" ]; then CLEAN_ID="linux-1"; fi

          RELEASE_TAG="zenova-linux-$CLEAN_ID"
          STATE_BRANCH="zenova-linux-state-$CLEAN_ID"
          echo "MACHINE_ID=$CLEAN_ID" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "STATE_BRANCH=$STATE_BRANCH" >> "$GITHUB_ENV"

          TOTAL=1440
          case "$INPUT_DURATION" in
            "1h") TOTAL=60 ;;
            "3h") TOTAL=180 ;;
            "5h") TOTAL=300 ;;
            "6h") TOTAL=360 ;;
            "12h") TOTAL=720 ;;
            "24h") TOTAL=1440 ;;
            *) TOTAL=1440 ;;
          esac
          echo "TOTAL_MINUTES=$TOTAL" >> "$GITHUB_ENV"

          STORAGE_ROOT="/home/runner/persistent_storage"
          mkdir -p "$STORAGE_ROOT" "$STORAGE_ROOT/config" "$STORAGE_ROOT/data" "$STORAGE_ROOT/apps"
          echo "STORAGE_ROOT=$STORAGE_ROOT" >> "$GITHUB_ENV"

          CONTROL_SIGNAL_FILE="/tmp/linux_control_signal.txt"
          rm -f "$CONTROL_SIGNAL_FILE"
          echo "CONTROL_SIGNAL_FILE=$CONTROL_SIGNAL_FILE" >> "$GITHUB_ENV"

          if ! gh release view "$RELEASE_TAG" --repo "$STORAGE_REPO" >/dev/null 2>&1; then
            INIT_FILE="/tmp/linux_init.txt"
            echo "Zenova Linux Storage initialized at $(date -u)" > "$INIT_FILE"
            gh release create "$RELEASE_TAG" "$INIT_FILE" --repo "$STORAGE_REPO" --title "Linux Storage ($CLEAN_ID)" --notes "Bản lưu trữ dữ liệu tự động"
          fi

      - name: 🧰 Tạo script lưu trữ dữ liệu Linux
        shell: bash
        run: |
          cat << 'EOF' > /tmp/save-linux.sh
          #!/usr/bin/env bash
          REASON="${1:-session-end}"
          echo "💾 [$REASON] Bắt đầu lưu trữ dữ liệu Linux..."

          if [ ! -f /tmp/session_ready.flag ] || [ ! -f /tmp/data_restored.flag ]; then
            echo "⚠️ Phiên Linux chưa sẵn sàng, bỏ qua lưu dữ liệu!"
            exit 0
          fi

          pkill -f "chrome" || true
          pkill -f "chromium" || true
          pkill -f "discord" || true
          pkill -f "spotify" || true
          pkill -f "vlc" || true
          sleep 2

          PACK_DIR="/tmp/linux-pack-$REASON"
          rm -rf "$PACK_DIR"
          mkdir -p "$PACK_DIR/stage"

          cp -r /home/runner/persistent_storage "$PACK_DIR/stage/" 2>/dev/null || true
          cp -r /home/runner/Desktop "$PACK_DIR/stage/" 2>/dev/null || true
          cp -r /home/runner/Documents "$PACK_DIR/stage/" 2>/dev/null || true
          cp -r /home/runner/Downloads "$PACK_DIR/stage/" 2>/dev/null || true
          mkdir -p "$PACK_DIR/stage/user_config"
          cp -r /home/runner/.config "$PACK_DIR/stage/user_config/" 2>/dev/null || true

          ARCHIVE_BASE="$PACK_DIR/linux-data.7z"
          cd "$PACK_DIR/stage"
          7z a -t7z -mx=1 -mmt=on -v1900m "$ARCHIVE_BASE" * >/dev/null 2>&1
          cd - >/dev/null

          CHUNKS=($(ls "$PACK_DIR"/linux-data.7z.* 2>/dev/null | sort))
          if [ ${#CHUNKS[@]} -eq 0 ]; then exit 1; fi

          MANIFEST="$PACK_DIR/drive-manifest.json"
          cat << JSON_EOF > "$MANIFEST"
          {
            "machineId": "$MACHINE_ID",
            "updatedUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "reason": "$REASON",
            "chunkCount": ${#CHUNKS[@]}
          }
          JSON_EOF

          UPLOAD_FILES=("${CHUNKS[@]}" "$MANIFEST")
          gh release upload "$RELEASE_TAG" "${UPLOAD_FILES[@]}" --repo "$STORAGE_REPO" --clobber
          rm -rf "$PACK_DIR"
          echo "✅ Đã lưu trữ dữ liệu Linux thành công!"
          exit 0
          EOF
          chmod +x /tmp/save-linux.sh

      - name: ♻️ Khôi phục dữ liệu Linux từ GitHub Release
        shell: bash
        run: |
          RESTORE_DIR="/tmp/linux-restore"
          rm -rf "$RESTORE_DIR"
          mkdir -p "$RESTORE_DIR"

          if gh release download "$RELEASE_TAG" --repo "$STORAGE_REPO" --pattern "drive-manifest.json" --dir "$RESTORE_DIR" 2>/dev/null; then
            if [ -f "$RESTORE_DIR/drive-manifest.json" ]; then
              gh release download "$RELEASE_TAG" --repo "$STORAGE_REPO" --pattern "linux-data.7z.*" --dir "$RESTORE_DIR"
              FIRST_CHUNK="$RESTORE_DIR/linux-data.7z.001"
              if [ -f "$FIRST_CHUNK" ]; then
                STAGE_EXTRACT="/tmp/linux-stage-extract"
                mkdir -p "$STAGE_EXTRACT"
                7z x "$FIRST_CHUNK" -o"$STAGE_EXTRACT" -y >/dev/null 2>&1

                if [ -d "$STAGE_EXTRACT/persistent_storage" ]; then
                  cp -rf "$STAGE_EXTRACT/persistent_storage"/* /home/runner/persistent_storage/ 2>/dev/null || true
                fi
                if [ -d "$STAGE_EXTRACT/Desktop" ]; then
                  mkdir -p /home/runner/Desktop
                  cp -rf "$STAGE_EXTRACT/Desktop"/* /home/runner/Desktop/ 2>/dev/null || true
                fi
                if [ -d "$STAGE_EXTRACT/user_config/.config" ]; then
                  mkdir -p /home/runner/.config
                  cp -rf "$STAGE_EXTRACT/user_config/.config"/* /home/runner/.config/ 2>/dev/null || true
                fi
                rm -rf "$STAGE_EXTRACT"
                echo "✅ Đã khôi phục dữ liệu Linux thành công!"
              fi
            fi
          fi
          rm -rf "$RESTORE_DIR"
          touch /tmp/data_restored.flag
          echo "DATA_RESTORED=1" >> "$GITHUB_ENV"

      - name: ⚙️ Tối ưu tối thượng Linux Kernel & Fix Lag
        shell: bash
        run: |
          echo "⚙️ Đang tối ưu Linux Kernel & CPU..."
          sudo tee /etc/sysctl.d/99-performance.conf > /dev/null << 'SYSCTL_EOF'
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
          fs.file-max = 2097152
          net.core.somaxconn = 4096
          net.core.netdev_max_backlog = 5000
          net.ipv4.tcp_fastopen = 3
          net.ipv4.tcp_slow_start_after_idle = 0
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.tcp_fin_timeout = 15
          SYSCTL_EOF
          sudo sysctl --system >/dev/null 2>&1 || true

          # CPU Governor Performance
          echo performance | sudo tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor 2>/dev/null || true
          echo mq-deadline | sudo tee /sys/block/*/queue/scheduler 2>/dev/null || true
          echo madvise | sudo tee /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || true

          SERVICES_TO_STOP=(
            "unattended-upgrades.service"
            "motd-news.timer"
            "apport.service"
            "whoopsie.service"
            "snapd.seeded.service"
          )
          for svc in "${SERVICES_TO_STOP[@]}"; do
            sudo systemctl stop "$svc" 2>/dev/null || true
            sudo systemctl disable "$svc" 2>/dev/null || true
          done

          sudo timedatectl set-timezone Asia/Ho_Chi_Minh || true
          echo "✅ Tối ưu Linux Kernel hoàn tất!"

      - name: 🖥️ Cài đặt Desktop XFCE4 & XRDP Server
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xfce4 xfce4-goodies \
            xrdp xorgxrdp \
            dbus-x11 x11-xserver-utils \
            p7zip-full curl wget git htop jq net-tools >/dev/null 2>&1

          echo "xfce4-session" > /home/runner/.xsession
          chmod +x /home/runner/.xsession
          sudo chown runner:runner /home/runner/.xsession
          sudo adduser xrdp ssl-cert || true

          sudo sed -i 's/max_bpp=32/max_bpp=16/g' /etc/xrdp/xrdp.ini || true
          sudo sed -i 's/xserverbpp=24/xserverbpp=16/g' /etc/xrdp/xrdp.ini || true
          sudo sed -i 's/crypt_level=high/crypt_level=low/g' /etc/xrdp/xrdp.ini || true

          mkdir -p /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml
          cat << 'XFCONF_EOF' > /home/runner/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="use_compositing" type="bool" value="false"/>
            </property>
          </channel>
          XFCONF_EOF
          sudo chown -R runner:runner /home/runner/.config
          sudo systemctl restart xrdp

      - name: 👤 Thiết lập tài khoản runner
        shell: bash
        run: |
          PASS="${FIXED_PASSWORD:-Zenova@2026}"
          echo "runner:$PASS" | sudo chpasswd
          echo "root:$PASS" | sudo chpasswd
          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner >/dev/null
          sudo chmod 0440 /etc/sudoers.d/runner

      - name: 📦 Cài đặt ứng dụng Linux (Chrome, VLC, Discord, Spotify)
        shell: bash
        run: |
          wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb || true
          if [ -f /tmp/google-chrome.deb ]; then
            sudo apt-get install -y -qq /tmp/google-chrome.deb >/dev/null 2>&1 || sudo apt-get -f install -y -qq >/dev/null 2>&1
            rm -f /tmp/google-chrome.deb
          fi
          sudo apt-get install -y -qq vlc >/dev/null 2>&1 || true

          if command -v snap >/dev/null 2>&1; then
            sudo snap install discord --classic 2>/dev/null || true
            sudo snap install spotify 2>/dev/null || true
          fi

          mkdir -p /home/runner/Desktop
          if [ -f /usr/share/applications/google-chrome.desktop ]; then
            cp /usr/share/applications/google-chrome.desktop /home/runner/Desktop/
            chmod +x /home/runner/Desktop/google-chrome.desktop
          fi
          sudo chown -R runner:runner /home/runner/Desktop

      - name: 🌐 Kết nối Tailscale Linux
        shell: bash
        run: |
          if [ -n "$TAILSCALE_AUTH_KEY" ]; then
            if ! command -v tailscale >/dev/null 2>&1; then
              curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
            fi
            sudo systemctl enable --now tailscaled >/dev/null 2>&1
            sleep 2
            TS_HOSTNAME="zenova-linux-$MACHINE_ID-$GITHUB_RUN_ID"
            sudo tailscale up --authkey="$TAILSCALE_AUTH_KEY" --hostname="$TS_HOSTNAME" --accept-routes --accept-dns --reset
            IP=$(tailscale ip -4 2>/dev/null | tr -d '[:space:]')
            echo "TAILSCALE_IP=$IP" >> "$GITHUB_ENV"
            echo "✅ IP Tailscale: $IP"
          else
            echo "TAILSCALE_IP=127.0.0.1" >> "$GITHUB_ENV"
          fi

      - name: 🌐 Khởi chạy Web Quản Lý Linux (Port 8080)
        shell: bash
        run: |
          cat << 'PY_EOF' > /tmp/web_server.py
          import http.server, socketserver, os
          PORT = int(os.environ.get("WEB_PORT", 8080))
          SIG_FILE = os.environ.get("CONTROL_SIGNAL_FILE", "/tmp/linux_control_signal.txt")
          IP = os.environ.get("TAILSCALE_IP", "127.0.0.1")
          PASS = os.environ.get("FIXED_PASSWORD", "Zenova@2026")
          MID = os.environ.get("MACHINE_ID", "zenova-1")

          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-type", "text/html; charset=utf-8")
                  self.end_headers()
                  html = f"""<!DOCTYPE html><html><head><meta charset='utf-8'><title>Zenova Linux VPS</title>
                  <style>body{{font-family:sans-serif;background:#0f172a;color:#f8fafc;padding:30px;text-align:center}}
                  .card{{max-width:500px;margin:auto;background:#1e293b;padding:24px;border-radius:12px;border:1px solid #334155}}
                  button{{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;font-weight:bold;cursor:pointer;color:#fff}}
                  .s{{background:#0284c7}} .r{{background:#ea580c}} .x{{background:#dc2626}}
                  </style></head><body><div class='card'>
                  <h2>🐧 ZENOVA LINUX VPS</h2>
                  <p>Machine ID: <b>{MID}</b> | IP: <b>{IP}</b></p>
                  <p>User: <b>runner</b> | Pass: <b>{PASS}</b></p>
                  <form method='POST' action='/save'><button class='s'>💾 LƯU DỮ LIỆU</button></form>
                  <form method='POST' action='/restart'><button class='r'>🔁 RESET PHIÊN MỚI</button></form>
                  <form method='POST' action='/stop'><button class='x'>🛑 NGẮT VPS</button></form>
                  </div></body></html>"""
                  self.wfile.write(html.encode('utf-8'))

              def do_POST(self):
                  act = self.path.strip("/")
                  cmd = {"save":"SAVE_NOW", "restart":"RESTART_SESSION", "stop":"STOP_SESSION"}.get(act, "SAVE_NOW")
                  with open(SIG_FILE, "w", encoding="utf-8") as f: f.write(cmd)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"OK")

          server = socketserver.TCPServer(("", PORT), H)
          server.serve_forever()
          PY_EOF
          nohup python3 /tmp/web_server.py >/dev/null 2>&1 &
          sleep 1

      - name: 🩺 Health Check & SESSION_READY
        shell: bash
        run: |
          touch /tmp/session_ready.flag
          echo "SESSION_READY=1" >> "$GITHUB_ENV"

      - name: 🎉 Thông tin kết nối Linux VPS
        shell: bash
        run: |
          echo ""
          echo "┌──────────────────────────────────────────────────────────────┐"
          echo "│ 🚀 LINUX UBUNTU VPS (XFCE4 DESKTOP) ĐÃ SẴN SÀNG!             │"
          echo "├──────────────────────────────────────────────────────────────┤"
          echo "│ 🌐 IP Tailscale : $TAILSCALE_IP"
          echo "│ 👤 RDP User     : runner"
          echo "│ 🔑 Password     : $FIXED_PASSWORD"
          echo "│ 🖥️ RDP Client   : Kết nối Remote Desktop tới $TAILSCALE_IP:3389"
          echo "│ 🎛️ Web Quản Lý : http://$TAILSCALE_IP:$WEB_PORT/"
          echo "└──────────────────────────────────────────────────────────────┘"
          echo ""

      - name: ⏳ Duy trì phiên làm việc Linux (Keep-Alive)
        id: keepalive_linux
        shell: bash
        run: |
          END_EPOCH=$(( JOB_START_EPOCH + (TOTAL_MINUTES * 60) ))
          SIG_FILE="/tmp/linux_control_signal.txt"

          while true; do
            if [ -f "$SIG_FILE" ]; then
              CMD=$(cat "$SIG_FILE" | tr -d '[:space:]')
              rm -f "$SIG_FILE"
              if [ "$CMD" = "SAVE_NOW" ]; then
                /tmp/save-linux.sh "manual-web-save" || true
              elif [ "$CMD" = "RESTART_SESSION" ]; then
                echo "FORCE_NEXT_SESSION=1" >> "$GITHUB_ENV"
                break
              elif [ "$CMD" = "STOP_SESSION" ]; then
                echo "FORCE_STOP_ONLY=1" >> "$GITHUB_ENV"
                break
              fi
            fi

            NOW=$(date +%s)
            REMAIN=$(( END_EPOCH - NOW ))
            if [ "$REMAIN" -le 0 ]; then break; fi
            sleep 3
          done

      - name: 💾 Lưu dữ liệu Linux cuối phiên
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/save-linux.sh ]; then /tmp/save-linux.sh "session-end" || true; fi

      - name: 🔁 Kích hoạt phiên tiếp theo Linux
        if: ${{ always() && (inputs.auto_restart || env.FORCE_NEXT_SESSION == '1') && env.FORCE_STOP_ONLY != '1' }}
        shell: bash
        run: |
          WF=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          gh workflow run "$WF" --ref "$GITHUB_REF_NAME" \
            -f "os_type=linux" \
            -f "machine_id=$MACHINE_ID" \
            -f "duration=$INPUT_DURATION" \
            -f "auto_restart=true" \
            -f "fixed_password=${{ inputs.fixed_password }}"
