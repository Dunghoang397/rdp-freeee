          # 2. Tá»‘i Æ°u CPU Scheduling & PhÃ¢n phá»‘i tÃ i nguyÃªn RAM (Win32PrioritySeparation = 38 - 0x26)
          Write-Host "âš¡ Tá»‘i Æ°u CPU Scheduling & PhÃ¢n phá»‘i bá»™ nhá»›..." -ForegroundColor Cyan;
          try {
              $priorityPath = 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl';
