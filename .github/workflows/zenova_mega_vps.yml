          $saveScript = [System.IO.Path]::Combine("$env:RUNNER_TEMP", 'save-data.ps1');
          $sigFile    = "$env:CONTROL_SIGNAL_FILE";
          $u          = "$env:RDP_USER";
          $sdExe      = 'C:\Program Files\StarDesk\StarDesk.exe';

          Write-Host "";
          Write-Host "ðŸ”„ Báº®T Äáº¦U DUY TRÃŒ PHIÃŠN LÃ€M VIá»†C CHO MÃY [$env:MACHINE_ID]..." -ForegroundColor Yellow;
          Write-Host "ðŸ”— Káº¿t ná»‘i RDP     : $env:TAILSCALE_IP:3389 (User:$u)" -ForegroundColor Cyan;
