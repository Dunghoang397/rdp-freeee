      # ─────────────────────────────────────────────────────────────
      # 13. WEB QUẢN LÝ VPS CÓ MẬT KHẨU & CHỈ TRUY CẬP QUA TAILSCALE
      # ─────────────────────────────────────────────────────────────
      - name: 🌐 Khởi chạy Web Quản Lý VPS bảo mật
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop';
          $tsIp = if (Test-Path 'C:\tailscale-ip.txt') { (Get-Content 'C:\tailscale-ip.txt' -Raw).Trim() } else { '' };
          if ($tsIp -notmatch '^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.') { $tsIp = '127.0.0.1'; }
          $bindIp = $tsIp;

          $pyExe = (Get-Command python -ErrorAction SilentlyContinue).Source;
          if (-not $pyExe) {
              $pythonDir = 'C:\ProgramData\Zenova\Python311';
              $pythonZip = 'C:\ProgramData\Zenova\python-embed.zip';
              New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null;
              if (-not (Test-Path (Join-Path $pythonDir 'python.exe'))) {
                  & curl.exe -fL --retry 3 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -o $pythonZip;
                  if ($LASTEXITCODE -ne 0) { throw 'Không tải được Python portable.'; }
                  Expand-Archive -Path $pythonZip -DestinationPath $pythonDir -Force;
              }
              $pyExe = Join-Path $pythonDir 'python.exe';
          }
          if (-not (Test-Path $pyExe)) { throw 'Không tìm thấy python.exe để chạy web panel.'; }

          $webDir = 'C:\ProgramData\Zenova\web';
          New-Item -ItemType Directory -Force -Path $webDir | Out-Null;
          $pyServerPath = Join-Path $webDir 'server.py';
          $panelTokenPath = 'C:\ProgramData\Zenova\panel-token.txt';
          if (Test-Path $panelTokenPath) {
              $panelToken = (Get-Content $panelTokenPath -Raw).Trim();
          } else {
              $random = New-Object byte[] 36;
              $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create();
              $rng.GetBytes($random); $rng.Dispose();
              $panelToken = [Convert]::ToBase64String($random).TrimEnd('=').Replace('+','-').Replace('/','_');
              Set-Content -Path $panelTokenPath -Value $panelToken -Encoding ASCII -Force;
              icacls $panelTokenPath /inheritance:r /grant:r 'SYSTEM:(R)' 'Administrators:(R)' | Out-Null;
          }
          "::add-mask::$panelToken";
          "ZENOVA_PANEL_TOKEN=$panelToken" >> "$env:GITHUB_ENV";

          $server = @'
          import base64, hashlib, hmac, html, http.server, json, os, socketserver
          from pathlib import Path

          PORT = int(os.environ.get("ZENOVA_WEB_PORT", "8080"))
          BIND = os.environ.get("ZENOVA_WEB_BIND", "127.0.0.1")
          SIG_FILE = Path(os.environ.get("ZENOVA_SIGNAL_FILE", r"C:\ZENOVA-VHD-HOST\control-signal.txt"))
          USER = os.environ.get("ZENOVA_PANEL_USER", "zenova")
          TOKEN = os.environ.get("ZENOVA_PANEL_TOKEN", "")

          PAGE = """<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta http-equiv='Cache-Control' content='no-store'><title>Zenova VPS Manager</title><style>
          *{box-sizing:border-box}body{margin:0;padding:24px;background:#090d16;color:#eef2ff;font:15px system-ui,sans-serif}.wrap{max-width:900px;margin:auto}.card{background:#111827;border:1px solid #293449;border-radius:16px;padding:22px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.value{overflow-wrap:anywhere;background:#0b1220;border-radius:8px;padding:10px;color:#fde68a;font-family:ui-monospace,monospace}.muted{color:#94a3b8}a{color:#7dd3fc}button{border:0;border-radius:9px;padding:12px 16px;margin:4px;color:white;background:#0369a1;font-weight:700;cursor:pointer}button.warn{background:#b45309}button.stop{background:#b91c1c}@media(max-width:600px){body{padding:12px}.card{padding:16px}}
          </style></head><body><main class='wrap'><section class='card'><h1>☁️ ZENOVA VPS MANAGER</h1><p>Máy: <b>__NAME__</b> <span class='muted'>(__MACHINE__)</span></p><p class='muted'>Kết nối quản trị riêng qua Tailscale • Không công khai Internet</p></section>
          <section class='grid'><div class='card'><h3>🌟 StarDesk 中文版</h3><p>Device ID</p><div class='value'>__SD_ID__</div><p>PIN</p><div class='value'>__SD_PIN__</div></div>
          <div class='card'><h3>🎮 Apollo / Moonlight</h3><p><a href='__APOLLO__' target='_blank' rel='noopener'>Mở Apollo Web UI (HTTPS)</a></p><div class='value'>__HOST__</div><p class='muted'>Lần đầu: tạo tài khoản quản trị Apollo, sau đó mở Moonlight và ghép đôi bằng PIN hiển thị trong Apollo.</p></div>
          <div class='card'><h3>🖥️ Kết nối Windows</h3><p>RDP host</p><div class='value'>__RDP__</div><p>User</p><div class='value'>zenova</div></div></section>
          <section class='card'><h3>Điều khiển phiên</h3><p><button onclick="sendCmd('SAVE_NOW')">💾 Lưu dữ liệu</button><button class='warn' onclick="sendCmd('RESTART_SESSION')">🔁 Khởi động phiên mới</button><button class='stop' onclick="sendCmd('STOP_SESSION')">⏹ Dừng phiên</button></p><p id='status' class='muted'>Panel tự làm mới mỗi 15 giây.</p></section></main>
          <script>async function sendCmd(cmd){if(!confirm('Xác nhận '+cmd+'?'))return;try{const r=await fetch('/api/cmd',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd})});const d=await r.json();document.getElementById('status').textContent=d.message||'Đã gửi';}catch(e){document.getElementById('status').textContent='Lỗi kết nối: '+e;}}setTimeout(()=>location.reload(),15000);</script></body></html>"""

          def read_text(path, fallback=""):
              try: return Path(path).read_text(encoding="utf-8", errors="replace").strip()
              except Exception: return fallback

          def esc(value): return html.escape(str(value or ""), quote=True)

          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args): pass
              def authorized(self):
                  supplied = self.headers.get("Authorization", "")
                  expected = "Basic " + base64.b64encode((USER + ":" + TOKEN).encode()).decode()
                  return bool(TOKEN) and hmac.compare_digest(supplied, expected)
              def deny(self):
                  self.send_response(401); self.send_header("WWW-Authenticate", 'Basic realm="Zenova VPS Manager"')
                  self.send_header("Cache-Control", "no-store"); self.end_headers()
              def reply(self, code, payload, content_type):
                  body = payload.encode("utf-8")
                  self.send_response(code); self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body))); self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff"); self.send_header("X-Frame-Options", "DENY")
                  self.end_headers(); self.wfile.write(body)
              def do_GET(self):
                  if not self.authorized(): return self.deny()
                  if self.path not in ("/", "/index.html"): return self.reply(404, "Not found", "text/plain; charset=utf-8")
                  ts = read_text(r"C:\tailscale-ip.txt", "Chưa kết nối")
                  values = {
                      "__NAME__": esc(os.environ.get("DISPLAY_NAME", "Zenova")),
                      "__MACHINE__": esc(os.environ.get("MACHINE_ID", "zenova-1")),
                      "__SD_ID__": esc(read_text(r"C:\stardesk-id.txt", "Đang chờ StarDesk")),
                      "__SD_PIN__": esc(read_text(r"C:\stardesk-pin.txt", "Chưa có PIN")),
                      "__APOLLO__": esc("https://" + ts + ":47990" if ts.startswith("100.") else "https://127.0.0.1:47990"),
                      "__HOST__": esc(ts),
                      "__RDP__": esc(ts + ":3389" if ts.startswith("100.") else "Chỉ khả dụng qua Tailscale"),
                  }
                  page = PAGE
                  for key, value in values.items(): page = page.replace(key, value)
                  self.reply(200, page, "text/html; charset=utf-8")
              def do_POST(self):
                  if not self.authorized(): return self.deny()
                  if self.path != "/api/cmd": return self.reply(404, '{"ok":false}', "application/json")
                  try:
                      size = int(self.headers.get("Content-Length", "0"))
                      if size <= 0 or size > 2048: raise ValueError("invalid body size")
                      data = json.loads(self.rfile.read(size).decode("utf-8"))
                      cmd = data.get("cmd", "")
                      if cmd not in {"SAVE_NOW", "RESTART_SESSION", "STOP_SESSION"}: raise ValueError("command not allowed")
                      SIG_FILE.parent.mkdir(parents=True, exist_ok=True)
                      SIG_FILE.write_text(cmd, encoding="utf-8")
                      self.reply(200, json.dumps({"ok": True, "message": "Đã nhận lệnh: " + cmd}, ensure_ascii=False), "application/json; charset=utf-8")
                  except Exception:
                      self.reply(400, json.dumps({"ok": False, "message": "Lệnh không hợp lệ"}), "application/json; charset=utf-8")

          class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):
              daemon_threads = True
              allow_reuse_address = True

          if not TOKEN: raise SystemExit("Missing panel token")
          Server((BIND, PORT), Handler).serve_forever()
          '@;
          Set-Content -Path $pyServerPath -Value $server -Encoding UTF8 -Force;
          $env:ZENOVA_WEB_PORT = '8080';
          $env:ZENOVA_WEB_BIND = $bindIp;
          $env:ZENOVA_SIGNAL_FILE = "$env:CONTROL_SIGNAL_FILE";
          $env:ZENOVA_PANEL_USER = 'zenova';
          $env:ZENOVA_PANEL_TOKEN = $panelToken;
          $panel = Start-Process -FilePath $pyExe -ArgumentList "`"$pyServerPath`"" -WindowStyle Hidden -PassThru;
          Start-Sleep -Seconds 3;
          $tcp = New-Object System.Net.Sockets.TcpClient;
          try {
              $ar = $tcp.BeginConnect($bindIp, 8080, $null, $null);
              if (-not $ar.AsyncWaitHandle.WaitOne(5000) -or -not $tcp.Connected) { throw 'Web panel không mở được cổng 8080.'; }
          } finally { $tcp.Close(); }
          New-NetFirewallRule -DisplayName 'Zenova VPS Panel TCP - Tailscale only' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 8080 -RemoteAddress '100.64.0.0/10' -Profile Any -ErrorAction SilentlyContinue | Out-Null;
          Write-Host "✅ Web panel đã chạy tại ${bindIp}:8080 (Basic Auth)." -ForegroundColor Green;
          if ($bindIp -eq '127.0.0.1') { Write-Host '⚠️ Chưa có Tailscale IP; panel chỉ mở nội bộ trên máy.' -ForegroundColor Yellow; }
          $global:LASTEXITCODE = 0;
          exit 0;

      # ─────────────────────────────────────────────────────────────
      # 14. THÔNG TIN KẾT NỐI ZENOVA VPS
      # ─────────────────────────────────────────────────────────────
      - name: 🎉 Thông tin kết nối Zenova VPS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue';
          $global:LASTEXITCODE = 0;
          $tsIp = if (Test-Path 'C:\tailscale-ip.txt') { (Get-Content 'C:\tailscale-ip.txt' -Raw).Trim() } else { '' };
          $sdId = if (Test-Path 'C:\stardesk-id.txt') { (Get-Content 'C:\stardesk-id.txt' -Raw).Trim() } else { 'Đang chờ StarDesk' };
          $sdPin = if (Test-Path 'C:\stardesk-pin.txt') { (Get-Content 'C:\stardesk-pin.txt' -Raw).Trim() } else { 'Chưa có PIN' };
          $panelToken = if (Test-Path 'C:\ProgramData\Zenova\panel-token.txt') { (Get-Content 'C:\ProgramData\Zenova\panel-token.txt' -Raw).Trim() } else { '' };
          $pass = "$env:FIXED_PASSWORD";
          $panelUrl = if ($tsIp -match '^100\.') { "http://${tsIp}:8080" } else { 'http://127.0.0.1:8080 (chỉ máy chủ)' };
          $apolloUrl = if ($tsIp -match '^100\.') { "https://${tsIp}:47990" } else { 'https://127.0.0.1:47990 (chỉ máy chủ)' };
          $rdpTarget = if ($tsIp -match '^100\.') { "${tsIp}:3389" } else { 'Chưa có Tailscale IP' };
          "::add-mask::$pass";
          "::add-mask::$panelToken";

          Write-Host '';
          Write-Host '======================================================================' -ForegroundColor Green;
          Write-Host '                 ZENOVA WINDOWS HOST ĐÃ CẤU HÌNH                     ' -ForegroundColor Green;
          Write-Host '======================================================================' -ForegroundColor Green;
          Write-Host "🌐 Web quản lý (Tailscale): $panelUrl" -ForegroundColor Cyan;
          Write-Host "🚀 Apollo Web UI (HTTPS) : $apolloUrl" -ForegroundColor White;
          Write-Host "🌟 StarDesk 中文版 ID     : $sdId" -ForegroundColor Yellow;
          Write-Host "🔑 StarDesk PIN          : $sdPin" -ForegroundColor Yellow;
          Write-Host "🖥️ RDP qua Tailscale     : $rdpTarget" -ForegroundColor Magenta;
          Write-Host '👤 Windows user          : zenova' -ForegroundColor Gray;
          Write-Host '======================================================================' -ForegroundColor Green;

          $sb = New-Object System.Text.StringBuilder;
          [void]$sb.AppendLine('# ☁️ Zenova Windows Host');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('> Panel chỉ truy cập qua Tailscale và yêu cầu Basic Authentication. Không có public tunnel.');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('## 1. Web quản lý VPS');
          [void]$sb.AppendLine("- **URL**: $panelUrl");
          [void]$sb.AppendLine('- **Tài khoản panel**: `zenova`');
          [void]$sb.AppendLine('- **Mật khẩu panel**: `' + $panelToken + '`');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('## 2. Apollo / Moonlight');
          [void]$sb.AppendLine("- **Apollo Web UI**: $apolloUrl");
          [void]$sb.AppendLine('- Mở link HTTPS, chấp nhận cảnh báo chứng chỉ tự ký trong lần đầu nếu trình duyệt hiển thị. Tạo tài khoản Apollo riêng, sau đó nhập mã PIN ghép đôi vào Moonlight.');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('## 3. StarDesk 中文版');
          [void]$sb.AppendLine('- **Device ID**: `' + $sdId + '`');
          [void]$sb.AppendLine('- **PIN**: `' + $sdPin + '`');
          [void]$sb.AppendLine('- Nếu ID vẫn hiện “Đang chờ…”, mở StarDesk, đăng nhập và để ứng dụng hiển thị ID; dashboard sẽ tự dò lại. Có thể nhập ID thủ công ở lần chạy tiếp theo.');
          [void]$sb.AppendLine('');
          [void]$sb.AppendLine('## 4. Windows / RDP');
          [void]$sb.AppendLine('- **RDP host**: `' + $rdpTarget + '`');
          [void]$sb.AppendLine('- **User**: `zenova`');
