            '.btn-save { background: #0284c7; } .btn-restart { background: #d97706; } .btn-stop { background: #dc2626; }',
            '.note { font-size: 12px; color: #94a3b8; margin-top: 14px; }',
            '</style>',
            '</head>',
            '<body>',
            '<div class="card">',
            '<h1>🌸 ZENOVA CLOUD</h1>',
            '<div class="sub">Quản lý Lưu ổ đĩa, Sunshine, Tắt máy</div>',
            '<div class="info">',
            "<div class='row'><span>🏷️ Máy:</span><span class='val'>$($env:MACHINE_ID)</span></div>",
            "<div class='row'><span>🌐 IP Tailscale:</span><span class='val'>$($env:TAILSCALE_IP)</span></div>",
            "<div class='row'><span>☀️ Sunshine Web UI:</span><span class='val'><a href='https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/' target='_blank'>https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/</a></span></div>",
            "<div class='row'><span>👤 Tài khoản:</span><span class='val'>$($env:RDP_USER)</span></div>",
            "<div class='row'><span>🔐 Mật khẩu:</span><span class='val'>$($env:RDP_PASS)</span></div>",
            "<div class='row'><span>⚡ CPU:</span><span class='val'>$($env:CPU_MODEL_INFO)</span></div>",
            '</div>',
            '<form action="/save" method="POST"><button type="submit" class="btn-save">💾 Lưu Dữ Liệu Ngay</button></form>',
            '<form action="/restart" method="POST"><button type="submit" class="btn-restart">🔁 Lưu & Restart</button></form>',
            '<form action="/stop" method="POST"><button type="submit" class="btn-stop">🛑 Lưu & Tắt Hẳn Server</button></form>',
            '<div class="note">💡 Tắt máy bằng các nút trên để không mất dữ liệu.</div>',
            '</div>',
            '</body>',
            '</html>'
          )
          Set-Content -Path "$env:RUNNER_TEMP\panel.html" -Value ($htmlLines -join "`r`n") -Encoding UTF8

          $serverLines = @(
            '$ErrorActionPreference = "Continue"',
            '$listener = [System.Net.HttpListener]::new()',
            ('$listener.Prefixes.Add("http://+:' + $port + '/")'),
            '$listener.Start()',
            'while ($listener.IsListening) {',
            '  try {',
            '    $ctx = $listener.GetContext()',
            '    $req = $ctx.Request',
            '    $resp = $ctx.Response',
            '    if ($req.HttpMethod -eq "POST") {',
            '      if ($req.Url.AbsolutePath -eq "/save") { Set-Content $env:CONTROL_SIGNAL_FILE "SAVE_NOW" }',
            '      elseif ($req.Url.AbsolutePath -eq "/restart") { Set-Content $env:CONTROL_SIGNAL_FILE "RESTART_SESSION" }',
            '      elseif ($req.Url.AbsolutePath -eq "/stop") { Set-Content $env:CONTROL_SIGNAL_FILE "STOP_SESSION" }',
            '      $resp.Redirect("/")',
            '    } else {',
            ('      $html = Get-Content -Raw "' + "$env:RUNNER_TEMP\panel.html" + '"'),
            '      $buf = [System.Text.Encoding]::UTF8.GetBytes($html)',
            '      $resp.ContentType = "text/html; charset=utf-8"',
            '      $resp.ContentLength64 = $buf.Length',
            '      $resp.OutputStream.Write($buf, 0, $buf.Length)',
            '    }',
            '    $resp.OutputStream.Close()',
            '  } catch {}',
            '}'
          )
          Set-Content -Path "$env:RUNNER_TEMP\web.ps1" -Value ($serverLines -join "`r`n") -Encoding UTF8
          Start-Process pwsh.exe -ArgumentList '-NoProfile','-WindowStyle','Hidden','-File',"`"$env:RUNNER_TEMP\web.ps1`""
          Start-Sleep -Seconds 2
          
          Write-Host "=============================================" -ForegroundColor Green
          Write-Host " WEB QUẢN LÝ: http://$($env:TAILSCALE_IP):$port/" -ForegroundColor Yellow
          Write-Host " SUNSHINE:   https://$($env:TAILSCALE_IP):$($env:SUNSHINE_WEB_PORT)/" -ForegroundColor Yellow
          Write-Host "=============================================" -ForegroundColor Green
          $global:LASTEXITCODE = 0

      - name: 🎉 Thông Tin Kết Nối & Cấu Hình (Sau Watchdog)
        shell: pwsh
        timeout-minutes: 2
        if: always()
        run: |
          $tsIp = if ($env:TAILSCALE_IP) { $env:TAILSCALE_IP } else { '127.0.0.1' }
          $hostStr = if ($env:DUCKDNS_URL) { $env:DUCKDNS_URL } else { $tsIp }
          $summary = @(
            "## ZENOVA CLOUD FINAL",
            "",
            "| Item | Value |",
            "|:---|:---|",
            "| Machine | $($env:MACHINE_ID) |",
            "| RDP Host | ${hostStr}:3389 |",
            "| User | $($env:RDP_USER) |",
            "| Pass | $($env:RDP_PASS) |",
            "| Web Panel | http://${tsIp}:$($env:WEB_PORT)/ |",
            "| Sunshine | https://${tsIp}:$($env:SUNSHINE_WEB_PORT)/ |",
            "| Drive | $($env:MOUNT_LETTER):\ |",
            "| Wallpaper | $($env:WALLPAPER_STATUS) |"
          )
          $summary | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }
          $global:LASTEXITCODE = 0

      - name: ⏳ Watchdog
        id: keepalive
        shell: pwsh
        timeout-minutes: 355
        run: |
          function Test-Port { param($P) try { $t=[System.Net.Sockets.TcpClient]::new(); $a=$t.ConnectAsync('127.0.0.1',$P); $ok=$a.Wait(1500); $t.Close(); return $ok } catch { return $false } }
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() + ([long]$env:TOTAL_MINUTES * 60)
          $sig = $env:CONTROL_SIGNAL_FILE
          while ($true) {
            if (Test-Path $sig) {
              $c = (Get-Content -Raw $sig).Trim(); Remove-Item $sig -Force -EA SilentlyContinue
              if ($c -eq 'SAVE_NOW') { & "$env:RUNNER_TEMP\save-data.ps1" -Reason 'manual' }
              elseif ($c -eq 'RESTART_SESSION') { 'FORCE_NEXT_SESSION=1' >> $env:GITHUB_ENV; break }
              elseif ($c -eq 'STOP_SESSION') { 'FORCE_STOP_ONLY=1' >> $env:GITHUB_ENV; break }
            }
            if ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() -ge $end) { break }
            # Fix: kiểm tra cả RDP lẫn Sunshine, restart nếu chết
            if (-not (Test-Port 47990)) {
              Write-Host "[Watchdog] Sunshine down — khởi lại..." -ForegroundColor Yellow
              & schtasks.exe /Run /TN "ALB-Launch-Sunshine" *> $null
              Start-Service SunshineService,sunshinesvc -EA SilentlyContinue
            }
            if (-not (Test-Port 3389)) {
              Write-Host "[Watchdog] RDP down — khởi lại..." -ForegroundColor Yellow
              Restart-Service TermService -Force -EA SilentlyContinue
            }
            Start-Sleep -Seconds 5
          }
          $global:LASTEXITCODE = 0

      - name: 💾 Lưu cuối phiên
        if: always()
        shell: pwsh
        timeout-minutes: 10
        run: |
          try { Stop-Service SunshineService,sunshinesvc -Force -EA SilentlyContinue; & taskkill.exe /F /IM 'StarDesk*' /T *> $null; & "$env:RUNNER_TEMP\save-data.ps1" -Reason 'session-end' } catch {}
          $global:LASTEXITCODE = 0

      - name: 🧹 Dọn dẹp & Auto-restart
        if: always()
        shell: pwsh
        timeout-minutes: 5
        env:
          AUTO_RESTART:  ${{ inputs.auto_restart }}
          WIN_IMAGE:     ${{ inputs.windows_image }}
          FIXED_PASS:    ${{ inputs.fixed_password }}
          VDD_RES:       ${{ inputs.vdd_resolution }}
          CHOCO_PKGS:    ${{ inputs.choco_packages }}
          OPT_WIN:       ${{ inputs.optimize_windows }}
        run: |
          # Dọn dẹp firewall
          @('RDP-Premium','Sunshine-Premium-TCP','Sunshine-Premium-UDP','Sunshine-Exe-Allow','Tailscale-ICMP') |
            ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -EA SilentlyContinue }
          Stop-Service TermService,SunshineService,sunshinesvc -Force -EA SilentlyContinue
          try {
            $vhd = "$env:VHD_CONTAINER\alb-os-disk.vhdx"
            if (Test-Path $vhd) { Dismount-VHD -Path $vhd -EA SilentlyContinue }
          } catch {}
          $global:LASTEXITCODE = 0

          # Auto-restart nếu được bật và không bị STOP
          if ($env:FORCE_STOP_ONLY -eq '1') { Write-Host "STOP_ONLY — bỏ qua restart" -ForegroundColor Yellow; exit 0 }
          if ($env:AUTO_RESTART -ne 'true' -and $env:FORCE_NEXT_SESSION -ne '1') { exit 0 }
          try {
            $wfRef  = $env:GITHUB_WORKFLOW_REF
            $wfFile = if ($wfRef) { ($wfRef -split '@')[0] -split '/' | Select-Object -Last 1 } else { "$env:GITHUB_WORKFLOW.yml" -replace ' ','-' }
            if ([string]::IsNullOrWhiteSpace($wfFile)) { $wfFile = 'codeymal.yml' }
            Write-Host "Auto-restart: $wfFile | machine=$env:MACHINE_ID" -ForegroundColor Cyan
            & gh workflow run $wfFile --ref $env:GITHUB_REF_NAME `
              -f machine_id="$env:MACHINE_ID" `
              -f duration="$env:INPUT_DURATION" `
              -f auto_restart='true' `
              -f drive_letter="$env:MOUNT_LETTER" `
              -f vhd_size_gb="$env:VHD_SIZE_GB_VALIDATED" `
              -f windows_image="$env:WIN_IMAGE" `
              -f fixed_password="$env:FIXED_PASS" `
              -f vdd_resolution="$env:VDD_RES" `
              -f choco_packages="$env:CHOCO_PKGS" `
              -f optimize_windows="$env:OPT_WIN"
            if ($LASTEXITCODE -eq 0) { Write-Host "OK Auto-restart triggered" -ForegroundColor Green }
            else { Write-Host "WARN auto-restart exit $LASTEXITCODE" -ForegroundColor Yellow }
          } catch { Write-Host "WARN auto-restart: $_" -ForegroundColor Yellow }
          $global:LASTEXITCODE = 0
